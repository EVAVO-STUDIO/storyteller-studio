name: storyteller-publication-operations

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile.publication-operations
    args:
      STORYTELLER_APPLICATION_REVISION: ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
  image: storyteller-publication-operations:local
  env_file:
    - ${STORYTELLER_PUBLICATION_OPERATIONS_ENV_FILE:-.env.publication-operations}
  environment:
    NODE_ENV: production
    STORYTELLER_DATA_DIR: /var/lib/storyteller
    STORYTELLER_APPLICATION_REVISION: ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
  init: true
  read_only: true
  user: node
  volumes:
    - publication-data:/var/lib/storyteller
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  publication-evidence-gateway:
    <<: *worker-base
    environment:
      NODE_ENV: production
      STORYTELLER_DATA_DIR: /var/lib/storyteller
      STORYTELLER_WORKER_ROLE: publication-evidence-gateway
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_MODE: serve
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_BIND_HOST: 127.0.0.1
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT: ${STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT:-8789}
      STORYTELLER_FILE_PUBLICATION_EVIDENCE_GATEWAY_SINGLE_HOST: "true"
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PRIVATE_NETWORK: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          npm run publication-operations-readiness -- --data-dir /var/lib/storyteller --readiness-only >/dev/null &&
          node -e "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:Number(process.env.STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT||8789)},()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 30s

  publication-operations-preflight:
    <<: *worker-base
    restart: "no"
    network_mode: service:publication-evidence-gateway
    depends_on:
      publication-evidence-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STORYTELLER_DATA_DIR: /var/lib/storyteller
      STORYTELLER_WORKER_ROLE: publication-operations-preflight
      STORYTELLER_PUBLICATION_ALERT_MODE: continuous
      STORYTELLER_FILE_PUBLICATION_ALERT_SINGLE_HOST: "true"
      STORYTELLER_PUBLICATION_REFRESH_MODE: continuous
      STORYTELLER_PUBLICATION_REFRESH_VERIFICATION_ENDPOINT: http://127.0.0.1:${STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT:-8789}/v1/publication-evidence
      STORYTELLER_FILE_PUBLICATION_REFRESH_SINGLE_HOST: "true"
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_MODE: serve
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_BIND_HOST: 127.0.0.1
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT: ${STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT:-8789}
      STORYTELLER_FILE_PUBLICATION_EVIDENCE_GATEWAY_SINGLE_HOST: "true"
      STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PRIVATE_NETWORK: "false"
      STORYTELLER_PUBLICATION_OPERATIONS_GATEWAY_PROXY: "false"

  publication-refresh:
    <<: *worker-base
    network_mode: service:publication-evidence-gateway
    depends_on:
      publication-evidence-gateway:
        condition: service_healthy
      publication-operations-preflight:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      STORYTELLER_DATA_DIR: /var/lib/storyteller
      STORYTELLER_WORKER_ROLE: publication-refresh
      STORYTELLER_PUBLICATION_REFRESH_MODE: continuous
      STORYTELLER_PUBLICATION_REFRESH_VERIFICATION_ENDPOINT: http://127.0.0.1:${STORYTELLER_PUBLICATION_EVIDENCE_GATEWAY_PORT:-8789}/v1/publication-evidence
      STORYTELLER_FILE_PUBLICATION_REFRESH_SINGLE_HOST: "true"

  publication-alerts:
    <<: *worker-base
    depends_on:
      publication-operations-preflight:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      STORYTELLER_DATA_DIR: /var/lib/storyteller
      STORYTELLER_WORKER_ROLE: publication-alerts
      STORYTELLER_PUBLICATION_ALERT_MODE: continuous
      STORYTELLER_FILE_PUBLICATION_ALERT_SINGLE_HOST: "true"

  publication-backup:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-data:/var/lib/storyteller:ro
      - publication-backups:/var/backups/storyteller
    command:
      - npm
      - run
      - publication-operations-backup
      - --
      - --data-dir
      - /var/lib/storyteller
      - --backup-dir
      - /var/backups/storyteller
      - --actor-id
      - ${STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID:?set STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID}
      - --offline-confirmed

  publication-backup-verify:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-backups:/var/backups/storyteller:ro
    command:
      - npm
      - run
      - publication-operations-backup-verify
      - --
      - --snapshot
      - /var/backups/storyteller/${STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID:?set STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID}

  publication-backup-retention-plan:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-backups:/var/backups/storyteller:ro
      - publication-maintenance-receipts:/var/lib/storyteller-maintenance
    command:
      - npm
      - run
      - publication-operations-backup-retention-plan
      - --
      - --backup-dir
      - /var/backups/storyteller
      - --evaluated-at
      - ${STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT:?set STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT}
      - --application-revision
      - ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
      - --keep-latest
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_LATEST:-7}
      - --keep-daily-days
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_DAILY_DAYS:-30}
      - --keep-weekly-weeks
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_WEEKLY_WEEKS:-12}
      - --output
      - /var/lib/storyteller-maintenance/${STORYTELLER_PUBLICATION_RETENTION_PLAN_FILE:-retention-plan.json}

  publication-backup-prune:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-backups:/var/backups/storyteller
      - publication-maintenance-receipts:/var/lib/storyteller-maintenance
    command:
      - npm
      - run
      - publication-operations-backup-prune
      - --
      - --backup-dir
      - /var/backups/storyteller
      - --evaluated-at
      - ${STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT:?set STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT}
      - --application-revision
      - ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
      - --keep-latest
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_LATEST:-7}
      - --keep-daily-days
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_DAILY_DAYS:-30}
      - --keep-weekly-weeks
      - ${STORYTELLER_PUBLICATION_RETENTION_KEEP_WEEKLY_WEEKS:-12}
      - --plan-fingerprint
      - ${STORYTELLER_PUBLICATION_RETENTION_PLAN_FINGERPRINT:?set STORYTELLER_PUBLICATION_RETENTION_PLAN_FINGERPRINT from the reviewed plan}
      - --actor-id
      - ${STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID:?set STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID}
      - --offline-confirmed
      - --output
      - /var/lib/storyteller-maintenance/${STORYTELLER_PUBLICATION_RETENTION_RECEIPT_FILE:-retention-receipt.json}


  publication-backup-retention-inspect:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-backups:/var/backups/storyteller:ro
      - publication-maintenance-receipts:/var/lib/storyteller-maintenance
    command:
      - npm
      - run
      - publication-operations-backup-retention-inspect
      - --
      - --backup-dir
      - /var/backups/storyteller
      - --plan-receipt
      - /var/lib/storyteller-maintenance/${STORYTELLER_PUBLICATION_RETENTION_PLAN_FILE:-retention-plan.json}
      - --apply-receipt
      - /var/lib/storyteller-maintenance/${STORYTELLER_PUBLICATION_RETENTION_RECEIPT_FILE:-retention-receipt.json}
      - --application-revision
      - ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
      - --offline-confirmed
      - --inspected-at
      - ${STORYTELLER_PUBLICATION_RETENTION_INSPECTED_AT:?set STORYTELLER_PUBLICATION_RETENTION_INSPECTED_AT}
      - --output
      - /var/lib/storyteller-maintenance/${STORYTELLER_PUBLICATION_RETENTION_INSPECTION_FILE:-retention-inspection.json}

  publication-restore:
    <<: *worker-base
    profiles:
      - maintenance
    restart: "no"
    network_mode: none
    volumes:
      - publication-data:/var/lib/storyteller
      - publication-backups:/var/backups/storyteller:ro
    command:
      - npm
      - run
      - publication-operations-restore
      - --
      - --snapshot
      - /var/backups/storyteller/${STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID:?set STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID}
      - --data-dir
      - /var/lib/storyteller
      - --actor-id
      - ${STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID:?set STORYTELLER_PUBLICATION_MAINTENANCE_ACTOR_ID}
      - --offline-confirmed

volumes:
  publication-data:
    name: ${STORYTELLER_PUBLICATION_DATA_VOLUME:-storyteller-publication-data}
  publication-backups:
    name: ${STORYTELLER_PUBLICATION_BACKUP_VOLUME:-storyteller-publication-backups}
  publication-maintenance-receipts:
    name: ${STORYTELLER_PUBLICATION_MAINTENANCE_RECEIPT_VOLUME:-storyteller-publication-maintenance-receipts}
