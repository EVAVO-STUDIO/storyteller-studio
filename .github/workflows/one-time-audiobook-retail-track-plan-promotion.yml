name: One-time audiobook retail track-plan promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-track-plan.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated track-plan slice by exact paths
        shell: bash
        run: |
          set -o pipefail
          git fetch origin work/audiobook-retail-track-plan-20260728
          git checkout origin/work/audiobook-retail-track-plan-20260728 -- \
            docs/AUDIOBOOK_RETAIL_TRACK_PLAN.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-track-plan.test.ts \
            packages/storyteller/src/audiobook-retail-track-plan.ts \
            scripts/check-audiobook-retail-track-plan.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-track-plan-promotion.log
          from pathlib import Path
          import subprocess

          expected = {
              "docs/AUDIOBOOK_RETAIL_TRACK_PLAN.md",
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/audiobook-retail-track-plan.test.ts",
              "packages/storyteller/src/audiobook-retail-track-plan.ts",
              "scripts/check-audiobook-retail-track-plan.mjs",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print("AUDIOBOOK_RETAIL_TRACK_PLAN_FILES:" + ",".join(sorted(changed)))
          if changed != expected:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_PLAN_FILE_SCOPE_INVALID:"
                  + ",".join(sorted(changed))
              )

          test_path = Path(
              "packages/storyteller/src/audiobook-retail-track-plan.test.ts"
          )
          tests = test_path.read_text(encoding="utf-8")
          lines = tests.splitlines()
          corrected = []
          insertions = 0
          for index, line in enumerate(lines):
              corrected.append(line)
              if (
                  line.strip() == "...fixture,"
                  and index + 1 < len(lines)
                  and lines[index + 1].strip().startswith("now:")
                  and "assertAudiobookRetailTrackPlanMatchesSources"
                      in "\n".join(lines[max(0, index - 10):index + 1])
              ):
                  indentation = line[:len(line) - len(line.lstrip())]
                  corrected.append(
                      f"{indentation}referenceChain: fixture.chain,"
                  )
                  insertions += 1
          print(
              "AUDIOBOOK_RETAIL_TRACK_PLAN_REFERENCE_CHAIN_FIX:"
              f"{insertions}"
          )
          if insertions != 3:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_PLAN_REFERENCE_CHAIN_FIX_INVALID:"
                  f"{insertions}"
              )
          test_path.write_text(
              "\n".join(corrected) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-track-plan-promotion.yml"
              ),
              Path(".github/audiobook-retail-track-plan.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_TRACK_PLAN_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-retail-track-plan-verify.log
          npm run build 2>&1 | tee .audiobook-retail-track-plan-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-track-plan-${{ github.sha }}
          path: |
            .audiobook-retail-track-plan-promotion.log
            .audiobook-retail-track-plan-verify.log
            .audiobook-retail-track-plan-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-retail-track-plan-promotion.log \
            .audiobook-retail-track-plan-verify.log \
            .audiobook-retail-track-plan-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail track plans"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-track-plan-promotion.log",
              ".audiobook-retail-track-plan-verify.log",
              ".audiobook-retail-track-plan-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_RETAIL_TRACK_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook retail track-plan promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-track-plan",
              description: state === "success" ? "Retail track-plan tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
