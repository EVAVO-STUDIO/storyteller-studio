name: One-time artifact API anchor diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/storyteller-artifact-api-diagnostic.trigger"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Print artifact API anchor counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("apps/api/src/server.ts").read_text(encoding="utf-8")
          anchors = {
              "imports": '} from "@evavo/storyteller-engine/generation-queue";\nimport {\n  createGenerationQueueRuntime,\n',
              "error-status": '    || code === "GENERATION_QUEUE_FILE_DRIVER_SINGLE_HOST_ACK_REQUIRED"\n',
              "runtime-state": '  let queueRuntime: FileGenerationQueue | null | undefined;\n',
              "artifact-runtime": '\n  return async function handler(request: IncomingMessage, response: ServerResponse): Promise<void> {\n',
              "health-status": '      const generationQueue = queueHealth();\n      status = generationQueue.status === "misconfigured" ? 503 : 200;\n',
              "health-body": '          generationQueue,\n        });\n',
              "capability-artifacts": '          orchestration: ["idempotent queue admission", "exclusive worker leases", "bounded retry", "operator cancellation"],\n',
              "capability-boundary": '          visuals: ["scene-level beat grouping", "continuity keys", "restrained motion policies"],\n          workerApiExposed: false,\n',
              "artifact-route": '\n      if (request.method === "POST" && url.pathname === "/v1/projects/plan") {\n',
          }
          failed = False
          for label, anchor in anchors.items():
              count = source.count(anchor)
              print(f"ARTIFACT_API_ANCHOR:{label}:{count}")
              failed = failed or count != 1
          if failed:
              raise SystemExit("ARTIFACT_API_ANCHOR_DIAGNOSTIC_FAILED")
          print("ARTIFACT_API_ANCHOR_DIAGNOSTIC_PASSED")
          PY

      - name: Publish anchor status
        if: always()
        uses: actions/github-script@v7
        env:
          ANCHOR_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.ANCHOR_JOB_STATUS === "success" ? "success" : "failure",
              context: "storyteller/artifact-api-anchors",
              description: process.env.ANCHOR_JOB_STATUS === "success"
                ? "All artifact API source anchors matched once"
                : "One or more artifact API source anchors did not match",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
