name: One-time publication evidence audit fixture repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-evidence-audit-fixture-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-evidence-inbox-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/storyteller/src/"
              "audiobook-retail-publication-evidence-inbox.test.ts"
          )
          source = path.read_text(encoding="utf-8")
          old = '    const audit = await readFile(join(temporaryRoot, "audit.jsonl"), "utf8");'
          new = (
              '    const audit = await readFile(\n'
              '      join(\n'
              '        temporaryRoot,\n'
              '        "audit",\n'
              '        `${item.receivedAt.slice(0, 10)}.jsonl`,\n'
              '      ),\n'
              '      "utf8",\n'
              '    );'
          )
          count = source.count(old)
          print(f"PUBLICATION_EVIDENCE_AUDIT_FIXTURE:{count}")
          if count != 1:
              raise SystemExit(
                  f"PUBLICATION_EVIDENCE_AUDIT_FIXTURE_INVALID:{count}"
              )
          path.write_text(
              source.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/audiobook-retail-publication-evidence-inbox.test.ts
          git diff --cached --check
          git commit -m "Correct publication evidence audit fixture path"
          git pull --rebase origin work/audiobook-retail-publication-evidence-inbox-20260729
          git push origin HEAD:work/audiobook-retail-publication-evidence-inbox-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-evidence-audit-fixture-repair.yml \
            .github/publication-evidence-audit-fixture-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication evidence audit fixture repair"
          git pull --rebase origin main
          git push origin HEAD:main
