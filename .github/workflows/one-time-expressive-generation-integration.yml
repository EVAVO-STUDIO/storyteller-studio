name: Bind expressive performance through generation

on:
  push:
    branches:
      - agent/expressive-generation-binding-20260813

permissions:
  contents: write

concurrency:
  group: expressive-generation-binding-20260813
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/expressive-generation-binding-20260813
          fetch-depth: 0

      - name: Assemble exact integration files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/expressive-integration packages/storyteller/src docs
          tr -d '[:space:]' < .github/agent-payload/expressive-generation-integration.tar.gz.b64 \
            | base64 --decode > /tmp/expressive-generation-integration.tar.gz
          echo '0e6d34f9f0cfc033e33e18fd363f0ff73e55c683b30b206bce6a9bbd6b6585dd  /tmp/expressive-generation-integration.tar.gz' | sha256sum -c -
          tar -xzf /tmp/expressive-generation-integration.tar.gz -C /tmp/expressive-integration
          sha256sum -c <<'EOF'
          be4f42048ab4c215842e409a1f9acff8b4365c505d99734428d424596aa63e6f  /tmp/expressive-integration/expressive-generation-binding.ts
          fc3cef3aa6087d5966533ab3424829c2318f71ed6d1eccaee8e020ec4ca14ef7  /tmp/expressive-integration/expressive-generation-integration.test.ts
          733bd1ce8246a44378fe68c88367f7dba9f25a508ce6c3d475817760fa671ac3  /tmp/expressive-integration/EXPRESSIVE_GENERATION_BINDING.md
          3a5c978bf549f116ac0005ddf7a6877cda104eb33e036a86236ba82643b5a072  /tmp/expressive-integration/apply.py
          EOF
          cp /tmp/expressive-integration/expressive-generation-binding.ts packages/storyteller/src/
          cp /tmp/expressive-integration/expressive-generation-integration.test.ts packages/storyteller/src/
          cp /tmp/expressive-integration/EXPRESSIVE_GENERATION_BINDING.md docs/
          python <<'PY'
          from pathlib import Path
          path = Path('packages/storyteller/src/expressive-generation-integration.test.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '  type PerformanceDirection,\n  type SegmentedManuscript,\n',
              '  type PerformanceDirection,\n  type ProviderFeature,\n  type SegmentedManuscript,\n',
              1,
          )
          source = source.replace(
              '  type NarrationProviderAdapter,\n  type ProviderFeature,\n  type SynthesisRequest,\n',
              '  type NarrationProviderAdapter,\n  type SynthesisRequest,\n',
              1,
          )
          source = source.replace(
              '/NARRATOR_PRODUCTION_VOICE_MISMATCH|EXPRESSIVE_GENERATION_VOICE_PIN_MISMATCH/u',
              '/NARRATOR_PROFILE_PIN_MISMATCH|NARRATOR_PRODUCTION_VOICE_MISMATCH|EXPRESSIVE_GENERATION_VOICE_PIN_MISMATCH/u',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python /tmp/expressive-integration/apply.py "$GITHUB_WORKSPACE"
          node -e 'JSON.parse(require("node:fs").readFileSync("packages/storyteller/package.json", "utf8"))'

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check complete repository
        run: npm run typecheck

      - name: Run focused expressive production regressions
        run: >-
          node --import tsx --test
          packages/storyteller/src/expressive-generation-integration.test.ts
          packages/storyteller/src/narration-expressive-performance.test.ts
          packages/storyteller/src/provider-adapter.test.ts
          packages/storyteller/src/audio-studio-adapter.test.ts
          packages/storyteller/src/generation-material.test.ts
          packages/storyteller/src/generation-worker.test.ts

      - name: Verify private and Audio Studio boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:private-boundary
          test -f scripts/check-audio-studio-voice-provider.mjs && node scripts/check-audio-studio-voice-provider.mjs || true
          test -f scripts/check-generation-worker.mjs && node scripts/check-generation-worker.mjs || true

      - name: Produce clean candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-payload
          rm -f .github/workflows/one-time-expressive-generation-integration.yml
          git config user.name 'EVAVO-STUDIO'
          git config user.email 'evavo.studio@gmail.com'
          git add --all
          git diff --cached --name-status
          git commit -m 'build: bind expressive performance through generation'
          if git ls-tree -r --name-only HEAD | grep -E '^\.github/(agent-payload/|workflows/one-time-expressive-generation-integration\.yml$)'; then
            echo 'EXPRESSIVE_GENERATION_TRANSPORT_RESIDUE_DETECTED'
            exit 1
          fi
          git push origin HEAD:agent/expressive-generation-binding-20260813
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
