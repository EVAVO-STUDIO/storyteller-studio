name: One-time mastering clipping fixture correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-clipping-fixture.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct clipping evidence fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/storyteller/src/mastering-plan.test.ts")
          source = path.read_text(encoding="utf-8")
          old = "  const damaged = await engineeringEvidence({\n    clippedSampleCount: 4,\n    sampleRateHz: 22_050,\n"
          new = "  const damaged = await engineeringEvidence({\n    peakDb: 0,\n    truePeakDb: 0.5,\n    clippedSampleCount: 4,\n    sampleRateHz: 22_050,\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"MASTERING_CLIPPING_FIXTURE_ANCHOR_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastering-clipping-fixture.yml").unlink(missing_ok=True)
          Path(".github/mastering-clipping-fixture.trigger").unlink(missing_ok=True)
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct mastering clipping fixture"
          git pull --rebase origin main
          git push origin HEAD:main
