name: One-time audio silence parser correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/audio-silence-parser-fix.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-audio-silence-parser-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make malformed silencedetect output fail closed
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audio-silence-parser-fix.log
          from pathlib import Path

          path = Path("packages/storyteller/src/audio-engineering.ts")
          source = path.read_text(encoding="utf-8")
          old = '''  const eventPattern = /silence_(start|end):\\s*([0-9]+(?:\\.[0-9]+)?)(?:\\s*\\|\\s*silence_duration:\\s*([0-9]+(?:\\.[0-9]+)?))?/gu;
          for (const match of source.matchAll(eventPattern)) {
          '''
          new = '''  const eventPattern = /silence_(start|end):\\s*([0-9]+(?:\\.[0-9]+)?)(?:\\s*\\|\\s*silence_duration:\\s*([0-9]+(?:\\.[0-9]+)?))?/gu;
          const events = [...source.matchAll(eventPattern)];
          if (events.length === 0 && /silence_(?:start|end)\\s*:/u.test(source)) {
            throw new AudioEngineeringError("AUDIO_ENGINEERING_SILENCE_EVENT_INVALID");
          }
          for (const match of events) {
          '''
          count = source.count(old)
          print(f"AUDIO_SILENCE_PARSER_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"AUDIO_SILENCE_PARSER_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          print("AUDIO_SILENCE_PARSER_FIXED")
          PY

      - name: Remove one-time correction machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-audio-silence-parser-fix.yml
          rm -f .github/audio-silence-parser-fix.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/audio-engineering.ts .github/workflows/one-time-audio-silence-parser-fix.yml .github/audio-silence-parser-fix.trigger
          git diff --cached --check
          git commit -m "Reject malformed silencedetect evidence"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        env:
          CORRECTION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.CORRECTION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".audio-silence-parser-fix.log")
              ? fs.readFileSync(".audio-silence-parser-fix.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "audio silence parser correction log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /AUDIO_SILENCE_PARSER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "audio silence parser correction failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audio-silence-parser-fix",
              description: state === "success"
                ? "Malformed silencedetect evidence fails closed and repository verifies"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
