name: One-time ElevenLabs generation fixture correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/elevenlabs-generation-test-fix.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-elevenlabs-generation-test-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct strict generation fixture state
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .elevenlabs-generation-test-fix.log
          from pathlib import Path

          path = Path("apps/worker/src/elevenlabs-generation.test.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "    const calls: ReadonlyArray<never> | string[] = [];\n",
                  "    const calls: string[] = [];\n",
                  "calls-type",
              ),
              (
                  "        (calls as string[]).push(url);\n",
                  "        calls.push(url);\n",
                  "calls-push",
              ),
              (
                  '    if (result.status === "disabled") throw new Error("enabled worker result required");\n',
                  "",
                  "result-narrowing",
              ),
              (
                  "    assert.equal((calls as string[]).length, 3);\n",
                  "    assert.equal(calls.length, 3);\n",
                  "calls-length",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"ELEVENLABS_GENERATION_TEST_FIX_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"ELEVENLABS_GENERATION_TEST_FIX_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          print("ELEVENLABS_GENERATION_TEST_FIXED")
          PY

      - name: Remove one-time fixture machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-elevenlabs-generation-test-fix.yml
          rm -f .github/elevenlabs-generation-test-fix.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify governed generation fixture
        run: npm run typecheck && npm run test:worker

      - name: Commit corrected generation fixture
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add apps/worker/src/elevenlabs-generation.test.ts .github/workflows/one-time-elevenlabs-generation-test-fix.yml .github/elevenlabs-generation-test-fix.trigger
          git diff --cached --check
          git commit -m "Fix governed ElevenLabs generation fixture"
          git push origin HEAD:main

      - name: Publish fixture correction status
        if: always()
        uses: actions/github-script@v7
        env:
          FIXTURE_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.FIXTURE_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".elevenlabs-generation-test-fix.log")
              ? fs.readFileSync(".elevenlabs-generation-test-fix.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "ElevenLabs generation fixture correction log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /ELEVENLABS_GENERATION_TEST_FIX_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "ElevenLabs generation fixture correction failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/elevenlabs-generation-test-fix",
              description: state === "success"
                ? "Governed ElevenLabs generation fixture passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
