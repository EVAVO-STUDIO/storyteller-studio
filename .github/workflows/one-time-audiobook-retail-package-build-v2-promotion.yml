name: One-time audiobook retail package-build promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-package-build-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail package-build slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-package-build-20260729
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_PACKAGE_BUILD.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-build.test.ts \
            packages/storyteller/src/audiobook-retail-package-build.ts \
            scripts/check-audiobook-retail-package-build.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-package-build-patch.log
          from pathlib import Path

          source_path = Path(
              "packages/storyteller/src/audiobook-retail-package-build.ts"
          )
          source = source_path.read_text(encoding="utf-8")
          old = '''  const manifestObservation = await observeFile(
              manifestPath,
              MAXIMUM_JSON_BYTES,
            );
            if (
              manifestObservation.mimeType !== "application/json"
              || manifestObservation.format !== "json"
            ) {
              throw new AudiobookRetailPackageBuildError(
                "AUDIOBOOK_RETAIL_PACKAGE_BUILD_DIRECTORY_MANIFEST_INVALID",
              );
            }
          '''
          new = '''  const manifestBytes = await readFile(manifestPath);
            const manifestObservation: FileObservation = Object.freeze({
              contentHash: createHash("sha256").update(manifestBytes).digest("hex"),
              byteCount: manifestBytes.byteLength,
              mimeType: "application/json",
              format: "json",
              mediaSignature: "utf8-json",
            });
          '''
          count = source.count(old)
          print(f"AUDIOBOOK_RETAIL_PACKAGE_BUILD_JSON_OBSERVATION_FIX:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_RETAIL_PACKAGE_BUILD_JSON_OBSERVATION_FIX_INVALID:{count}"
              )
          source = source.replace(old, new, 1)

          old_rm = '''      await rm(temporaryDirectory, { recursive: true, force: true });
                temporaryDirectory = undefined;'''
          new_rm = '''      await rm(temporaryDirectory!, { recursive: true, force: true });
                temporaryDirectory = undefined;'''
          rm_count = source.count(old_rm)
          print(f"AUDIOBOOK_RETAIL_PACKAGE_BUILD_TEMPORARY_NARROWING_FIX:{rm_count}")
          if rm_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_PACKAGE_BUILD_TEMPORARY_NARROWING_FIX_INVALID:"
                  f"{rm_count}"
              )
          source = source.replace(old_rm, new_rm, 1)
          source_path.write_text(source, encoding="utf-8", newline="\n")

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-package-build-v2-promotion.yml"
              ),
              Path(".github/audiobook-retail-package-build-v2.trigger"),
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-package-build-promotion.yml"
              ),
              Path(".github/audiobook-retail-package-build.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_PACKAGE_BUILD_PATCH_APPLIED")
          PY

          git add \
            docs/AUDIOBOOK_RETAIL_PACKAGE_BUILD.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-build.test.ts \
            packages/storyteller/src/audiobook-retail-package-build.ts \
            scripts/check-audiobook-retail-package-build.mjs

          expected=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_PACKAGE_BUILD.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/audiobook-retail-package-build.test.ts
          packages/storyteller/src/audiobook-retail-package-build.ts
          scripts/check-audiobook-retail-package-build.mjs
          EOF
          )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //')
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo AUDIOBOOK_RETAIL_PACKAGE_BUILD_FILE_SCOPE_INVALID
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-package-build 2>&1 | tee .audiobook-retail-package-build-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-package-build-typecheck.log
          node --import tsx --test \
            packages/storyteller/src/audiobook-retail-package-build.test.ts \
            2>&1 | tee .audiobook-retail-package-build-test.log
          npm run verify 2>&1 | tee .audiobook-retail-package-build-verify.log
          npm run build 2>&1 | tee .audiobook-retail-package-build-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-package-build-v2-${{ github.sha }}
          path: |
            .audiobook-retail-package-build-patch.log
            .audiobook-retail-package-build-check.log
            .audiobook-retail-package-build-typecheck.log
            .audiobook-retail-package-build-test.log
            .audiobook-retail-package-build-verify.log
            .audiobook-retail-package-build-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-package-build-patch.log \
            .audiobook-retail-package-build-check.log \
            .audiobook-retail-package-build-typecheck.log \
            .audiobook-retail-package-build-test.log \
            .audiobook-retail-package-build-verify.log \
            .audiobook-retail-package-build-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail package build"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-package-build-patch.log",
              ".audiobook-retail-package-build-check.log",
              ".audiobook-retail-package-build-typecheck.log",
              ".audiobook-retail-package-build-test.log",
              ".audiobook-retail-package-build-verify.log",
              ".audiobook-retail-package-build-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_PACKAGE_BUILD_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail package-build promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-package-build-v2",
              description: state === "success" ? "Package-build tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
