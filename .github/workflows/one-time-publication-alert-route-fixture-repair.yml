name: One-time publication alert route fixture repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-alert-route-fixture-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-alert-delivery-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/storyteller/src/audiobook-retail-publication-alert-delivery.test.ts"
          )
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if "degradedMonitor(`publication_delivery_monitor_route_${route.emailAddress.replaceAll" in line
          ]
          print(f"PUBLICATION_ALERT_ROUTE_FIXTURE:{matches}")
          if len(matches) != 1:
              raise SystemExit(
                  f"PUBLICATION_ALERT_ROUTE_FIXTURE_INVALID:{matches}"
              )
          index = matches[0]
          indentation = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = (
              indentation
              + "degradedMonitor(`publication_delivery_monitor_route_${stableHash(route).slice(0, 24)}`),"
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/audiobook-retail-publication-alert-delivery.test.ts
          git diff --cached --check
          git commit -m "Separate publication route fixture identity"
          git pull --rebase origin work/audiobook-retail-publication-alert-delivery-20260729
          git push origin HEAD:work/audiobook-retail-publication-alert-delivery-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-alert-route-fixture-repair.yml \
            .github/publication-alert-route-fixture-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication alert route fixture repair"
          git pull --rebase origin main
          git push origin HEAD:main
