name: One-time book credit generation promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-credit-generation-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote calibrated book credit generation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-credit-generation-promotion.log
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"BOOK_CREDIT_GENERATION_PROMOTION_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"BOOK_CREDIT_GENERATION_PROMOTION_ANCHOR_INVALID:{label}:{count}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          def replace_section(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> None:
              source = path.read_text(encoding="utf-8")
              start_count = source.count(start_marker)
              end_count = source.count(end_marker)
              print(
                  f"BOOK_CREDIT_GENERATION_PROMOTION_SECTION:{label}:"
                  f"{start_count}:{end_count}"
              )
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"BOOK_CREDIT_GENERATION_PROMOTION_SECTION_INVALID:"
                      f"{label}:{start_count}:{end_count}"
                  )
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              path.write_text(
                  source[:start] + replacement + source[end:],
                  encoding="utf-8",
                  newline="\n",
              )

          source_path = Path("packages/storyteller/src/book-credit-generation.ts")
          replace_section(
              source_path,
              "export interface BookCreditGenerationScriptSnapshot {\n",
              "export interface BookCreditGenerationPlan {\n",
              "",
              "remove-script-snapshot",
          )
          replace_once(
              source_path,
              "  script: BookCreditGenerationScriptSnapshot;\n",
              "  script: BookCreditScript;\n",
              "full-script-type",
          )
          replace_section(
              source_path,
              "  const scriptSnapshot: BookCreditGenerationScriptSnapshot = Object.freeze({\n",
              '  const partial: Omit<BookCreditGenerationPlan, "fingerprint"> = {\n',
              "",
              "remove-script-snapshot-creation",
          )
          replace_once(
              source_path,
              "    script: scriptSnapshot,\n",
              "    script: input.script,\n",
              "store-full-script",
          )
          replace_section(
              source_path,
              '  requireIdentifier(plan.script.id, "BOOK_CREDIT_GENERATION_SCRIPT_ID_INVALID");\n',
              "  assertGenerationMaterialRecord(plan.material);\n",
              '''  assertBookCreditScript(plan.script);
          if (plan.script.status !== "approved" || !plan.script.approval) {
            throw new BookCreditGenerationError("BOOK_CREDIT_GENERATION_APPROVED_SCRIPT_REQUIRED");
          }
          if (
            plan.script.projectId !== plan.projectId
            || plan.script.bookId !== plan.bookId
            || plan.script.kind !== plan.creditKind
            || plan.script.textHash !== stableHash(plan.script.text)
          ) {
            throw new BookCreditGenerationError("BOOK_CREDIT_GENERATION_SCRIPT_SCOPE_MISMATCH");
          }
          ''',
              "assert-full-script",
          )
          replace_once(
              source_path,
              "    || plan.material.textHash !== plan.script.textHash\n",
              '''    || plan.job.segmentId !== bookCreditSegmentId(plan.script)
            || plan.material.textHash !== plan.script.textHash
            || plan.material.material.text !== plan.script.text
          ''',
              "script-material-scope",
          )

          store_path = Path("packages/storyteller/src/project-store.ts")
          replace_once(
              store_path,
              '  | "book-credit-script"\n  | "chapter-assembly"\n',
              '  | "book-credit-script"\n  | "book-credit-generation"\n  | "chapter-assembly"\n',
              "store-entity",
          )

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./book-credit-generation"] = "./src/book-credit-generation.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(
              json.dumps(engine, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:book-credit-generation"] = (
              "node scripts/check-book-credit-generation.mjs"
          )
          marker = "npm run verify:book-credits"
          if "npm run verify:book-credit-generation" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("BOOK_CREDIT_GENERATION_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:book-credit-generation",
                  1,
              )
          root_path.write_text(
              json.dumps(root, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(".github/workflows/one-time-book-credit-generation-promotion.yml"),
              Path(".github/book-credit-generation-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CREDIT_GENERATION_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-credit-generation-verify.log
          npm run build 2>&1 | tee .book-credit-generation-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-credit-generation-promotion-${{ github.sha }}
          path: |
            .book-credit-generation-promotion.log
            .book-credit-generation-verify.log
            .book-credit-generation-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-credit-generation-promotion.log .book-credit-generation-verify.log .book-credit-generation-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify calibrated audiobook credit generation"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-credit-generation-promotion.log",
              ".book-credit-generation-verify.log",
              ".book-credit-generation-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_CREDIT_GENERATION_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book credit generation promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-credit-generation-promotion",
              description: state === "success" ? "Credit generation, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
