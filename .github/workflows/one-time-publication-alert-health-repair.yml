name: One-time publication alert health repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-alert-health-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-alert-delivery-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/audiobook-retail-publication-alert.ts")
          lines = path.read_text(encoding="utf-8").splitlines()
          target = [
              "  const triggerHealth: AudiobookRetailPublicationHealth =",
              "    alert.trigger.toHealth;",
          ]
          matches = [
              index
              for index in range(len(lines) - 1)
              if lines[index:index + 2] == target
          ]
          print(f"PUBLICATION_ALERT_RUNTIME_HEALTH:{matches}")
          if len(matches) != 1:
              raise SystemExit(
                  f"PUBLICATION_ALERT_RUNTIME_HEALTH_INVALID:{matches}"
              )
          index = matches[0]
          lines[index:index + 2] = [
              "  const triggerHealth = String(alert.trigger.toHealth);"
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/audiobook-retail-publication-alert.ts
          git diff --cached --check
          git commit -m "Correct publication alert health validation"
          git pull --rebase origin work/audiobook-retail-publication-alert-delivery-20260729
          git push origin HEAD:work/audiobook-retail-publication-alert-delivery-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-alert-health-repair.yml \
            .github/publication-alert-health-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication alert health repair"
          git pull --rebase origin main
          git push origin HEAD:main
