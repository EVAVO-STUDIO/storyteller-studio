name: One-time generation engineering integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/generation-engineering-integration.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-generation-engineering-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate engineering evidence before generation completion
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .generation-engineering-integration.log
          from pathlib import Path

          path = Path("packages/storyteller/src/generation-worker.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'import { createHash } from "node:crypto";\n',
                  '''import { createHash } from "node:crypto";
          import {
            ingestAudioEngineeringArtifact,
            type AudioEngineeringArtifactResult,
          } from "./audio-engineering-artifact.js";
          import type { GenerationAudioEngineeringPolicy } from "./generation-audio-engineering.js";
          ''',
                  "imports",
              ),
              (
                  '''  artifactRegistry: FileArtifactRegistry;
            material: GenerationWorkerMaterial;
          ''',
                  '''  artifactRegistry: FileArtifactRegistry;
            audioEngineering?: GenerationAudioEngineeringPolicy;
            material: GenerationWorkerMaterial;
          ''',
                  "worker-input",
              ),
              (
                  '''}>): Promise<readonly ArtifactIngestResult[]> {
            const { worker, request, result, now } = input;
          ''',
                  '''}>): Promise<Readonly<{
            ingested: readonly ArtifactIngestResult[];
            engineering?: AudioEngineeringArtifactResult;
          }>> {
            const { worker, request, result, now } = input;
          ''',
                  "ingest-return-type",
              ),
              (
                  '  if (!audio.accepted) return ingested;\n',
                  '  if (!audio.accepted) return Object.freeze({ ingested: Object.freeze(ingested) });\n',
                  "early-return",
              ),
              (
                  '''  return ingested;
          }

          async function ingestExecutionReport''',
                  '''  let engineering: AudioEngineeringArtifactResult | undefined;
            if (worker.audioEngineering) {
              if (request.format === "pcm") {
                throw new Error("GENERATION_AUDIO_ENGINEERING_FORMAT_UNSUPPORTED");
              }
              engineering = await ingestAudioEngineeringArtifact(
                worker.objectStore,
                worker.artifactRegistry,
                {
                  candidateArtifactId: identity.artifactId,
                  projectId: worker.claim.item.projectId,
                  jobId: worker.claim.item.jobId,
                  segmentId: worker.claim.item.segmentId,
                  takeId: identity.takeId,
                  generationRequestHash: request.idempotencyKey,
                  bytes: result.audio,
                  format: request.format,
                  rights: worker.material.rights,
                  actorId: worker.workerActorId,
                  verifierActorId,
                  profile: worker.audioEngineering.profile.profile,
                  profileVersion: worker.audioEngineering.profile.externalVersion,
                  profileReviewedAt: worker.audioEngineering.profile.reviewedAt,
                  profileSourceReference: worker.audioEngineering.profile.sourceReference,
                  ...(worker.audioEngineering.runner
                    ? { runner: worker.audioEngineering.runner }
                    : {}),
                  ...(worker.audioEngineering.ffprobePath
                    ? { ffprobePath: worker.audioEngineering.ffprobePath }
                    : {}),
                  ...(worker.audioEngineering.ffmpegPath
                    ? { ffmpegPath: worker.audioEngineering.ffmpegPath }
                    : {}),
                  ...(worker.audioEngineering.timeoutMs !== undefined
                    ? { timeoutMs: worker.audioEngineering.timeoutMs }
                    : {}),
                  ...(worker.audioEngineering.maximumOutputBytes !== undefined
                    ? { maximumOutputBytes: worker.audioEngineering.maximumOutputBytes }
                    : {}),
                  ...(worker.audioEngineering.temporaryRoot
                    ? { temporaryRoot: worker.audioEngineering.temporaryRoot }
                    : {}),
                  now,
                  ...(worker.signal ? { signal: worker.signal } : {}),
                },
              );
              ingested.push(engineering.ingest);
            }

            return Object.freeze({
              ingested: Object.freeze(ingested),
              ...(engineering ? { engineering } : {}),
            });
          }

          async function ingestExecutionReport''',
                  "engineering-ingest",
              ),
              (
                  '''  const requestsById = new Map(requests.map((request) => [request.requestId, request]));
            const ingested: ArtifactIngestResult[] = [];
            try {
          ''',
                  '''  const requestsById = new Map(requests.map((request) => [request.requestId, request]));
            const ingested: ArtifactIngestResult[] = [];
            const engineeringBlockedCodes: string[] = [];
            try {
          ''',
                  "engineering-code-ledger",
              ),
              (
                  '''      ingested.push(...await ingestResultArtifacts({
                worker: input,
                request,
                result,
                now: currentTime(),
              }));
          ''',
                  '''      const resultArtifacts = await ingestResultArtifacts({
                worker: input,
                request,
                result,
                now: currentTime(),
              });
              ingested.push(...resultArtifacts.ingested);
              if (resultArtifacts.engineering && !resultArtifacts.engineering.candidateEligible) {
                const codes = resultArtifacts.engineering.evidence.findings
                  .filter((finding) => finding.severity === "error")
                  .map((finding) => finding.code);
                engineeringBlockedCodes.push(
                  ...(codes.length > 0 ? codes : ["GENERATION_AUDIO_ENGINEERING_INELIGIBLE"]),
                );
              }
          ''',
                  "result-ingest",
              ),
              (
                  '''  if (report.status !== "completed") {
          ''',
                  '''  if (engineeringBlockedCodes.length > 0) {
              return blockClaim({
                worker: input,
                executionStatus: report.status,
                accounting,
                codes: Object.freeze([...new Set(engineeringBlockedCodes)].sort()),
                message: "Independent engineering evidence did not satisfy the configured delivery profile.",
                artifacts,
                candidateArtifactIds,
                reportArtifactId: reportArtifact.ingest.envelope.payload.id,
                reportHash: reportArtifact.reportHash,
                now: currentTime(),
              });
            }

            if (report.status !== "completed") {
          ''',
                  "engineering-block",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"GENERATION_ENGINEERING_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"GENERATION_ENGINEERING_MATCH_COUNT_INVALID:{label}:{count}"
                  )
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          print("GENERATION_ENGINEERING_INTEGRATED")
          PY

      - name: Remove one-time integration machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-generation-engineering-integration.yml
          rm -f .github/generation-engineering-integration.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-worker.ts .github/workflows/one-time-generation-engineering-integration.yml .github/generation-engineering-integration.trigger
          git diff --cached --check
          git commit -m "Integrate engineering evidence before generation completion"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".generation-engineering-integration.log")
              ? fs.readFileSync(".generation-engineering-integration.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "generation engineering integration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /GENERATION_ENGINEERING_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "generation engineering integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/generation-engineering-integration",
              description: state === "success"
                ? "Independent engineering evidence gates generation completion"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
