name: One-time generation engineering integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/generation-engineering-integration.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-generation-engineering-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate engineering evidence before generation completion
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .generation-engineering-integration.log
          from pathlib import Path

          path = Path("packages/storyteller/src/generation-worker.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'import { createHash } from "node:crypto";\n',
                  'import { createHash } from "node:crypto";\n'
                  'import {\n'
                  '  ingestAudioEngineeringArtifact,\n'
                  '  type AudioEngineeringArtifactResult,\n'
                  '} from "./audio-engineering-artifact.js";\n'
                  'import type { GenerationAudioEngineeringPolicy } from "./generation-audio-engineering.js";\n',
                  "imports",
              ),
              (
                  '  artifactRegistry: FileArtifactRegistry;\n'
                  '  material: GenerationWorkerMaterial;\n',
                  '  artifactRegistry: FileArtifactRegistry;\n'
                  '  audioEngineering?: GenerationAudioEngineeringPolicy;\n'
                  '  material: GenerationWorkerMaterial;\n',
                  "worker-input",
              ),
              (
                  '}>): Promise<readonly ArtifactIngestResult[]> {\n'
                  '  const { worker, request, result, now } = input;\n',
                  '}>): Promise<Readonly<{\n'
                  '  ingested: readonly ArtifactIngestResult[];\n'
                  '  engineering?: AudioEngineeringArtifactResult;\n'
                  '}>> {\n'
                  '  const { worker, request, result, now } = input;\n',
                  "ingest-return-type",
              ),
              (
                  '  if (!audio.accepted) return ingested;\n',
                  '  if (!audio.accepted) return Object.freeze({ ingested: Object.freeze(ingested) });\n',
                  "early-return",
              ),
              (
                  '  return ingested;\n'
                  '}\n\n'
                  'async function ingestExecutionReport',
                  '  let engineering: AudioEngineeringArtifactResult | undefined;\n'
                  '  if (worker.audioEngineering) {\n'
                  '    if (request.format === "pcm") {\n'
                  '      throw new Error("GENERATION_AUDIO_ENGINEERING_FORMAT_UNSUPPORTED");\n'
                  '    }\n'
                  '    engineering = await ingestAudioEngineeringArtifact(\n'
                  '      worker.objectStore,\n'
                  '      worker.artifactRegistry,\n'
                  '      {\n'
                  '        candidateArtifactId: identity.artifactId,\n'
                  '        projectId: worker.claim.item.projectId,\n'
                  '        jobId: worker.claim.item.jobId,\n'
                  '        segmentId: worker.claim.item.segmentId,\n'
                  '        takeId: identity.takeId,\n'
                  '        generationRequestHash: request.idempotencyKey,\n'
                  '        bytes: result.audio,\n'
                  '        format: request.format,\n'
                  '        rights: worker.material.rights,\n'
                  '        actorId: worker.workerActorId,\n'
                  '        verifierActorId,\n'
                  '        profile: worker.audioEngineering.profile.profile,\n'
                  '        profileVersion: worker.audioEngineering.profile.externalVersion,\n'
                  '        profileReviewedAt: worker.audioEngineering.profile.reviewedAt,\n'
                  '        profileSourceReference: worker.audioEngineering.profile.sourceReference,\n'
                  '        ...(worker.audioEngineering.runner\n'
                  '          ? { runner: worker.audioEngineering.runner }\n'
                  '          : {}),\n'
                  '        ...(worker.audioEngineering.ffprobePath\n'
                  '          ? { ffprobePath: worker.audioEngineering.ffprobePath }\n'
                  '          : {}),\n'
                  '        ...(worker.audioEngineering.ffmpegPath\n'
                  '          ? { ffmpegPath: worker.audioEngineering.ffmpegPath }\n'
                  '          : {}),\n'
                  '        ...(worker.audioEngineering.timeoutMs !== undefined\n'
                  '          ? { timeoutMs: worker.audioEngineering.timeoutMs }\n'
                  '          : {}),\n'
                  '        ...(worker.audioEngineering.maximumOutputBytes !== undefined\n'
                  '          ? { maximumOutputBytes: worker.audioEngineering.maximumOutputBytes }\n'
                  '          : {}),\n'
                  '        ...(worker.audioEngineering.temporaryRoot\n'
                  '          ? { temporaryRoot: worker.audioEngineering.temporaryRoot }\n'
                  '          : {}),\n'
                  '        now,\n'
                  '        ...(worker.signal ? { signal: worker.signal } : {}),\n'
                  '      },\n'
                  '    );\n'
                  '    ingested.push(engineering.ingest);\n'
                  '  }\n\n'
                  '  return Object.freeze({\n'
                  '    ingested: Object.freeze(ingested),\n'
                  '    ...(engineering ? { engineering } : {}),\n'
                  '  });\n'
                  '}\n\n'
                  'async function ingestExecutionReport',
                  "engineering-ingest",
              ),
              (
                  '  const requestsById = new Map(requests.map((request) => [request.requestId, request]));\n'
                  '  const ingested: ArtifactIngestResult[] = [];\n'
                  '  try {\n',
                  '  const requestsById = new Map(requests.map((request) => [request.requestId, request]));\n'
                  '  const ingested: ArtifactIngestResult[] = [];\n'
                  '  const engineeringBlockedCodes: string[] = [];\n'
                  '  try {\n',
                  "engineering-code-ledger",
              ),
              (
                  '      ingested.push(...await ingestResultArtifacts({\n'
                  '        worker: input,\n'
                  '        request,\n'
                  '        result,\n'
                  '        now: currentTime(),\n'
                  '      }));\n',
                  '      const resultArtifacts = await ingestResultArtifacts({\n'
                  '        worker: input,\n'
                  '        request,\n'
                  '        result,\n'
                  '        now: currentTime(),\n'
                  '      });\n'
                  '      ingested.push(...resultArtifacts.ingested);\n'
                  '      if (resultArtifacts.engineering && !resultArtifacts.engineering.candidateEligible) {\n'
                  '        const codes = resultArtifacts.engineering.evidence.findings\n'
                  '          .filter((finding) => finding.severity === "error")\n'
                  '          .map((finding) => finding.code);\n'
                  '        engineeringBlockedCodes.push(\n'
                  '          ...(codes.length > 0 ? codes : ["GENERATION_AUDIO_ENGINEERING_INELIGIBLE"]),\n'
                  '        );\n'
                  '      }\n',
                  "result-ingest",
              ),
              (
                  '  if (report.status !== "completed") {\n',
                  '  if (engineeringBlockedCodes.length > 0) {\n'
                  '    return blockClaim({\n'
                  '      worker: input,\n'
                  '      executionStatus: report.status,\n'
                  '      accounting,\n'
                  '      codes: Object.freeze([...new Set(engineeringBlockedCodes)].sort()),\n'
                  '      message: "Independent engineering evidence did not satisfy the configured delivery profile.",\n'
                  '      artifacts,\n'
                  '      candidateArtifactIds,\n'
                  '      reportArtifactId: reportArtifact.ingest.envelope.payload.id,\n'
                  '      reportHash: reportArtifact.reportHash,\n'
                  '      now: currentTime(),\n'
                  '    });\n'
                  '  }\n\n'
                  '  if (report.status !== "completed") {\n',
                  "engineering-block",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"GENERATION_ENGINEERING_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"GENERATION_ENGINEERING_MATCH_COUNT_INVALID:{label}:{count}"
                  )
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          print("GENERATION_ENGINEERING_INTEGRATED")
          PY

      - name: Remove one-time integration machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-generation-engineering-integration.yml
          rm -f .github/generation-engineering-integration.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-worker.ts .github/workflows/one-time-generation-engineering-integration.yml .github/generation-engineering-integration.trigger
          git diff --cached --check
          git commit -m "Integrate engineering evidence before generation completion"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".generation-engineering-integration.log")
              ? fs.readFileSync(".generation-engineering-integration.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "generation engineering integration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /GENERATION_ENGINEERING_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "generation engineering integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/generation-engineering-integration",
              description: state === "success"
                ? "Independent engineering evidence gates generation completion"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
