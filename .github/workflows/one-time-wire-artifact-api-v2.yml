name: One-time artifact API wiring v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/storyteller-artifact-api-wiring-v2.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-artifact-api-wiring-v2
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire the read-only artifact runtime into the API
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .artifact-api-wiring-v2.log
          from pathlib import Path

          path = Path("apps/api/src/server.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"ARTIFACT_API_WIRING_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              '} from "@evavo/storyteller-engine/generation-queue";\nimport {\n  createGenerationQueueRuntime,\n',
              '} from "@evavo/storyteller-engine/generation-queue";\n'
              'import type { FileArtifactRegistry } from "@evavo/storyteller-engine/artifact-store";\n'
              'import {\n'
              '  artifactRegistryRuntimeSummary,\n'
              '  createArtifactRegistryRuntime,\n'
              '  resolveArtifactRegistryRuntimeConfiguration,\n'
              '  type ArtifactRegistryRuntimeConfiguration,\n'
              '} from "./artifact-runtime.js";\n'
              'import { handleArtifactReadRoute } from "./artifact-routes.js";\n'
              'import {\n'
              '  createGenerationQueueRuntime,\n',
              "imports",
          )
          replace_once(
              '    || code === "GENERATION_QUEUE_FILE_DRIVER_SINGLE_HOST_ACK_REQUIRED"\n',
              '    || code === "GENERATION_QUEUE_FILE_DRIVER_SINGLE_HOST_ACK_REQUIRED"\n'
              '    || code === "ARTIFACT_REGISTRY_NOT_CONFIGURED"\n'
              '    || code === "ARTIFACT_REGISTRY_DATA_DIR_REQUIRED"\n'
              '    || code === "ARTIFACT_REGISTRY_DRIVER_INVALID"\n'
              '    || code === "ARTIFACT_REGISTRY_FILE_DRIVER_SINGLE_HOST_ACK_REQUIRED"\n',
              "error-status",
          )
          replace_once(
              '  let queueRuntime: FileGenerationQueue | null | undefined;\n',
              '  let queueRuntime: FileGenerationQueue | null | undefined;\n'
              '  let artifactConfiguration: ArtifactRegistryRuntimeConfiguration | undefined;\n'
              '  let artifactRuntime: FileArtifactRegistry | null | undefined;\n',
              "runtime-state",
          )

          artifact_runtime = '''
          const resolveArtifactConfiguration = (): ArtifactRegistryRuntimeConfiguration => {
            artifactConfiguration ??= resolveArtifactRegistryRuntimeConfiguration(environment, workingDirectory);
            return artifactConfiguration;
          };

          const requireArtifactRuntime = (): FileArtifactRegistry => {
            if (artifactRuntime === undefined) {
              artifactRuntime = createArtifactRegistryRuntime(resolveArtifactConfiguration());
            }
            if (!artifactRuntime) throw new Error("ARTIFACT_REGISTRY_NOT_CONFIGURED");
            return artifactRuntime;
          };

          const artifactHealth = (): Readonly<Record<string, unknown>> => {
            try {
              const summary = artifactRegistryRuntimeSummary(resolveArtifactConfiguration());
              return { status: summary.enabled ? "ready" : "disabled", ...summary };
            } catch (error) {
              const code = error instanceof Error ? error.message : "ARTIFACT_REGISTRY_CONFIGURATION_INVALID";
              return {
                status: "misconfigured",
                enabled: false,
                workerWriteApiExposed: false,
                releaseApiExposed: false,
                code,
              };
            }
          };
          '''.strip("\n")
          replace_once(
              '\n  return async function handler(request: IncomingMessage, response: ServerResponse): Promise<void> {\n',
              f'\n{artifact_runtime}\n\n  return async function handler(request: IncomingMessage, response: ServerResponse): Promise<void> {{\n',
              "artifact-runtime",
          )
          replace_once(
              '        const generationQueue = queueHealth();\n'
              '        status = generationQueue.status === "misconfigured" ? 503 : 200;\n',
              '        const generationQueue = queueHealth();\n'
              '        const artifactRegistry = artifactHealth();\n'
              '        status = generationQueue.status === "misconfigured" || artifactRegistry.status === "misconfigured"\n'
              '          ? 503\n'
              '          : 200;\n',
              "health-status",
          )
          replace_once(
              '          generationQueue,\n        });\n',
              '          generationQueue,\n'
              '          artifactRegistry,\n'
              '        });\n',
              "health-body",
          )
          replace_once(
              '          orchestration: ["idempotent queue admission", "exclusive worker leases", "bounded retry", "operator cancellation"],\n',
              '          orchestration: ["idempotent queue admission", "exclusive worker leases", "bounded retry", "operator cancellation"],\n'
              '          artifacts: ["immutable integrity records", "private storage references", "quarantine", "review and release gates"],\n',
              "capability-artifacts",
          )
          replace_once(
              '          visuals: ["scene-level beat grouping", "continuity keys", "restrained motion policies"],\n'
              '          workerApiExposed: false,\n',
              '          visuals: ["scene-level beat grouping", "continuity keys", "restrained motion policies"],\n'
              '          workerApiExposed: false,\n'
              '          artifactWriteApiExposed: false,\n'
              '          releaseApiExposed: false,\n',
              "capability-boundary",
          )

          artifact_route = '''
              if (url.pathname.startsWith("/v1/artifacts")) {
                const artifactRoute = await handleArtifactReadRoute({
                  method: request.method,
                  url,
                  registry: request.method === "GET" ? requireArtifactRuntime() : null,
                  requestId: id,
                });
                if (artifactRoute) {
                  status = artifactRoute.status;
                  sendJson(response, id, status, artifactRoute.body);
                  return;
                }
              }
          '''.strip("\n")
          replace_once(
              '\n      if (request.method === "POST" && url.pathname === "/v1/projects/plan") {\n',
              f'\n{artifact_route}\n\n      if (request.method === "POST" && url.pathname === "/v1/projects/plan") {{\n',
              "artifact-route",
          )
          path.write_text(source, encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check the API wiring
        run: npm run typecheck

      - name: Test API routes
        run: npm run test:api

      - name: Commit the wiring directly to main
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add apps/api/src/server.ts
          git diff --cached --check
          git commit -m "Wire redacted artifact reads into API"
          git push origin HEAD:main

      - name: Publish wiring status
        if: always()
        uses: actions/github-script@v7
        env:
          WIRING_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.WIRING_JOB_STATUS === "success" ? "success" : "failure",
              context: "storyteller/artifact-api-wiring-v2",
              description: process.env.WIRING_JOB_STATUS === "success"
                ? "Artifact API wiring typecheck and tests passed"
                : "Corrected artifact API wiring failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
