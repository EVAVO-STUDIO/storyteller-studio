name: One-time chapter render source cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/chapter-render-source-cleanup.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Track resolved source before validation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .chapter-render-source-cleanup.log
          from pathlib import Path

          path = Path("packages/storyteller/src/chapter-render.ts")
          lines = path.read_text(encoding="utf-8").splitlines()
          resolve_line = "      const source = await input.sources.resolve(segment.audio, input.signal);"
          push_line = "      resolved.push(source);"
          indices = [i for i, line in enumerate(lines) if line == resolve_line]
          print(f"CHAPTER_RENDER_RESOLVE_COUNT:{len(indices)}")
          if len(indices) != 1:
              raise SystemExit(f"CHAPTER_RENDER_RESOLVE_COUNT_INVALID:{len(indices)}")
          resolve_index = indices[0]
          push_indices = [i for i, line in enumerate(lines) if line == push_line]
          print(f"CHAPTER_RENDER_PUSH_COUNT:{len(push_indices)}")
          if len(push_indices) != 1:
              raise SystemExit(f"CHAPTER_RENDER_PUSH_COUNT_INVALID:{len(push_indices)}")
          old_push = push_indices[0]
          lines.pop(old_push)
          if old_push < resolve_index:
              resolve_index -= 1
          lines.insert(resolve_index + 1, push_line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-chapter-render-source-cleanup.yml"),
              Path(".github/chapter-render-source-cleanup.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("CHAPTER_RENDER_SOURCE_CLEANUP_FIXED")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build
        run: |
          npm run verify
          npm run build
      - name: Commit cleanup fix
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Dispose rejected chapter render sources"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".chapter-render-source-cleanup.log")
              ? fs.readFileSync(".chapter-render-source-cleanup.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "chapter render cleanup log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /CHAPTER_RENDER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "chapter render cleanup failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/chapter-render-source-cleanup",
              description: state === "success"
                ? "Rejected sources dispose and complete repository verification passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
