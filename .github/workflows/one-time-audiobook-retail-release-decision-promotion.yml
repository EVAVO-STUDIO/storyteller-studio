name: One-time retail release-decision promotion

on:
  push:
    branches: [main]
    paths: [".github/audiobook-retail-release-decision.trigger"]

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-release-decision-20260729
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_RELEASE_DECISION.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-release-decision.test.ts \
            packages/storyteller/src/audiobook-retail-release-decision.ts \
            packages/storyteller/src/test-support/retail-release-package-fixture.ts \
            packages/storyteller/src/test-support/retail-release-policy-fixture.ts \
            packages/storyteller/src/test-support/retail-release-review-fixture.ts \
            scripts/check-audiobook-retail-release-decision.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/storyteller/src/project-store.ts")
          source = path.read_text(encoding="utf-8")
          old = '  | "audiobook-retail-package-review"\n  | "chapter-assembly"'
          new = '  | "audiobook-retail-package-review"\n  | "audiobook-retail-release-decision"\n  | "chapter-assembly"'
          if source.count(old) != 1:
              raise SystemExit("AUDIOBOOK_RETAIL_RELEASE_DECISION_ENTITY_FIX_INVALID")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          rm -f \
            .github/workflows/one-time-audiobook-retail-release-decision-promotion.yml \
            .github/audiobook-retail-release-decision.trigger

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-release-decision
          npm run typecheck
          node --import tsx --test packages/storyteller/src/audiobook-retail-release-decision.test.ts
          npm run verify
          npm run build

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail release decision"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.RESULT === "success" ? "success" : "failure",
              context: "storyteller/audiobook-retail-release-decision",
              description: process.env.RESULT === "success"
                ? "Release-decision tests, contracts and builds passed"
                : "Release-decision promotion failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
