name: One-time worker terminal hook integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-terminal-hook.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-terminal-hook
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add terminal-transition coordination hook
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .terminal-hook.log
          from pathlib import Path

          path = Path("packages/storyteller/src/generation-worker.ts")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  signal?: AbortSignal;\n  now?: Date;\n',
                  '  signal?: AbortSignal;\n  beforeTerminalTransition?: () => Promise<void>;\n  now?: Date;\n',
                  "input-contract",
              ),
              (
                  '}>): Promise<GenerationWorkerResult> {\n  const queueEnvelope = await input.worker.queue.block(\n',
                  '}>): Promise<GenerationWorkerResult> {\n  await input.worker.beforeTerminalTransition?.();\n  const queueEnvelope = await input.worker.queue.block(\n',
                  "block-transition",
              ),
              (
                  '    if (providerExecutionIsRetryable(report)) {\n      const queueEnvelope = await input.queue.fail(\n',
                  '    if (providerExecutionIsRetryable(report)) {\n      await input.beforeTerminalTransition?.();\n      const queueEnvelope = await input.queue.fail(\n',
                  "retry-transition",
              ),
              (
                  '  try {\n    const completion = await completeGenerationWithArtifacts({\n',
                  '  try {\n    await input.beforeTerminalTransition?.();\n    const completion = await completeGenerationWithArtifacts({\n',
                  "completion-transition",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              print(f"WORKER_TERMINAL_HOOK_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_TERMINAL_HOOK_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          print("WORKER_TERMINAL_HOOK_PATCHED")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a .terminal-hook.log

      - name: Verify worker integration
        shell: bash
        run: |
          set -o pipefail
          (npm run typecheck && npm run test:engine) 2>&1 | tee -a .terminal-hook.log

      - name: Commit terminal-transition coordination
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-worker.ts
          git diff --cached --check
          git commit -m "Coordinate worker terminal transitions"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          TERMINAL_HOOK_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.TERMINAL_HOOK_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".terminal-hook.log")
              ? fs.readFileSync(".terminal-hook.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker terminal hook log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const line of lines.filter((candidate) => candidate.startsWith("WORKER_TERMINAL_HOOK_ANCHOR:"))) {
              const [, label, rawCount] = line.split(":");
              const count = Number(rawCount);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: count === 1 ? "success" : "failure",
                context: `storyteller/terminal-hook/${label}/${count}`.slice(0, 100),
                description: count === 1 ? `${label} matched exactly once` : `${label} matched ${count} times`,
                target_url: targetUrl,
              });
            }
            const diagnostic = lines.find((line) =>
              /WORKER_TERMINAL_HOOK_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker terminal hook integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-terminal-hook",
              description: state === "success"
                ? "Worker terminal transitions are coordinated"
                : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
