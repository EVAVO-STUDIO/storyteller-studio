name: One-time mastered chapter tamper expectation correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastered-chapter-test-expectation.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct structural tamper expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/storyteller/src/mastered-chapter.test.ts")
          source = path.read_text(encoding="utf-8")
          old = '''    assert.throws(
              () => masteredChapterPublicView(comparisonTampered),
              /MASTERED_CHAPTER_COMPARISON_FINGERPRINT_INVALID/u,
            );
          '''
          new = '''    assert.throws(
              () => masteredChapterPublicView(comparisonTampered),
              /MASTERED_CHAPTER_COMPARISON_DURATION_MISMATCH|MASTERED_CHAPTER_COMPARISON_FINGERPRINT_INVALID/u,
            );
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"MASTERED_CHAPTER_TAMPER_EXPECTATION_ANCHOR_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastered-chapter-test-expectation.yml").unlink(missing_ok=True)
          Path(".github/mastered-chapter-test-expectation.trigger").unlink(missing_ok=True)
          PY
      - name: Commit expectation
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct mastered chapter tamper expectation"
          git push origin HEAD:main
