name: One-time mastered chapter promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastered-chapter-promotion-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mastered chapter promotion and corrected tamper expectation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastered-chapter-promotion-v2.log
          from pathlib import Path

          workflow_path = Path(".github/workflows/one-time-mastered-chapter-promotion.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY' 2>&1 | tee .mastered-chapter-promotion.log\n"
          end_marker = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          exec(compile(code, "mastered-chapter-promotion.py", "exec"), {})

          test_path = Path("packages/storyteller/src/mastered-chapter.test.ts")
          source = test_path.read_text(encoding="utf-8")
          old = '''    assert.throws(
              () => masteredChapterPublicView(comparisonTampered),
              /MASTERED_CHAPTER_COMPARISON_FINGERPRINT_INVALID/u,
            );
          '''
          new = '''    assert.throws(
              () => masteredChapterPublicView(comparisonTampered),
              /MASTERED_CHAPTER_COMPARISON_DURATION_MISMATCH|MASTERED_CHAPTER_COMPARISON_FINGERPRINT_INVALID/u,
            );
          '''
          count = source.count(old)
          print(f"MASTERED_CHAPTER_V2_EXPECTATION_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"MASTERED_CHAPTER_V2_EXPECTATION_ANCHOR_INVALID:{count}")
          test_path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-mastered-chapter-promotion-v2.yml"),
              Path(".github/mastered-chapter-promotion-v2.trigger"),
              Path(".github/workflows/one-time-mastered-chapter-test-expectation.yml"),
              Path(".github/mastered-chapter-test-expectation.trigger"),
              Path(".github/workflows/one-time-mastered-chapter-promotion.yml"),
              Path(".github/mastered-chapter-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERED_CHAPTER_PROMOTION_V2_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastered-chapter-promotion-v2-verify.log
          npm run build 2>&1 | tee .mastered-chapter-promotion-v2-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastered-chapter-promotion-v2-${{ github.sha }}
          path: |
            .mastered-chapter-promotion-v2.log
            .mastered-chapter-promotion-v2-verify.log
            .mastered-chapter-promotion-v2-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .mastered-chapter-promotion-v2.log .mastered-chapter-promotion-v2-verify.log .mastered-chapter-promotion-v2-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed mastered chapter ingestion"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".mastered-chapter-promotion-v2.log",
              ".mastered-chapter-promotion-v2-verify.log",
              ".mastered-chapter-promotion-v2-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /MASTERED_CHAPTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "mastered chapter promotion v2 failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastered-chapter-promotion-v2",
              description: state === "success" ? "Mastered chapter, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
