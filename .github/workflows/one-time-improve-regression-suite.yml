name: One-time regression suite repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/storyteller-regression-suite-repair.trigger"

permissions:
  contents: write

concurrency:
  group: storyteller-regression-suite-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Improve regression risk classification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/series-continuity.ts")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    const punctuationPressure = (segment.text.match(/[!?…—]/gu)?.length ?? 0) / Math.max(1, segment.wordCount);\n',
                  '    const punctuationPressure = (segment.text.match(/[!?…—]/gu)?.length ?? 0) / Math.max(1, segment.wordCount);\n'
                  '    const syntaxTurnCount = segment.text.match(/[,;:—]/gu)?.length ?? 0;\n',
                  "punctuation-pressure-anchor",
              ),
              (
                  '    if (segment.wordCount >= 90) {\n',
                  '    if (\n'
                  '      segment.wordCount >= 90\n'
                  '      || (segment.kind === "narration" && segment.wordCount >= 24 && syntaxTurnCount >= 2)\n'
                  '    ) {\n',
                  "long-syntax-condition",
              ),
              (
                  'priority: 82 + Math.min(12, Math.floor(segment.wordCount / 40)) });\n',
                  'priority: 82 + Math.min(12, Math.floor(segment.wordCount / 40) + syntaxTurnCount) });\n',
                  "long-syntax-priority",
              ),
              (
                  '    if (punctuationPressure >= 0.035) {\n',
                  '    if (punctuationPressure >= 0.035 || (segment.kind === "dialogue" && segment.wordCount <= 24)) {\n',
                  "high-pressure-condition",
              ),
              (
                  'priority: 88 + Math.min(10, Math.round(punctuationPressure * 100)) });\n',
                  'priority: 88 + Math.min(10, Math.round(punctuationPressure * 100) + (segment.kind === "dialogue" ? 1 : 0)) });\n',
                  "high-pressure-priority",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"REGRESSION_SUITE_REPAIR_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8", newline="\n")
          PY

      - name: Commit the repair directly to main
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/series-continuity.ts
          git diff --cached --check
          git commit -m "Improve series regression calibration coverage"
          git push origin HEAD:main
