name: One-time publication image provenance integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-image-provenance.trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-image-provenance-20260730
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bind publication image to exact source revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"REPLACE:{path}:{count}:{old[:70]!r}")
              if count != 1:
                  raise SystemExit(f"PATCH_SCOPE_INVALID:{path}:{count}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_one(
              "Dockerfile.publication-operations",
              '''FROM node:22.18.0-bookworm-slim

          WORKDIR /opt/storyteller

          COPY . .

          RUN npm ci --no-audit --no-fund \\
            && npm run typecheck \\
            && npm run build \\
            && mkdir -p /var/lib/storyteller \\
            && chown -R node:node /opt/storyteller /var/lib/storyteller

          ENV NODE_ENV=production \\
            HOME=/tmp \\
            STORYTELLER_DATA_DIR=/var/lib/storyteller
          '''.replace("          ", ""),
              '''FROM node:24.18.0-bookworm-slim

          ARG STORYTELLER_APPLICATION_REVISION

          RUN node -e "const revision=process.env.STORYTELLER_APPLICATION_REVISION??'';if(!/^[a-f0-9]{40}$/.test(revision)){throw new Error('STORYTELLER_APPLICATION_REVISION_INVALID')}"

          LABEL org.opencontainers.image.revision="${STORYTELLER_APPLICATION_REVISION}"

          WORKDIR /opt/storyteller

          COPY . .

          RUN npm ci --no-audit --no-fund \\
            && npm run typecheck \\
            && npm run build \\
            && mkdir -p /var/lib/storyteller \\
            && chown -R node:node /opt/storyteller /var/lib/storyteller

          ENV NODE_ENV=production \\
            HOME=/tmp \\
            STORYTELLER_DATA_DIR=/var/lib/storyteller \\
            STORYTELLER_APPLICATION_REVISION=${STORYTELLER_APPLICATION_REVISION}
          '''.replace("          ", ""),
          )

          replace_one(
              "compose.publication-operations.yml",
              '''  build:
              context: .
              dockerfile: Dockerfile.publication-operations
            image: storyteller-publication-operations:local
          '''.replace("          ", ""),
              '''  build:
              context: .
              dockerfile: Dockerfile.publication-operations
              args:
                STORYTELLER_APPLICATION_REVISION: ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
            image: storyteller-publication-operations:local
          '''.replace("          ", ""),
          )
          replace_one(
              "compose.publication-operations.yml",
              '''  environment:
              NODE_ENV: production
              STORYTELLER_DATA_DIR: /var/lib/storyteller
          '''.replace("          ", ""),
              '''  environment:
              NODE_ENV: production
              STORYTELLER_DATA_DIR: /var/lib/storyteller
              STORYTELLER_APPLICATION_REVISION: ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}
          '''.replace("          ", ""),
          )

          replace_one(
              ".env.publication-operations.example",
              "# Exact 40-character lowercase Git commit SHA for the image/code performing backup or restore.\n",
              "# Exact 40-character lowercase Git commit SHA. Compose passes this to the image build, OCI revision label and every runtime role.\n",
          )

          replace_one(
              "docs/PUBLICATION_OPERATIONS_DOCKER.md",
              "`Dockerfile.publication-operations` uses Node.js 22.18, installs the locked workspace dependencies, runs strict TypeScript and workspace builds, then runs the worker as the unprivileged `node` user.\n",
              "`Dockerfile.publication-operations` uses Node.js 24.18.0, matching `.nvmrc`, installs the locked workspace dependencies, runs strict TypeScript and workspace builds, then runs the worker as the unprivileged `node` user.\n",
          )
          replace_one(
              "docs/PUBLICATION_OPERATIONS_DOCKER.md",
              "The image does not publish a port or include an HTTP proxy.\n",
              '''The image does not publish a port or include an HTTP proxy.

          ## Image revision binding

          Before Compose configuration or build, set `STORYTELLER_APPLICATION_REVISION` to the exact reviewed lowercase 40-character Git commit SHA:

          ```bash
          export STORYTELLER_APPLICATION_REVISION="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          ```

          Compose passes the same value as the Docker build argument and runtime environment. The Dockerfile rejects missing, uppercase, shortened or non-hex revisions, records the value in `org.opencontainers.image.revision`, and exposes it to the private backup and restore CLI.

          The runtime value therefore comes from the immutable image build contract rather than a separately editable container override. Before deployment, confirm the reviewed checkout is clean and the SHA matches the intended release commit.
          '''.replace("          ", ""),
          )
          replace_one(
              "docs/PUBLICATION_OPERATIONS_DOCKER.md",
              "- distinct alert, refresh and gateway identities.\n",
              "- distinct alert, refresh and gateway identities;\n- the exact reviewed `STORYTELLER_APPLICATION_REVISION`.\n",
          )

          checker = Path("scripts/check-publication-operations-compose.mjs")
          source = checker.read_text(encoding="utf-8")
          source = source.replace(
              '  "FROM node:22.18.0-bookworm-slim",\n',
              '  "FROM node:24.18.0-bookworm-slim",\n  "ARG STORYTELLER_APPLICATION_REVISION",\n  "STORYTELLER_APPLICATION_REVISION_INVALID",\n  \'LABEL org.opencontainers.image.revision="${STORYTELLER_APPLICATION_REVISION}"\',\n  "STORYTELLER_APPLICATION_REVISION=${STORYTELLER_APPLICATION_REVISION}",\n',
              1,
          )
          source = source.replace(
              '  "Dockerfile.publication-operations",\n  "STORYTELLER_PUBLICATION_OPERATIONS_ENV_FILE",\n',
              '  "Dockerfile.publication-operations",\n  "STORYTELLER_PUBLICATION_OPERATIONS_ENV_FILE",\n  "STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION",\n',
              1,
          )
          source = source.replace(
              'if (existsSync(fromRoot("Dockerfile.publication-operations"))) {\n  const dockerfile = read("Dockerfile.publication-operations");\n',
              '''if (existsSync(fromRoot("Dockerfile.publication-operations"))) {
            const dockerfile = read("Dockerfile.publication-operations");
            const pinnedRuntime = existsSync(fromRoot(".nvmrc"))
              ? read(".nvmrc").trim()
              : "";
            if (!pinnedRuntime || !dockerfile.includes(`FROM node:${pinnedRuntime}-bookworm-slim`)) {
              problems.push("publication operations image runtime must exactly match .nvmrc");
            }
          '''.replace("          ", ""),
              1,
          )
          source = source.replace(
              '  "STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID=",\n',
              '  "STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID=",\n  "STORYTELLER_APPLICATION_REVISION=replace-with-40-character-git-commit-sha",\n',
              1,
          )
          source = source.replace(
              '  "Included roles",\n',
              '  "Included roles",\n  "Image revision binding",\n  "org.opencontainers.image.revision",\n',
              1,
          )
          source = source.replace(
              'console.log("- one immutable worker image runs four long-lived or startup publication roles");\n',
              'console.log("- one immutable worker image runs four long-lived or startup publication roles");\nconsole.log("- image runtime matches .nvmrc and build provenance is bound to one exact source revision");\n',
              1,
          )
          checker.write_text(source, encoding="utf-8", newline="\n")
          PY

      - name: Install exact workspace graph
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Validate image provenance slice
        run: |
          npm run verify:publication-operations-compose
          npm run verify:publication-operations-backup
          npm run typecheck

      - name: Commit verified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            Dockerfile.publication-operations \
            compose.publication-operations.yml \
            .env.publication-operations.example \
            docs/PUBLICATION_OPERATIONS_DOCKER.md \
            scripts/check-publication-operations-compose.mjs
          git diff --cached --check
          git commit -m "Bind publication image to exact source revision"
          git push origin HEAD:work/publication-image-provenance-20260730

      - name: Remove temporary integration from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f \
            .github/workflows/one-time-publication-image-provenance.yml \
            .github/publication-image-provenance.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Remove publication image provenance integration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
