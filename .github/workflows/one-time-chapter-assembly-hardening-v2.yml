name: One-time chapter assembly hardening v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/chapter-assembly-hardening-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harden chapter assembly validation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .chapter-assembly-hardening-v2.log
          from pathlib import Path

          def load(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def save(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          def find(lines: list[str], text: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == text:
                      return index
              raise SystemExit(f"CHAPTER_ASSEMBLY_V2_LINE_MISSING:{text}")

          test_path = "packages/storyteller/src/chapter-assembly.test.ts"
          test_lines = load(test_path)
          old = "    /AUDIO_ENGINEERING_EVIDENCE_FINGERPRINT_MISMATCH|CHAPTER_ASSEMBLY_ENGINEERING_CONTENT_MISMATCH/u,"
          new = "    /AUDIO_ENGINEERING_FINGERPRINT_INVALID|AUDIO_ENGINEERING_EVIDENCE_FINGERPRINT_MISMATCH|CHAPTER_ASSEMBLY_ENGINEERING_CONTENT_MISMATCH/u,"
          if new not in test_lines:
              test_lines[find(test_lines, old)] = new
          save(test_path, test_lines)

          module_path = "packages/storyteller/src/chapter-assembly.ts"
          lines = load(module_path)
          section_start = find(lines, "export function assertChapterAssemblyPlan(plan: ChapterAssemblyPlan): void {")
          loop_anchor = find(lines, "  let previousSourceEnd = -1;", section_start)
          sentinel = "  const segmentIds = new Set<string>();"
          if sentinel not in lines[section_start:]:
              lines[loop_anchor + 1:loop_anchor + 1] = [
                  "  const segmentIds = new Set<string>();",
                  "  const takeIds = new Set<string>();",
                  "  const audioIds = new Set<string>();",
                  "  if (Number.isNaN(Date.parse(plan.createdAt))) {",
                  '    throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_DATE_INVALID");',
                  "  }",
                  '  requireInteger(plan.sourceDurationMs, 1, MAX_CHAPTER_DURATION_MS, "CHAPTER_ASSEMBLY_SOURCE_TOTAL_INVALID");',
                  '  requireInteger(plan.renderedDurationMs, 1, MAX_CHAPTER_DURATION_MS, "CHAPTER_ASSEMBLY_RENDERED_TOTAL_INVALID");',
              ]
          rights_anchor = find(
              lines,
              '    requireHash(segment.rightsFingerprint, "CHAPTER_ASSEMBLY_RIGHTS_HASH_INVALID");',
              section_start,
          )
          duplicate_sentinel = '    if (segmentIds.has(segment.segmentId)) throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_SEGMENT_DUPLICATE");'
          if duplicate_sentinel not in lines[section_start:]:
              lines[rights_anchor + 1:rights_anchor + 1] = [
                  '    if (segmentIds.has(segment.segmentId)) throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_SEGMENT_DUPLICATE");',
                  '    if (takeIds.has(segment.takeId)) throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_TAKE_DUPLICATE");',
                  '    if (audioIds.has(segment.audio.id)) throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_AUDIO_DUPLICATE");',
                  "    segmentIds.add(segment.segmentId);",
                  "    takeIds.add(segment.takeId);",
                  "    audioIds.add(segment.audio.id);",
                  "    for (const [value, maximum, code] of [",
                  '      [segment.trimStartMs, plan.policy.maximumTrimMs, "CHAPTER_ASSEMBLY_TRIM_START_INVALID"],',
                  '      [segment.trimEndMs, plan.policy.maximumTrimMs, "CHAPTER_ASSEMBLY_TRIM_END_INVALID"],',
                  '      [segment.fadeInMs, plan.policy.maximumFadeMs, "CHAPTER_ASSEMBLY_FADE_IN_INVALID"],',
                  '      [segment.fadeOutMs, plan.policy.maximumFadeMs, "CHAPTER_ASSEMBLY_FADE_OUT_INVALID"],',
                  '      [segment.gapBeforeMs, plan.policy.maximumGapMs, "CHAPTER_ASSEMBLY_GAP_BEFORE_INVALID"],',
                  '      [segment.gapAfterMs, plan.policy.maximumGapMs, "CHAPTER_ASSEMBLY_GAP_AFTER_INVALID"],',
                  "    ] as const) requireInteger(value, 0, maximum, code);",
                  '    requireInteger(segment.sourceDurationMs, 1, MAX_CHAPTER_DURATION_MS, "CHAPTER_ASSEMBLY_DURATION_INVALID");',
                  '    if (segment.renderedDurationMs < 1) throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_TRIM_CONSUMES_AUDIO");',
                  "    if (segment.fadeInMs + segment.fadeOutMs > segment.renderedDurationMs) {",
                  '      throw new ChapterAssemblyError("CHAPTER_ASSEMBLY_FADES_EXCEED_AUDIO");',
                  "    }",
              ]
          save(module_path, lines)

          for path in [
              ".github/workflows/one-time-chapter-assembly-hardening.yml",
              ".github/chapter-assembly-hardening.trigger",
              ".github/workflows/one-time-chapter-assembly-hardening-v2.yml",
              ".github/chapter-assembly-hardening-v2.trigger",
          ]:
              Path(path).unlink(missing_ok=True)
          print("CHAPTER_ASSEMBLY_HARDENING_V2_WRITTEN")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build
        run: |
          npm run verify
          npm run build
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Harden governed chapter assembly"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".chapter-assembly-hardening-v2.log")
              ? fs.readFileSync(".chapter-assembly-hardening-v2.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "chapter assembly hardening v2 log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /CHAPTER_ASSEMBLY_V2_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "chapter assembly hardening v2 failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/chapter-assembly-hardening-v2",
              description: state === "success"
                ? "Chapter assembly, complete tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
