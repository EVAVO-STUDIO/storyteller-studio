name: One-time governed worker transition hooks v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-transition-hooks-v2.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-transition-hooks-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add governed queue transition hooks
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-transition-hooks-v2.log
          from pathlib import Path
          from textwrap import dedent

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              print(f"WORKER_TRANSITION_V2_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_TRANSITION_V2_MATCH_COUNT_INVALID:{label}:{count}")
              return source.replace(old, new, 1)

          artifact_path = Path("packages/storyteller/src/artifact-queue.ts")
          artifact = artifact_path.read_text(encoding="utf-8")
          artifact = replace_once(
              artifact,
              '  currency?: string;\n  now?: Date;\n',
              '  currency?: string;\n'
              '  beforeQueueComplete?: (input: Readonly<{\n'
              '    artifactIds: readonly string[];\n'
              '    candidateTakeIds: readonly string[];\n'
              '    admissionFingerprint: string;\n'
              '  }>) => Promise<void>;\n'
              '  now?: Date;\n',
              "artifact-completion-contract",
          )
          artifact = replace_once(
              artifact,
              '  const envelope = await input.queue.complete(\n',
              '  await input.beforeQueueComplete?.({\n'
              '    artifactIds: assessment.artifactIds,\n'
              '    candidateTakeIds,\n'
              '    admissionFingerprint,\n'
              '  });\n'
              '  const envelope = await input.queue.complete(\n',
              "artifact-completion-call",
          )
          artifact_path.write_text(artifact, encoding="utf-8", newline="\n")

          worker_path = Path("packages/storyteller/src/generation-worker.ts")
          worker = worker_path.read_text(encoding="utf-8")
          transition_types = dedent('''\
          export interface GenerationWorkerCostAccounting {
            attemptedProviderCount: number;
            successfulResultCount: number;
            totalEstimatedCost?: number;
            currency?: string;
            blockedCode?: string;
          }

          export type GenerationWorkerQueueTransition =
            | Readonly<{
                kind: "block" | "retry";
                codes: readonly string[];
                accounting: GenerationWorkerCostAccounting;
                at: string;
              }>
            | Readonly<{
                kind: "complete";
                codes: readonly [];
                accounting: GenerationWorkerCostAccounting;
                artifactIds: readonly string[];
                candidateTakeIds: readonly string[];
                admissionFingerprint: string;
                at: string;
              }>;

          ''')
          worker = replace_once(
              worker,
              'export interface ClaimedGenerationWorkerInput {\n',
              transition_types + 'export interface ClaimedGenerationWorkerInput {\n',
              "worker-transition-types",
          )
          worker = replace_once(
              worker,
              '  beforeTerminalTransition?: () => Promise<void>;\n',
              '  beforeTerminalTransition?: (transition: GenerationWorkerQueueTransition) => Promise<void>;\n',
              "worker-transition-callback",
          )

          accounting_start = worker.index('function executionAccounting(')
          accounting_end = worker.index('\nfunction resultIdentity(', accounting_start)
          accounting = dedent('''\
          function executionAccounting(
            report: GenerationExecutionReport,
            policy: GenerationWorkerMaterial["costPolicy"],
          ): GenerationWorkerCostAccounting {
            let total = 0;
            let currency: string | undefined;
            let observedCosts = 0;
            const attemptedProviderCount = report.attempts.filter(
              (attempt) => attempt.status !== "skipped",
            ).length;
            const successfulResultCount = report.results.length;
            const resultBase = { attemptedProviderCount, successfulResultCount };

            for (const result of report.results) {
              const cost = result.usage.estimatedCost;
              const resultCurrency = result.usage.currency;
              if (cost === undefined) continue;
              if (!Number.isFinite(cost) || cost < 0 || !resultCurrency || !CURRENCY_PATTERN.test(resultCurrency)) {
                return { ...resultBase, blockedCode: "GENERATION_COST_EVIDENCE_INVALID" };
              }
              if (currency && currency !== resultCurrency) {
                return {
                  ...resultBase,
                  totalEstimatedCost: Number(total.toFixed(6)),
                  currency,
                  blockedCode: "GENERATION_COST_CURRENCY_MISMATCH",
                };
              }
              currency = resultCurrency;
              total += cost;
              observedCosts += 1;
            }

            const observed = observedCosts > 0
              ? { totalEstimatedCost: Number(total.toFixed(6)), currency }
              : {};
            if (policy) {
              if (observedCosts !== report.results.length) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_EVIDENCE_MISSING" };
              }
              if (currency !== policy.currency) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_POLICY_CURRENCY_MISMATCH" };
              }
              if (total > policy.maximumTotalEstimatedCost) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_POLICY_EXCEEDED" };
              }
            }
            return { ...resultBase, ...observed };
          }
          ''')
          print("WORKER_TRANSITION_V2_ANCHOR:worker-accounting-boundary:1")
          worker = worker[:accounting_start] + accounting + worker[accounting_end:]

          worker = replace_once(
              worker,
              '  reportHash?: string;\n'
              '  now: Date;\n'
              '}>): Promise<GenerationWorkerResult> {\n'
              '  await input.worker.beforeTerminalTransition?.();\n',
              '  reportHash?: string;\n'
              '  accounting: GenerationWorkerCostAccounting;\n'
              '  now: Date;\n'
              '}>): Promise<GenerationWorkerResult> {\n'
              '  await input.worker.beforeTerminalTransition?.({\n'
              '    kind: "block",\n'
              '    codes: input.codes,\n'
              '    accounting: input.accounting,\n'
              '    at: input.now.toISOString(),\n'
              '  });\n',
              "worker-block-transition",
          )

          report_start = worker.index('  const report = await executeGenerationJob({')
          post_report = worker.index('  throwIfWorkerAborted(input.signal);', report_start)
          insertion = post_report + len('  throwIfWorkerAborted(input.signal);')
          worker = worker[:insertion] + '\n  const accounting = executionAccounting(report, input.material.costPolicy);' + worker[insertion:]
          print("WORKER_TRANSITION_V2_ANCHOR:worker-early-accounting:1")
          worker = replace_once(
              worker,
              '  const accounting = executionAccounting(report, input.material.costPolicy);\n'
              '  if (accounting.blockedCode) {\n',
              '  if (accounting.blockedCode) {\n',
              "worker-remove-late-accounting",
          )

          block_anchor = '      executionStatus: report.status,\n      codes:'
          block_count = worker.count(block_anchor)
          print(f"WORKER_TRANSITION_V2_ANCHOR:worker-block-accounting:{block_count}")
          if block_count != 6:
              raise SystemExit(f"WORKER_TRANSITION_V2_MATCH_COUNT_INVALID:worker-block-accounting:{block_count}")
          worker = worker.replace(
              block_anchor,
              '      executionStatus: report.status,\n      accounting,\n      codes:',
          )

          worker = replace_once(
              worker,
              '    if (providerExecutionIsRetryable(report)) {\n'
              '      await input.beforeTerminalTransition?.();\n'
              '      const queueEnvelope = await input.queue.fail(\n',
              '    if (providerExecutionIsRetryable(report)) {\n'
              '      const transitionTime = currentTime();\n'
              '      await input.beforeTerminalTransition?.({\n'
              '        kind: "retry",\n'
              '        codes: ["GENERATION_PROVIDER_EXECUTION_INCOMPLETE"],\n'
              '        accounting,\n'
              '        at: transitionTime.toISOString(),\n'
              '      });\n'
              '      const queueEnvelope = await input.queue.fail(\n',
              "worker-retry-transition",
          )
          retry_start = worker.index('    if (providerExecutionIsRetryable(report)) {')
          retry_end = worker.index('      return {', retry_start)
          retry_section = worker[retry_start:retry_end]
          retry_section = replace_once(
              retry_section,
              '          now: currentTime(),\n',
              '          now: transitionTime,\n',
              "worker-retry-time",
          )
          worker = worker[:retry_start] + retry_section + worker[retry_end:]

          worker = replace_once(
              worker,
              '  try {\n'
              '    await input.beforeTerminalTransition?.();\n'
              '    const completion = await completeGenerationWithArtifacts({\n',
              '  try {\n'
              '    const completionTime = currentTime();\n'
              '    const completion = await completeGenerationWithArtifacts({\n',
              "worker-completion-time",
          )
          worker = replace_once(
              worker,
              '      ...(accounting.totalEstimatedCost !== undefined\n'
              '        ? {\n'
              '            totalEstimatedCost: accounting.totalEstimatedCost,\n'
              '            currency: accounting.currency,\n'
              '          }\n'
              '        : {}),\n'
              '      now: currentTime(),\n',
              '      ...(accounting.totalEstimatedCost !== undefined\n'
              '        ? {\n'
              '            totalEstimatedCost: accounting.totalEstimatedCost,\n'
              '            currency: accounting.currency,\n'
              '          }\n'
              '        : {}),\n'
              '      beforeQueueComplete: async ({\n'
              '        artifactIds,\n'
              '        candidateTakeIds,\n'
              '        admissionFingerprint,\n'
              '      }) => {\n'
              '        await input.beforeTerminalTransition?.({\n'
              '          kind: "complete",\n'
              '          codes: [],\n'
              '          accounting,\n'
              '          artifactIds,\n'
              '          candidateTakeIds,\n'
              '          admissionFingerprint,\n'
              '          at: completionTime.toISOString(),\n'
              '        });\n'
              '      },\n'
              '      now: completionTime,\n',
              "worker-completion-transition",
          )
          worker_path.write_text(worker, encoding="utf-8", newline="\n")

          heartbeat_path = Path("packages/storyteller/src/heartbeat-worker.ts")
          heartbeat = heartbeat_path.read_text(encoding="utf-8")
          heartbeat = replace_once(
              heartbeat,
              '  type GenerationWorkerPublicView,\n'
              '  type GenerationWorkerResult,\n',
              '  type GenerationWorkerPublicView,\n'
              '  type GenerationWorkerQueueTransition,\n'
              '  type GenerationWorkerResult,\n',
              "heartbeat-transition-import",
          )
          heartbeat = replace_once(
              heartbeat,
              '  signal?: AbortSignal;\n'
              '  heartbeat?: GenerationLeaseHeartbeatOptions;\n',
              '  signal?: AbortSignal;\n'
              '  heartbeat?: GenerationLeaseHeartbeatOptions;\n'
              '  beforeQueueTransition?: (transition: GenerationWorkerQueueTransition) => Promise<void>;\n',
              "heartbeat-transition-contract",
          )
          heartbeat = replace_once(
              heartbeat,
              '    heartbeat: heartbeatOptions,\n'
              '    signal: externalSignal,\n'
              '    ...workerInput\n',
              '    heartbeat: heartbeatOptions,\n'
              '    signal: externalSignal,\n'
              '    beforeQueueTransition,\n'
              '    ...workerInput\n',
              "heartbeat-transition-destructure",
          )
          heartbeat = replace_once(
              heartbeat,
              '      beforeTerminalTransition: async () => {\n'
              '        await heartbeat.stopForTerminalTransition();\n'
              '      },\n',
              '      beforeTerminalTransition: async (transition) => {\n'
              '        await heartbeat.stopForTerminalTransition();\n'
              '        await beforeQueueTransition?.(transition);\n'
              '      },\n',
              "heartbeat-transition-compose",
          )
          heartbeat_path.write_text(heartbeat, encoding="utf-8", newline="\n")
          print("WORKER_TRANSITION_HOOKS_V2_PATCHED")
          PY

      - name: Remove failed and completed migration machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/one-time-worker-transition-hooks.yml \
            .github/worker-transition-hooks.trigger \
            .github/workflows/one-time-worker-transition-hooks-v2.yml \
            .github/worker-transition-hooks-v2.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify governed transition hooks
        run: npm run typecheck && npm run test:engine

      - name: Commit queue transition hooks
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/artifact-queue.ts \
            packages/storyteller/src/generation-worker.ts \
            packages/storyteller/src/heartbeat-worker.ts
          git diff --cached --check
          git commit -m "Add governed worker queue transition hooks"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-transition-hooks-v2.log")
              ? fs.readFileSync(".worker-transition-hooks-v2.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker transition hook v2 log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_TRANSITION_V2_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker transition hook integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-transition-hooks-v2",
              description: state === "success"
                ? "Worker queue transitions expose governed settlement hooks"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
