name: One-time narrator review monitoring type correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/narrator-review-monitor-type.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve the reviewed runtime narrowing in TypeScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/narrator-voice-profile.ts")
          source = path.read_text(encoding="utf-8")
          old = '    objectiveMonitoringContinuitySeverity: input.objectiveMonitoring.continuitySeverity,\n'
          new = '    objectiveMonitoringContinuitySeverity: input.objectiveMonitoring.continuitySeverity as "stable" | "review",\n'
          if source.count(old) != 1:
              raise SystemExit(f"NARRATOR_REVIEW_MONITOR_TYPE_TARGET_INVALID:{source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-narrator-review-monitor-type.yml"),
              Path(".github/narrator-review-monitor-type.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          PY
      - name: Commit the correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Fix narrator review monitoring type narrowing"
          git pull --rebase origin main
          git push origin HEAD:main
