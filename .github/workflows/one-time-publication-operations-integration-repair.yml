name: One-time publication operations integration repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-operations-integration-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-alert-delivery-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path("packages/storyteller/src/project-store.ts")
          store_lines = store_path.read_text(encoding="utf-8").splitlines()
          store_matches = [
              index
              for index in range(len(store_lines) - 1)
              if store_lines[index].strip()
                  == '| "audiobook-retail-publication-verification"'
              and store_lines[index + 1].strip() == '| "chapter-assembly"'
          ]
          print(f"PUBLICATION_ENTITY_REGISTRATION:{store_matches}")
          if len(store_matches) != 1:
              raise SystemExit(
                  f"PUBLICATION_ENTITY_REGISTRATION_INVALID:{store_matches}"
              )
          store_index = store_matches[0]
          store_lines[store_index + 1:store_index + 1] = [
              '  | "audiobook-retail-publication-monitor"',
              '  | "audiobook-retail-publication-alert"',
          ]
          store_path.write_text(
              "\n".join(store_lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          alert_path = Path("packages/storyteller/src/audiobook-retail-publication-alert.ts")
          alert_lines = alert_path.read_text(encoding="utf-8").splitlines()
          alert_matches = [
              index
              for index in range(len(alert_lines) - 3)
              if alert_lines[index].strip() == "if ("
              and alert_lines[index + 1].strip()
                  == 'alert.distributor !== "acx-audible"'
              and alert_lines[index + 2].strip()
                  == '|| alert.trigger.toHealth === "healthy-live"'
              and alert_lines[index + 3].strip() == ") {"
          ]
          print(f"PUBLICATION_ALERT_HEALTH_NARROWING:{alert_matches}")
          if len(alert_matches) != 1:
              raise SystemExit(
                  f"PUBLICATION_ALERT_HEALTH_NARROWING_INVALID:{alert_matches}"
              )
          alert_index = alert_matches[0]
          alert_lines[alert_index:alert_index + 4] = [
              "  const triggerHealth: AudiobookRetailPublicationHealth =",
              "    alert.trigger.toHealth;",
              "  if (",
              '    alert.distributor !== "acx-audible"',
              '    || triggerHealth === "healthy-live"',
              "  ) {",
          ]
          alert_path.write_text(
              "\n".join(alert_lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/project-store.ts \
            packages/storyteller/src/audiobook-retail-publication-alert.ts
          git diff --cached --check
          git commit -m "Register publication operations entities"
          git pull --rebase origin work/audiobook-retail-publication-alert-delivery-20260729
          git push origin HEAD:work/audiobook-retail-publication-alert-delivery-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-operations-integration-repair.yml \
            .github/publication-operations-integration-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication operations integration repair"
          git pull --rebase origin main
          git push origin HEAD:main
