name: One-time book credit queue promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-credit-queue-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote calibrated book credit queue admission
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-credit-queue-promotion.log
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"BOOK_CREDIT_QUEUE_PROMOTION_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"BOOK_CREDIT_QUEUE_PROMOTION_ANCHOR_INVALID:{label}:{count}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          source_path = Path("packages/storyteller/src/book-credit-queue.ts")
          replace_once(
              source_path,
              'const HASH_PATTERN = /^[a-f0-9]{64}$/u;\n',
              '''const HASH_PATTERN = /^[a-f0-9]{64}$/u;
          const QUEUE_STATUSES: ReadonlySet<GenerationQueueStatus> = new Set([
            "queued",
            "leased",
            "retry-wait",
            "completed",
            "blocked",
            "failed",
            "cancelled",
          ]);
          ''',
              "queue-statuses",
          )
          replace_once(
              source_path,
              '''  if (receipt.creditKind !== "opening" && receipt.creditKind !== "closing") {
            throw new BookCreditQueueError("BOOK_CREDIT_QUEUE_KIND_INVALID");
          }
          ''',
              '''  if (receipt.creditKind !== "opening" && receipt.creditKind !== "closing") {
            throw new BookCreditQueueError("BOOK_CREDIT_QUEUE_KIND_INVALID");
          }
          if (!QUEUE_STATUSES.has(receipt.queueStatus)) {
            throw new BookCreditQueueError("BOOK_CREDIT_QUEUE_STATUS_INVALID");
          }
          if (receipt.queueItemId !== generationQueueEntityId(receipt.jobId)) {
            throw new BookCreditQueueError("BOOK_CREDIT_QUEUE_ITEM_SCOPE_MISMATCH");
          }
          ''',
              "receipt-status-and-scope",
          )

          test_path = Path("packages/storyteller/src/book-credit-queue.test.ts")
          source = test_path.read_text(encoding="utf-8")
          start_marker = '    const { fingerprint: _fingerprint, ...base } = receipt;\n'
          end_marker = '    const structurallyInvalidBase = {\n'
          start_count = source.count(start_marker)
          end_count = source.count(end_marker)
          print(
              f"BOOK_CREDIT_QUEUE_PROMOTION_SECTION:tamper-fixture:"
              f"{start_count}:{end_count}"
          )
          if start_count != 1 or end_count != 1:
              raise SystemExit(
                  f"BOOK_CREDIT_QUEUE_PROMOTION_SECTION_INVALID:tamper-fixture:"
                  f"{start_count}:{end_count}"
              )
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    const { fingerprint: _fingerprint, ...base } = receipt;
            const fingerprintTampered = {
              ...receipt,
              priority: 99,
            };
            assert.throws(
              () => assertBookCreditQueueReceipt(fingerprintTampered),
              /BOOK_CREDIT_QUEUE_FINGERPRINT_INVALID/u,
            );

          '''
          test_path.write_text(
              source[:start] + replacement + source[end:],
              encoding="utf-8",
              newline="\n",
          )

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./book-credit-queue"] = "./src/book-credit-queue.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(
              json.dumps(engine, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:book-credit-queue"] = "node scripts/check-book-credit-queue.mjs"
          marker = "npm run verify:book-credit-generation"
          if "npm run verify:book-credit-queue" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("BOOK_CREDIT_QUEUE_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:book-credit-queue",
                  1,
              )
          root_path.write_text(
              json.dumps(root, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(".github/workflows/one-time-book-credit-queue-promotion.yml"),
              Path(".github/book-credit-queue-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CREDIT_QUEUE_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-credit-queue-verify.log
          npm run build 2>&1 | tee .book-credit-queue-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-credit-queue-promotion-${{ github.sha }}
          path: |
            .book-credit-queue-promotion.log
            .book-credit-queue-verify.log
            .book-credit-queue-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-credit-queue-promotion.log .book-credit-queue-verify.log .book-credit-queue-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify calibrated audiobook credit queue admission"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-credit-queue-promotion.log",
              ".book-credit-queue-verify.log",
              ".book-credit-queue-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_CREDIT_QUEUE_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book credit queue promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-credit-queue-promotion",
              description: state === "success" ? "Credit queue, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
