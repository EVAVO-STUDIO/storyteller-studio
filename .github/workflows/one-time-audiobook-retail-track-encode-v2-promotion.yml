name: One-time audiobook retail track admission promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-track-encode-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail track admission slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-track-encode-20260728
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_TRACK_ENCODE.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-track-encode.test.ts \
            packages/storyteller/src/audiobook-retail-track-encode.ts \
            scripts/check-audiobook-retail-track-encode.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-track-encode-promotion.log
          from pathlib import Path
          import subprocess

          expected = {
              "docs/AUDIOBOOK_RETAIL_TRACK_ENCODE.md",
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/audiobook-retail-track-encode.test.ts",
              "packages/storyteller/src/audiobook-retail-track-encode.ts",
              "scripts/check-audiobook-retail-track-encode.mjs",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print("AUDIOBOOK_RETAIL_TRACK_ENCODE_FILES:" + ",".join(sorted(changed)))
          if changed != expected:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_ENCODE_FILE_SCOPE_INVALID:"
                  + ",".join(sorted(changed))
              )

          test_path = Path(
              "packages/storyteller/src/audiobook-retail-track-encode.test.ts"
          )
          lines = test_path.read_text(encoding="utf-8").splitlines()
          start = None
          end = None
          for index, line in enumerate(lines):
              if (
                  line.strip() == "assert.throws("
                  and index + 1 < len(lines)
                  and 'approvedReference({ suffix: "other" })' in lines[index + 1]
              ):
                  start = index
                  for candidate in range(index + 1, min(len(lines), index + 12)):
                      if lines[candidate].strip() == ");":
                          end = candidate
                          break
                  break
          print(
              "AUDIOBOOK_RETAIL_TRACK_ENCODE_FIXTURE_BLOCK:"
              f"{start}:{end}"
          )
          if start is None or end is None:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_ENCODE_FIXTURE_BLOCK_INVALID"
              )
          lines = lines[:start] + lines[end + 1:]

          duplicate = [
              '      case "ffprobe-version":',
              '        throw new Error("unreachable duplicate ffprobe call");',
          ]
          duplicate_start = None
          for index in range(len(lines) - len(duplicate) + 1):
              if lines[index:index + len(duplicate)] == duplicate:
                  duplicate_start = index
                  break
          print(
              "AUDIOBOOK_RETAIL_TRACK_ENCODE_DUPLICATE_CASE:"
              f"{duplicate_start}"
          )
          if duplicate_start is None:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_ENCODE_DUPLICATE_CASE_INVALID"
              )
          lines = (
              lines[:duplicate_start]
              + lines[duplicate_start + len(duplicate):]
          )
          test_path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-track-encode-v2-promotion.yml"
              ),
              Path(".github/audiobook-retail-track-encode-v2.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_TRACK_ENCODE_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-track-encode 2>&1 | tee .audiobook-retail-track-encode-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-track-encode-typecheck.log
          node --import tsx --test packages/storyteller/src/audiobook-retail-track-encode.test.ts 2>&1 | tee .audiobook-retail-track-encode-test.log
          npm run verify 2>&1 | tee .audiobook-retail-track-encode-verify.log
          npm run build 2>&1 | tee .audiobook-retail-track-encode-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-track-encode-v2-${{ github.sha }}
          path: |
            .audiobook-retail-track-encode-promotion.log
            .audiobook-retail-track-encode-check.log
            .audiobook-retail-track-encode-typecheck.log
            .audiobook-retail-track-encode-test.log
            .audiobook-retail-track-encode-verify.log
            .audiobook-retail-track-encode-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-track-encode-promotion.log \
            .audiobook-retail-track-encode-check.log \
            .audiobook-retail-track-encode-typecheck.log \
            .audiobook-retail-track-encode-test.log \
            .audiobook-retail-track-encode-verify.log \
            .audiobook-retail-track-encode-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail track admission"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-track-encode-promotion.log",
              ".audiobook-retail-track-encode-check.log",
              ".audiobook-retail-track-encode-typecheck.log",
              ".audiobook-retail-track-encode-test.log",
              ".audiobook-retail-track-encode-verify.log",
              ".audiobook-retail-track-encode-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_TRACK_ENCODE_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "retail track admission promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-track-encode-v2",
              description: state === "success" ? "Retail track admission tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
