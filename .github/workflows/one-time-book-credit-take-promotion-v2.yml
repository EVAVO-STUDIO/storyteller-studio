name: One-time book credit take promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-credit-take-promotion-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote governed book credit take admission
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-credit-take-v2.log
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"BOOK_CREDIT_TAKE_V2_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"BOOK_CREDIT_TAKE_V2_ANCHOR_INVALID:{label}:{count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          def replace_section(path: Path, start_marker: str, end_marker: str, replacement: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              start_count = source.count(start_marker)
              end_count = source.count(end_marker)
              print(f"BOOK_CREDIT_TAKE_V2_SECTION:{label}:{start_count}:{end_count}")
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"BOOK_CREDIT_TAKE_V2_SECTION_INVALID:{label}:{start_count}:{end_count}"
                  )
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              path.write_text(source[:start] + replacement + source[end:], encoding="utf-8", newline="\n")

          source_path = Path("packages/storyteller/src/book-credit-take.ts")
          replace_once(
              source_path,
              'const HASH_PATTERN = /^[a-f0-9]{64}$/u;\n',
              'const HASH_PATTERN = /^[a-f0-9]{64}$/u;\nconst SAFE_VERSION = /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/u;\n',
              "safe-version",
          )
          replace_once(
              source_path,
              '  } else {\n    requireInteger(\n',
              '''  } else {
            if (
              evidence.sourceTextHash === evidence.observedTextHash
              && evidence.sourceCharacterCount === evidence.observedCharacterCount
            ) {
              throw new BookCreditTakeError("BOOK_CREDIT_TRANSCRIPT_MISMATCH_STATE_INVALID");
            }
            requireInteger(
          ''',
              "transcript-mismatch-state",
          )
          replace_section(
              source_path,
              "function requireChronology(earlier: string, later: string, code: string): void {\n",
              "function recordFingerprint(\n",
              '''function requireChronology(earlier: string, later: string, code: string): void {
            const earlierTime = Date.parse(earlier);
            const laterTime = Date.parse(later);
            if (
              Number.isNaN(earlierTime)
              || Number.isNaN(laterTime)
              || laterTime < earlierTime
            ) {
              throw new BookCreditTakeError(code);
            }
          }

          ''',
              "chronology",
          )
          replace_section(
              source_path,
              '  requireIdentifier(record.engineeringProfileId, "BOOK_CREDIT_TAKE_ENGINEERING_PROFILE_INVALID");\n',
              '  requireDate(record.createdAt, "BOOK_CREDIT_TAKE_DATE_INVALID");\n',
              '''  requireIdentifier(record.engineeringProfileId, "BOOK_CREDIT_TAKE_ENGINEERING_PROFILE_INVALID");
            if (!SAFE_VERSION.test(record.engineeringProfileVersion)) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_ENGINEERING_VERSION_INVALID");
            }
            if (record.transcriptEvidence.sourceTextHash !== record.scriptTextHash) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_TRANSCRIPT_SOURCE_MISMATCH");
            }
            if (new Set([
              record.audio.id,
              record.transcript.id,
              record.engineering.id,
            ]).size !== 3) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_ARTIFACT_ID_DUPLICATE");
            }
            if (!Array.isArray(record.findings) || record.findings.some((finding) =>
              !finding.code?.trim()
              || !finding.message?.trim()
              || !["info", "warning", "error"].includes(finding.severity)
            )) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_FINDINGS_INVALID");
            }
            const findingCodes = record.findings.map((finding) => finding.code);
            if (new Set(findingCodes).size !== findingCodes.length) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_FINDING_CODE_DUPLICATE");
            }
            const hasTranscriptError = findingCodes.includes(
              "BOOK_CREDIT_TAKE_TRANSCRIPT_NOT_EXACT",
            );
            const hasFinalWordError = findingCodes.includes(
              "BOOK_CREDIT_TAKE_FINAL_WORD_MISSING",
            );
            if (
              hasTranscriptError === record.transcriptEvidence.exactMatch
              || hasFinalWordError === record.transcriptEvidence.finalWordCovered
            ) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_EVIDENCE_STATE_MISMATCH");
            }
            const errors = record.findings.filter((finding) => finding.severity === "error");
            if (
              record.eligibleForReview !== (errors.length === 0)
              || record.status !== (record.eligibleForReview ? "eligible-for-review" : "blocked")
              || (record.eligibleForReview
                && (!record.transcriptEvidence.exactMatch
                  || !record.transcriptEvidence.finalWordCovered))
              || (!record.eligibleForReview && errors.length === 0)
            ) {
              throw new BookCreditTakeError("BOOK_CREDIT_TAKE_STATUS_MISMATCH");
            }
          ''',
              "record-semantics",
          )

          test_path = Path("packages/storyteller/src/book-credit-take.test.ts")
          source = test_path.read_text(encoding="utf-8")
          start_marker = 'test("transcript and take evidence reject recomputed structural tampering", async () => {\n'
          count = source.count(start_marker)
          print(f"BOOK_CREDIT_TAKE_V2_SECTION:tamper-test:{count}")
          if count != 1:
              raise SystemExit(f"BOOK_CREDIT_TAKE_V2_SECTION_INVALID:tamper-test:{count}")
          start = source.index(start_marker)
          replacement = '''test("transcript and take evidence reject recomputed structural tampering", async () => {
            const evidence = createBookCreditTranscriptEvidence({
              sourceText: creditText,
              observedText: creditText,
              assessedAt: t6,
            });
            const { fingerprint: _fingerprint, ...evidenceBase } = evidence;
            const evidenceTamperedBase = {
              ...evidenceBase,
              exactMatch: false,
              firstMismatchIndex: 0,
            };
            const evidenceTampered = {
              ...evidenceTamperedBase,
              fingerprint: stableHash(evidenceTamperedBase),
            } as typeof evidence;
            assert.throws(
              () => assertBookCreditTranscriptEvidence(evidenceTampered),
              /BOOK_CREDIT_TRANSCRIPT_MISMATCH_STATE_INVALID/u,
            );

            const fixture = await admittedFixture();
            const {
              fingerprint: _transcriptFingerprint,
              ...transcriptWithoutFingerprint
            } = fixture.record.transcriptEvidence;
            const transcriptTamperedBase = {
              ...transcriptWithoutFingerprint,
              sourceTextHash: "0".repeat(64),
            };
            const transcriptTampered = {
              ...transcriptTamperedBase,
              fingerprint: stableHash(transcriptTamperedBase),
            };
            const { fingerprint: _recordFingerprint, ...recordBase } = fixture.record;
            const recordTamperedBase = {
              ...recordBase,
              transcriptEvidence: transcriptTampered,
            };
            const recordTampered = {
              ...recordTamperedBase,
              fingerprint: stableHash(recordTamperedBase),
            } as typeof fixture.record;
            assert.throws(
              () => assertBookCreditTakeRecord(recordTampered),
              /BOOK_CREDIT_TAKE_TRANSCRIPT_SOURCE_MISMATCH/u,
            );
          });
          '''
          test_path.write_text(source[:start] + replacement, encoding="utf-8", newline="\n")

          store_path = Path("packages/storyteller/src/project-store.ts")
          replace_once(
              store_path,
              '  | "book-credit-generation"\n  | "chapter-assembly"\n',
              '  | "book-credit-generation"\n  | "book-credit-take"\n  | "chapter-assembly"\n',
              "store-entity",
          )

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./book-credit-take"] = "./src/book-credit-take.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(json.dumps(engine, indent=2) + "\n", encoding="utf-8", newline="\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:book-credit-take"] = "node scripts/check-book-credit-take.mjs"
          marker = "npm run verify:book-credit-queue"
          if "npm run verify:book-credit-take" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("BOOK_CREDIT_TAKE_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:book-credit-take",
                  1,
              )
          root_path.write_text(json.dumps(root, indent=2) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-book-credit-take-promotion.yml"),
              Path(".github/book-credit-take-promotion.trigger"),
              Path(".github/workflows/one-time-book-credit-take-promotion-v2.yml"),
              Path(".github/book-credit-take-promotion-v2.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CREDIT_TAKE_V2_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-credit-take-v2-verify.log
          npm run build 2>&1 | tee .book-credit-take-v2-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-credit-take-promotion-v2-${{ github.sha }}
          path: |
            .book-credit-take-v2.log
            .book-credit-take-v2-verify.log
            .book-credit-take-v2-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-credit-take-v2.log .book-credit-take-v2-verify.log .book-credit-take-v2-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed audiobook credit take admission"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-credit-take-v2.log",
              ".book-credit-take-v2-verify.log",
              ".book-credit-take-v2-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_CREDIT_TAKE_|BOOK_CREDIT_TRANSCRIPT_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book credit take v2 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-credit-take-promotion-v2",
              description: state === "success" ? "Credit takes, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
