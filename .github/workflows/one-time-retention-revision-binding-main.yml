name: One-time retention revision binding main

on:
  push:
    branches:
      - main
    paths:
      - ".github/retention-revision-binding-main.trigger"
      - ".github/retention-revision-binding-main-2.trigger"

permissions:
  contents: write

jobs:
  bind-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-backup-retention-revision-binding-20260730
          fetch-depth: 0

      - name: Apply revision binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, code: str) -> str:
              count = source.count(old)
              print(f"{code}:{count}")
              if count != 1:
                  raise SystemExit(f"{code}_INVALID:{count}")
              return source.replace(old, new, 1)

          domain_path = Path("packages/cli/src/publication-operations-backup-retention.ts")
          domain = domain_path.read_text(encoding="utf-8")
          domain = replace_once(domain, '"storyteller-publication-operations-backup-retention-plan-v1" as const;', '"storyteller-publication-operations-backup-retention-plan-v2" as const;', "RETENTION_PLAN_SCHEMA")
          domain = replace_once(domain, '"storyteller-publication-operations-backup-retention-result-v1" as const;', '"storyteller-publication-operations-backup-retention-result-v2" as const;', "RETENTION_RESULT_SCHEMA")
          domain = replace_once(domain, '  evaluatedAt: string;\n  policy: PublicationOperationsBackupRetentionPolicy;\n', '  evaluatedAt: string;\n  applicationRevision: string;\n  policy: PublicationOperationsBackupRetentionPolicy;\n', "RETENTION_PLAN_REVISION_FIELD")
          domain = replace_once(domain, '  planFingerprint: string;\n  retainedCount: number;\n', '  planFingerprint: string;\n  applicationRevision: string;\n  retainedCount: number;\n', "RETENTION_RESULT_REVISION_FIELD")
          domain = replace_once(domain, 'export interface PlanPublicationOperationsBackupRetentionInput {\n  backupDirectory: string;\n', 'export interface PlanPublicationOperationsBackupRetentionInput {\n  backupDirectory: string;\n  applicationRevision: string;\n', "RETENTION_INPUT_REVISION_FIELD")
          domain = replace_once(domain, 'const SAFE_IDENTIFIER = /^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$/u;\n', 'const SAFE_IDENTIFIER = /^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$/u;\nconst APPLICATION_REVISION_PATTERN = /^[a-f0-9]{40}$/u;\n', "RETENTION_REVISION_PATTERN")
          domain = replace_once(domain, 'function requireInteger(\n', 'function requireApplicationRevision(value: string): string {\n  if (!APPLICATION_REVISION_PATTERN.test(value)) {\n    throw new PublicationOperationsBackupRetentionError(\n      "PUBLICATION_OPERATIONS_BACKUP_RETENTION_APPLICATION_REVISION_INVALID",\n    );\n  }\n  return value;\n}\n\nfunction requireInteger(\n', "RETENTION_REVISION_VALIDATOR")
          domain = replace_once(domain, '  const retentionPolicy = policy(input);\n', '  const applicationRevision = requireApplicationRevision(\n    input.applicationRevision,\n  );\n  const retentionPolicy = policy(input);\n', "RETENTION_PLAN_REVISION_VALIDATE")
          domain = replace_once(domain, '    evaluatedAt: evaluatedAt.toISOString(),\n    policy: retentionPolicy,\n', '    evaluatedAt: evaluatedAt.toISOString(),\n    applicationRevision,\n    policy: retentionPolicy,\n', "RETENTION_PLAN_REVISION_VALUE")
          domain = replace_once(domain, '    planFingerprint: plan.fingerprint,\n    retainedCount: plan.retained.length,\n', '    planFingerprint: plan.fingerprint,\n    applicationRevision: plan.applicationRevision,\n    retainedCount: plan.retained.length,\n', "RETENTION_RESULT_REVISION_VALUE")
          domain_path.write_text(domain, encoding="utf-8", newline="\n")

          cli_path = Path("packages/cli/src/publication-operations-backup-retention-main.ts")
          cli = cli_path.read_text(encoding="utf-8")
          cli = cli.replace('--evaluated-at 2026-07-30T00:00:00Z --keep-latest', '--evaluated-at 2026-07-30T00:00:00Z --application-revision <40-character-git-sha> --keep-latest')
          cli = replace_once(cli, '  return {\n    backupDirectory: stringFlag(args, "backup-dir", true)!,\n', '  return {\n    backupDirectory: stringFlag(args, "backup-dir", true)!,\n    applicationRevision: stringFlag(\n      args,\n      "application-revision",\n      true,\n    )!,\n', "RETENTION_CLI_REVISION_FLAG")
          cli_path.write_text(cli, encoding="utf-8", newline="\n")

          test_path = Path("packages/cli/src/publication-operations-backup-retention.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(tests, '    const input = {\n      backupDirectory: paths.backups,\n', '    const input = {\n      backupDirectory: paths.backups,\n      applicationRevision,\n', "RETENTION_TEST_INPUT_REVISION")
          tests = tests.replace('    const common = {\n      backupDirectory: paths.backups,\n', '    const common = {\n      backupDirectory: paths.backups,\n      applicationRevision,\n')
          tests = tests.replace('    const plan = await planPublicationOperationsBackupRetention({\n      backupDirectory: paths.backups,\n', '    const plan = await planPublicationOperationsBackupRetention({\n      backupDirectory: paths.backups,\n      applicationRevision,\n')
          tests = tests.replace('      planPublicationOperationsBackupRetention({\n        backupDirectory: paths.backups,\n', '      planPublicationOperationsBackupRetention({\n        backupDirectory: paths.backups,\n        applicationRevision,\n')
          tests = tests.replace('      "--evaluated-at", evaluated,\n      "--keep-latest", "2",\n', '      "--evaluated-at", evaluated,\n      "--application-revision", applicationRevision,\n      "--keep-latest", "2",\n')
          anchor = 'test("retention rejects unknown root entries, staging state and symbolic links", async (context) => {\n'
          revision_test = 'test("application revision change invalidates an approved plan before deletion", async () => {\n  await withDirectories(async (paths) => {\n    await createSnapshots(paths);\n    const common = {\n      backupDirectory: paths.backups,\n      applicationRevision,\n      keepLatest: 2,\n      keepDailyDays: 0,\n      keepWeeklyWeeks: 0,\n      evaluatedAt,\n    } as const;\n    const plan = await planPublicationOperationsBackupRetention(common);\n    assert.equal(plan.applicationRevision, applicationRevision);\n    await assert.rejects(\n      prunePublicationOperationsBackups({\n        ...common,\n        applicationRevision: "2".repeat(40),\n        actorId: "retention_revision_operator_001",\n        offlineConfirmed: true,\n        expectedPlanFingerprint: plan.fingerprint,\n        prunedAt: new Date("2026-07-30T12:05:00.000Z"),\n      }),\n      /PUBLICATION_OPERATIONS_BACKUP_RETENTION_PLAN_STALE/u,\n    );\n    assert.equal((await readdir(paths.backups)).length, snapshotDates.length);\n  });\n});\n\n'
          tests = replace_once(tests, anchor, revision_test + anchor, "RETENTION_TEST_REVISION_CHANGE")
          tests = tests.replace('      fingerprint: string;\n      delete: unknown[];\n', '      fingerprint: string;\n      applicationRevision: string;\n      delete: unknown[];\n')
          tests = replace_once(tests, '    assert.equal(plan.delete.length > 0, true);\n', '    assert.equal(plan.delete.length > 0, true);\n    assert.equal(plan.applicationRevision, applicationRevision);\n', "RETENTION_TEST_PLAN_RECEIPT_REVISION")
          tests = tests.replace('      actorId: string;\n      deletedCount: number;\n', '      actorId: string;\n      applicationRevision: string;\n      deletedCount: number;\n')
          tests = replace_once(tests, '    assert.equal(receipt.actorId, "retention_cli_operator_001");\n', '    assert.equal(receipt.actorId, "retention_cli_operator_001");\n    assert.equal(receipt.applicationRevision, applicationRevision);\n', "RETENTION_TEST_APPLY_RECEIPT_REVISION")
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          docs_path = Path("docs/PUBLICATION_OPERATIONS_BACKUP_RETENTION.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace('  --evaluated-at 2026-07-30T00:00:00Z \\\n  --keep-latest', '  --evaluated-at 2026-07-30T00:00:00Z \\\n  --application-revision <40-character-git-sha> \\\n  --keep-latest')
          docs = replace_once(docs, '- evaluation time;\n- keep-latest count;\n', '- evaluation time;\n- exact application revision;\n- keep-latest count;\n', "RETENTION_DOCS_COMMON_REVISION")
          docs = replace_once(docs, '- exact evaluation time;\n- policy and policy fingerprint;\n', '- exact evaluation time;\n- exact lowercase 40-character application revision;\n- policy and policy fingerprint;\n', "RETENTION_DOCS_PLAN_REVISION")
          docs = replace_once(docs, '- approved plan fingerprint;\n- retained and deleted counts;\n', '- approved plan fingerprint;\n- exact application revision;\n- retained and deleted counts;\n', "RETENTION_DOCS_RECEIPT_REVISION")
          docs_path.write_text(docs, encoding="utf-8", newline="\n")

          checker_path = Path("scripts/check-publication-operations-backup-retention.mjs")
          checker = checker_path.read_text(encoding="utf-8")
          checker = replace_once(checker, '  "PUBLICATION_OPERATIONS_BACKUP_RETENTION_OFFLINE_CONFIRMATION_REQUIRED",\n', '  "PUBLICATION_OPERATIONS_BACKUP_RETENTION_OFFLINE_CONFIRMATION_REQUIRED",\n  "PUBLICATION_OPERATIONS_BACKUP_RETENTION_APPLICATION_REVISION_INVALID",\n  "applicationRevision",\n', "RETENTION_CHECKER_DOMAIN_REVISION")
          checker = replace_once(checker, '  \'stringFlag(args, "backup-dir", true)\',\n', '  \'stringFlag(args, "backup-dir", true)\',\n  \'"application-revision"\',\n', "RETENTION_CHECKER_CLI_REVISION")
          checker = replace_once(checker, '  "changed inventory invalidates a previously approved plan before deletion",\n', '  "changed inventory invalidates a previously approved plan before deletion",\n  "application revision change invalidates an approved plan before deletion",\n', "RETENTION_CHECKER_TEST_REVISION")
          checker = replace_once(checker, '  "Exact apply gate",\n', '  "Exact apply gate",\n  "exact application revision",\n', "RETENTION_CHECKER_DOC_REVISION")
          checker_path.write_text(checker, encoding="utf-8", newline="\n")

          compose_path = Path("compose.publication-operations.yml")
          compose = compose_path.read_text(encoding="utf-8")
          anchor = '      - --evaluated-at\n      - ${STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT:?set STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT}\n      - --keep-latest\n'
          replacement = '      - --evaluated-at\n      - ${STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT:?set STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT}\n      - --application-revision\n      - ${STORYTELLER_APPLICATION_REVISION:?set STORYTELLER_APPLICATION_REVISION to the exact 40-character source commit SHA}\n      - --keep-latest\n'
          count = compose.count(anchor)
          print(f"RETENTION_COMPOSE_REVISION_COUNT:{count}")
          if count != 2:
              raise SystemExit(f"RETENTION_COMPOSE_REVISION_SCOPE_INVALID:{count}")
          compose_path.write_text(compose.replace(anchor, replacement), encoding="utf-8", newline="\n")

          compose_checker_path = Path("scripts/check-publication-operations-compose.mjs")
          compose_checker = compose_checker_path.read_text(encoding="utf-8")
          compose_checker = compose_checker.replace('    "STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT",\n    "STORYTELLER_PUBLICATION_RETENTION_KEEP_LATEST",\n', '    "STORYTELLER_PUBLICATION_RETENTION_EVALUATED_AT",\n    "--application-revision",\n    "STORYTELLER_APPLICATION_REVISION",\n    "STORYTELLER_PUBLICATION_RETENTION_KEEP_LATEST",\n')
          compose_checker_path.write_text(compose_checker, encoding="utf-8", newline="\n")
          PY

      - name: Install exact workspace graph
        run: npm ci --no-audit --no-fund

      - name: Validate revision binding
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:publication-operations-backup-retention
          npm run verify:publication-operations-compose
          npm run typecheck
          node --import tsx --test packages/cli/src/publication-operations-backup-retention.test.ts

      - name: Commit validated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-retention-revision-binding.yml \
            .github/retention-revision-binding.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Bind backup retention to application revision"
          git pull --rebase origin work/publication-backup-retention-revision-binding-20260730
          git push origin HEAD:work/publication-backup-retention-revision-binding-20260730

      - name: Clean main workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-retention-revision-binding-main.yml \
            .github/retention-revision-binding-main.trigger \
            .github/retention-revision-binding-main-2.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove retention revision binding workflow"
          git pull --rebase origin main
          git push origin HEAD:main
