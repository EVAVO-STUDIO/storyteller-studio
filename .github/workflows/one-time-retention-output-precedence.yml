name: One-time fix retention output precedence

on:
  push:
    branches:
      - work/publication-retention-apply-intent-20260801
    paths:
      - ".github/retention-output-precedence.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-retention-apply-intent-20260801
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require receipt output before parsing mutation inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/cli/src/publication-operations-backup-retention-main.ts")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''  if (args.command === "plan") {
            const input = commonInput(args);
            const output = receiptPathOutsideBackupRoot(
              stringFlag(args, "output", true)!,
              input.backupDirectory,
            );
          '''.replace("        ", ""),
                  '''  if (args.command === "plan") {
            const outputFlag = stringFlag(args, "output", true)!;
            const input = commonInput(args);
            const output = receiptPathOutsideBackupRoot(
              outputFlag,
              input.backupDirectory,
            );
          '''.replace("        ", ""),
                  "RETENTION_PLAN_OUTPUT_PRECEDENCE",
              ),
              (
                  '''  if (args.command === "apply") {
            const input = commonInput(args);
            const output = receiptPathOutsideBackupRoot(
              stringFlag(args, "output", true)!,
              input.backupDirectory,
            );
          '''.replace("        ", ""),
                  '''  if (args.command === "apply") {
            const outputFlag = stringFlag(args, "output", true)!;
            const input = commonInput(args);
            const output = receiptPathOutsideBackupRoot(
              outputFlag,
              input.backupDirectory,
            );
          '''.replace("        ", ""),
                  "RETENTION_APPLY_OUTPUT_PRECEDENCE",
              ),
          ]

          for old, new, code in replacements:
              count = source.count(old)
              print(f"{code}:{count}")
              if count != 1:
                  raise SystemExit(f"{code}_SCOPE_INVALID:{count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8", newline="\n")
          PY

      - name: Validate focused retention and CLI contracts
        run: |
          npm ci --no-audit --no-fund
          npm run verify:publication-operations-backup-retention
          npm run typecheck
          npm run test:cli

      - name: Commit validated repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-retention-output-precedence.yml \
            .github/retention-output-precedence.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Require retention receipt output before mutation inputs"
          git pull --rebase origin work/publication-retention-apply-intent-20260801
          git push origin HEAD:work/publication-retention-apply-intent-20260801
