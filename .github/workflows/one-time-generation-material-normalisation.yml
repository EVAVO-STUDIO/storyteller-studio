name: One-time generation material normalisation

on:
  push:
    branches:
      - main
    paths:
      - ".github/generation-material-normalisation.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-generation-material-normalisation
  cancel-in-progress: false

jobs:
  normalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Canonicalise generation material records
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .generation-material-normalisation.log
          from pathlib import Path
          from textwrap import dedent

          path = Path("packages/storyteller/src/generation-material.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              print(f"GENERATION_MATERIAL_NORMALISATION_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"GENERATION_MATERIAL_NORMALISATION_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              '  const seen = new Set<string>();\n  for (const value of values) {\n',
              '  const seen = new Set<string>();\n'
              '  const seenWrittenForms = new Set<string>();\n'
              '  for (const value of values) {\n',
              "pronunciation-written-set",
          )

          replace_once(
              '    const fingerprint = pronunciationFingerprint(value);\n'
              '    if (seen.has(fingerprint)) {\n',
              '    const writtenFormKey = value.writtenForm.trim().toLocaleLowerCase("en-AU");\n'
              '    if (seenWrittenForms.has(writtenFormKey)) {\n'
              '      throw new GenerationMaterialIntegrityError("GENERATION_MATERIAL_PRONUNCIATION_WRITTEN_DUPLICATE");\n'
              '    }\n'
              '    seenWrittenForms.add(writtenFormKey);\n'
              '    const fingerprint = pronunciationFingerprint(value);\n'
              '    if (seen.has(fingerprint)) {\n',
              "pronunciation-written-check",
          )

          replace_once(
              '  const intendedUse = material.intendedUse ?? "audiobook";\n',
              '  if (new Set(rights.allowedUses).size !== rights.allowedUses.length) {\n'
              '    throw new GenerationMaterialIntegrityError("GENERATION_MATERIAL_RIGHTS_USES_DUPLICATE");\n'
              '  }\n'
              '  const intendedUse = material.intendedUse ?? "audiobook";\n',
              "rights-use-deduplication",
          )

          normalisation_helper = dedent('''\
          function normaliseGenerationWorkerMaterial(
            material: GenerationWorkerMaterial,
          ): GenerationWorkerMaterial {
            return {
              text: material.text,
              immutableSourceHash: material.immutableSourceHash,
              voiceProfileId: material.voiceProfileId,
              voiceRevision: material.voiceRevision,
              direction: {
                ...material.direction,
                notes: Object.freeze([...material.direction.notes]),
              },
              pronunciations: Object.freeze((material.pronunciations ?? []).map((value) => ({
                writtenForm: value.writtenForm,
                approvedRevision: value.approvedRevision,
                ...(value.ipa !== undefined ? { ipa: value.ipa } : {}),
                ...(value.providerPhoneme !== undefined
                  ? { providerPhoneme: value.providerPhoneme }
                  : {}),
                ...(value.spokenForm !== undefined ? { spokenForm: value.spokenForm } : {}),
              }))),
              mode: material.mode ?? "production",
              format: material.format ?? "wav",
              sampleRateHz: material.sampleRateHz ?? 48_000,
              rights: {
                rightsEvidenceId: material.rights.rightsEvidenceId,
                rightsFingerprint: material.rights.rightsFingerprint,
                allowedUses: Object.freeze([...material.rights.allowedUses]),
                commercialUseApproved: material.rights.commercialUseApproved,
                ...(material.rights.expiresAt !== undefined
                  ? { expiresAt: material.rights.expiresAt }
                  : {}),
                ...(material.rights.retainUntil !== undefined
                  ? { retainUntil: material.rights.retainUntil }
                  : {}),
                ...(material.rights.deletionRequiredAt !== undefined
                  ? { deletionRequiredAt: material.rights.deletionRequiredAt }
                  : {}),
              },
              intendedUse: material.intendedUse ?? "audiobook",
              commercial: material.commercial ?? true,
              parentArtifactIds: Object.freeze([...(material.parentArtifactIds ?? [])]),
              ...(material.costPolicy
                ? {
                    costPolicy: {
                      currency: material.costPolicy.currency,
                      maximumTotalEstimatedCost: material.costPolicy.maximumTotalEstimatedCost,
                    },
                  }
                : {}),
            };
          }
          ''')
          replace_once(
              'function materialFingerprintBase(input: Readonly<{\n',
              normalisation_helper + '\nfunction materialFingerprintBase(input: Readonly<{\n',
              "normalisation-helper",
          )

          replace_once(
              '  validateGenerationWorkerMaterial(job, material, now);\n'
              '  const base = materialFingerprintBase({ job, material });\n'
              '  return {\n',
              '  const normalisedMaterial = normaliseGenerationWorkerMaterial(material);\n'
              '  validateGenerationWorkerMaterial(job, normalisedMaterial, now);\n'
              '  const base = materialFingerprintBase({ job, material: normalisedMaterial });\n'
              '  return {\n',
              "normalised-record-create",
          )

          replace_once(
              '    textHash: stableHash(material.text),\n'
              '    material,\n',
              '    textHash: stableHash(normalisedMaterial.text),\n'
              '    material: normalisedMaterial,\n',
              "normalised-record-fields",
          )

          replace_once(
              '  if (record.projectId !== record.material.direction.segmentId && false) {\n'
              '    throw new GenerationMaterialIntegrityError("GENERATION_MATERIAL_UNREACHABLE_SCOPE_GUARD");\n'
              '  }\n',
              '',
              "remove-unreachable-guard",
          )

          path.write_text(source, encoding="utf-8", newline="\n")
          print("GENERATION_MATERIAL_NORMALISED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify material records
        run: npm run typecheck && npm run test:engine

      - name: Commit material normalisation
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-material.ts
          git diff --cached --check
          git commit -m "Canonicalise private generation material"
          git push origin HEAD:main

      - name: Publish normalisation status
        if: always()
        uses: actions/github-script@v7
        env:
          NORMALISATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.NORMALISATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".generation-material-normalisation.log")
              ? fs.readFileSync(".generation-material-normalisation.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "generation material normalisation log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /GENERATION_MATERIAL_NORMALISATION_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "generation material normalisation failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/generation-material-normalisation",
              description: state === "success"
                ? "Generation material is canonical and verified"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
