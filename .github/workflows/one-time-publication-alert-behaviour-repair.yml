name: One-time publication alert behaviour repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-alert-behaviour-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-alert-delivery-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          delivery_path = Path(
              "packages/storyteller/src/audiobook-retail-publication-alert-delivery.ts"
          )
          delivery = delivery_path.read_text(encoding="utf-8")
          control_old = (
              'const CONTROL_CHARACTERS = /[\\u0000-\\u001f\\u007f]/u;\n'
              'const MAXIMUM_EMAIL_LENGTH = 320;'
          )
          control_new = (
              'const CONTROL_CHARACTERS = /[\\u0000-\\u001f\\u007f]/u;\n'
              'const MESSAGE_CONTROL_CHARACTERS = '
              '/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]/u;\n'
              'const MAXIMUM_EMAIL_LENGTH = 320;'
          )
          control_count = delivery.count(control_old)
          print(f"PUBLICATION_DELIVERY_MESSAGE_CONTROL:{control_count}")
          if control_count != 1:
              raise SystemExit(
                  f"PUBLICATION_DELIVERY_MESSAGE_CONTROL_INVALID:{control_count}"
              )
          delivery = delivery.replace(control_old, control_new, 1)

          function_old = '''function requireEmail(value: string): string {'''
          function_new = '''function requireMessageBody(
            value: string,
            maximum: number,
            code: string,
          ): string {
            const trimmed = value.trim();
            if (
              !trimmed
              || trimmed.length > maximum
              || MESSAGE_CONTROL_CHARACTERS.test(trimmed)
            ) {
              throw new AudiobookRetailPublicationAlertDeliveryError(code);
            }
            return trimmed;
          }

          function requireEmail(value: string): string {'''
          function_count = delivery.count(function_old)
          print(f"PUBLICATION_DELIVERY_BODY_VALIDATOR:{function_count}")
          if function_count != 1:
              raise SystemExit(
                  f"PUBLICATION_DELIVERY_BODY_VALIDATOR_INVALID:{function_count}"
              )
          delivery = delivery.replace(function_old, function_new, 1)

          for old, new, label in [
              (
                  "  const textBody = requireText(\n",
                  "  const textBody = requireMessageBody(\n",
                  "TEXT_BODY",
              ),
              (
                  "  const htmlBody = requireText(\n",
                  "  const htmlBody = requireMessageBody(\n",
                  "HTML_BODY",
              ),
          ]:
              count = delivery.count(old)
              print(f"PUBLICATION_DELIVERY_{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"PUBLICATION_DELIVERY_{label}_INVALID:{count}"
                  )
              delivery = delivery.replace(old, new, 1)
          delivery_path.write_text(
              delivery,
              encoding="utf-8",
              newline="\n",
          )

          alert_path = Path(
              "packages/storyteller/src/audiobook-retail-publication-alert.ts"
          )
          alert = alert_path.read_text(encoding="utf-8")
          notification_old = '''  const notificationBase: Omit<
            AudiobookRetailPublicationAlertNotification,
            "fingerprint"
          > = {
            ...alert.notification,
            deliveryStatus: deriveDeliveryStatus(attempts),
            attempts,
          };'''
          notification_new = '''  const {
            fingerprint: _notificationFingerprint,
            ...notificationState
          } = alert.notification;
          const notificationBase: Omit<
            AudiobookRetailPublicationAlertNotification,
            "fingerprint"
          > = {
            ...notificationState,
            deliveryStatus: deriveDeliveryStatus(attempts),
            attempts,
          };'''
          notification_count = alert.count(notification_old)
          print(f"PUBLICATION_ALERT_NOTIFICATION_REVISION:{notification_count}")
          if notification_count != 1:
              raise SystemExit(
                  "PUBLICATION_ALERT_NOTIFICATION_REVISION_INVALID:"
                  f"{notification_count}"
              )
          alert_path.write_text(
              alert.replace(notification_old, notification_new, 1),
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/audiobook-retail-publication-alert.ts \
            packages/storyteller/src/audiobook-retail-publication-alert-delivery.ts
          git diff --cached --check
          git commit -m "Correct publication alert delivery invariants"
          git pull --rebase origin work/audiobook-retail-publication-alert-delivery-20260729
          git push origin HEAD:work/audiobook-retail-publication-alert-delivery-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-alert-behaviour-repair.yml \
            .github/publication-alert-behaviour-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication alert behaviour repair"
          git pull --rebase origin main
          git push origin HEAD:main
