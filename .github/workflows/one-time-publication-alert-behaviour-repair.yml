name: One-time publication alert behaviour repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-alert-behaviour-repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-alert-delivery-20260729
          fetch-depth: 0

      - name: Patch pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          delivery_path = Path(
              "packages/storyteller/src/audiobook-retail-publication-alert-delivery.ts"
          )
          delivery_lines = delivery_path.read_text(encoding="utf-8").splitlines()

          control_matches = [
              index
              for index in range(len(delivery_lines) - 1)
              if delivery_lines[index].strip().startswith(
                  "const CONTROL_CHARACTERS ="
              )
              and delivery_lines[index + 1].strip()
                  == "const MAXIMUM_EMAIL_LENGTH = 320;"
          ]
          print(f"PUBLICATION_DELIVERY_MESSAGE_CONTROL:{control_matches}")
          if len(control_matches) != 1:
              raise SystemExit(
                  "PUBLICATION_DELIVERY_MESSAGE_CONTROL_INVALID:"
                  f"{control_matches}"
              )
          control_index = control_matches[0]
          delivery_lines.insert(
              control_index + 1,
              "const MESSAGE_CONTROL_CHARACTERS = "
              "/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]/u;",
          )

          email_matches = [
              index
              for index, line in enumerate(delivery_lines)
              if line.strip() == "function requireEmail(value: string): string {"
          ]
          print(f"PUBLICATION_DELIVERY_BODY_VALIDATOR:{email_matches}")
          if len(email_matches) != 1:
              raise SystemExit(
                  "PUBLICATION_DELIVERY_BODY_VALIDATOR_INVALID:"
                  f"{email_matches}"
              )
          email_index = email_matches[0]
          delivery_lines[email_index:email_index] = [
              "function requireMessageBody(",
              "  value: string,",
              "  maximum: number,",
              "  code: string,",
              "): string {",
              "  const trimmed = value.trim();",
              "  if (",
              "    !trimmed",
              "    || trimmed.length > maximum",
              "    || MESSAGE_CONTROL_CHARACTERS.test(trimmed)",
              "  ) {",
              "    throw new AudiobookRetailPublicationAlertDeliveryError(code);",
              "  }",
              "  return trimmed;",
              "}",
              "",
          ]

          replacements = {
              "const textBody = requireText(":
                  "const textBody = requireMessageBody(",
              "const htmlBody = requireText(":
                  "const htmlBody = requireMessageBody(",
          }
          for old, new in replacements.items():
              matches = [
                  index
                  for index, line in enumerate(delivery_lines)
                  if line.strip() == old
              ]
              print(f"PUBLICATION_DELIVERY_BODY_CALL:{old}:{matches}")
              if len(matches) != 1:
                  raise SystemExit(
                      f"PUBLICATION_DELIVERY_BODY_CALL_INVALID:{old}:{matches}"
                  )
              indentation = delivery_lines[matches[0]][
                  :len(delivery_lines[matches[0]])
                  - len(delivery_lines[matches[0]].lstrip())
              ]
              delivery_lines[matches[0]] = indentation + new

          delivery_path.write_text(
              "\n".join(delivery_lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          alert_path = Path(
              "packages/storyteller/src/audiobook-retail-publication-alert.ts"
          )
          alert_lines = alert_path.read_text(encoding="utf-8").splitlines()
          notification_matches = []
          for index, line in enumerate(alert_lines):
              if line.strip() != "const notificationBase: Omit<":
                  continue
              window = alert_lines[index:index + 12]
              if any(item.strip() == "...alert.notification," for item in window):
                  notification_matches.append(index)
          print(
              "PUBLICATION_ALERT_NOTIFICATION_REVISION:"
              f"{notification_matches}"
          )
          if len(notification_matches) != 1:
              raise SystemExit(
                  "PUBLICATION_ALERT_NOTIFICATION_REVISION_INVALID:"
                  f"{notification_matches}"
              )
          notification_index = notification_matches[0]
          alert_lines[notification_index:notification_index] = [
              "  const {",
              "    fingerprint: _notificationFingerprint,",
              "    ...notificationState",
              "  } = alert.notification;",
          ]
          spread_matches = [
              index
              for index in range(
                  notification_index + 4,
                  min(len(alert_lines), notification_index + 20),
              )
              if alert_lines[index].strip() == "...alert.notification,"
          ]
          print(f"PUBLICATION_ALERT_NOTIFICATION_SPREAD:{spread_matches}")
          if len(spread_matches) != 1:
              raise SystemExit(
                  "PUBLICATION_ALERT_NOTIFICATION_SPREAD_INVALID:"
                  f"{spread_matches}"
              )
          spread_index = spread_matches[0]
          indentation = alert_lines[spread_index][
              :len(alert_lines[spread_index])
              - len(alert_lines[spread_index].lstrip())
          ]
          alert_lines[spread_index] = indentation + "...notificationState,"
          alert_path.write_text(
              "\n".join(alert_lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/audiobook-retail-publication-alert.ts \
            packages/storyteller/src/audiobook-retail-publication-alert-delivery.ts
          git diff --cached --check
          git commit -m "Correct publication alert delivery invariants"
          git pull --rebase origin work/audiobook-retail-publication-alert-delivery-20260729
          git push origin HEAD:work/audiobook-retail-publication-alert-delivery-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-alert-behaviour-repair.yml \
            .github/publication-alert-behaviour-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication alert behaviour repair"
          git pull --rebase origin main
          git push origin HEAD:main
