name: One-time worker budget integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-budget-integration.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-budget-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire pre-provider reservations into the worker service
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-budget-integration.log
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              print(f"WORKER_BUDGET_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_BUDGET_MATCH_COUNT_INVALID:{label}:{count}")
              return source.replace(old, new, 1)

          service_path = Path("packages/storyteller/src/worker-service.ts")
          service = service_path.read_text(encoding="utf-8")
          service = replace_once(
              service,
              'import type { FileArtifactRegistry } from "./artifact-store.js";\n',
              'import type { FileArtifactRegistry } from "./artifact-store.js";\n'
              'import {\n'
              '  isGenerationBudgetAdmissionError,\n'
              '  type FileGenerationBudgetController,\n'
              '  type GenerationBudgetSession,\n'
              '} from "./generation-budget.js";\n',
              "service-budget-import",
          )
          service = replace_once(
              service,
              '  artifactRegistry: FileArtifactRegistry;\n}\n',
              '  artifactRegistry: FileArtifactRegistry;\n'
              '  budgetController?: FileGenerationBudgetController;\n'
              '}\n',
              "service-dependency",
          )
          service = replace_once(
              service,
              '  outcomeHistoryLimit?: number;\n  now?: () => Date;\n',
              '  outcomeHistoryLimit?: number;\n'
              '  requireBudget?: boolean;\n'
              '  now?: () => Date;\n',
              "service-option",
          )
          service = replace_once(
              service,
              '  readonly #outcomeHistoryLimit: number;\n  readonly #now: () => Date;\n',
              '  readonly #outcomeHistoryLimit: number;\n'
              '  readonly #requireBudget: boolean;\n'
              '  readonly #now: () => Date;\n',
              "service-field",
          )
          service = replace_once(
              service,
              '    this.#outcomeHistoryLimit = requireInteger(\n'
              '      options.outcomeHistoryLimit ?? 100,\n'
              '      0,\n'
              '      1_000,\n'
              '      "GENERATION_WORKER_SERVICE_HISTORY_LIMIT_INVALID",\n'
              '    );\n'
              '    this.#now = options.now ?? (() => new Date());\n',
              '    this.#outcomeHistoryLimit = requireInteger(\n'
              '      options.outcomeHistoryLimit ?? 100,\n'
              '      0,\n'
              '      1_000,\n'
              '      "GENERATION_WORKER_SERVICE_HISTORY_LIMIT_INVALID",\n'
              '    );\n'
              '    this.#requireBudget = options.requireBudget ?? false;\n'
              '    if (this.#requireBudget && !dependencies.budgetController) {\n'
              '      throw new Error("GENERATION_WORKER_SERVICE_BUDGET_CONTROLLER_REQUIRED");\n'
              '    }\n'
              '    this.#now = options.now ?? (() => new Date());\n',
              "service-constructor",
          )

          budget_block = '''
              let budgetSession: GenerationBudgetSession | undefined;
              if (this.#requireBudget) {
                if (this.#abortController.signal.aborted) {
                  return this.#outcome(claim, "aborted", 0, 0, [], this.#now());
                }
                const controller = this.#dependencies.budgetController;
                if (!controller) {
                  throw new Error("GENERATION_WORKER_SERVICE_BUDGET_CONTROLLER_REQUIRED");
                }
                try {
                  budgetSession = await controller.reserve({
                    claim,
                    material,
                    actorId: this.#workerId,
                    providerTimeoutMs: this.#providerTimeoutMs,
                    now: this.#now(),
                  });
                } catch (error) {
                  if (!isGenerationBudgetAdmissionError(error)) throw error;
                  const code = safeErrorCode(error, "GENERATION_BUDGET_ADMISSION_FAILED");
                  const envelope = await this.#dependencies.queue.block(
                    claim.item.id,
                    claim.leaseToken,
                    {
                      codes: [code],
                      message: "The claimed job could not reserve its approved maximum provider cost.",
                      now: this.#now(),
                    },
                  );
                  return {
                    queueItemId: envelope.payload.id,
                    jobId: envelope.payload.jobId,
                    disposition: "blocked",
                    queueRevision: envelope.revision,
                    artifactCount: 0,
                    candidateCount: 0,
                    occurredAt: this.#now().toISOString(),
                    findingCodes: Object.freeze([code]),
                  };
                }
              }

              const settleInterruptedBudget = async (code: string): Promise<void> => {
                if (!budgetSession) return;
                await budgetSession.settleInterrupted({ code, at: this.#now() });
              };

          '''
          service = replace_once(
              service,
              '    try {\n      const result = await runGenerationWorkerWithHeartbeat({\n',
              budget_block + '    try {\n      const result = await runGenerationWorkerWithHeartbeat({\n',
              "service-reservation",
          )
          service = replace_once(
              service,
              '        heartbeat: {\n'
              '          leaseDurationMs: this.#leaseDurationMs,\n',
              '        ...(budgetSession\n'
              '          ? {\n'
              '              beforeQueueTransition: async (transition) => {\n'
              '                await budgetSession?.settle(transition);\n'
              '              },\n'
              '            }\n'
              '          : {}),\n'
              '        heartbeat: {\n'
              '          leaseDurationMs: this.#leaseDurationMs,\n',
              "service-settlement-hook",
          )
          service = replace_once(
              service,
              '      if (error instanceof GenerationLeaseOwnershipLostError) {\n'
              '        return this.#outcome(claim, "ownership-lost", 0, 0, [error.causeCode], this.#now());\n'
              '      }\n'
              '      if (this.#abortController.signal.aborted) {\n'
              '        return this.#outcome(claim, "aborted", 0, 0, [], this.#now());\n'
              '      }\n\n'
              '      const current = await this.#dependencies.queue.read(claim.item.id);\n',
              '      if (error instanceof GenerationLeaseOwnershipLostError) {\n'
              '        await settleInterruptedBudget("GENERATION_BUDGET_LEASE_OWNERSHIP_LOST");\n'
              '        return this.#outcome(claim, "ownership-lost", 0, 0, [error.causeCode], this.#now());\n'
              '      }\n'
              '      if (this.#abortController.signal.aborted) {\n'
              '        await settleInterruptedBudget("GENERATION_BUDGET_WORKER_ABORTED");\n'
              '        return this.#outcome(claim, "aborted", 0, 0, [], this.#now());\n'
              '      }\n\n'
              '      await settleInterruptedBudget("GENERATION_BUDGET_WORKER_RUNTIME_FAILED");\n'
              '      const current = await this.#dependencies.queue.read(claim.item.id);\n',
              "service-interruption-settlement",
          )
          service_path.write_text(service, encoding="utf-8", newline="\n")

          runtime_path = Path("apps/worker/src/runtime.ts")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_once(
              runtime,
              'import { FileArtifactRegistry } from "@evavo/storyteller-engine/artifact-store";\n',
              'import { FileArtifactRegistry } from "@evavo/storyteller-engine/artifact-store";\n'
              'import { FileBudgetLedger } from "@evavo/storyteller-engine/budget-ledger";\n'
              'import { FileGenerationBudgetController } from "@evavo/storyteller-engine/generation-budget";\n',
              "runtime-budget-import",
          )
          runtime = replace_once(
              runtime,
              '  const materials = new FileGenerationMaterialStore(queueState);\n'
              '  const artifactRegistry = new FileArtifactRegistry(\n',
              '  const materials = new FileGenerationMaterialStore(queueState);\n'
              '  const budgetController = new FileGenerationBudgetController(\n'
              '    new FileBudgetLedger(queueState),\n'
              '  );\n'
              '  const artifactRegistry = new FileArtifactRegistry(\n',
              "runtime-budget-controller",
          )
          runtime = replace_once(
              runtime,
              '      artifactRegistry,\n    },\n',
              '      artifactRegistry,\n'
              '      budgetController,\n'
              '    },\n',
              "runtime-budget-dependency",
          )
          runtime = replace_once(
              runtime,
              '      outcomeHistoryLimit: configuration.outcomeHistoryLimit,\n',
              '      outcomeHistoryLimit: configuration.outcomeHistoryLimit,\n'
              '      requireBudget: true,\n',
              "runtime-budget-required",
          )
          runtime_path.write_text(runtime, encoding="utf-8", newline="\n")
          print("WORKER_BUDGET_INTEGRATION_PATCHED")
          PY

      - name: Remove integration machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/one-time-worker-budget-integration.yml \
            .github/worker-budget-integration.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify budgeted worker composition
        run: npm run typecheck && npm run test:engine && npm run test:worker

      - name: Commit pre-provider budget integration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/worker-service.ts apps/worker/src/runtime.ts
          git diff --cached --check
          git commit -m "Require budget reservation in private worker runtime"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-budget-integration.log")
              ? fs.readFileSync(".worker-budget-integration.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker budget integration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_BUDGET_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker budget integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-budget-integration",
              description: state === "success"
                ? "Private worker reserves budget before provider execution"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
