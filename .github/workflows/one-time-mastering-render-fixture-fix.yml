name: One-time mastering render fixture correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-render-fixture-fix.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct async mastering render fixture
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastering-render-fixture-fix.log
          from pathlib import Path
          path = Path("packages/storyteller/src/mastering-render.test.ts")
          source = path.read_text(encoding="utf-8")
          old = '''async function plan(
            operations: readonly MasteringOperation[] = [{
              kind: "gain",
              gainDb: 4.5,
              rationaleCode: "MASTERING_TRANSPARENT_GAIN",
            }],
            evidence = await engineeringEvidence(),
          ): Promise<Readonly<{ plan: MasteringPlan; evidence: AudioEngineeringEvidence }>> {
            const masterBytes = wavBytes();
          '''
          new = '''async function plan(
            operations: readonly MasteringOperation[] = [{
              kind: "gain",
              gainDb: 4.5,
              rationaleCode: "MASTERING_TRANSPARENT_GAIN",
            }],
            evidence?: AudioEngineeringEvidence,
          ): Promise<Readonly<{ plan: MasteringPlan; evidence: AudioEngineeringEvidence }>> {
            const resolvedEvidence = evidence ?? await engineeringEvidence();
            const masterBytes = wavBytes();
          '''
          count = source.count(old)
          print(f"MASTERING_RENDER_FIXTURE_SIGNATURE:{count}")
          if count != 1:
              raise SystemExit(f"MASTERING_RENDER_FIXTURE_SIGNATURE_INVALID:{count}")
          source = source.replace(old, new, 1)
          replacements = [
              ("JSON.stringify(evidence)", "JSON.stringify(resolvedEvidence)"),
              ("    evidence,\n    plan: createMasteringPlan", "    evidence: resolvedEvidence,\n    plan: createMasteringPlan"),
              ("      engineeringEvidence: evidence,\n      targetProfile: evidence.profile,", "      engineeringEvidence: resolvedEvidence,\n      targetProfile: resolvedEvidence.profile,"),
          ]
          for old_value, new_value in replacements:
              count = source.count(old_value)
              print(f"MASTERING_RENDER_FIXTURE_VALUE:{old_value[:30]}:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERING_RENDER_FIXTURE_VALUE_INVALID:{count}")
              source = source.replace(old_value, new_value, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastering-render-fixture-fix.yml").unlink(missing_ok=True)
          Path(".github/mastering-render-fixture-fix.trigger").unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastering-render-verify.log
          npm run build 2>&1 | tee .mastering-render-build.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastering-render-verification-${{ github.sha }}
          path: |
            .mastering-render-fixture-fix.log
            .mastering-render-verify.log
            .mastering-render-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Commit correction
        shell: bash
        run: |
          rm -f .mastering-render-fixture-fix.log .mastering-render-verify.log .mastering-render-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed mastering rendering"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".mastering-render-fixture-fix.log",
              ".mastering-render-verify.log",
              ".mastering-render-build.log",
            ].filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /MASTERING_RENDER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "mastering renderer failed verification";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-render-verification",
              description: state === "success"
                ? "Mastering renderer, complete tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
