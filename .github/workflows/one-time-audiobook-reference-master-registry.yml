name: One-time audiobook reference master registry promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-reference-master-registry.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Register the governed audiobook reference master artifact
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audiobook-reference-master-registry.log
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"REFERENCE_MASTER_REPLACE:{path}:{count}")
              if count != expected:
                  raise SystemExit(
                      f"REFERENCE_MASTER_REPLACE_COUNT_INVALID:{path}:{count}:{expected}"
                  )
              path.write_text(
                  source.replace(old, new),
                  encoding="utf-8",
                  newline="\n",
              )

          registry_path = Path("packages/storyteller/src/artifact-registry.ts")
          replace_exact(
              registry_path,
              '  | "credit-master"\n  | "release-package";',
              '  | "credit-master"\n  | "audiobook-reference-master"\n  | "release-package";',
          )
          replace_exact(
              registry_path,
              '  "mastered-chapter",\n  "credit-master",\n  "release-package",\n]);',
              '  "mastered-chapter",\n  "credit-master",\n  "audiobook-reference-master",\n  "release-package",\n]);',
              expected=2,
          )
          replace_exact(
              registry_path,
              '  if ((kind === "audio-candidate" || kind === "chapter-master" || kind === "mastered-chapter" || kind === "credit-master") && !mime.startsWith("audio/")) {',
              '  if ((kind === "audio-candidate" || kind === "chapter-master" || kind === "mastered-chapter" || kind === "credit-master" || kind === "audiobook-reference-master") && !mime.startsWith("audio/")) {',
          )
          replace_exact(
              registry_path,
              '  if ((record.kind === "chapter-master" || record.kind === "mastered-chapter" || record.kind === "credit-master" || record.kind === "release-package") && parents.length === 0) {',
              '  if ((record.kind === "chapter-master" || record.kind === "mastered-chapter" || record.kind === "credit-master" || record.kind === "audiobook-reference-master" || record.kind === "release-package") && parents.length === 0) {',
          )

          test_path = Path("packages/storyteller/src/artifact-registry.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("release remains blocked until every dependency is verified, reviewed and rights-valid", () => {'
          if tests.count(marker) != 1:
              raise SystemExit(
                  f"REFERENCE_MASTER_TEST_MARKER_INVALID:{tests.count(marker)}"
              )
          test_block = '''test("audiobook reference masters require audio integrity, parent provenance and human review", () => {
            const reference = createArtifactRecord({
              id: "artifact_audiobook_reference_master_001",
              kind: "audiobook-reference-master",
              projectId: job.projectId,
              jobId: "job_audiobook_reference_001",
              segmentId: "book_reference_001",
              takeId: "take_audiobook_reference_001",
              storage: {
                driver: "private-object-store",
                provider: "s3-compatible-private",
                container: "storyteller-production",
                objectKey: `projects/${job.projectId}/books/book_reference_001/reference-master.wav`,
                region: "australia-southeast",
              },
              integrity: {
                algorithm: "sha256",
                contentHash: "a".repeat(64),
                byteCount: 4_800_000,
                mimeType: "audio/wav",
                format: "wav",
              },
              provenance: {
                createdByActorId: "audiobook_reference_master_001",
                sourceContentHash: "b".repeat(64),
                generationRequestHash: "c".repeat(64),
                parentArtifactIds: [
                  "artifact_audiobook_sequence_001",
                  "artifact_audiobook_render_evidence_001",
                ],
              },
              rights: rights(),
            }, t1);
            assert.equal(reference.review.required, true);
            assert.equal(reference.review.status, "pending");
            assert.doesNotThrow(() => assertArtifactRecord(reference));

            assert.throws(
              () => createArtifactRecord({
                ...candidateInput(
                  "artifact_audiobook_reference_non_audio_001",
                  "take_audiobook_reference_non_audio_001",
                  "8",
                ),
                kind: "audiobook-reference-master",
                integrity: {
                  algorithm: "sha256",
                  contentHash: "8".repeat(64),
                  byteCount: 128,
                  mimeType: "application/json",
                  format: "json",
                },
                provenance: {
                  createdByActorId: "audiobook_reference_master_001",
                  parentArtifactIds: ["artifact_audiobook_sequence_001"],
                },
              }, t1),
              /ARTIFACT_AUDIO_MIME_REQUIRED/u,
            );

            assert.throws(
              () => createArtifactRecord({
                ...candidateInput(
                  "artifact_audiobook_reference_parentless_001",
                  "take_audiobook_reference_parentless_001",
                  "9",
                ),
                kind: "audiobook-reference-master",
                provenance: {
                  createdByActorId: "audiobook_reference_master_001",
                  parentArtifactIds: [],
                },
              }, t1),
              /ARTIFACT_PARENT_REQUIRED/u,
            );
          });

          '''
          test_path.write_text(
              tests.replace(marker, test_block + marker, 1),
              encoding="utf-8",
              newline="\n",
          )

          checker_path = Path("scripts/check-artifact-registry.mjs")
          replace_exact(
              checker_path,
              '  \'"credit-master"\',\n  "ARTIFACT_STORAGE_OBJECT_KEY_UNSAFE",',
              '  \'"credit-master"\',\n  \'"audiobook-reference-master"\',\n  "ARTIFACT_STORAGE_OBJECT_KEY_UNSAFE",',
          )
          replace_exact(
              checker_path,
              '  "credit masters require audio integrity, parent provenance and human review",\n]);',
              '  "credit masters require audio integrity, parent provenance and human review",\n  "audiobook reference masters require audio integrity, parent provenance and human review",\n]);',
          )

          for temporary in [
              Path(".github/workflows/one-time-audiobook-reference-master-registry.yml"),
              Path(".github/audiobook-reference-master-registry.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("REFERENCE_MASTER_REGISTRY_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-reference-master-registry-verify.log
          npm run build 2>&1 | tee .audiobook-reference-master-registry-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-reference-master-registry-${{ github.sha }}
          path: |
            .audiobook-reference-master-registry.log
            .audiobook-reference-master-registry-verify.log
            .audiobook-reference-master-registry-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .audiobook-reference-master-registry.log .audiobook-reference-master-registry-verify.log .audiobook-reference-master-registry-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Register governed audiobook reference masters"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-reference-master-registry.log",
              ".audiobook-reference-master-registry-verify.log",
              ".audiobook-reference-master-registry-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /REFERENCE_MASTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "reference master registry promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-reference-master-registry",
              description: state === "success" ? "Reference master registry, tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
