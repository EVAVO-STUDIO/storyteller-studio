name: One-time stable mastering findings fixture correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-findings-fixture-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct expected mastering findings
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastering-findings-fixture-v2.log
          from pathlib import Path
          path = Path("packages/storyteller/src/mastering-plan.test.ts")
          source = path.read_text(encoding="utf-8")
          required = '      "MASTERING_SOURCE_CLIPPING_REQUIRES_REPAIR",\n'
          addition = required + '      "MASTERING_TRANSPARENT_GAIN_WINDOW_EMPTY",\n'
          if '      "MASTERING_TRANSPARENT_GAIN_WINDOW_EMPTY",\n' not in source:
              count = source.count(required)
              print(f"MASTERING_FINDINGS_V2_ANCHOR:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERING_FINDINGS_V2_ANCHOR_INVALID:{count}")
              source = source.replace(required, addition, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          for temporary in [
              Path(".github/workflows/one-time-mastering-findings-fixture.yml"),
              Path(".github/mastering-findings-fixture.trigger"),
              Path(".github/workflows/one-time-mastering-findings-fixture-v2.yml"),
              Path(".github/mastering-findings-fixture-v2.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERING_FINDINGS_V2_CORRECTED")
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct complete mastering finding set"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-findings-fixture",
              description: state === "success"
                ? "Complete mastering finding fixture corrected"
                : "Mastering finding fixture correction failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
