name: One-time publication evidence CLI integration v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-evidence-cli-integration-v2.trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/publication-evidence-intake-cli-20260730
          fetch-depth: 0

      - name: Apply structural CLI integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          main_path = Path("packages/cli/src/main.ts")
          lines = main_path.read_text(encoding="utf-8").splitlines()

          import_index = next(
              (index for index, line in enumerate(lines)
               if line.strip() == '} from "./elevenlabs-config.js";'),
              None,
          )
          if import_index is None:
              raise SystemExit("PUBLICATION_EVIDENCE_CLI_IMPORT_ANCHOR_INVALID")
          imports = [
              'import type { AudiobookRetailPublicationVerification } from "@evavo/storyteller-engine/audiobook-retail-publication-verification";',
              'import { submitPublicationEvidenceCommand } from "./publication-evidence.js";',
          ]
          if not any("submitPublicationEvidenceCommand" in line for line in lines):
              lines[import_index + 1:import_index + 1] = imports

          help_index = next(
              (index for index, line in enumerate(lines)
               if "queue-reap     Requeue expired worker leases" in line),
              None,
          )
          if help_index is None:
              raise SystemExit("PUBLICATION_EVIDENCE_CLI_HELP_ANCHOR_INVALID")
          help_line = '  process.stdout.write(`  publication-evidence-submit  Admit complete governed publication verification to the private inbox.\\n`);'
          if not any("publication-evidence-submit  Admit" in line for line in lines):
              lines.insert(help_index + 1, help_line)

          example_index = next(
              (index for index, line in enumerate(lines)
               if "queue-cancel --data-dir ./storage" in line),
              None,
          )
          if example_index is None:
              raise SystemExit("PUBLICATION_EVIDENCE_CLI_EXAMPLE_ANCHOR_INVALID")
          example_line = '  process.stdout.write(`  npm run storyteller -- publication-evidence-submit --data-dir ./storage --monitor-id publication_monitor_001 --verification verification.json --source-reference-hash <sha256> --actor-id operator_greg --output intake.json\\n`);'
          if not any("npm run storyteller -- publication-evidence-submit" in line for line in lines):
              lines.insert(example_index + 1, example_line)

          switch_index = next(
              (index for index, line in enumerate(lines)
               if line == '    case "verify": {'),
              None,
          )
          if switch_index is None:
              raise SystemExit("PUBLICATION_EVIDENCE_CLI_SWITCH_ANCHOR_INVALID")
          if not any(line == '    case "publication-evidence-submit": {' for line in lines):
              command = '''    case "publication-evidence-submit": {
              const dataDirectory = stringFlag(args, "data-dir")
                ?? process.env.STORYTELLER_DATA_DIR?.trim();
              if (!dataDirectory) throw new Error("CLI_FLAG_REQUIRED:data-dir");
              const receivedAt = dateFlag(args, "received-at");
              const result = await submitPublicationEvidenceCommand({
                dataDirectory,
                monitorId: stringFlag(args, "monitor-id", true)!,
                verification: readJson<AudiobookRetailPublicationVerification>(
                  stringFlag(args, "verification", true)!,
                ),
                sourceReferenceHash: stringFlag(
                  args,
                  "source-reference-hash",
                  true,
                )!,
                actorId: stringFlag(args, "actor-id", true)!,
                ...(receivedAt ? { receivedAt } : {}),
              });
              emit(result, output, force);
              return 0;
            }
          '''.splitlines()
              lines[switch_index:switch_index] = command + [""]

          main_path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["verify:publication-evidence-cli"] = (
              "node scripts/check-publication-evidence-cli.mjs"
          )
          verify = scripts["verify:artifacts"]
          marker = (
              "npm run verify:audiobook-retail-publication-evidence-inbox "
              "&& npm run verify:mastering-render"
          )
          replacement = (
              "npm run verify:audiobook-retail-publication-evidence-inbox "
              "&& npm run verify:publication-evidence-cli "
              "&& npm run verify:mastering-render"
          )
          if marker not in verify and "npm run verify:publication-evidence-cli" not in verify:
              raise SystemExit("PUBLICATION_EVIDENCE_CLI_VERIFY_ANCHOR_INVALID")
          scripts["verify:artifacts"] = verify.replace(marker, replacement, 1)
          package_path.write_text(
              json.dumps(package, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Remove temporary workflow files
        shell: bash
        run: |
          rm -f \
            .github/workflows/one-time-publication-evidence-cli-integration-v2.yml \
            .github/publication-evidence-cli-integration-v2.trigger

      - name: Install and validate focused slice
        run: |
          npm install --no-audit --no-fund
          npm run verify:publication-evidence-cli
          npm run typecheck
          node --import tsx --test packages/cli/src/publication-evidence.test.ts

      - name: Commit integrated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Integrate private publication evidence intake CLI"
          git pull --rebase origin work/publication-evidence-intake-cli-20260730
          git push origin HEAD:work/publication-evidence-intake-cli-20260730

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm -f \
            .github/workflows/one-time-publication-evidence-cli-integration-v2.yml \
            .github/publication-evidence-cli-integration-v2.trigger
          if ! git diff --quiet; then
            git config user.name "EVAVO Repository Automation"
            git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
            git add --all
            git commit -m "Remove structural publication evidence CLI integration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
