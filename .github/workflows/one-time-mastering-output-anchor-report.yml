name: One-time mastering output anchor report

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-output-anchor-report.trigger"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record all output-contract anchor counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          anchors = {
              "source:output-interface": ("packages/storyteller/src/mastering-plan.ts", "export interface MasteringPrediction {\n"),
              "source:plan-output": ("packages/storyteller/src/mastering-plan.ts", "  chapterId: string;\n  sourceMaster: MasteringArtifactSnapshot;\n"),
              "source:input-output": ("packages/storyteller/src/mastering-plan.ts", "  engineeringEvidence: AudioEngineeringEvidence;\n  targetProfile: AudioEngineeringProfileSnapshot;\n  operations: readonly MasteringOperation[];\n"),
              "source:public-output": ("packages/storyteller/src/mastering-plan.ts", "  targetProfileVersion: string;\n  operationKinds: readonly MasteringOperation[\"kind\"][];\n"),
              "source:output-helper": ("packages/storyteller/src/mastering-plan.ts", "function assertOperation(operation: MasteringOperation): void {\n"),
              "source:create-output-validation": ("packages/storyteller/src/mastering-plan.ts", "  assertProfile(input.targetProfile);\n  if (Date.parse(input.targetProfile.reviewedAt) > createdAt.getTime()) {\n"),
              "source:create-output-snapshot": ("packages/storyteller/src/mastering-plan.ts", "    chapterId: input.chapterId,\n    sourceMaster: snapshot(input.chapterMaster),\n"),
              "source:persisted-output-validation": ("packages/storyteller/src/mastering-plan.ts", "  assertProfile(plan.targetProfile);\n  assertOperationOrder(plan.operations);\n"),
              "source:public-output-projection": ("packages/storyteller/src/mastering-plan.ts", "    targetProfileVersion: plan.targetProfile.externalVersion,\n    operationKinds: Object.freeze(plan.operations.map((operation) => operation.kind)),\n"),
              "test:output-input": ("packages/storyteller/src/mastering-plan.test.ts", "    targetProfile: data.evidence.profile,\n    operations,\n"),
              "test:public-output": ("packages/storyteller/src/mastering-plan.test.ts", "  assert.deepEqual(publicView.operationKinds, [\"gain\"]);\n"),
              "test:output-conversion": ("packages/storyteller/src/mastering-plan.test.ts", 'test("operation bounds, duplicates and ordering are fail-closed", async () => {\n'),
              "checker:output-contract": ("scripts/check-mastering-plan.mjs", '  "MasteringPlan",\n'),
              "checker:output-test": ("scripts/check-mastering-plan.mjs", '  "operation bounds, duplicates and ordering are fail-closed",\n'),
              "docs:output-contract": ("docs/MASTERING_PLAN.md", "- target profile;\n- ordered operations;\n"),
              "docs:output-conversion": ("docs/MASTERING_PLAN.md", "Operations must appear in that order and each operation kind may appear at most once.\n"),
          }
          rows = []
          for label, (path, anchor) in anchors.items():
              source = Path(path).read_text(encoding="utf-8")
              rows.append(f"{label}={source.count(anchor)}")
          Path(".github/mastering-output-anchor-report.txt").write_text("\n".join(rows) + "\n", encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastering-output-anchor-report.yml").unlink(missing_ok=True)
          Path(".github/mastering-output-anchor-report.trigger").unlink(missing_ok=True)
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Record mastering output anchor report"
          git pull --rebase origin main
          git push origin HEAD:main
