name: One-time publication evidence inbox integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-evidence-inbox-integration.trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-evidence-inbox-20260729
          fetch-depth: 0

      - name: Integrate evidence inbox
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_string, old, new, label):
              path = Path(path_string)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"{label}:{count}")
              if count != 1:
                  raise SystemExit(f"{label}_INVALID:{count}")
              path.write_text(
                  source.replace(old, new, 1),
                  encoding="utf-8",
                  newline="\n",
              )

          replace_once(
              "packages/storyteller/src/project-store.ts",
              '  | "audiobook-retail-publication-alert"\n  | "chapter-assembly"',
              '  | "audiobook-retail-publication-alert"\n'
              '  | "audiobook-retail-publication-evidence-inbox"\n'
              '  | "chapter-assembly"',
              "PUBLICATION_EVIDENCE_ENTITY",
          )

          replace_once(
              "packages/storyteller/package.json",
              '    "./audiobook-retail-publication-refresh": '
              '"./src/audiobook-retail-publication-refresh.ts",\n'
              '    "./audiobook-sequence"',
              '    "./audiobook-retail-publication-refresh": '
              '"./src/audiobook-retail-publication-refresh.ts",\n'
              '    "./audiobook-retail-publication-evidence-inbox": '
              '"./src/audiobook-retail-publication-evidence-inbox.ts",\n'
              '    "./audiobook-sequence"',
              "PUBLICATION_EVIDENCE_EXPORT",
          )

          replace_once(
              "package.json",
              'npm run verify:audiobook-retail-publication-refresh && '
              'npm run verify:mastering-render',
              'npm run verify:audiobook-retail-publication-refresh && '
              'npm run verify:audiobook-retail-publication-evidence-inbox && '
              'npm run verify:mastering-render',
              "PUBLICATION_EVIDENCE_VERIFY_CHAIN",
          )

          replace_once(
              "package.json",
              '    "verify:audiobook-retail-publication-refresh": '
              '"node scripts/check-audiobook-retail-publication-refresh.mjs"\n',
              '    "verify:audiobook-retail-publication-refresh": '
              '"node scripts/check-audiobook-retail-publication-refresh.mjs",\n'
              '    "verify:audiobook-retail-publication-evidence-inbox": '
              '"node scripts/check-audiobook-retail-publication-evidence-inbox.mjs"\n',
              "PUBLICATION_EVIDENCE_VERIFY_SCRIPT",
          )

          replace_once(
              "apps/worker/src/publication-refresh-runtime.ts",
              'import { stableHash } from "@evavo/storyteller-engine";\n',
              'import { audiobookRetailPublicationRefreshRequestFingerprint } '
              'from "@evavo/storyteller-engine/'
              'audiobook-retail-publication-evidence-inbox";\n',
              "PUBLICATION_EVIDENCE_RUNTIME_IMPORT",
          )

          replace_once(
              "apps/worker/src/publication-refresh-runtime.ts",
              '    const latestEntry = monitor.entries.at(-1)!;\n'
              '    const requestFingerprint = stableHash({\n'
              '      monitorId: monitor.id,\n'
              '      monitorRevision: monitor.revision,\n'
              '      monitorFingerprint: monitor.fingerprint,\n'
              '      latestVerificationFingerprint: '
              'latestEntry.verificationFingerprint,\n'
              '      nextRefreshDueAt: monitor.nextRefreshDueAt,\n'
              '    });',
              '    const latestEntry = monitor.entries.at(-1)!;\n'
              '    const requestFingerprint =\n'
              '      audiobookRetailPublicationRefreshRequestFingerprint(monitor);',
              "PUBLICATION_EVIDENCE_RUNTIME_FINGERPRINT",
          )
          PY
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/project-store.ts \
            packages/storyteller/package.json \
            package.json \
            apps/worker/src/publication-refresh-runtime.ts
          git diff --cached --check
          git commit -m "Integrate publication verification evidence inbox"
          git pull --rebase origin work/audiobook-retail-publication-evidence-inbox-20260729
          git push origin HEAD:work/audiobook-retail-publication-evidence-inbox-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-evidence-inbox-integration.yml \
            .github/publication-evidence-inbox-integration.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication evidence inbox integration workflow"
          git pull --rebase origin main
          git push origin HEAD:main
