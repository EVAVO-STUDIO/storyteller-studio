name: One-time audiobook retail sample-render promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-sample-render.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail sample-render slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-sample-render-20260728
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_SAMPLE_RENDER.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-sample-render.test.ts \
            packages/storyteller/src/audiobook-retail-sample-render.ts \
            scripts/check-audiobook-retail-sample-render.mjs

          expected=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_SAMPLE_RENDER.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/audiobook-retail-sample-render.test.ts
          packages/storyteller/src/audiobook-retail-sample-render.ts
          scripts/check-audiobook-retail-sample-render.mjs
          EOF
          )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //')
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo AUDIOBOOK_RETAIL_SAMPLE_RENDER_FILE_SCOPE_INVALID
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          rm -f \
            .github/workflows/one-time-audiobook-retail-sample-render-promotion.yml \
            .github/audiobook-retail-sample-render.trigger
          echo AUDIOBOOK_RETAIL_SAMPLE_RENDER_PROMOTION_APPLIED

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-sample-render 2>&1 | tee .audiobook-retail-sample-render-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-sample-render-typecheck.log
          node --import tsx --test packages/storyteller/src/audiobook-retail-sample-render.test.ts 2>&1 | tee .audiobook-retail-sample-render-test.log
          npm run verify 2>&1 | tee .audiobook-retail-sample-render-verify.log
          npm run build 2>&1 | tee .audiobook-retail-sample-render-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-sample-render-${{ github.sha }}
          path: |
            .audiobook-retail-sample-render-check.log
            .audiobook-retail-sample-render-typecheck.log
            .audiobook-retail-sample-render-test.log
            .audiobook-retail-sample-render-verify.log
            .audiobook-retail-sample-render-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-sample-render-check.log \
            .audiobook-retail-sample-render-typecheck.log \
            .audiobook-retail-sample-render-test.log \
            .audiobook-retail-sample-render-verify.log \
            .audiobook-retail-sample-render-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail sample rendering"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-sample-render-check.log",
              ".audiobook-retail-sample-render-typecheck.log",
              ".audiobook-retail-sample-render-test.log",
              ".audiobook-retail-sample-render-verify.log",
              ".audiobook-retail-sample-render-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_SAMPLE_RENDER_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail sample-render promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-sample-render",
              description: state === "success" ? "Sample-render tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
