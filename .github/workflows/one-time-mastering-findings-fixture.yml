name: One-time mastering findings fixture correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-findings-fixture.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct expected mastering findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/storyteller/src/mastering-plan.test.ts")
          source = path.read_text(encoding="utf-8")
          old = '''      "MASTERING_SAMPLE_RATE_CONVERSION_REQUIRED",
              "MASTERING_SOURCE_CLIPPING_REQUIRES_REPAIR",
            ],
          );
          '''
          new = '''      "MASTERING_SAMPLE_RATE_CONVERSION_REQUIRED",
              "MASTERING_SOURCE_CLIPPING_REQUIRES_REPAIR",
              "MASTERING_TRANSPARENT_GAIN_WINDOW_EMPTY",
            ],
          );
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"MASTERING_FINDINGS_FIXTURE_ANCHOR_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastering-findings-fixture.yml").unlink(missing_ok=True)
          Path(".github/mastering-findings-fixture.trigger").unlink(missing_ok=True)
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct mastering findings fixture"
          git pull --rebase origin main
          git push origin HEAD:main
