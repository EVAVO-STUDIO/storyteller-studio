name: One-time audiobook retail sample-review promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-sample-review.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail sample-review slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-sample-review-20260728
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_SAMPLE_REVIEW.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-sample-review.test.ts \
            packages/storyteller/src/audiobook-retail-sample-review.ts \
            scripts/check-audiobook-retail-sample-review.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-sample-review-patch.log
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"AUDIOBOOK_RETAIL_SAMPLE_REVIEW_REPLACE:{path}:{count}:{expected}")
              if count != expected:
                  raise SystemExit(
                      f"AUDIOBOOK_RETAIL_SAMPLE_REVIEW_REPLACE_INVALID:{path}:{count}:{expected}"
                  )
              path.write_text(
                  source.replace(old, new),
                  encoding="utf-8",
                  newline="\n",
              )

          project_store = Path("packages/storyteller/src/project-store.ts")
          replace_exact(
              project_store,
              '  | "audiobook-retail-sample-plan"\n  | "chapter-assembly"',
              '  | "audiobook-retail-sample-plan"\n  | "audiobook-retail-sample-review"\n  | "chapter-assembly"',
          )

          tests = Path(
              "packages/storyteller/src/audiobook-retail-sample-review.test.ts"
          )
          replace_exact(
              tests,
              '      sustainedListenability: 3,',
              '      encodingTransparency: 3,',
          )

          print("AUDIOBOOK_RETAIL_SAMPLE_REVIEW_PATCH_APPLIED")
          PY

          git add \
            docs/AUDIOBOOK_RETAIL_SAMPLE_REVIEW.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-sample-review.test.ts \
            packages/storyteller/src/audiobook-retail-sample-review.ts \
            packages/storyteller/src/project-store.ts \
            scripts/check-audiobook-retail-sample-review.mjs

          expected=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_SAMPLE_REVIEW.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/audiobook-retail-sample-review.test.ts
          packages/storyteller/src/audiobook-retail-sample-review.ts
          packages/storyteller/src/project-store.ts
          scripts/check-audiobook-retail-sample-review.mjs
          EOF
          )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //')
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo AUDIOBOOK_RETAIL_SAMPLE_REVIEW_FILE_SCOPE_INVALID
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          rm -f \
            .github/workflows/one-time-audiobook-retail-sample-review-promotion.yml \
            .github/audiobook-retail-sample-review.trigger
          echo AUDIOBOOK_RETAIL_SAMPLE_REVIEW_PROMOTION_APPLIED

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-sample-review 2>&1 | tee .audiobook-retail-sample-review-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-sample-review-typecheck.log
          node --import tsx --test \
            packages/storyteller/src/audiobook-retail-sample-review.test.ts \
            2>&1 | tee .audiobook-retail-sample-review-test.log
          npm run verify 2>&1 | tee .audiobook-retail-sample-review-verify.log
          npm run build 2>&1 | tee .audiobook-retail-sample-review-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-sample-review-${{ github.sha }}
          path: |
            .audiobook-retail-sample-review-patch.log
            .audiobook-retail-sample-review-check.log
            .audiobook-retail-sample-review-typecheck.log
            .audiobook-retail-sample-review-test.log
            .audiobook-retail-sample-review-verify.log
            .audiobook-retail-sample-review-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-sample-review-patch.log \
            .audiobook-retail-sample-review-check.log \
            .audiobook-retail-sample-review-typecheck.log \
            .audiobook-retail-sample-review-test.log \
            .audiobook-retail-sample-review-verify.log \
            .audiobook-retail-sample-review-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail sample playback review"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-sample-review-patch.log",
              ".audiobook-retail-sample-review-check.log",
              ".audiobook-retail-sample-review-typecheck.log",
              ".audiobook-retail-sample-review-test.log",
              ".audiobook-retail-sample-review-verify.log",
              ".audiobook-retail-sample-review-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_SAMPLE_REVIEW_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail sample-review promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-sample-review",
              description: state === "success" ? "Sample-review tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
