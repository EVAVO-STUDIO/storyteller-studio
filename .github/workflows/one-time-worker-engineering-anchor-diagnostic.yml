name: One-time worker engineering anchor diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-engineering-anchor-diagnostic.trigger"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record anchor counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          cases = [
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-engineering-imports", 'import test from "node:test";\n'),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-policy-import", 'import { FileProjectStore } from "@evavo/storyteller-engine/project-store";\n'),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-policy-environment", '    ELEVENLABS_API_KEY: "fixture-elevenlabs-generation-secret",\n'),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-engineering-runner", "function fetchFrom(\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-policy-resolution", "    const calls: string[] = [];\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-runtime-policy", "      credentials,\n      now: () => t0,\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-engineering-call-count", "    assert.equal(calls.length, 3);\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-completion-artifact-count", "    assert.equal(queueEnvelope?.payload.completion?.outputArtifactRefs.length, 4);\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-registry-artifact-count", "    assert.equal(artifactRows.length, 4);\n"),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-artifact-kinds", dedent('''\
                assert.deepEqual(artifactKinds.sort(), [
                  "audio-analysis",
                  "audio-candidate",
                  "transcript",
                  "word-alignment",
                ]);
            ''')),
            ("apps/worker/src/elevenlabs-generation.test.ts", "fixture-engineering-redaction", "      configuration.objectRootDirectory,\n"),
            ("scripts/check-elevenlabs-generation.mjs", "checker-artifact-count", '  "outputArtifactRefs.length, 4",\n'),
            ("scripts/check-elevenlabs-generation.mjs", "checker-engineering-fixture-tokens", '  "runConfiguredWorkerRuntime",\n'),
            ("scripts/check-elevenlabs-generation.mjs", "checker-runtime-engineering-tokens", '  "requireBudget: true",\n'),
            ("scripts/check-elevenlabs-generation.mjs", "checker-engineering-summary", 'console.log("- verified audio, transcript, alignment and execution evidence back queue completion");\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-policy-error", '  "WORKER_PROVIDER_CAPABILITY_ID_MISMATCH",\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-required-policy", '  "requireBudget: true",\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-policy-test", '  "disabled runtime returns without providers, credentials or persistence",\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-main-policy", '  "EnvironmentCredentialResolver",\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-env-policy", '  "STORYTELLER_WORKER_CREDENTIAL_BINDINGS={}",\n'),
            ("scripts/check-worker-runtime.mjs", "runtime-checker-engineering-summary", 'console.log("- the private runtime requires calibration and transactional budget control before provider work");\n'),
            (".env.example", "env-engineering-policy", "STORYTELLER_WORKER_CREDENTIAL_BINDINGS={}\n\n"),
            ("docs/WORKER_RUNTIME.md", "runtime-doc", "## Required budget control\n"),
          ]
          lines = []
          for path, label, anchor in cases:
              source = Path(path).read_text(encoding="utf-8")
              lines.append(f"{label}={source.count(anchor)}")
          Path(".github/worker-engineering-anchor-diagnostic.txt").write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          rm -f .github/workflows/one-time-worker-engineering-anchor-diagnostic.yml
          rm -f .github/worker-engineering-anchor-diagnostic.trigger
          git add --all
          git commit -m "Record worker engineering anchor diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
