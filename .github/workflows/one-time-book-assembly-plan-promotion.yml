MUBHat u6ajZ1HdX3eKuxyuI+ydx+CLLEuKP17p2m02LbZSFPKjEPF2UGMUWWOk1e9TcJeutg2qjRVU+77w/2ugECMvRxgcKMIWlNbeuZqZsHtyKvaC9sTT8xOBJ eFzzPv0W0AyzJg5UqeDAkkpu1p3h11lXRkD5j6+SC3CX9h/NKLwsFSw3HI6K8xmaCe8BVHfCsXp0kmoBQifygLnqWRM26IQSerKOFqEGuUie97BKREJLwsNrUMmNWzF57ZsFE3/OgzPM5lPUa8VGie8vEK90ZpFJ4SkkdGpsx+OdW7vtyNY3PCOx49zEIZ6vPBOx5tgaX4CQ9oWHxTmoYNkoSaqjMs4+757BEJIUaPm6jnlGABD  d/WGExKqQUQEv+QZEki9LSDMdLLFol jABgZeGIT0pHhFJ2cpwA7O1JHmOqwQZjQk7qEave mMdtJGnbMoVJNX6ni4uqpGV6uiVcNJcW7zkceB97Y0u+M5fhyLmdnN22FXdyElRiTjoBu7Nv1lCdzjIDgWi6vwgIIQot14UcwK+HrV8t3TS25P1GK RcHVgbtGOQ3V4wJDnGoxveeNFHnoI6xbQ09GFtkAZt8LIcOI+494jaOy1xDPXfQsXpqTTyD5p//sLT5JjHhxGNaG8W2eO50YZ7n5W+A9ZSDlSY/oq lwvYNHLuE2dUTn3j+v8DaFpvejE8AQAA=="
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-assembly-plan-promotion.log
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          payload = json.loads(gzip.decompress(base64.b64decode(
              os.environ["BOOK_ASSEMBLY_PAYLOAD"]
          )).decode("utf-8"))
          expected = {
              "packages/storyteller/src/book-assembly-plan.ts",
              "packages/storyteller/src/book-assembly-plan.test.ts",
              "docs/BOOK_ASSEMBLY_PLAN.md",
              "scripts/check-book-assembly-plan.mjs",
          }
          if set(payload) != expected:
              raise SystemExit(
                  f"BOOK_ASSEMBLY_PAYLOAD_SCOPE_INVALID:{sorted(payload)}"
              )
          for relative, content in payload.items():
              path = Path(relative)
              if path.exists():
                  raise SystemExit(f"BOOK_ASSEMBLY_TARGET_ALREADY_EXISTS:{relative}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8", newline="\n")
              print(f"BOOK_ASSEMBLY_FILE_WRITTEN:{relative}:{len(content)}")

          project_store = Path("packages/storyteller/src/project-store.ts")
          source = project_store.read_text(encoding="utf-8")
          marker = '  | "book-chapter-sequence"\n'
          count = source.count(marker)
          print(f"BOOK_ASSEMBLY_PROJECT_STORE_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"BOOK_ASSEMBLY_PROJECT_STORE_ANCHOR_INVALID:{count}")
          source = source.replace(
              marker,
              marker + '  | "book-assembly-plan"\n',
              1,
          )
          project_store.write_text(source, encoding="utf-8", newline="\n")

          engine_package_path = Path("packages/storyteller/package.json")
          engine_package = json.loads(engine_package_path.read_text(encoding="utf-8"))
          exports = engine_package.get("exports")
          if not isinstance(exports, dict):
              raise SystemExit("BOOK_ASSEMBLY_ENGINE_EXPORTS_INVALID")
          if "./book-assembly-plan" in exports:
              raise SystemExit("BOOK_ASSEMBLY_ENGINE_EXPORT_ALREADY_EXISTS")
          rebuilt_exports = {}
          inserted = False
          for key, value in exports.items():
              rebuilt_exports[key] = value
              if key == "./book-chapter-sequence":
                  rebuilt_exports["./book-assembly-plan"] = "./src/book-assembly-plan.ts"
                  inserted = True
          if not inserted:
              raise SystemExit("BOOK_ASSEMBLY_ENGINE_EXPORT_ANCHOR_MISSING")
          engine_package["exports"] = rebuilt_exports
          engine_package_path.write_text(
              json.dumps(engine_package, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          root_package_path = Path("package.json")
          root_package = json.loads(root_package_path.read_text(encoding="utf-8"))
          scripts = root_package.get("scripts")
          if not isinstance(scripts, dict):
              raise SystemExit("BOOK_ASSEMBLY_ROOT_SCRIPTS_INVALID")
          if "verify:book-assembly" in scripts:
              raise SystemExit("BOOK_ASSEMBLY_VERIFY_SCRIPT_ALREADY_EXISTS")
          old_chain = "npm run verify:book-credit-master && npm run verify:mastering-render"
          new_chain = (
              "npm run verify:book-credit-master && npm run verify:book-assembly "
              "&& npm run verify:mastering-render"
          )
          verify_artifacts = scripts.get("verify:artifacts")
          if not isinstance(verify_artifacts, str) or verify_artifacts.count(old_chain) != 1:
              raise SystemExit("BOOK_ASSEMBLY_VERIFY_CHAIN_ANCHOR_INVALID")
          scripts["verify:artifacts"] = verify_artifacts.replace(old_chain, new_chain, 1)
          rebuilt_scripts = {}
          inserted = False
          for key, value in scripts.items():
              rebuilt_scripts[key] = value
              if key == "verify:book-credit-master":
                  rebuilt_scripts["verify:book-assembly"] = (
                      "node scripts/check-book-assembly-plan.mjs"
                  )
                  inserted = True
          if not inserted:
              raise SystemExit("BOOK_ASSEMBLY_VERIFY_SCRIPT_ANCHOR_MISSING")
          root_package["scripts"] = rebuilt_scripts
          root_package_path.write_text(
              json.dumps(root_package, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(".github/workflows/one-time-book-assembly-plan-promotion.yml"),
              Path(".github/book-assembly-plan-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_ASSEMBLY_PLAN_SLICE_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run focused assembly gates
        shell: bash
        run: |
          set -o pipefail
          npm run verify:book-assembly 2>&1 | tee .book-assembly-plan-focused.log
          npm run typecheck 2>&1 | tee -a .book-assembly-plan-focused.log
          npm run test:engine 2>&1 | tee -a .book-assembly-plan-focused.log

      - name: Run complete verification and builds
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-assembly-plan-verify.log
          npm run build 2>&1 | tee .book-assembly-plan-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-assembly-plan-promotion-${{ github.sha }}
          path: |
            .book-assembly-plan-promotion.log
            .book-assembly-plan-focused.log
            .book-assembly-plan-verify.log
            .book-assembly-plan-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promoted slice
        shell: bash
        run: |
          rm -f .book-assembly-plan-promotion.log .book-assembly-plan-focused.log .book-assembly-plan-verify.log .book-assembly-plan-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed complete-book assembly plan"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-assembly-plan-promotion.log",
              ".book-assembly-plan-focused.log",
              ".book-assembly-plan-verify.log",
              ".book-assembly-plan-build.log",
            ].filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /BOOK_ASSEMBLY_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)
            ) || lines.at(-1) || "complete-book assembly plan promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-assembly-plan-promotion",
              description: state === "success"
                ? "Complete-book assembly plan, tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
