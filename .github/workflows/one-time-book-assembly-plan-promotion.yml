name: One-time complete-book assembly plan promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-assembly-plan-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply governed complete-book assembly plan slice
        shell: bash
        env:
          BOOK_ASSEMBLY_PAYLOAD: "[... ELLIPSIZATION ...] PnuPJ0AjGyEl1FmMCsXEW M1KyxigjR Mau4rsfun+CfF4O9w9ch3KPMpqSGv0wn6PGPdit1uaKH43S+RJF WK2faqNxJKrj17nqF3qch4NH/XZ3/7lfno9tcnY/ubghwzaGOchvfw7N6X2z78bGuyP0LkJzLDn9C5vAaupW/3VeR2XiXVQQu0mnb8n2Q9I1veSfavRl+FLrzBwrFFmWmcL9B0/OG lHW2NaDQwc9uSHBwbQWCe+g2P3D7sSo+yKpoSkm5ke6w9cYHrsdiXIdUn5Hmvm5Mz7HA5F8HpBRLsz1shiHH9lDFfdfby tqMUA vfg0W  vxr7xEgEyLshPE3AUwuzrQzfqIzSTI8SE6zM7TqCKM5Mpgwkd/9LtlbLuZFmeGvvvZdkTof4XDpOLaoC5vU58bJBb3XgLpksKP5ZAKUe54uaEE5TKlDb6qk8Qr+pshB06UwUF1my aeLfHQB4AAiJBqQE2ACMzdrQVdkqJhWAgAtchZayKZSaY9z4lGo5tJqLNeezq6gPlBRsS8CFPgkFypAow4CAc0VNduX5GhJkLvVYrsiO8vJ17aTDKtkXMA6ZgXesrMR1J6RHxBFT oBJo lcT9ETZOCeYZhMzxmBPL e0yBIWTDA/6PB19TM9x54VZtrzApVQXyAjKbVSO4vJUA/wr2lIxaWME mRCmVBeIaZiNlHayog8lulKpd9E6aGgPu+l2aC/OFX6fBFxcT3B/TjyPxhNyd0Tiu9WhYZTJR S OU9wzgRN9S+ionE3MGo19p5CQHS+j2oZibh58n1vPME/mKhJSXaN4hXNONB HuuHnZAr4+cXhWm363X72IgcHqNrD8FTBc1oa/HHcAQTDg4Dhm2ss/4MDivhESQcJZfo3n8JItllS1nBWVLvxSiR57iwMmnL+bBC R3sU8ClHGjB D A GCtcTHSSHipGuEk1ZkqiOPm4CR3GbFAipE31awUyBKxzJTlaCsZJhV0ZYFRcIzmI5G2RznDd3DkHQGUhyVw3qKi06WJR7DTtKX0jMdR3ruYyMggU2AK0eRXsr5OMY5dlQRS ozc+cp3kjjbAW4ozr+iVqqGBBWdvDYBQ+AVGiQrSlPR0ohhudW21FsAeo4iQApEN6FkFUDn5ihCUsR5nJk+zZJk6MwMbZPUpq3eldBnhVRACwnl2hqBP11kdLcQthA0BDmiZsATlTD35O9LuBJgBbOMPi9nkr6Naabi3kgvgRwSQQUk g c7HS/LopQYjnDDUxrNgrjjaBp0fGXYvk0ugMXGh7HIAcoswhANFEVy o5qxASwxsKGDEjMCtKb6+XSnOqyCo0jACR2F5CnOuUIuDaX9TupqTsyUCuS0QQR/f00kx+igQmxhmhczScqJCueD25bMlAF6MJdFLnrBcXCcaYUTW32yUwp pho bjpNAKt16AT+v92KDGBvAsUosqDJi87vG0Iz8uLfA7dVp+ybMZw0JBC TqsEpXjiVao+FUKhJWsjufDpoWhk0RSOhlabEktp400YjSf2EWHRW9X6dQ18ITLH W3pmh6o0lATppslM0Q7Tanv52i1CEVWzGDMVOtCCvKgrAoZSjmziNiYyjeG/xVbxCWr0oH7kORmPF8jqWfCTsKmhAeIMiInIV5qSj+IEGVkwPEjiqDFqXCrEPVTOedpzIp9IrD2k1aADEGO1FOsk2CPYfPL4MAwrneGZzHjcRm9/QSAFwVVMrAAATEyi5V/6v5jEeAadcBXC iTFZcBShgmkB5x1WRSxHod6NCPDYNfe236ISGVii eXVhF2nSyeOtKcAxgkyLOFjO58UC9wd7lGhMTu3ie jrRBo2Tlv yB6bJPC Cri98Mt+A03kiII4owgCVhIx hNpMIif0KaAWS74+lt6kZP0inKU61Vhe4tflksgCv4rIRWjHJqhBcyj7ltwxeNo