name: One-time mastered chapter release gate

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastered-chapter-release-gate.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require mastered chapters for audiobook release
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastered-chapter-release-gate.log
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"MASTERED_RELEASE_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERED_RELEASE_ANCHOR_INVALID:{label}:{count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          registry = Path("packages/storyteller/src/artifact-registry.ts")
          replace_once(
              registry,
              '''  if (![...visited].some((id) => byId.get(id)?.kind === "chapter-master")) {
            findings.push({
              code: "ARTIFACT_RELEASE_CHAPTER_MASTER_REQUIRED",
              severity: "error",
              message: "Audiobook release package must depend on at least one verified chapter master.",
            });
          }
          ''',
              '''  if (![...visited].some((id) => byId.get(id)?.kind === "mastered-chapter")) {
            findings.push({
              code: "ARTIFACT_RELEASE_MASTERED_CHAPTER_REQUIRED",
              severity: "error",
              message: "Audiobook release package must depend on at least one verified and approved mastered chapter.",
            });
          }
          ''',
              "release-gate",
          )

          tests = Path("packages/storyteller/src/artifact-registry.test.ts")
          mastered_block = '''  const masteredPending = createArtifactRecord({
            id: "artifact_mastered_release_001",
            kind: "mastered-chapter",
            projectId: job.projectId,
            segmentId: "chapter_001",
            takeId: "mastered_release_take_001",
            storage: {
              driver: "private-object-store",
              provider: "s3-compatible-private",
              container: "storyteller-production",
              objectKey: `projects/${job.projectId}/chapters/chapter_001/mastered-release.wav`,
              versionId: "mastered-version-001",
              region: "australia-southeast",
            },
            integrity: {
              algorithm: "sha256",
              contentHash: "c".repeat(64),
              byteCount: 960_000,
              mimeType: "audio/wav",
              format: "wav",
            },
            provenance: {
              createdByActorId: "mastering_release_001",
              sourceContentHash: chapter.integrity.contentHash,
              generationRequestHash: "4".repeat(64),
              parentArtifactIds: [chapter.id],
            },
            rights: rights(),
          }, new Date(t3.getTime() + 100));
            const mastered = approve(
              verify(masteredPending, new Date(t3.getTime() + 200)),
              new Date(t3.getTime() + 300),
            );

          '''
          replace_once(
              tests,
              "  const releasePending = createArtifactRecord({\n",
              mastered_block + "  const releasePending = createArtifactRecord({\n",
              "mastered-fixture",
          )
          replace_once(
              tests,
              "      parentArtifactIds: [chapter.id],\n",
              "      parentArtifactIds: [mastered.id],\n",
              "release-parent",
          )
          for old, new, label in [
              ("    [first, second, chapter, releaseVerified],", "    [first, second, chapter, mastered, releaseVerified],", "blocked-records"),
              ("    [first, second, chapter, releaseApproved],", "    [first, second, chapter, mastered, releaseApproved],", "assessment-records"),
              ("    [first, second, chapter, releaseApproved],", "    [first, second, chapter, mastered, releaseApproved],", "confirmation-records"),
              ("Package order, metadata, checksums and approved chapter masters were reviewed.", "Package order, metadata, checksums and approved mastered chapters were reviewed.", "release-note"),
              ("  assert.equal(assessment.artifactIds.includes(chapter.id), true);", "  assert.equal(assessment.artifactIds.includes(chapter.id), true);\n  assert.equal(assessment.artifactIds.includes(mastered.id), true);", "mastered-assessment"),
          ]:
              replace_once(tests, old, new, label)

          pre_master_test = '''test("a pre-master chapter alone cannot satisfy audiobook release", () => {
            const candidate = approve(verify(createCandidate("artifact_take_pre_master_only", "take_pre_master_only", "5")));
            const chapter = approve(verify(createArtifactRecord({
              id: "artifact_pre_master_only_001",
              kind: "chapter-master",
              projectId: job.projectId,
              storage: {
                driver: "private-object-store",
                provider: "s3-compatible-private",
                container: "storyteller-production",
                objectKey: `projects/${job.projectId}/chapters/chapter_pre_master_only/master.wav`,
                region: "australia-southeast",
              },
              integrity: {
                algorithm: "sha256",
                contentHash: "6".repeat(64),
                byteCount: 960_000,
                mimeType: "audio/wav",
                format: "wav",
              },
              provenance: {
                createdByActorId: "assembler_pre_master_only_001",
                sourceContentHash: "d".repeat(64),
                parentArtifactIds: [candidate.id],
              },
              rights: rights(),
            }, t1), t2), t3);
            const release = approve(verify(createArtifactRecord({
              id: "artifact_release_pre_master_only_001",
              kind: "release-package",
              projectId: job.projectId,
              storage: {
                driver: "private-object-store",
                provider: "s3-compatible-private",
                container: "storyteller-production",
                objectKey: `projects/${job.projectId}/releases/pre-master-only.zip`,
                region: "australia-southeast",
              },
              integrity: {
                algorithm: "sha256",
                contentHash: "7".repeat(64),
                byteCount: 1_200_000,
                mimeType: "application/zip",
                format: "zip",
              },
              provenance: {
                createdByActorId: "release_pre_master_only_001",
                sourceContentHash: chapter.integrity.contentHash,
                parentArtifactIds: [chapter.id],
              },
              rights: rights(),
            }, t1), t2), t3);
            const assessment = assessArtifactRelease(
              [candidate, chapter, release],
              release.id,
              { finalConfirmationId: "confirmation_pre_master_only_001", now: t3 },
            );
            assert.equal(assessment.ok, false);
            assert.equal(
              assessment.findings.some((finding) =>
                finding.code === "ARTIFACT_RELEASE_MASTERED_CHAPTER_REQUIRED"
              ),
              true,
            );
          });

          '''
          replace_once(
              tests,
              'test("expired rights block queue completion and final release", () => {\n',
              pre_master_test + 'test("expired rights block queue completion and final release", () => {\n',
              "pre-master-release-test",
          )

          checker = Path("scripts/check-artifact-registry.mjs")
          replace_once(
              checker,
              '  "ARTIFACT_RELEASE_REVIEW_PENDING",\n',
              '  "ARTIFACT_RELEASE_REVIEW_PENDING",\n  "ARTIFACT_RELEASE_MASTERED_CHAPTER_REQUIRED",\n',
              "checker-release-code",
          )
          replace_once(
              checker,
              '  "release remains blocked until every dependency is verified, reviewed and rights-valid",\n',
              '  "release remains blocked until every dependency is verified, reviewed and rights-valid",\n  "a pre-master chapter alone cannot satisfy audiobook release",\n',
              "checker-release-test",
          )

          for temporary in [
              Path(".github/workflows/one-time-mastered-chapter-release-gate.yml"),
              Path(".github/mastered-chapter-release-gate.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERED_CHAPTER_RELEASE_GATE_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastered-release-verify.log
          npm run build 2>&1 | tee .mastered-release-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastered-chapter-release-${{ github.sha }}
          path: |
            .mastered-chapter-release-gate.log
            .mastered-release-verify.log
            .mastered-release-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit release gate
        shell: bash
        run: |
          rm -f .mastered-chapter-release-gate.log .mastered-release-verify.log .mastered-release-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Require mastered chapters for audiobook release"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".mastered-chapter-release-gate.log",
              ".mastered-release-verify.log",
              ".mastered-release-build.log",
            ].filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /MASTERED_RELEASE_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "mastered chapter release gate failed verification";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastered-chapter-release-gate",
              description: state === "success"
                ? "Mastered chapter release gate, tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
