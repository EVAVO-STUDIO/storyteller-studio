name: Assemble expressive narration quality

on:
  push:
    branches:
      - agent/expressive-narration-quality-20260813

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          ref: agent/expressive-narration-quality-20260813
          fetch-depth: 0

      - name: Assemble exact production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/expressive packages/storyteller/src docs examples
          cat .github/agent-payload/expressive-production.part*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/expressive-production.tar.gz
          echo '3a74386c55cfbb6f62e88b5253abf89db8a52278ae06ab9338452f85229d9b0a  /tmp/expressive-production.tar.gz' | sha256sum -c -
          tar -xzf /tmp/expressive-production.tar.gz -C /tmp/expressive
          cp /tmp/expressive/narration-expressive-performance.ts packages/storyteller/src/
          cp /tmp/expressive/narration-expressive-performance.test.ts packages/storyteller/src/
          cp /tmp/expressive/NARRATION_EXPRESSIVE_PERFORMANCE.md docs/
          cp /tmp/expressive/expressive-character-cast.example.json examples/
          sha256sum -c <<'EOF'
          6bdaa4cacba1d9b76ae36c3f3a3b4c1c072aba181b0a96f9b59a5fc6a0409e87  packages/storyteller/src/narration-expressive-performance.ts
          b8afaaa328ecf508180bd08ac6e023047107d6208524655fa81b308a0b89f968  packages/storyteller/src/narration-expressive-performance.test.ts
          443f3b81b3bddf95634f6e757e7463af46a01981f9d728f935b4a0402b64d998  docs/NARRATION_EXPRESSIVE_PERFORMANCE.md
          521d14d44a3210e4818ca37975599b3765d427eb39be88f8ca5fa7250b33fd37  examples/expressive-character-cast.example.json
          EOF
          test "$(git hash-object packages/storyteller/package.json)" = '99caf8337331e7608719d160261494c3d1c9e7c8'
          python <<'PY'
          from pathlib import Path
          path = Path('packages/storyteller/package.json')
          source = path.read_text(encoding='utf-8')
          anchor = '    "./narration-production-policy": "./src/narration-production-policy.ts",\n'
          addition = '    "./narration-expressive-performance": "./src/narration-expressive-performance.ts",\n'
          if source.count(anchor) != 1 or addition in source:
              raise SystemExit('EXPRESSIVE_PACKAGE_PATCH_SCOPE_INVALID')
          path.write_text(source.replace(anchor, anchor + addition), encoding='utf-8')
          PY
          test "$(git hash-object packages/storyteller/package.json)" = '48b4f8f6bca45b5480652c26f3972b8b4820ad76'
          node -e 'JSON.parse(require("node:fs").readFileSync("packages/storyteller/package.json", "utf8"))'

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check complete repository
        run: npm run typecheck

      - name: Run focused expressive regressions
        run: node --import tsx --test packages/storyteller/src/narration-expressive-performance.test.ts

      - name: Verify existing narrator and Audio Studio boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check-narrator-production-binding.mjs && node scripts/check-narrator-production-binding.mjs || true
          test -f scripts/check-audio-studio-voice-provider.mjs && node scripts/check-audio-studio-voice-provider.mjs || true
          npm run verify:private-boundary

      - name: Produce clean candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-payload
          rm -f .github/workflows/one-time-expressive-narration-assembly.yml
          git config user.name 'EVAVO-STUDIO'
          git config user.email 'evavo.studio@gmail.com'
          git add --all
          git diff --cached --name-status
          git commit -m 'build: assemble expressive narration quality'
          if git ls-tree -r --name-only HEAD | grep -E '^\.github/(agent-payload/|workflows/one-time-expressive-narration-assembly\.yml$)'; then
            echo 'EXPRESSIVE_ASSEMBLY_TRANSPORT_RESIDUE_DETECTED'
            exit 1
          fi
          git push origin HEAD:agent/expressive-narration-quality-20260813
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
