name: One-time narrator mastering chain correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/narrator-mastering-chain-fix.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply exact narrator mastering corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path("packages/storyteller/src/narrator-mastering-chain.ts")
          source = module.read_text(encoding="utf-8")

          replacements = [
              (
                  '''export interface NarratorApprovedMasteredChapterReceipt {\n  schemaVersion: typeof NARRATOR_APPROVED_MASTERED_CHAPTER_SCHEMA;\n  projectId: string;\n  chapterId: string;\n  authorizationFingerprint: string;''',
                  '''export interface NarratorApprovedMasteredChapterReceipt {\n  schemaVersion: typeof NARRATOR_APPROVED_MASTERED_CHAPTER_SCHEMA;\n  projectId: string;\n  chapterId: string;\n  planId: string;\n  planFingerprint: string;\n  authorizationFingerprint: string;''',
              ),
              (
                  '''  const authorizedAt = (input.authorizedAt ?? new Date()).toISOString();\n  if (Date.parse(authorizedAt) < Date.parse(input.review.reviewedAt)) {''',
                  '''  const authorizedAtDate = input.authorizedAt ?? new Date();\n  if (Number.isNaN(authorizedAtDate.getTime())) {\n    throw new NarratorMasteringChainError("NARRATOR_MASTERING_AUTHORIZATION_DATE_INVALID");\n  }\n  const authorizedAt = authorizedAtDate.toISOString();\n  if (Date.parse(authorizedAt) < Date.parse(input.review.reviewedAt)) {''',
              ),
              (
                  '''    projectId: input.approvedPlan.authorization.projectId,\n    chapterId: input.approvedPlan.authorization.chapterId,\n    authorizationFingerprint: input.approvedPlan.authorization.fingerprint,''',
                  '''    projectId: input.approvedPlan.authorization.projectId,\n    chapterId: input.approvedPlan.authorization.chapterId,\n    planId: input.approvedPlan.plan.id,\n    planFingerprint: input.approvedPlan.plan.fingerprint,\n    authorizationFingerprint: input.approvedPlan.authorization.fingerprint,''',
              ),
              (
                  '''  requireIdentifier(receipt.projectId, "NARRATOR_MASTERED_CHAPTER_PROJECT_INVALID");\n  requireIdentifier(receipt.chapterId, "NARRATOR_MASTERED_CHAPTER_CHAPTER_INVALID");\n  for (const hash of [\n    receipt.authorizationFingerprint,''',
                  '''  requireIdentifier(receipt.projectId, "NARRATOR_MASTERED_CHAPTER_PROJECT_INVALID");\n  requireIdentifier(receipt.chapterId, "NARRATOR_MASTERED_CHAPTER_CHAPTER_INVALID");\n  requireIdentifier(receipt.planId, "NARRATOR_MASTERED_CHAPTER_PLAN_ID_INVALID");\n  for (const hash of [\n    receipt.planFingerprint,\n    receipt.authorizationFingerprint,''',
              ),
              (
                  '''    chapterId: receipt.chapterId,\n    planId: receipt.masteredArtifact.id,\n    masteredArtifactId: receipt.masteredArtifact.id,''',
                  '''    chapterId: receipt.chapterId,\n    planId: receipt.planId,\n    masteredArtifactId: receipt.masteredArtifact.id,''',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"NARRATOR_MASTERING_MODULE_REPLACEMENT_INVALID:{count}:{old[:80]!r}")
              source = source.replace(old, new)
          module.write_text(source, encoding="utf-8", newline="\n")

          test = Path("packages/storyteller/src/narrator-mastering-chain.test.ts")
          source = test.read_text(encoding="utf-8")
          duplicate = '        engineering: postEngineeringPolicy(outputBytes),\n'
          if source.count(duplicate) != 1:
              raise SystemExit(f"NARRATOR_MASTERING_DUPLICATE_ENGINEERING_INVALID:{source.count(duplicate)}")
          source = source.replace(duplicate, "")
          old = '''  const changedMaster = { ...value.chapterMaster, revision: value.chapterMaster.revision + 1 };'''
          new = '''  const changedMaster = verifiedArtifact({\n    id: "artifact_chapter_master_narrator_other",\n    kind: "chapter-master",\n    bytes: value.sourceBytes,\n    sourceContentHash: manuscriptSourceHash,\n    generationRequestHash: value.chapterRenderEvidence.commandFingerprint,\n    parentArtifactIds: ["artifact_chapter_render_evidence_other"],\n    reviewRequired: true,\n  });'''
          if source.count(old) != 1:
              raise SystemExit(f"NARRATOR_MASTERING_CHANGED_MASTER_FIX_INVALID:{source.count(old)}")
          source = source.replace(old, new)
          source = source.replace(
              '/ARTIFACT_FINGERPRINT_MISMATCH|NARRATOR_MASTERING_SOURCE_MASTER_CHANGED/u,',
              '/NARRATOR_MASTERING_SOURCE_MASTER_CHANGED/u,',
          )
          test.write_text(source, encoding="utf-8", newline="\n")
          PY
      - name: Validate focused narrator mastering chain
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          node --import tsx --test packages/storyteller/src/narrator-mastering-chain.test.ts
          node scripts/check-narrator-book-monitoring.mjs
          git diff --check
      - name: Remove one-time automation and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-time-narrator-mastering-chain-fix.yml
          rm -f .github/narrator-mastering-chain-fix.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: harden narrator mastering evidence chain"
          git pull --rebase origin main
          git push origin HEAD:main
