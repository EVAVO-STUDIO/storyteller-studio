name: One-time worker service engineering integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-service-engineering-integration.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-service-engineering-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pass mandatory engineering policy through worker service
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-service-engineering-integration.log
          from pathlib import Path

          path = Path("packages/storyteller/src/worker-service.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'import type { FileArtifactRegistry } from "./artifact-store.js";\n',
                  'import type { FileArtifactRegistry } from "./artifact-store.js";\n'
                  'import type { GenerationAudioEngineeringPolicy } from "./generation-audio-engineering.js";\n',
                  "import",
              ),
              (
                  '  artifactRegistry: FileArtifactRegistry;\n'
                  '  budgetController?: FileGenerationBudgetController;\n',
                  '  artifactRegistry: FileArtifactRegistry;\n'
                  '  audioEngineering?: GenerationAudioEngineeringPolicy;\n'
                  '  budgetController?: FileGenerationBudgetController;\n',
                  "dependencies",
              ),
              (
                  '  requireBudget?: boolean;\n'
                  '  now?: () => Date;\n',
                  '  requireBudget?: boolean;\n'
                  '  requireAudioEngineering?: boolean;\n'
                  '  now?: () => Date;\n',
                  "options",
              ),
              (
                  '  readonly #requireBudget: boolean;\n'
                  '  readonly #now: () => Date;\n',
                  '  readonly #requireBudget: boolean;\n'
                  '  readonly #requireAudioEngineering: boolean;\n'
                  '  readonly #now: () => Date;\n',
                  "field",
              ),
              (
                  '    if (this.#requireBudget && !dependencies.budgetController) {\n'
                  '      throw new Error("GENERATION_WORKER_SERVICE_BUDGET_CONTROLLER_REQUIRED");\n'
                  '    }\n'
                  '    this.#now = options.now ?? (() => new Date());\n',
                  '    if (this.#requireBudget && !dependencies.budgetController) {\n'
                  '      throw new Error("GENERATION_WORKER_SERVICE_BUDGET_CONTROLLER_REQUIRED");\n'
                  '    }\n'
                  '    this.#requireAudioEngineering = options.requireAudioEngineering ?? false;\n'
                  '    if (this.#requireAudioEngineering && !dependencies.audioEngineering) {\n'
                  '      throw new Error("GENERATION_WORKER_SERVICE_AUDIO_ENGINEERING_REQUIRED");\n'
                  '    }\n'
                  '    this.#now = options.now ?? (() => new Date());\n',
                  "constructor",
              ),
              (
                  '        artifactRegistry: this.#dependencies.artifactRegistry,\n'
                  '        material,\n',
                  '        artifactRegistry: this.#dependencies.artifactRegistry,\n'
                  '        ...(this.#dependencies.audioEngineering\n'
                  '          ? { audioEngineering: this.#dependencies.audioEngineering }\n'
                  '          : {}),\n'
                  '        material,\n',
                  "execution",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"WORKER_SERVICE_ENGINEERING_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"WORKER_SERVICE_ENGINEERING_MATCH_COUNT_INVALID:{label}:{count}"
                  )
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          print("WORKER_SERVICE_ENGINEERING_INTEGRATED")
          PY

      - name: Remove one-time integration machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-worker-service-engineering-integration.yml
          rm -f .github/worker-service-engineering-integration.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/worker-service.ts .github/workflows/one-time-worker-service-engineering-integration.yml .github/worker-service-engineering-integration.trigger
          git diff --cached --check
          git commit -m "Pass engineering policy through worker service"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-service-engineering-integration.log")
              ? fs.readFileSync(".worker-service-engineering-integration.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker service engineering integration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_SERVICE_ENGINEERING_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker service engineering integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-service-engineering-integration",
              description: state === "success"
                ? "Worker service propagates mandatory engineering policy"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
