name: One-time calibrated ElevenLabs verifier migration v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/calibrated-elevenlabs-verifier-v2.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-calibrated-elevenlabs-verifier-v2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write canonical calibrated verifier
        shell: bash
        run: |
          set -o pipefail
          cat > scripts/check-elevenlabs-generation.mjs <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const root = process.cwd();
          const problems = [];
          const fromRoot = (path) => resolve(root, path);
          const read = (path) => readFileSync(fromRoot(path), "utf8");

          function requireFile(path) {
            if (!existsSync(fromRoot(path))) problems.push(`missing ElevenLabs generation file: ${path}`);
          }

          function requireTokens(path, tokens) {
            if (!existsSync(fromRoot(path))) return;
            const source = read(path);
            for (const token of tokens) {
              if (!source.includes(token)) {
                problems.push(`${path} is missing ElevenLabs generation contract token: ${token}`);
              }
            }
          }

          for (const path of [
            "apps/worker/src/elevenlabs-generation.test.ts",
            "apps/worker/src/runtime.ts",
            "packages/storyteller/src/calibration-admission.ts",
            "packages/storyteller/src/generation-calibration.ts",
            "packages/storyteller/src/generation-worker.ts",
            "packages/storyteller/src/generation-budget.ts",
            "packages/storyteller/src/artifact-ingest.ts",
            "packages/storyteller/src/artifact-queue.ts",
            "packages/storyteller/src/elevenlabs-adapter.ts",
            "docs/ELEVENLABS_PRODUCTION_PATH.md",
          ]) requireFile(path);

          requireTokens("apps/worker/src/elevenlabs-generation.test.ts", [
            "queued ElevenLabs production requires approved calibration, reserves budget, verifies artifacts and completes with exact evidence",
            "createWorkerProviderRegistry",
            "runConfiguredWorkerRuntime",
            "FileGenerationQueue",
            "FileGenerationMaterialStore",
            "FileBudgetLedger",
            "FileCalibrationSessionStore",
            "FileGenerationCalibrationBindingStore",
            "createProductionCalibrationLock",
            "persistCalibrationAndBinding",
            "approvedCapabilityFingerprint",
            "FileArtifactRegistry",
            "premadeVoice0001",
            "eleven_multilingual_v2",
            "enable_logging",
            "wav_44100",
            "completedJobs",
            "committedMicros",
            "artifactKinds",
            "artifact_calibration_take_elevenlabs_generation_001",
            "reviewer_elevenlabs_generation_001",
          ]);

          requireTokens("apps/worker/src/runtime.ts", [
            "FileCalibrationSessionStore",
            "FileGenerationCalibrationBindingStore",
            "CalibratedGenerationMaterialStore",
            "createCalibrationBoundProviderRegistry",
            "FileGenerationBudgetController",
            "requireBudget: true",
          ]);

          requireTokens("packages/storyteller/src/calibration-admission.ts", [
            "createProductionCalibrationLock",
            "validatePersistedProductionCalibrationLock",
            "validateProductionCalibrationScope",
            "calibrationExecutionFindingCodes",
          ]);

          requireTokens("packages/storyteller/src/generation-calibration.ts", [
            "FileGenerationCalibrationBindingStore",
            "CalibratedGenerationMaterialStore",
            "createCalibrationBoundProviderRegistry",
            "resolveForMaterial",
            "resolveForRequest",
          ]);

          requireTokens("packages/storyteller/src/generation-budget.ts", [
            "FileGenerationBudgetController",
            "GenerationBudgetSession",
            "GENERATION_BUDGET_COMPLETED",
          ]);

          requireTokens("packages/storyteller/src/generation-worker.ts", [
            "runClaimedGenerationWorker",
            "ingestResultArtifacts",
            "beforeQueueTransition",
          ]);

          requireTokens("packages/storyteller/src/artifact-ingest.ts", [
            "ingestPrivateArtifact",
            "verifyArtifactIntegrity",
          ]);

          requireTokens("packages/storyteller/src/artifact-queue.ts", [
            "completeGenerationWithArtifacts",
            "beforeQueueComplete",
          ]);

          requireTokens("packages/storyteller/src/elevenlabs-adapter.ts", [
            "ElevenLabsNarrationAdapter",
            "/with-timestamps",
            "original_alignment",
            "ELEVENLABS_ALIGNMENT_TEXT_MISMATCH",
          ]);

          requireTokens("docs/ELEVENLABS_PRODUCTION_PATH.md", [
            "Governed ElevenLabs Production Path",
            "approved calibration session",
            "production calibration lock",
            "per-job calibration binding",
            "exact provider request",
            "Transaction budget proof",
            "Queue completion evidence",
            "What the fixture does not prove",
          ]);

          const testSource = existsSync(fromRoot("apps/worker/src/elevenlabs-generation.test.ts"))
            ? read("apps/worker/src/elevenlabs-generation.test.ts")
            : "";
          const orderedCallSites = [
            "const configuration = resolveWorkerRuntimeConfiguration",
            "const ledger = new FileBudgetLedger",
            "await materials.create(job, material()",
            "const approvedCalibration = await persistCalibrationAndBinding",
            "await queue.enqueue(job",
            "const providers = createWorkerProviderRegistry",
            "const result = await runConfiguredWorkerRuntime",
            "const queueEnvelope = await queue.read",
            "const budget = await ledger.require",
            "const artifactRows = await registry.list",
          ];
          let previous = -1;
          for (const token of orderedCallSites) {
            const index = testSource.indexOf(token, previous + 1);
            if (index < 0) {
              problems.push(`ElevenLabs generation fixture call sequence is missing at: ${token}`);
              continue;
            }
            previous = index;
          }

          const runtimeSource = existsSync(fromRoot("apps/worker/src/runtime.ts"))
            ? read("apps/worker/src/runtime.ts")
            : "";
          const runtimeOrder = [
            "const queueState = new FileProjectStore",
            "const calibrationStore = new FileCalibrationSessionStore",
            "const calibrationBindings = new FileGenerationCalibrationBindingStore",
            "const materials = new CalibratedGenerationMaterialStore",
            "const providers = createCalibrationBoundProviderRegistry",
            "const budgetController = new FileGenerationBudgetController",
            "const artifactRegistry = new FileArtifactRegistry",
            "return new GenerationWorkerService",
          ];
          previous = -1;
          for (const token of runtimeOrder) {
            const index = runtimeSource.indexOf(token, previous + 1);
            if (index < 0) {
              problems.push(`ElevenLabs calibrated worker runtime sequence is missing at: ${token}`);
              continue;
            }
            previous = index;
          }

          for (const sentinel of [
            "fixture-elevenlabs-generation-secret",
            "premadeVoice0001",
            "Aelwyn waited.",
            "artifact_calibration_take_elevenlabs_generation_001",
            "reviewer_elevenlabs_generation_001",
            "greg_parker",
          ]) {
            if (!testSource.includes(sentinel)) {
              problems.push(`ElevenLabs generation fixture is missing redaction sentinel: ${sentinel}`);
            }
          }
          if (!testSource.includes("assert.equal(serialised.includes(forbidden), false)")) {
            problems.push("ElevenLabs generation fixture does not assert redacted runtime output");
          }

          if (problems.length > 0) {
            console.error("Storyteller Studio ElevenLabs generation check failed:\n");
            for (const problem of problems) console.error(`- ${problem}`);
            process.exit(1);
          }

          console.log("storyteller_elevenlabs_generation_check_passed");
          console.log("- the first concrete provider path is proven through the dedicated private worker");
          console.log("- an approved calibration session and per-job lock are required before production synthesis");
          console.log("- exact manuscript text, deterministic settings, timestamp alignment and media signatures are verified");
          console.log("- approved provider, model and capability evidence are rechecked around synthesis");
          console.log("- project budget capacity is reserved before provider work and actual cost is committed before completion");
          console.log("- private audio, transcript, alignment and execution evidence become verified artifact records");
          console.log("- queue completion contains governed references rather than media, credentials, calibration evidence or private locators");
          console.log("- the deterministic fixture proves orchestration but does not claim real narrator or release approval");
          EOF

          python3 - <<'PY' 2>&1 | tee .calibrated-elevenlabs-verifier-v2.log
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.get("scripts", {})
          scripts["verify:elevenlabs-generation"] = "node scripts/check-elevenlabs-generation.mjs"
          package_path.write_text(
              json.dumps(package, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          doc_path = Path("docs/ELEVENLABS_PRODUCTION_PATH.md")
          doc = doc_path.read_text(encoding="utf-8")
          addition = """

          ## Approved calibration admission

          Production now requires an approved calibration session before synthesis. A production calibration lock binds the exact project, voice revision, provider, model and capability fingerprint selected through human review. A per-job calibration binding must match the job, segment, cache key, candidate count and sole provider route before provider credentials are used.

          The calibrated material store revalidates the persisted approved session after the worker owns an exclusive lease. The calibrated provider wrapper then verifies the approved provider, model and capability fingerprint around the exact provider request and before generated bytes can enter artifact ingestion.

          Missing, stale or mismatched calibration evidence blocks production rather than silently falling back to another voice or model. Preview and calibration generation remain available for creating review evidence before final approval.
          """
          if "## Approved calibration admission" not in doc:
              doc_path.write_text(doc.rstrip() + addition + "\n", encoding="utf-8", newline="\n")

          for path in [
              Path("scripts/check-elevenlabs-generation-v2.mjs"),
              Path("scripts/check-elevenlabs-generation-current.mjs"),
              Path("scripts/.batch-update-marker"),
              Path(".github/calibrated-checker-note"),
              Path(".github/push-files-probe-remove"),
              Path(".github/explicit-push-test"),
              Path(".github/push-files-probe-remove"),
              Path(".github/workflows/one-time-calibrated-elevenlabs-verifier.yml"),
              Path(".github/calibrated-elevenlabs-verifier.trigger"),
              Path(".github/workflows/one-time-calibrated-elevenlabs-verifier-v2.yml"),
              Path(".github/calibrated-elevenlabs-verifier-v2.trigger"),
          ]:
              path.unlink(missing_ok=True)

          print("CALIBRATED_ELEVENLABS_VERIFIER_V2_WRITTEN")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Rebase onto current main
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "CALIBRATED_VERIFIER_V2_NO_CHANGES"
            exit 0
          fi
          git commit -m "Promote calibrated ElevenLabs production verifier"
          git pull --rebase origin main

      - name: Reverify after rebase
        run: |
          npm run verify
          npm run build

      - name: Push calibrated verifier
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "Promote calibrated ElevenLabs production verifier"; then
            git push origin HEAD:main
          else
            echo "CALIBRATED_VERIFIER_V2_ALREADY_CURRENT"
          fi

      - name: Publish migration status
        if: always()
        uses: actions/github-script@v7
        env:
          MIGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.MIGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".calibrated-elevenlabs-verifier-v2.log")
              ? fs.readFileSync(".calibrated-elevenlabs-verifier-v2.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "calibrated verifier v2 migration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /CALIBRATED_VERIFIER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "calibrated verifier v2 migration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/calibrated-elevenlabs-verifier-v2",
              description: state === "success"
                ? "Full calibrated verifier, tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
