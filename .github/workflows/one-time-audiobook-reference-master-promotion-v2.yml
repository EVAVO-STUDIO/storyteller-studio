name: One-time audiobook reference master promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-reference-master-promotion-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the original promotion with a strict typed-array fixture
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audiobook-reference-master-v2.log
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/one-time-audiobook-reference-master-promotion.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          old = "              changedBytes[changedBytes.length - 1] ^= 0xff;"
          new = (
              "              const lastByteIndex = changedBytes.length - 1;\n"
              "              changedBytes[lastByteIndex] = "
              "changedBytes[lastByteIndex]! ^ 0xff;"
          )
          count = workflow.count(old)
          print(f"AUDIOBOOK_REFERENCE_MASTER_V2_TYPED_ARRAY_FIX:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_REFERENCE_MASTER_V2_TYPED_ARRAY_FIX_INVALID:{count}"
              )
          workflow = workflow.replace(old, new, 1)

          step_marker = (
              "      - name: Add governed reference-master tests, "
              "documentation and contracts\n"
          )
          step_start = workflow.index(step_marker)
          run_marker = "        run: |\n"
          script_start = workflow.index(run_marker, step_start) + len(run_marker)
          script_end = workflow.index(
              "\n      - name: Install dependencies",
              script_start,
          )
          lines = workflow[script_start:script_end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          script_path = Path(".audiobook-reference-master-v2-apply.sh")
          script_path.write_text(script, encoding="utf-8", newline="\n")
          print("AUDIOBOOK_REFERENCE_MASTER_V2_SCRIPT_PREPARED")
          PY

          bash .audiobook-reference-master-v2-apply.sh
          rm -f .audiobook-reference-master-v2-apply.sh
          rm -f \
            .github/workflows/one-time-audiobook-reference-master-promotion-v2.yml \
            .github/audiobook-reference-master-promotion-v2.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-reference-master-v2-verify.log
          npm run build 2>&1 | tee .audiobook-reference-master-v2-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-reference-master-v2-${{ github.sha }}
          path: |
            .audiobook-reference-master-v2.log
            .audiobook-reference-master-promotion.log
            .audiobook-reference-master-v2-verify.log
            .audiobook-reference-master-v2-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-reference-master-v2.log \
            .audiobook-reference-master-promotion.log \
            .audiobook-reference-master-v2-verify.log \
            .audiobook-reference-master-v2-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed audiobook reference masters"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-reference-master-v2.log",
              ".audiobook-reference-master-promotion.log",
              ".audiobook-reference-master-v2-verify.log",
              ".audiobook-reference-master-v2-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_REFERENCE_MASTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook reference master v2 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-reference-master-promotion-v2",
              description: state === "success" ? "Reference-master tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
