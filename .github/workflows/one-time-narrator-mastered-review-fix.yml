name: One-time narrator mastered review correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-narrator-mastered-review-fix.yml"

permissions:
  contents: write

concurrency:
  group: narrator-mastered-review-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply exact narrator mastered review correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/narrator-mastered-review.ts")
          source = path.read_text(encoding="utf-8")
          old = '''  const partial: Omit<NarratorMasteredReviewBinding, "fingerprint"> = {
            ...binding,
            reviewSession: nextSession,
            acknowledgements: Object.freeze([...binding.acknowledgements, acknowledgement]),
            revision: binding.revision + 1,
            previousFingerprint: binding.fingerprint,
            createdAt: binding.createdAt,
            updatedAt: review.decidedAt,
            fingerprint: undefined as never,
          };
          delete (partial as Partial<NarratorMasteredReviewBinding>).fingerprint;
          '''
          new = '''  const {
            fingerprint: _fingerprint,
            previousFingerprint: _previousFingerprint,
            ...base
          } = binding;
          const partial: Omit<NarratorMasteredReviewBinding, "fingerprint"> = {
            ...base,
            reviewSession: nextSession,
            acknowledgements: Object.freeze([...binding.acknowledgements, acknowledgement]),
            revision: binding.revision + 1,
            previousFingerprint: binding.fingerprint,
            createdAt: binding.createdAt,
            updatedAt: review.decidedAt,
          };
          '''
          if old not in source:
              raise SystemExit("expected narrator mastered review block not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate narrator mastered review correction
        shell: bash
        run: |
          npm install --no-audit --no-fund
          node scripts/check-narrator-mastered-review-sequence.mjs
          npm run typecheck
          npm run test:engine

      - name: Remove one-time automation and commit
        shell: bash
        run: |
          rm .github/workflows/one-time-narrator-mastered-review-fix.yml
          git config user.name "EVAVO Studio Automation"
          git config user.email "evavo.studio@gmail.com"
          git add packages/storyteller/src/narrator-mastered-review.ts .github/workflows/one-time-narrator-mastered-review-fix.yml
          git diff --cached --check
          git commit -m "fix: correct narrator mastered review revision update"
          git push origin HEAD:main
