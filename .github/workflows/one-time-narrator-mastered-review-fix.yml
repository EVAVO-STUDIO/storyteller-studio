name: One-time narrator mastered review correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-narrator-mastered-review-fix.yml"

permissions:
  contents: write

concurrency:
  group: narrator-mastered-review-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply exact narrator mastered review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("packages/storyteller/src/narrator-mastered-review.ts")
          source = source_path.read_text(encoding="utf-8")
          function_start = source.index("export function recordNarratorMasteredReview(")
          start_marker = '  const partial: Omit<NarratorMasteredReviewBinding, "fingerprint"> = {\n    ...binding,\n'
          end_marker = '  delete (partial as Partial<NarratorMasteredReviewBinding>).fingerprint;\n'
          start = source.index(start_marker, function_start)
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''  const {
            fingerprint: _fingerprint,
            previousFingerprint: _previousFingerprint,
            ...base
          } = binding;
          const partial: Omit<NarratorMasteredReviewBinding, "fingerprint"> = {
            ...base,
            reviewSession: nextSession,
            acknowledgements: Object.freeze([...binding.acknowledgements, acknowledgement]),
            revision: binding.revision + 1,
            previousFingerprint: binding.fingerprint,
            createdAt: binding.createdAt,
            updatedAt: review.decidedAt,
          };
          '''
          source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          test_path = Path("packages/storyteller/src/narrator-mastered-review.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          old = '/NARRATOR_MASTERED_REVIEW_APPROVAL_FINGERPRINT_INVALID|NARRATOR_BOOK_SEQUENCE_CHAPTER_BINDING_MISMATCH/u,'
          new = '/NARRATOR_MASTERED_REVIEW_APPROVED_ARTIFACT_MISMATCH|NARRATOR_MASTERED_REVIEW_APPROVAL_FINGERPRINT_INVALID|NARRATOR_BOOK_SEQUENCE_CHAPTER_BINDING_MISMATCH/u,'
          if old not in tests:
              raise SystemExit("expected narrator sequence substitution assertion not found")
          test_path.write_text(tests.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate narrator mastered review corrections
        shell: bash
        run: |
          npm install --no-audit --no-fund
          node scripts/check-narrator-mastered-review-sequence.mjs
          npm run typecheck
          npm run test:engine

      - name: Remove one-time automation and commit
        shell: bash
        run: |
          rm .github/workflows/one-time-narrator-mastered-review-fix.yml
          git config user.name "EVAVO Studio Automation"
          git config user.email "evavo.studio@gmail.com"
          git add packages/storyteller/src/narrator-mastered-review.ts packages/storyteller/src/narrator-mastered-review.test.ts .github/workflows/one-time-narrator-mastered-review-fix.yml
          git diff --cached --check
          git commit -m "fix: correct narrator mastered review validation"
          git push origin HEAD:main
