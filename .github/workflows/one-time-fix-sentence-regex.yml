name: One-time sentence regex repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/storyteller-sentence-regex-repair.trigger"

permissions:
  contents: write

concurrency:
  group: storyteller-sentence-regex-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair sentence-ending Unicode regular expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/index.ts")
          source = path.read_text(encoding="utf-8")
          old = r'''/[.!?](?:[”\"']|$)/gu'''
          new = r'''/[.!?](?:[”"']|$)/gu'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"SENTENCE_REGEX_REPAIR_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Commit the repair directly to main
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/index.ts
          git diff --cached --check
          git commit -m "Fix Unicode sentence-ending regex"
          git push origin HEAD:main
