name: One-time worker live clock integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-live-clock.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-live-clock
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use a live clock after heartbeat renewals
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-live-clock.log
          from pathlib import Path

          path = Path("packages/storyteller/src/generation-worker.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              print(f"WORKER_LIVE_CLOCK_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_LIVE_CLOCK_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              '  beforeTerminalTransition?: () => Promise<void>;\n  now?: Date;\n',
              '  beforeTerminalTransition?: () => Promise<void>;\n'
              '  clock?: () => Date;\n'
              '  now?: Date;\n',
              "input-clock",
          )

          replace_once(
              'export async function runClaimedGenerationWorker(\n',
              'function generationWorkerNow(input: ClaimedGenerationWorkerInput): Date {\n'
              '  return input.clock?.() ?? input.now ?? new Date();\n'
              '}\n\n'
              'export async function runClaimedGenerationWorker(\n',
              "clock-helper",
          )

          start = source.index('export async function runClaimedGenerationWorker(')
          end = source.index('\nexport function generationWorkerPublicView(', start)
          if start < 0 or end < 0:
              raise SystemExit("WORKER_LIVE_CLOCK_FUNCTION_BOUNDARY_INVALID")
          body = source[start:end]
          anchor = '  const now = input.now ?? new Date();\n'
          count = body.count(anchor)
          print(f"WORKER_LIVE_CLOCK_ANCHOR:fixed-now:{count}")
          if count != 1:
              raise SystemExit(f"WORKER_LIVE_CLOCK_MATCH_COUNT_INVALID:fixed-now:{count}")
          body = body.replace(anchor, '  const currentTime = () => generationWorkerNow(input);\n', 1)
          shorthand_count = body.count('\n      now,\n') + body.count('\n        now,\n')
          print(f"WORKER_LIVE_CLOCK_ANCHOR:now-shorthand:{shorthand_count}")
          body = body.replace('\n      now,\n', '\n      now: currentTime(),\n')
          body = body.replace('\n        now,\n', '\n        now: currentTime(),\n')
          if ' now,' in body or '\n  now,' in body:
              raise SystemExit("WORKER_LIVE_CLOCK_UNCONVERTED_SHORTHAND")
          source = source[:start] + body + source[end:]
          path.write_text(source, encoding="utf-8", newline="\n")
          print("WORKER_LIVE_CLOCK_PATCHED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify live-clock worker
        run: npm run typecheck && npm run test:engine

      - name: Commit live-clock worker
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-worker.ts
          git diff --cached --check
          git commit -m "Use live worker transition timestamps"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          LIVE_CLOCK_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.LIVE_CLOCK_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-live-clock.log")
              ? fs.readFileSync(".worker-live-clock.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker live clock log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_LIVE_CLOCK_(?:MATCH_COUNT|FUNCTION_BOUNDARY|UNCONVERTED)|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker live clock integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-live-clock",
              description: state === "success"
                ? "Worker transitions use a live post-heartbeat clock"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
