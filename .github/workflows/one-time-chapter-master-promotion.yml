name: One-time chapter master promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/chapter-master-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote chapter master contracts
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .chapter-master-promotion.log
          import json
          from pathlib import Path

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          exports = engine["exports"]
          exports["./chapter-master"] = "./src/chapter-master.ts"
          engine["exports"] = dict(sorted(exports.items()))
          engine_path.write_text(json.dumps(engine, indent=2) + "\n", encoding="utf-8", newline="\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:master"] = "node scripts/check-chapter-master.mjs"
          old = scripts["verify:artifacts"]
          if "npm run verify:master" not in old:
              marker = "npm run verify:render"
              if marker not in old:
                  raise SystemExit("CHAPTER_MASTER_VERIFY_RENDER_MARKER_MISSING")
              scripts["verify:artifacts"] = old.replace(
                  marker,
                  f"{marker} && npm run verify:master",
                  1,
              )
          root_path.write_text(json.dumps(root, indent=2) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-chapter-master-promotion.yml"),
              Path(".github/chapter-master-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("CHAPTER_MASTER_PROMOTED")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build
        run: |
          npm run verify
          npm run build
      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed chapter master"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".chapter-master-promotion.log")
              ? fs.readFileSync(".chapter-master-promotion.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "chapter master promotion log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /CHAPTER_MASTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "chapter master promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/chapter-master-promotion",
              description: state === "success"
                ? "Chapter master, complete tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
