name: One-time publication backup compatibility integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-backup-compatibility.trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-backup-compatibility-20260730
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply deterministic compatibility slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"REPLACE:{path}:{count}:{old[:60]!r}")
              if count != 1:
                  raise SystemExit(f"PATCH_SCOPE_INVALID:{path}:{count}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          compatibility = r'''import { stableHash } from "@evavo/storyteller-engine";
          import {
            AUDIOBOOK_RETAIL_PUBLICATION_ALERT_SCHEMA_VERSION,
          } from "@evavo/storyteller-engine/audiobook-retail-publication-alert";
          import {
            AUDIOBOOK_RETAIL_PUBLICATION_EVIDENCE_INBOX_SCHEMA_VERSION,
            AUDIOBOOK_RETAIL_PUBLICATION_EVIDENCE_REQUEST_SCHEMA_VERSION,
          } from "@evavo/storyteller-engine/audiobook-retail-publication-evidence-inbox";
          import {
            AUDIOBOOK_RETAIL_PUBLICATION_MONITOR_SCHEMA_VERSION,
          } from "@evavo/storyteller-engine/audiobook-retail-publication-monitor";

          export const PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION =
            "storyteller-publication-operations-durable-schema-v1" as const;

          export const PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT = stableHash({
            contractVersion: PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION,
            storeEnvelopeSchema: "storyteller-store-v1",
            auditSchema: "storyteller-audit-v1",
            monitorSchema: AUDIOBOOK_RETAIL_PUBLICATION_MONITOR_SCHEMA_VERSION,
            alertSchema: AUDIOBOOK_RETAIL_PUBLICATION_ALERT_SCHEMA_VERSION,
            evidenceRequestSchema:
              AUDIOBOOK_RETAIL_PUBLICATION_EVIDENCE_REQUEST_SCHEMA_VERSION,
            evidenceInboxSchema:
              AUDIOBOOK_RETAIL_PUBLICATION_EVIDENCE_INBOX_SCHEMA_VERSION,
            entityTypes: Object.freeze([
              "audiobook-retail-publication-monitor",
              "audiobook-retail-publication-alert",
              "audiobook-retail-publication-evidence-inbox",
            ]),
          });

          export interface PublicationOperationsBackupCompatibilityIdentity {
            applicationRevision: string;
            durableSchemaContractVersion:
              typeof PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION;
            durableSchemaFingerprint: string;
            fingerprint: string;
          }

          export interface PublicationOperationsRestoreCompatibilityApproval {
            approvedByActorId: string;
            evidenceReferenceHash: string;
            approvedAt: Date;
          }

          export interface PublicationOperationsRestoreCompatibilityResult {
            mode: "exact-revision" | "approved-compatible-revision";
            compatibilityApprovalFingerprint?: string;
          }

          export class PublicationOperationsBackupCompatibilityError extends Error {
            readonly code: string;

            constructor(code: string) {
              super(code);
              this.name = "PublicationOperationsBackupCompatibilityError";
              this.code = code;
            }
          }

          const APPLICATION_REVISION_PATTERN = /^[a-f0-9]{40}$/u;
          const HASH_PATTERN = /^[a-f0-9]{64}$/u;
          const SAFE_IDENTIFIER = /^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$/u;

          function requireApplicationRevision(value: string): string {
            if (!APPLICATION_REVISION_PATTERN.test(value)) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_BACKUP_APPLICATION_REVISION_INVALID",
              );
            }
            return value;
          }

          function identityFingerprint(
            value: Omit<PublicationOperationsBackupCompatibilityIdentity, "fingerprint">,
          ): string {
            return stableHash(value);
          }

          export function createPublicationOperationsBackupCompatibilityIdentity(
            applicationRevision: string,
          ): PublicationOperationsBackupCompatibilityIdentity {
            const partial: Omit<
              PublicationOperationsBackupCompatibilityIdentity,
              "fingerprint"
            > = {
              applicationRevision: requireApplicationRevision(applicationRevision),
              durableSchemaContractVersion:
                PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION,
              durableSchemaFingerprint:
                PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT,
            };
            return Object.freeze({
              ...partial,
              fingerprint: identityFingerprint(partial),
            });
          }

          export function assertPublicationOperationsBackupCompatibilityIdentity(
            identity: PublicationOperationsBackupCompatibilityIdentity,
          ): void {
            requireApplicationRevision(identity.applicationRevision);
            if (
              identity.durableSchemaContractVersion
                !== PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION
              || identity.durableSchemaFingerprint
                !== PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT
            ) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_RESTORE_DURABLE_SCHEMA_INCOMPATIBLE",
              );
            }
            if (!HASH_PATTERN.test(identity.fingerprint)) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_BACKUP_COMPATIBILITY_FINGERPRINT_INVALID",
              );
            }
            const { fingerprint, ...partial } = identity;
            if (identityFingerprint(partial) !== fingerprint) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_BACKUP_COMPATIBILITY_FINGERPRINT_MISMATCH",
              );
            }
          }

          export function resolvePublicationOperationsRestoreCompatibility(
            input: Readonly<{
              snapshot: PublicationOperationsBackupCompatibilityIdentity;
              applicationRevision: string;
              approval?: PublicationOperationsRestoreCompatibilityApproval;
            }>,
          ): PublicationOperationsRestoreCompatibilityResult {
            assertPublicationOperationsBackupCompatibilityIdentity(input.snapshot);
            const applicationRevision = requireApplicationRevision(
              input.applicationRevision,
            );
            if (input.snapshot.applicationRevision === applicationRevision) {
              return Object.freeze({ mode: "exact-revision" });
            }
            if (!input.approval) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_RESTORE_APPLICATION_REVISION_MISMATCH",
              );
            }
            if (!SAFE_IDENTIFIER.test(input.approval.approvedByActorId)) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_RESTORE_COMPATIBILITY_APPROVER_INVALID",
              );
            }
            if (!HASH_PATTERN.test(input.approval.evidenceReferenceHash)) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_RESTORE_COMPATIBILITY_EVIDENCE_INVALID",
              );
            }
            if (Number.isNaN(input.approval.approvedAt.getTime())) {
              throw new PublicationOperationsBackupCompatibilityError(
                "PUBLICATION_OPERATIONS_RESTORE_COMPATIBILITY_DATE_INVALID",
              );
            }
            return Object.freeze({
              mode: "approved-compatible-revision",
              compatibilityApprovalFingerprint: stableHash({
                snapshotApplicationRevision: input.snapshot.applicationRevision,
                targetApplicationRevision: applicationRevision,
                durableSchemaFingerprint: input.snapshot.durableSchemaFingerprint,
                approvedByActorId: input.approval.approvedByActorId,
                evidenceReferenceHash: input.approval.evidenceReferenceHash,
                approvedAt: input.approval.approvedAt.toISOString(),
              }),
            });
          }
          '''
          Path("packages/cli/src/publication-operations-backup-compatibility.ts").write_text(
              compatibility.replace("          ", ""), encoding="utf-8", newline="\n"
          )

          compatibility_test = r'''import assert from "node:assert/strict";
          import test from "node:test";
          import {
            PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT,
            createPublicationOperationsBackupCompatibilityIdentity,
            resolvePublicationOperationsRestoreCompatibility,
          } from "./publication-operations-backup-compatibility.js";

          const revisionA = "1".repeat(40);
          const revisionB = "2".repeat(40);
          const approvedAt = new Date("2026-07-30T02:00:00.000Z");

          test("backup compatibility identity binds one exact application and durable schema", () => {
            const identity = createPublicationOperationsBackupCompatibilityIdentity(revisionA);
            assert.equal(identity.applicationRevision, revisionA);
            assert.equal(
              identity.durableSchemaFingerprint,
              PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT,
            );
            assert.match(identity.fingerprint, /^[a-f0-9]{64}$/u);
            assert.throws(
              () => createPublicationOperationsBackupCompatibilityIdentity("main"),
              /PUBLICATION_OPERATIONS_BACKUP_APPLICATION_REVISION_INVALID/u,
            );
          });

          test("restore compatibility accepts the exact creating application revision", () => {
            const result = resolvePublicationOperationsRestoreCompatibility({
              snapshot: createPublicationOperationsBackupCompatibilityIdentity(revisionA),
              applicationRevision: revisionA,
            });
            assert.deepEqual(result, { mode: "exact-revision" });
          });

          test("cross-revision restore requires a bound human compatibility approval", () => {
            const snapshot = createPublicationOperationsBackupCompatibilityIdentity(revisionA);
            assert.throws(
              () => resolvePublicationOperationsRestoreCompatibility({
                snapshot,
                applicationRevision: revisionB,
              }),
              /PUBLICATION_OPERATIONS_RESTORE_APPLICATION_REVISION_MISMATCH/u,
            );
            const result = resolvePublicationOperationsRestoreCompatibility({
              snapshot,
              applicationRevision: revisionB,
              approval: {
                approvedByActorId: "publication_compatibility_reviewer_001",
                evidenceReferenceHash: "a".repeat(64),
                approvedAt,
              },
            });
            assert.equal(result.mode, "approved-compatible-revision");
            assert.match(
              result.compatibilityApprovalFingerprint ?? "",
              /^[a-f0-9]{64}$/u,
            );
            const serialised = JSON.stringify(result);
            assert.equal(serialised.includes("publication_compatibility_reviewer_001"), false);
            assert.equal(serialised.includes(revisionA), false);
            assert.equal(serialised.includes(revisionB), false);
          });

          test("durable schema drift cannot be bypassed by a compatibility approval", () => {
            const snapshot = {
              ...createPublicationOperationsBackupCompatibilityIdentity(revisionA),
              durableSchemaFingerprint: "f".repeat(64),
            };
            assert.throws(
              () => resolvePublicationOperationsRestoreCompatibility({
                snapshot,
                applicationRevision: revisionB,
                approval: {
                  approvedByActorId: "publication_compatibility_reviewer_001",
                  evidenceReferenceHash: "a".repeat(64),
                  approvedAt,
                },
              }),
              /PUBLICATION_OPERATIONS_RESTORE_DURABLE_SCHEMA_INCOMPATIBLE/u,
            );
          });
          '''
          Path("packages/cli/src/publication-operations-backup-compatibility.test.ts").write_text(
              compatibility_test.replace("          ", ""), encoding="utf-8", newline="\n"
          )

          backup = Path("packages/cli/src/publication-operations-backup.ts")
          source = backup.read_text(encoding="utf-8")
          source = source.replace(
              'import { stableHash } from "@evavo/storyteller-engine";\n',
              'import { stableHash } from "@evavo/storyteller-engine";\nimport {\n  assertPublicationOperationsBackupCompatibilityIdentity,\n  createPublicationOperationsBackupCompatibilityIdentity,\n  resolvePublicationOperationsRestoreCompatibility,\n  type PublicationOperationsBackupCompatibilityIdentity,\n  type PublicationOperationsRestoreCompatibilityApproval,\n} from "./publication-operations-backup-compatibility.js";\n',
              1,
          )
          source = source.replace(
              '"storyteller-publication-operations-backup-v1" as const;',
              '"storyteller-publication-operations-backup-v2" as const;',
              1,
          )
          source = source.replace(
              '  createdByActorId: string;\n  sourceFingerprint: string;',
              '  createdByActorId: string;\n  compatibility: PublicationOperationsBackupCompatibilityIdentity;\n  sourceFingerprint: string;',
              1,
          )
          source = source.replace(
              '  fingerprint: string;\n}\n\nexport interface PublicationOperationsBackupVerificationResult',
              '  fingerprint: string;\n  compatibilityBound: true;\n}\n\nexport interface PublicationOperationsBackupVerificationResult',
              1,
          )
          source = source.replace(
              '  fingerprint: string;\n}\n\nexport interface PublicationOperationsRestoreResult',
              '  fingerprint: string;\n  compatibilityBound: true;\n}\n\nexport interface PublicationOperationsRestoreResult',
              1,
          )
          source = source.replace(
              '  fingerprint: string;\n}\n\nexport interface CreatePublicationOperationsBackupInput',
              '  fingerprint: string;\n  applicationCompatibility: "exact-revision" | "approved-compatible-revision";\n  compatibilityApprovalFingerprint?: string;\n}\n\nexport interface CreatePublicationOperationsBackupInput',
              1,
          )
          source = source.replace(
              '  offlineConfirmed: true;\n  createdAt?: Date;',
              '  offlineConfirmed: true;\n  applicationRevision: string;\n  createdAt?: Date;',
              1,
          )
          source = source.replace(
              '  offlineConfirmed: true;\n  restoredAt?: Date;',
              '  offlineConfirmed: true;\n  applicationRevision: string;\n  compatibilityApproval?: PublicationOperationsRestoreCompatibilityApproval;\n  restoredAt?: Date;',
              1,
          )
          source = source.replace(
              '  actorId: string;\n}): PublicationOperationsBackupManifest {',
              '  actorId: string;\n  compatibility: PublicationOperationsBackupCompatibilityIdentity;\n}): PublicationOperationsBackupManifest {',
              1,
          )
          source = source.replace(
              '    actorId: input.actorId,\n  }).slice(0, 24)}`;',
              '    actorId: input.actorId,\n    compatibilityFingerprint: input.compatibility.fingerprint,\n  }).slice(0, 24)}`;',
              1,
          )
          source = source.replace(
              '    createdByActorId: input.actorId,\n    sourceFingerprint,',
              '    createdByActorId: input.actorId,\n    compatibility: input.compatibility,\n    sourceFingerprint,',
              1,
          )
          source = source.replace(
              '  requireHash(\n    manifest.sourceFingerprint,',
              '  assertPublicationOperationsBackupCompatibilityIdentity(\n    manifest.compatibility,\n  );\n  requireHash(\n    manifest.sourceFingerprint,',
              1,
          )
          source = source.replace(
              '      fingerprint: manifest.fingerprint,\n    }),',
              '      fingerprint: manifest.fingerprint,\n      compatibilityBound: true,\n    }),',
              1,
          )
          source = source.replace(
              '  const sourceRoot = resolve(input.dataDirectory, "publication-operations");',
              '  const compatibility =\n    createPublicationOperationsBackupCompatibilityIdentity(\n      input.applicationRevision,\n    );\n\n  const sourceRoot = resolve(input.dataDirectory, "publication-operations");',
              1,
          )
          source = source.replace(
              '    actorId,\n  });',
              '    actorId,\n    compatibility,\n  });',
              1,
          )
          source = source.replace(
              '      fingerprint: manifest.fingerprint,\n    });',
              '      fingerprint: manifest.fingerprint,\n      compatibilityBound: true,\n    });',
              1,
          )
          source = source.replace(
              '    fingerprint: manifest.fingerprint,\n  });\n}\n\nasync function targetState',
              '    fingerprint: manifest.fingerprint,\n    compatibilityBound: true,\n  });\n}\n\nasync function targetState',
              1,
          )
          source = source.replace(
              '  const verified = await verifySnapshotInternal(snapshotRoot);\n  const state = await targetState(targetRoot);',
              '  const verified = await verifySnapshotInternal(snapshotRoot);\n  const compatibility = resolvePublicationOperationsRestoreCompatibility({\n    snapshot: verified.manifest.compatibility,\n    applicationRevision: input.applicationRevision,\n    ...(input.compatibilityApproval\n      ? { approval: input.compatibilityApproval }\n      : {}),\n  });\n  const state = await targetState(targetRoot);',
              1,
          )
          source = source.replace(
              '    fingerprint: verified.manifest.fingerprint,\n  });\n}',
              '    fingerprint: verified.manifest.fingerprint,\n    applicationCompatibility: compatibility.mode,\n    ...(compatibility.compatibilityApprovalFingerprint\n      ? {\n          compatibilityApprovalFingerprint:\n            compatibility.compatibilityApprovalFingerprint,\n        }\n      : {}),\n  });\n}',
              1,
          )
          backup.write_text(source, encoding="utf-8", newline="\n")

          main = Path("packages/cli/src/publication-operations-backup-main.ts")
          source = main.read_text(encoding="utf-8")
          helper_anchor = '''function booleanFlag(args: ParsedArguments, key: string): boolean {
            const value = args.flags[key];
            if (value === true) return true;
            if (typeof value === "string") {
              return value.trim().toLocaleLowerCase("en-AU") === "true";
            }
            return false;
          }
          '''.replace("          ", "")
          helper_new = helper_anchor + '''
          function applicationRevision(
            args: ParsedArguments,
            environment: Readonly<Record<string, string | undefined>>,
          ): string {
            const value = stringFlag(args, "application-revision")
              ?? environment.STORYTELLER_APPLICATION_REVISION?.trim();
            if (!value) {
              throw new Error(
                "PUBLICATION_OPERATIONS_BACKUP_CLI_FLAG_REQUIRED:application-revision",
              );
            }
            return value;
          }

          function compatibilityApproval(
            args: ParsedArguments,
            environment: Readonly<Record<string, string | undefined>>,
          ): Readonly<{
            approvedByActorId: string;
            evidenceReferenceHash: string;
            approvedAt: Date;
          }> | undefined {
            const approvedByActorId = stringFlag(args, "compatibility-approved-by")
              ?? environment.STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_BY?.trim();
            const evidenceReferenceHash = stringFlag(
              args,
              "compatibility-evidence-hash",
            ) ?? environment.STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_EVIDENCE_HASH?.trim();
            const approvedAtValue = stringFlag(args, "compatibility-approved-at")
              ?? environment.STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_AT?.trim();
            const supplied = [approvedByActorId, evidenceReferenceHash, approvedAtValue]
              .filter(Boolean).length;
            if (supplied === 0) return undefined;
            if (supplied !== 3) {
              throw new Error(
                "PUBLICATION_OPERATIONS_BACKUP_CLI_COMPATIBILITY_APPROVAL_INCOMPLETE",
              );
            }
            const approvedAt = new Date(approvedAtValue!);
            if (Number.isNaN(approvedAt.getTime())) {
              throw new Error(
                "PUBLICATION_OPERATIONS_BACKUP_CLI_DATE_INVALID:compatibility-approved-at",
              );
            }
            return Object.freeze({
              approvedByActorId: approvedByActorId!,
              evidenceReferenceHash: evidenceReferenceHash!,
              approvedAt,
            });
          }
          '''.replace("          ", "")
          if source.count(helper_anchor) != 1:
              raise SystemExit("BACKUP_MAIN_HELPER_SCOPE_INVALID")
          source = source.replace(helper_anchor, helper_new, 1)
          source = source.replace(
              '--actor-id operator_greg --offline-confirmed --output backup.json',
              '--actor-id operator_greg --application-revision <40-char-sha> --offline-confirmed --output backup.json',
              1,
          )
          source = source.replace(
              '--actor-id operator_greg --offline-confirmed --output restore.json',
              '--actor-id operator_greg --application-revision <40-char-sha> --offline-confirmed --output restore.json',
              1,
          )
          source = source.replace(
              '      offlineConfirmed: booleanFlag(args, "offline-confirmed") as true,\n      ...(createdAt ? { createdAt } : {}),',
              '      offlineConfirmed: booleanFlag(args, "offline-confirmed") as true,\n      applicationRevision: applicationRevision(args, environment),\n      ...(createdAt ? { createdAt } : {}),',
              1,
          )
          source = source.replace(
              '    const restoredAt = dateFlag(args, "restored-at");\n    const result = await restorePublicationOperationsBackup({',
              '    const restoredAt = dateFlag(args, "restored-at");\n    const approval = compatibilityApproval(args, environment);\n    const result = await restorePublicationOperationsBackup({',
              1,
          )
          source = source.replace(
              '      offlineConfirmed: booleanFlag(args, "offline-confirmed") as true,\n      ...(restoredAt ? { restoredAt } : {}),',
              '      offlineConfirmed: booleanFlag(args, "offline-confirmed") as true,\n      applicationRevision: applicationRevision(args, environment),\n      ...(approval ? { compatibilityApproval: approval } : {}),\n      ...(restoredAt ? { restoredAt } : {}),',
              1,
          )
          main.write_text(source, encoding="utf-8", newline="\n")

          tests = Path("packages/cli/src/publication-operations-backup.test.ts")
          source = tests.read_text(encoding="utf-8")
          source = source.replace(
              'const restoredAt = new Date("2026-07-30T01:00:00.000Z");',
              'const restoredAt = new Date("2026-07-30T01:00:00.000Z");\nconst applicationRevision = "1".repeat(40);\nconst compatibleApplicationRevision = "2".repeat(40);',
              1,
          )
          source = re.sub(
              r'(?m)^(\s*)offlineConfirmed: (true|false as true),$',
              r'\1offlineConfirmed: \2,\n\1applicationRevision,',
              source,
          )
          source = source.replace(
              '    assert.equal(first.totalBytes > 0, true);',
              '    assert.equal(first.totalBytes > 0, true);\n    assert.equal(first.compatibilityBound, true);',
              1,
          )
          source = source.replace(
              '    assert.equal(verified.totalBytes, first.totalBytes);',
              '    assert.equal(verified.totalBytes, first.totalBytes);\n    assert.equal(verified.compatibilityBound, true);',
              1,
          )
          source = source.replace(
              '    assert.equal(manifest.createdByActorId, "publication_backup_operator_001");',
              '    assert.equal(manifest.createdByActorId, "publication_backup_operator_001");\n    assert.equal(manifest.compatibility.applicationRevision, applicationRevision);',
              1,
          )
          source = source.replace(
              '    assert.equal(restored.fingerprint, backup.fingerprint);',
              '    assert.equal(restored.fingerprint, backup.fingerprint);\n    assert.equal(restored.applicationCompatibility, "exact-revision");',
              1,
          )
          source = source.replace(
              '{\n          environment: {},\n          stdout: { write: (value) => stdout.push(String(value)) },\n        },',
              '{\n          environment: { STORYTELLER_APPLICATION_REVISION: applicationRevision },\n          stdout: { write: (value) => stdout.push(String(value)) },\n        },',
              1,
          )
          source = source.replace(
              '{ environment: {}, stdout: { write: () => true } },',
              '{ environment: { STORYTELLER_APPLICATION_REVISION: applicationRevision }, stdout: { write: () => true } },',
          )
          insertion = r'''

          test("restore fails closed across revisions without approval and records a redacted governed override", async () => {
            await withDirectories(async ({ root, data, backups }) => {
              await createPublicationState(data);
              const backup = await createPublicationOperationsBackup({
                dataDirectory: data,
                backupDirectory: backups,
                actorId: "publication_backup_operator_compatibility_001",
                offlineConfirmed: true,
                applicationRevision,
                createdAt,
              });
              const snapshot = join(backups, backup.snapshotId);
              const restoredData = join(root, "compatible-restored-data");
              await assert.rejects(
                restorePublicationOperationsBackup({
                  snapshotDirectory: snapshot,
                  dataDirectory: restoredData,
                  actorId: "publication_restore_operator_compatibility_001",
                  offlineConfirmed: true,
                  applicationRevision: compatibleApplicationRevision,
                  restoredAt,
                }),
                /PUBLICATION_OPERATIONS_RESTORE_APPLICATION_REVISION_MISMATCH/u,
              );
              const restored = await restorePublicationOperationsBackup({
                snapshotDirectory: snapshot,
                dataDirectory: restoredData,
                actorId: "publication_restore_operator_compatibility_001",
                offlineConfirmed: true,
                applicationRevision: compatibleApplicationRevision,
                compatibilityApproval: {
                  approvedByActorId: "publication_compatibility_reviewer_001",
                  evidenceReferenceHash: "d".repeat(64),
                  approvedAt: new Date("2026-07-30T00:30:00.000Z"),
                },
                restoredAt,
              });
              assert.equal(
                restored.applicationCompatibility,
                "approved-compatible-revision",
              );
              assert.match(
                restored.compatibilityApprovalFingerprint ?? "",
                /^[a-f0-9]{64}$/u,
              );
              const serialised = JSON.stringify(restored);
              for (const forbidden of [
                applicationRevision,
                compatibleApplicationRevision,
                "publication_compatibility_reviewer_001",
                "d".repeat(64),
              ]) {
                assert.equal(serialised.includes(forbidden), false);
              }
            });
          });
          '''.replace("          ", "")
          marker = '\ntest("backup and restore require explicit offline confirmation and reject nested paths"'
          if source.count(marker) != 1:
              raise SystemExit("BACKUP_TEST_INSERT_SCOPE_INVALID")
          source = source.replace(marker, insertion + marker, 1)
          source = source.replace(
              '        "sourceFingerprint",',
              '        "sourceFingerprint",\n        applicationRevision,\n        "applicationRevision",\n        "durableSchemaFingerprint",',
              1,
          )
          tests.write_text(source, encoding="utf-8", newline="\n")

          env = Path(".env.publication-operations.example")
          source = env.read_text(encoding="utf-8")
          anchor = 'STORYTELLER_PUBLICATION_BACKUP_SNAPSHOT_ID=publication_backup_replace_with_verified_snapshot_id\n'
          addition = anchor + '''
          # Exact 40-character lowercase Git commit SHA for the image/code performing backup or restore.
          STORYTELLER_APPLICATION_REVISION=replace-with-40-character-git-commit-sha

          # Populate all three only for a reviewed cross-revision restore with unchanged durable schema.
          STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_BY=
          STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_EVIDENCE_HASH=
          STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_AT=
          '''.replace("          ", "")
          if source.count(anchor) != 1:
              raise SystemExit("BACKUP_ENV_SCOPE_INVALID")
          env.write_text(source.replace(anchor, addition, 1), encoding="utf-8", newline="\n")

          docs = Path("docs/PUBLICATION_OPERATIONS_BACKUP.md")
          source = docs.read_text(encoding="utf-8")
          source = source.replace(
              '  --actor-id operator_greg \\\n  --offline-confirmed',
              '  --actor-id operator_greg \\\n  --application-revision "$STORYTELLER_APPLICATION_REVISION" \\\n  --offline-confirmed',
              1,
          )
          source = source.replace(
              '  --actor-id operator_greg \\\n  --offline-confirmed',
              '  --actor-id operator_greg \\\n  --application-revision "$STORYTELLER_APPLICATION_REVISION" \\\n  --offline-confirmed',
              1,
          )
          source = source.replace(
              '- private operator identifier;\n- source fingerprint;',
              '- private operator identifier;\n- exact creating application revision;\n- durable publication-schema contract version and fingerprint;\n- source fingerprint;',
              1,
          )
          compatibility_section = r'''

          ## Application and durable-schema compatibility

          Every new snapshot is bound to the exact 40-character lowercase Git commit SHA supplied through `--application-revision` or `STORYTELLER_APPLICATION_REVISION`.

          The manifest also records a deterministic durable-schema fingerprint covering the file-store envelope, audit format, publication monitor, evidence request, evidence inbox and alert schemas plus their entity types. The snapshot identifier and manifest fingerprint include this compatibility identity.

          Restore is fail closed:

          - the durable-schema fingerprint must match the running code exactly;
          - the creating and restoring application revisions must match by default;
          - durable-schema mismatch cannot be overridden;
          - a different application revision with the same durable schema requires all of `--compatibility-approved-by`, `--compatibility-evidence-hash` and `--compatibility-approved-at`, or the equivalent private environment values.

          The approval is bound to the snapshot revision, target revision, durable-schema fingerprint, reviewer, evidence reference and approval time. The restore result exposes only `approved-compatible-revision` and a one-way approval fingerprint. It does not expose commit SHAs, reviewer identities or evidence hashes.

          A compatibility approval is not a schema migration. When the durable-schema contract changes, implement and independently verify an explicit migration before restore support is extended.
          '''.replace("          ", "")
          marker = '\n## Redacted output\n'
          if source.count(marker) != 1:
              raise SystemExit("BACKUP_DOC_SCOPE_INVALID")
          source = source.replace(marker, compatibility_section + marker, 1)
          source = source.replace(
              'It does not stop running services, prevent a writer from restarting, encrypt backups, transfer them off host, automate retention, verify external provider connectivity, create human evidence, guarantee perpetual publication availability or make file-backed persistence multi-host safe.',
              'It does not stop running services, prevent a writer from restarting, encrypt backups, transfer them off host, automate retention, verify external provider connectivity, create human evidence, guarantee perpetual publication availability, perform schema migrations or make file-backed persistence multi-host safe.',
              1,
          )
          docs.write_text(source, encoding="utf-8", newline="\n")

          maintenance = Path("docs/PUBLICATION_OPERATIONS_MAINTENANCE_PROFILE.md")
          source = maintenance.read_text(encoding="utf-8")
          marker = 'The actor identifier is stored privately in the backup manifest. The snapshot identifier is used only by verification and restore.\n'
          addition = marker + '\n`STORYTELLER_APPLICATION_REVISION` must be the exact lowercase 40-character Git commit SHA used to build the maintenance image. Backup binds it into the private manifest. Restore requires the same revision unless a separately reviewed same-schema compatibility approval is supplied through the private compatibility environment fields.\n'
          if source.count(marker) != 1:
              raise SystemExit("MAINTENANCE_DOC_SCOPE_INVALID")
          maintenance.write_text(source.replace(marker, addition, 1), encoding="utf-8", newline="\n")

          checker = Path("scripts/check-publication-operations-backup.mjs")
          source = checker.read_text(encoding="utf-8")
          source = source.replace(
              '  "packages/cli/src/publication-operations-backup.ts",',
              '  "packages/cli/src/publication-operations-backup.ts",\n  "packages/cli/src/publication-operations-backup-compatibility.ts",\n  "packages/cli/src/publication-operations-backup-compatibility.test.ts",',
              1,
          )
          source = source.replace(
              '  "docs/PUBLICATION_OPERATIONS_BACKUP.md",',
              '  "docs/PUBLICATION_OPERATIONS_BACKUP.md",\n  ".env.publication-operations.example",',
              1,
          )
          source = source.replace(
              '  "PUBLICATION_OPERATIONS_BACKUP_SCHEMA_VERSION",',
              '  "PUBLICATION_OPERATIONS_BACKUP_SCHEMA_VERSION",\n  "storyteller-publication-operations-backup-v2",\n  "compatibilityBound: true",\n  "resolvePublicationOperationsRestoreCompatibility",\n  "PUBLICATION_OPERATIONS_RESTORE_APPLICATION_REVISION_MISMATCH",',
              1,
          )
          source = source.replace(
              'requireTokens("packages/cli/src/publication-operations-backup-main.ts", [',
              '''requireTokens("packages/cli/src/publication-operations-backup-compatibility.ts", [
            "PUBLICATION_OPERATIONS_DURABLE_SCHEMA_CONTRACT_VERSION",
            "PUBLICATION_OPERATIONS_DURABLE_SCHEMA_FINGERPRINT",
            "createPublicationOperationsBackupCompatibilityIdentity",
            "resolvePublicationOperationsRestoreCompatibility",
            "PUBLICATION_OPERATIONS_RESTORE_DURABLE_SCHEMA_INCOMPATIBLE",
            "PUBLICATION_OPERATIONS_RESTORE_APPLICATION_REVISION_MISMATCH",
            "compatibilityApprovalFingerprint",
          ]);

          requireTokens("packages/cli/src/publication-operations-backup-main.ts", ['''.replace("          ", ""),
              1,
          )
          source = source.replace(
              '  \'booleanFlag(args, "offline-confirmed")\',',
              '  \'booleanFlag(args, "offline-confirmed")\',\n  \'applicationRevision(args, environment)\',\n  \'compatibilityApproval(args, environment)\',',
              1,
          )
          source = source.replace(
              '  "standalone CLI emits redacted backup, verify and restore results",',
              '  "standalone CLI emits redacted backup, verify and restore results",\n  "restore fails closed across revisions without approval and records a redacted governed override",',
              1,
          )
          source = source.replace(
              '  "Rollback boundary",',
              '  "Rollback boundary",\n  "Application and durable-schema compatibility",\n  "durable-schema mismatch cannot be overridden",',
              1,
          )
          source = source.replace(
              'requireTokens(".gitignore", [',
              '''requireTokens(".env.publication-operations.example", [
            "STORYTELLER_APPLICATION_REVISION",
            "STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_BY",
            "STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_EVIDENCE_HASH",
            "STORYTELLER_PUBLICATION_RESTORE_COMPATIBILITY_APPROVED_AT",
          ]);

          requireTokens(".gitignore", ['''.replace("          ", ""),
              1,
          )
          source = source.replace(
              'console.log("- restore only targets absent or empty publication state and verifies final bytes");',
              'console.log("- restore only targets absent or empty publication state and verifies final bytes");\nconsole.log("- snapshots bind the creating application revision and durable publication schema");\nconsole.log("- cross-revision restore requires redacted approval evidence and cannot bypass schema drift");',
              1,
          )
          checker.write_text(source, encoding="utf-8", newline="\n")
          PY

      - name: Install exact workspace graph
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Validate compatibility slice
        run: |
          npm run verify:publication-operations-backup
          npm run typecheck
          node --import tsx --test packages/cli/src/publication-operations-backup-compatibility.test.ts packages/cli/src/publication-operations-backup.test.ts

      - name: Commit verified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/cli/src/publication-operations-backup-compatibility.ts \
            packages/cli/src/publication-operations-backup-compatibility.test.ts \
            packages/cli/src/publication-operations-backup.ts \
            packages/cli/src/publication-operations-backup-main.ts \
            packages/cli/src/publication-operations-backup.test.ts \
            scripts/check-publication-operations-backup.mjs \
            docs/PUBLICATION_OPERATIONS_BACKUP.md \
            docs/PUBLICATION_OPERATIONS_MAINTENANCE_PROFILE.md \
            .env.publication-operations.example
          git diff --cached --check
          git commit -m "Bind publication backups to application compatibility"
          git push origin HEAD:work/publication-backup-compatibility-20260730

      - name: Remove temporary integration from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-backup-compatibility.yml \
            .github/publication-backup-compatibility.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Remove publication backup compatibility integration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
