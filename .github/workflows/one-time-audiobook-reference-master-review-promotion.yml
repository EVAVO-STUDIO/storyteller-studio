name: One-time audiobook reference-master review promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-reference-master-review.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Squash the isolated whole-book review slice
        shell: bash
        run: |
          set -o pipefail
          git fetch origin work/audiobook-reference-master-review-20260728
          git merge --squash --no-commit origin/work/audiobook-reference-master-review-20260728

          python3 - <<'PY' 2>&1 | tee .audiobook-reference-master-review-promotion.log
          from pathlib import Path

          allowed = {
              "docs/AUDIOBOOK_REFERENCE_MASTER_REVIEW.md",
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/audiobook-reference-master-review.test.ts",
              "packages/storyteller/src/audiobook-reference-master-review.ts",
              "scripts/check-audiobook-reference-master-review.mjs",
          }

          import subprocess
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print("AUDIOBOOK_REFERENCE_REVIEW_SQUASH_FILES:" + ",".join(sorted(changed)))
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_UNEXPECTED_FILES:"
                  + ",".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_MISSING_FILES:"
                  + ",".join(sorted(missing))
              )

          project_store_path = Path("packages/storyteller/src/project-store.ts")
          project_store = project_store_path.read_text(encoding="utf-8")
          old = '  | "audiobook-sequence"\n  | "chapter-assembly"'
          new = (
              '  | "audiobook-sequence"\n'
              '  | "audiobook-reference-master-review"\n'
              '  | "chapter-assembly"'
          )
          count = project_store.count(old)
          print(f"AUDIOBOOK_REFERENCE_REVIEW_ENTITY_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_REFERENCE_REVIEW_ENTITY_ANCHOR_INVALID:{count}"
              )
          project_store_path.write_text(
              project_store.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-reference-master-review-promotion.yml"
              ),
              Path(".github/audiobook-reference-master-review.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_REFERENCE_MASTER_REVIEW_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-reference-master-review-verify.log
          npm run build 2>&1 | tee .audiobook-reference-master-review-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-reference-master-review-${{ github.sha }}
          path: |
            .audiobook-reference-master-review-promotion.log
            .audiobook-reference-master-review-verify.log
            .audiobook-reference-master-review-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-reference-master-review-promotion.log \
            .audiobook-reference-master-review-verify.log \
            .audiobook-reference-master-review-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed whole-book reference review"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-reference-master-review-promotion.log",
              ".audiobook-reference-master-review-verify.log",
              ".audiobook-reference-master-review-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_REFERENCE_REVIEW_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "whole-book reference review promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-reference-master-review",
              description: state === "success" ? "Whole-book review tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
