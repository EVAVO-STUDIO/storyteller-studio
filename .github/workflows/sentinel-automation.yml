name: "SENTINEL Read-Only Repository Audit"

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit depth"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - focused
  push:
    branches:
      - main
      - develop
    paths:
      - "packages/**"
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: storyteller-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare audit report directory
        run: mkdir -p .verification/sentinel

      - name: Audit architecture foundation
        shell: bash
        run: |
          set -o pipefail
          npm run verify:foundation 2>&1 | tee .verification/sentinel/foundation.log

      - name: Audit private application boundary
        shell: bash
        run: |
          set -o pipefail
          npm run verify:private-boundary 2>&1 | tee .verification/sentinel/private-boundary.log

      - name: Audit narrator training admission, production, monitoring, mastering and review-sequence boundaries
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-narrator-profile-admission.mjs 2>&1 | tee .verification/sentinel/narrator-profile-admission.log
          node scripts/check-narrator-production-binding.mjs 2>&1 | tee .verification/sentinel/narrator-production.log
          node scripts/check-narrator-book-monitoring.mjs 2>&1 | tee .verification/sentinel/narrator-monitoring.log
          node scripts/check-narrator-mastering-chain.mjs 2>&1 | tee .verification/sentinel/narrator-mastering.log
          node scripts/check-narrator-mastered-review-sequence.mjs 2>&1 | tee .verification/sentinel/narrator-mastered-review-sequence.log

      - name: Audit TypeScript contracts
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .verification/sentinel/typecheck.log

      - name: Audit governed artifact lifecycle
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full'
        shell: bash
        run: |
          set -o pipefail
          npm run verify:artifacts 2>&1 | tee .verification/sentinel/artifacts.log

      - name: Record legacy Sentinel availability without executing mutators
        shell: bash
        run: |
          {
            echo "sentinel_mode=read-only"
            echo "legacy_orchestrator_present=$([[ -f .sentinel/sentinel-orchestrator.js ]] && echo true || echo false)"
            echo "legacy_enhanced_present=$([[ -f .sentinel/ENHANCED_SENTINEL_V6.js ]] && echo true || echo false)"
            echo "legacy_mutation_executed=false"
            echo "force_push_allowed=false"
          } | tee .verification/sentinel/runtime-boundary.txt

      - name: Verify the audit did not modify the repository
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain Sentinel audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyteller-sentinel-${{ github.sha }}
          path: .verification/sentinel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Publish Sentinel audit commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          SENTINEL_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.SENTINEL_JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/sentinel",
              description: state === "success"
                ? "Read-only narrator training admission, review sequence, privacy, type and artifact audits passed"
                : "Read-only Sentinel repository audit failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
