name: One-time generation material entity migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/generation-material-entity.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-generation-material-entity
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add dedicated generation material entity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/project-store.ts")
          source = path.read_text(encoding="utf-8")
          old = 'export type StoredEntityType =\n  | "artifact"\n  | "project"\n'
          new = 'export type StoredEntityType =\n  | "artifact"\n  | "generation-material"\n  | "project"\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"GENERATION_MATERIAL_ENTITY_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check entity migration
        run: npm run typecheck

      - name: Commit entity migration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/project-store.ts
          git diff --cached --check
          git commit -m "Add generation material entity to project store"
          git push origin HEAD:main

      - name: Publish migration status
        if: always()
        uses: actions/github-script@v7
        env:
          MIGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.MIGRATION_STATUS === "success" ? "success" : "failure",
              context: "storyteller/generation-material-entity",
              description: process.env.MIGRATION_STATUS === "success"
                ? "Generation material entity migration passed"
                : "Generation material entity migration failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
