name: One-time publication verification parser repair main

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-verification-parser-repair-main.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-publication-verification-20260729
          fetch-depth: 0

      - name: Patch and validate pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/audiobook-retail-publication-verification.ts")
          lines = path.read_text(encoding="utf-8").splitlines()
          repaired = []
          index = 0
          counts = {
              "verification": 0,
              "return": 0,
          }
          while index < len(lines):
              line = lines[index]
              following = lines[index + 1] if index + 1 < len(lines) else ""
              if (
                  line.strip() == "const verification = envelope.payload"
                  and following.strip()
                  == "as unknown as AudiobookRetailPublicationVerification;"
              ):
                  repaired.append(
                      "  const verification = envelope.payload as unknown as "
                      "AudiobookRetailPublicationVerification;"
                  )
                  counts["verification"] += 1
                  index += 2
                  continue
              if (
                  line.strip() == "return envelope"
                  and following.strip()
                  == "as unknown as StoredEnvelope<AudiobookRetailPublicationVerification>;"
              ):
                  repaired.append(
                      "  return envelope as unknown as "
                      "StoredEnvelope<AudiobookRetailPublicationVerification>;"
                  )
                  counts["return"] += 1
                  index += 2
                  continue
              repaired.append(line)
              index += 1
          print(f"PUBLICATION_VERIFICATION_PARSER_REPAIR:{counts}")
          if counts != {"verification": 1, "return": 1}:
              raise SystemExit(
                  f"PUBLICATION_VERIFICATION_PARSER_REPAIR_INVALID:{counts}"
              )
          path.write_text(
              "\n".join(repaired) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          rm -f \
            .github/workflows/one-time-publication-verification-parser-repair.yml \
            .github/publication-verification-parser-repair.trigger
          npm install --no-audit --no-fund
          npm run typecheck
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct publication verification type assertions"
          git pull --rebase origin work/audiobook-retail-publication-verification-20260729
          git push origin HEAD:work/audiobook-retail-publication-verification-20260729

      - name: Self-clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-verification-parser-repair-main.yml \
            .github/publication-verification-parser-repair-main.trigger
          git add --all
          git diff --cached --check
          git commit -m "Remove publication verification repair workflow"
          git pull --rebase origin main
          git push origin HEAD:main
