name: Apply Governed Narration Take Review

on:
  push:
    branches:
      - work/narration-take-review-20260808

permissions:
  contents: write

concurrency:
  group: storyteller-narration-take-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconstruct and apply the exact patch
        shell: bash
        run: |
          set -euo pipefail
          base_commit="8bdb6f601a4aca98201125ddd1d01d905f708abc"
          base_tree="3276a1cfdb9d161e628877d82eafcb48af3aec59"
          parts_dir=".github/temporary"
          gzip_file="/tmp/narration-take-review.patch.gz"
          patch_file="/tmp/narration-take-review.patch"

          test "$(git rev-parse "${base_commit}^{tree}")" = "$base_tree"

          python - <<'PY'
          import subprocess

          base = "8bdb6f601a4aca98201125ddd1d01d905f708abc"
          expected = {
              ".github/temporary/narration-take-review.patch.gz.b64.part-000",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-00",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-01",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-02",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-03",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-04",
              ".github/temporary/narration-take-review.patch.gz.b64.part-000.sub-05",
              ".github/temporary/narration-take-review.patch.gz.b64.part-001",
              ".github/temporary/narration-take-review.patch.gz.b64.part-002",
              ".github/temporary/narration-take-review.patch.gz.b64.part-003",
              ".github/workflows/apply-narration-take-review.yml",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected staging paths: {sorted(actual ^ expected)}")
          PY

          cat \
            "$parts_dir"/narration-take-review.patch.gz.b64.part-000.sub-* \
            "$parts_dir"/narration-take-review.patch.gz.b64.part-001 \
            "$parts_dir"/narration-take-review.patch.gz.b64.part-002 \
            "$parts_dir"/narration-take-review.patch.gz.b64.part-003 \
            | base64 --decode > "$gzip_file"
          test "$(sha256sum "$gzip_file" | cut -d' ' -f1)" = "0e8890d27ac53fd1720a48ced82f3d403facc836352f531630df2b30a9e6d725"
          gzip --decompress --stdout "$gzip_file" > "$patch_file"
          test "$(sha256sum "$patch_file" | cut -d' ' -f1)" = "cdf5efed53a95cf7e56f6f9d844df1513644b2d7f55869db455ecc5844733a67"
          test "$(wc -c < "$patch_file")" = "145919"

          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify architecture foundation
        run: npm run verify:foundation

      - name: Verify private application boundary
        run: npm run verify:private-boundary

      - name: Type-check repository
        run: npm run typecheck

      - name: Verify governed artifact lifecycle
        run: npm run verify:artifacts

      - name: Test storyteller engine
        run: npm run test:engine

      - name: Test protected API
        run: npm run test:api

      - name: Test private worker runtime
        run: npm run test:worker

      - name: Test CLI workflows
        run: npm run test:cli

      - name: Build workspaces
        run: npm run build

      - name: Commit only the validated production tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/temporary/narration-take-review.patch.gz.b64.part-*
          rm .github/workflows/apply-narration-take-review.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "023786ac9beb59296b17bffab45eba9c4c1b418e"
          git config user.name "EVAVO Studio Automation"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat: govern narration take selection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
