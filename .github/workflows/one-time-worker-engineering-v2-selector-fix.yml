name: One-time worker engineering v2 selector correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-engineering-v2-selector-fix.trigger"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct three ambiguous selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/one-time-worker-engineering-completion-v2.yml")
          source = path.read_text(encoding="utf-8")

          old_artifact = '''              dedent('''\\
                  assert.deepEqual(artifactKinds.sort(), [
                    "audio-analysis",
                    "audio-candidate",
                    "transcript",
                    "word-alignment",
                  ]);
              '''),
              dedent('''\\
                  assert.deepEqual(artifactKinds.sort(), [
                    "audio-analysis",
                    "audio-analysis",
                    "audio-candidate",
                    "transcript",
                    "word-alignment",
                  ]);
                  const analysisArtifacts = artifactRows.filter(
                    (row) => row.payload.kind === "audio-analysis",
                  );
                  assert.equal(analysisArtifacts.length, 2);
                  assert.equal(
                    analysisArtifacts.some((row) => row.payload.takeId !== undefined),
                    true,
                  );
              '''),
          '''
          new_artifact = '''              "    assert.deepEqual(artifactKinds.sort(), [\\n"
              "      \\\"audio-analysis\\\",\\n"
              "      \\\"audio-candidate\\\",\\n"
              "      \\\"transcript\\\",\\n"
              "      \\\"word-alignment\\\",\\n"
              "    ]);\\n",
              "    assert.deepEqual(artifactKinds.sort(), [\\n"
              "      \\\"audio-analysis\\\",\\n"
              "      \\\"audio-analysis\\\",\\n"
              "      \\\"audio-candidate\\\",\\n"
              "      \\\"transcript\\\",\\n"
              "      \\\"word-alignment\\\",\\n"
              "    ]);\\n"
              "    const analysisArtifacts = artifactRows.filter(\\n"
              "      (row) => row.payload.kind === \\\"audio-analysis\\\",\\n"
              "    );\\n"
              "    assert.equal(analysisArtifacts.length, 2);\\n"
              "    assert.equal(\\n"
              "      analysisArtifacts.some((row) => row.payload.takeId !== undefined),\\n"
              "      true,\\n"
              "    );\\n",
          '''
          replacements = [
              (old_artifact, new_artifact, "artifact-kinds"),
              (
                  '''              '  "runConfiguredWorkerRuntime",\\n',
              '  "runConfiguredWorkerRuntime",\\n  "resolveWorkerAudioEngineeringPolicy",\\n  "ElevenLabsEngineeringRunner",\\n  "engineeringRunner.commands.length, 6",\\n',
''',
                  '''              '  "createWorkerProviderRegistry",\\n  "runConfiguredWorkerRuntime",\\n',
              '  "createWorkerProviderRegistry",\\n  "runConfiguredWorkerRuntime",\\n  "resolveWorkerAudioEngineeringPolicy",\\n  "ElevenLabsEngineeringRunner",\\n  "engineeringRunner.commands.length, 6",\\n',
''',
                  "checker-fixture-sequence",
              ),
              (
                  '''              '  "EnvironmentCredentialResolver",\\n',
              '  "EnvironmentCredentialResolver",\\n  "resolveWorkerAudioEngineeringPolicy",\\n  "workerAudioEngineeringPolicySummary",\\n',
''',
                  '''              '  "resolveWorkerRuntimeConfiguration",\\n  "EnvironmentCredentialResolver",\\n  "createWorkerProviderRegistry",\\n',
              '  "resolveWorkerRuntimeConfiguration",\\n  "EnvironmentCredentialResolver",\\n  "resolveWorkerAudioEngineeringPolicy",\\n  "workerAudioEngineeringPolicySummary",\\n  "createWorkerProviderRegistry",\\n',
''',
                  "runtime-main-sequence",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"V2_SELECTOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"V2_SELECTOR_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")

          trigger = Path(".github/worker-engineering-completion-v2.trigger")
          trigger.write_text(
              "rerun mandatory engineering completion with corrected selectors\n",
              encoding="utf-8",
              newline="\n",
          )
          Path(".github/workflows/one-time-worker-engineering-v2-selector-fix.yml").unlink(missing_ok=True)
          Path(".github/worker-engineering-v2-selector-fix.trigger").unlink(missing_ok=True)
          PY
      - name: Commit selector correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct worker engineering migration selectors"
          git pull --rebase origin main
          git push origin HEAD:main
