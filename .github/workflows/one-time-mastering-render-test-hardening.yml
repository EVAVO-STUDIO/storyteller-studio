name: One-time mastering render test hardening

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-render-test-hardening.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct mastering render fixtures
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastering-render-test-hardening.log
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              print(f"MASTERING_RENDER_TEST_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERING_RENDER_TEST_ANCHOR_INVALID:{label}:{count}")
              return source.replace(old, new, 1)

          path = Path("packages/storyteller/src/mastering-render.test.ts")
          source = path.read_text(encoding="utf-8")

          source = replace_once(
              source,
              '''async function plan(
            operations: readonly MasteringOperation[] = [{
              kind: "gain",
              gainDb: 4.5,
              rationaleCode: "MASTERING_TRANSPARENT_GAIN",
            }],
            evidence = await engineeringEvidence(),
          ): Promise<Readonly<{ plan: MasteringPlan; evidence: AudioEngineeringEvidence }>> {
            const masterBytes = wavBytes();
          ''',
              '''async function plan(
            operations: readonly MasteringOperation[] = [{
              kind: "gain",
              gainDb: 4.5,
              rationaleCode: "MASTERING_TRANSPARENT_GAIN",
            }],
            evidence?: AudioEngineeringEvidence,
          ): Promise<Readonly<{ plan: MasteringPlan; evidence: AudioEngineeringEvidence }>> {
            const resolvedEvidence = evidence ?? await engineeringEvidence();
            const masterBytes = wavBytes();
          ''',
              "async-plan-signature",
          )
          source = replace_once(
              source,
              "JSON.stringify(evidence)",
              "JSON.stringify(resolvedEvidence)",
              "resolved-evidence-json",
          )
          source = replace_once(
              source,
              "    evidence,\n    plan: createMasteringPlan",
              "    evidence: resolvedEvidence,\n    plan: createMasteringPlan",
              "resolved-evidence-return",
          )
          source = replace_once(
              source,
              "      engineeringEvidence: evidence,\n      targetProfile: evidence.profile,",
              "      engineeringEvidence: resolvedEvidence,\n      targetProfile: resolvedEvidence.profile,",
              "resolved-evidence-plan",
          )
          source = replace_once(
              source,
              "/alimiter=limit=0\\.69984199:attack=5:release=50:level=0:latency=1/u",
              "/alimiter=limit=0\\.699842:attack=5:release=50:level=0:latency=1/u",
              "limiter-rounding",
          )
          source = replace_once(
              source,
              "    readonly bytes = wavBytes(),\n    readonly failure?: Error,",
              '''    readonly bytes = new Uint8Array([
              0x52, 0x49, 0x46, 0x46,
              0x04, 0x00, 0x00, 0x00,
              0x57, 0x41, 0x56, 0x45,
              0x05, 0x06, 0x07, 0x08,
            ]),
            readonly failure?: Error,
          ''',
              "distinct-mastered-bytes",
          )
          source = replace_once(
              source,
              "  assert.equal(result.evidence.output.contentHash, hashBytes(wavBytes()));",
              "  assert.equal(result.evidence.output.contentHash, hashBytes(runner.bytes));",
              "output-hash-expectation",
          )
          source = replace_once(
              source,
              "      sampleRateHz: 48_000,\n",
              "      sampleRateHz: 1_000,\n",
              "invalid-rate-tamper",
          )

          path.write_text(source, encoding="utf-8", newline="\n")
          for temporary in [
              Path(".github/workflows/one-time-mastering-render-fixture-fix.yml"),
              Path(".github/mastering-render-fixture-fix.trigger"),
              Path(".github/workflows/one-time-mastering-render-test-hardening.yml"),
              Path(".github/mastering-render-test-hardening.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERING_RENDER_TESTS_HARDENED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastering-render-hardened-verify.log
          npm run build 2>&1 | tee .mastering-render-hardened-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastering-render-test-hardening-${{ github.sha }}
          path: |
            .mastering-render-test-hardening.log
            .mastering-render-hardened-verify.log
            .mastering-render-hardened-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit hardening
        shell: bash
        run: |
          rm -f .mastering-render-test-hardening.log .mastering-render-hardened-verify.log .mastering-render-hardened-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed mastering rendering"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".mastering-render-test-hardening.log",
              ".mastering-render-hardened-verify.log",
              ".mastering-render-hardened-build.log",
            ].filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /MASTERING_RENDER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "mastering render hardening failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-render-test-hardening",
              description: state === "success"
                ? "Mastering renderer, tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
