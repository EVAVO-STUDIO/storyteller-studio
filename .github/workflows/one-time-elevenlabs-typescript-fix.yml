name: One-time ElevenLabs TypeScript correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/elevenlabs-typescript-fix.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-elevenlabs-typescript-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct strict adapter typing
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .elevenlabs-typescript-fix.log
          from pathlib import Path

          path = Path("packages/storyteller/src/elevenlabs-adapter.ts")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "  for (const policy of configuration.modelPolicies) {\n",
                  "  for (const policy of configuration.modelPolicies as readonly ElevenLabsModelPolicy[]) {\n",
                  "model-policy-iteration",
              ),
              (
                  "      || binding.allowedModes.some((mode) => !EXECUTION_MODES.includes(mode))\n",
                  "      || (binding.allowedModes as readonly ProviderExecutionMode[]).some(\n"
                  "        (mode: ProviderExecutionMode) => !EXECUTION_MODES.includes(mode),\n"
                  "      )\n",
                  "allowed-mode-iteration",
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              print(f"ELEVENLABS_TYPESCRIPT_FIX_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"ELEVENLABS_TYPESCRIPT_FIX_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          print("ELEVENLABS_TYPESCRIPT_FIXED")
          PY

      - name: Remove one-time correction machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-elevenlabs-typescript-fix.yml
          rm -f .github/elevenlabs-typescript-fix.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify adapter typing and engine tests
        run: npm run typecheck && npm run test:engine

      - name: Commit ElevenLabs TypeScript correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/elevenlabs-adapter.ts .github/workflows/one-time-elevenlabs-typescript-fix.yml .github/elevenlabs-typescript-fix.trigger
          git diff --cached --check
          git commit -m "Fix strict ElevenLabs adapter typing"
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        env:
          CORRECTION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.CORRECTION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".elevenlabs-typescript-fix.log")
              ? fs.readFileSync(".elevenlabs-typescript-fix.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "ElevenLabs TypeScript correction log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /ELEVENLABS_TYPESCRIPT_FIX_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "ElevenLabs TypeScript correction failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/elevenlabs-typescript-fix",
              description: state === "success"
                ? "ElevenLabs adapter typing and engine tests passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
