name: Bootstrap narrator whole-book admission source

on:
  push:
    branches:
      - agent/bind-narrator-through-whole-book-review

permissions:
  contents: write

concurrency:
  group: bootstrap-narrator-whole-book-admission
  cancel-in-progress: false

jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/narrator-whole-book-payload/part-* > /tmp/narrator-whole-book-payload.b64
          base64 --decode /tmp/narrator-whole-book-payload.b64 > /tmp/narrator-whole-book-payload.tar.gz
          echo '23e29b74232bc131eb370737dc4f2d43932e337d32dd14fc7ea5810188666038  /tmp/narrator-whole-book-payload.tar.gz' | sha256sum --check --strict
          cat > /tmp/expected-archive-paths.txt <<'EOF'
          docs/NARRATOR_AUDIOBOOK_ADMISSION.md
          packages/storyteller/package.json
          packages/storyteller/src/narrator-audiobook-admission.test.ts
          packages/storyteller/src/narrator-audiobook-admission.ts
          packages/storyteller/src/narrator-credit-admission.ts
          packages/storyteller/test-support/narrator-audiobook.ts
          scripts/check-narrator-mastered-review-sequence.mjs
          EOF
          tar -tzf /tmp/narrator-whole-book-payload.tar.gz | LC_ALL=C sort > /tmp/actual-archive-paths.txt
          LC_ALL=C sort /tmp/expected-archive-paths.txt -o /tmp/expected-archive-paths.txt
          diff -u /tmp/expected-archive-paths.txt /tmp/actual-archive-paths.txt
          tar --extract --gzip --file /tmp/narrator-whole-book-payload.tar.gz --directory . --no-same-owner --no-same-permissions
          cat > /tmp/expected-source.sha256 <<'EOF'
          fcf7f5b50d97dca43b3e3f477ea9f60fe1b357db3222bb4614aff1f1cc9df890  docs/NARRATOR_AUDIOBOOK_ADMISSION.md
          63af6bec0bfd4ef32e78a3a6dc8b72e50827c58267e74628f7c838e261c18347  packages/storyteller/package.json
          50e0699c8b083f8619535c9bf7370b0bd7c246d6934c27e38d79801ed1a0f409  packages/storyteller/src/narrator-audiobook-admission.test.ts
          2f458909c621325ad47e892ad6c951e5e374342f13a66b092bc6b3743baf776f  packages/storyteller/src/narrator-audiobook-admission.ts
          c32f5e33e894914a172b757a3129ca114304473fe11037bf963a8c87c09aa077  packages/storyteller/src/narrator-credit-admission.ts
          b5a1143f1cb8f49c9245382010a82d4fedd5ce0513608baa3a80385596999b44  packages/storyteller/test-support/narrator-audiobook.ts
          19f8c42cacccb320ee68c2aaf9327fa7470f461cc5cb212b5b65174665db3dc3  scripts/check-narrator-mastered-review-sequence.mjs
          EOF
          sha256sum --check --strict /tmp/expected-source.sha256
          rm -rf .github/narrator-whole-book-payload
          rm -f .github/workflows/bootstrap-whole-book-admission-source.yml

      - name: Validate complete source before publishing it
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/check-narrator-mastered-review-sequence.mjs
          npm run typecheck
          npm run test:engine
          git diff --check

      - name: Publish reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EVAVO-STUDIO'
          git config user.email 'evavo.studio@gmail.com'
          git add \
            docs/NARRATOR_AUDIOBOOK_ADMISSION.md \
            packages/storyteller/package.json \
            packages/storyteller/src/narrator-audiobook-admission.test.ts \
            packages/storyteller/src/narrator-audiobook-admission.ts \
            packages/storyteller/src/narrator-credit-admission.ts \
            packages/storyteller/test-support/narrator-audiobook.ts \
            scripts/check-narrator-mastered-review-sequence.mjs \
            .github/workflows/bootstrap-whole-book-admission-source.yml \
            .github/narrator-whole-book-payload
          git diff --cached --check
          git commit -m 'feat: bind narrator admission through whole-book review' -m 'Carry the exact Audio Studio profile admission and admitted Storyteller casting through opening and closing credits, complete audiobook assembly, lossless reference mastering, and continuous whole-book human review. Preserve zero-shot and adapted provenance while keeping title-narrator, release, and publication authority separate.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
