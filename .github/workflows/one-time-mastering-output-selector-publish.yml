name: One-time clean mastering output selector publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-output-selector-publish.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct selector and remove temporary machinery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/one-time-mastering-output-contract.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [index for index, line in enumerate(lines) if '"input-output",' in line]
          if len(matches) != 1:
              raise SystemExit(f"MASTERING_OUTPUT_SELECTOR_PUBLISH_LABEL_INVALID:{len(matches)}")
          index = matches[0]
          lines[index - 2] = '              "  engineeringEvidence: AudioEngineeringEvidence;\\n  targetProfile: AudioEngineeringProfileSnapshot;\\n  operations: readonly MasteringOperation[];\\n",'
          lines[index - 1] = '              "  engineeringEvidence: AudioEngineeringEvidence;\\n  targetProfile: AudioEngineeringProfileSnapshot;\\n  output: MasteringOutputProfile;\\n  operations: readonly MasteringOperation[];\\n",'
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          for temporary in [
              Path(".github/workflows/one-time-mastering-output-selector-fix.yml"),
              Path(".github/mastering-output-selector-fix.trigger"),
              Path(".github/workflows/one-time-mastering-output-selector-fix-v2.yml"),
              Path(".github/mastering-output-selector-fix-v2.trigger"),
              Path(".github/workflows/one-time-mastering-output-selector-publish.yml"),
              Path(".github/mastering-output-selector-publish.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          PY
      - name: Commit selector correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add .github/workflows/one-time-mastering-output-contract.yml
          git add -u .github
          git diff --cached --check
          git commit -m "Correct mastering output contract selector"
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-output-selector-publish",
              description: state === "success"
                ? "Mastering output selector published"
                : "Mastering output selector publication failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
