name: One-time book credit master promotion v4

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-credit-master-promotion-v4.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply direct governed credit master promotion
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-credit-master-v4.log
          import json
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              print(f"BOOK_CREDIT_MASTER_V4_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"BOOK_CREDIT_MASTER_V4_ANCHOR_INVALID:{label}:{count}")
              return source.replace(old, new, 1)

          def replace_in_section(
              source: str,
              start_marker: str,
              end_marker: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              start_count = source.count(start_marker)
              end_count = source.count(end_marker)
              print(f"BOOK_CREDIT_MASTER_V4_SECTION:{label}:{start_count}:{end_count}")
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"BOOK_CREDIT_MASTER_V4_SECTION_INVALID:{label}:{start_count}:{end_count}"
                  )
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              replaced = replace_once(section, old, new, label)
              return source[:start] + replaced + source[end:]

          source_path = Path("packages/storyteller/src/book-credit-master.ts")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''  selectedAudioRevision: number;
            selectedAudioFingerprint: string;
            reviewEvidence: StoredEnvelope<ArtifactRecord>;
          ''',
              '''  selectedAudioRevision: number;
            selectedAudioFingerprint: string;
            approvedSourceAudio: StoredEnvelope<ArtifactRecord>;
            transcriptArtifact: StoredEnvelope<ArtifactRecord>;
            engineeringArtifact: StoredEnvelope<ArtifactRecord>;
            reviewEvidence: StoredEnvelope<ArtifactRecord>;
          ''',
              "chain-interface",
          )
          source = replace_in_section(
              source,
              "function chainFingerprint(\n",
              "async function approveArtifact(\n",
              "    selectedAudioFingerprint: chain.selectedAudioFingerprint,\n",
              '''    selectedAudioFingerprint: chain.selectedAudioFingerprint,
            approvedSourceAudio: {
              id: chain.approvedSourceAudio.payload.id,
              revision: chain.approvedSourceAudio.revision,
              fingerprint: chain.approvedSourceAudio.payload.fingerprint,
              envelopeHash: chain.approvedSourceAudio.envelopeHash,
            },
            transcriptArtifact: {
              id: chain.transcriptArtifact.payload.id,
              revision: chain.transcriptArtifact.revision,
              fingerprint: chain.transcriptArtifact.payload.fingerprint,
              envelopeHash: chain.transcriptArtifact.envelopeHash,
            },
            engineeringArtifact: {
              id: chain.engineeringArtifact.payload.id,
              revision: chain.engineeringArtifact.revision,
              fingerprint: chain.engineeringArtifact.payload.fingerprint,
              envelopeHash: chain.engineeringArtifact.envelopeHash,
            },
          ''',
              "fingerprint-envelopes",
          )
          source = replace_in_section(
              source,
              '  const partial: Omit<BookCreditMasterChain, "fingerprint"> = {\n',
              "  const chain = Object.freeze({ ...partial, fingerprint: chainFingerprint(partial) });\n",
              "    selectedAudioFingerprint: approvedSource.payload.fingerprint,\n",
              '''    selectedAudioFingerprint: approvedSource.payload.fingerprint,
            approvedSourceAudio: approvedSource,
            transcriptArtifact: currentTranscript,
            engineeringArtifact: currentEngineering,
          ''',
              "result-envelopes",
          )
          source = replace_in_section(
              source,
              '  const partial: Omit<BookCreditMasterChain, "fingerprint"> = {\n',
              "  const chain = Object.freeze({ ...partial, fingerprint: chainFingerprint(partial) });\n",
              "    createdAt: now.toISOString(),\n",
              "    createdAt: approvedMaster.payload.updatedAt,\n",
              "stable-created-at",
          )
          source = replace_once(
              source,
              '''function assertArtifactEnvelope(
            envelope: StoredEnvelope<ArtifactRecord>,
          ''',
              '''function canonicalEnvelopeHash(
            envelope: Omit<StoredEnvelope<ArtifactRecord>, "envelopeHash">,
          ): string {
            return stableHash({
              schemaVersion: envelope.schemaVersion,
              entityType: envelope.entityType,
              entityId: envelope.entityId,
              revision: envelope.revision,
              createdAt: envelope.createdAt,
              savedAt: envelope.savedAt,
              contentHash: envelope.contentHash,
              previousEnvelopeHash: envelope.previousEnvelopeHash ?? null,
              payload: envelope.payload,
            });
          }

          function assertArtifactEnvelope(
            envelope: StoredEnvelope<ArtifactRecord>,
          ''',
              "envelope-helper",
          )
          source = replace_in_section(
              source,
              "function assertArtifactEnvelope(\n",
              "export function assertBookCreditMasterChain(\n",
              "  assertArtifactRecord(envelope.payload);\n  if (\n",
              '''  assertArtifactRecord(envelope.payload);
            const { envelopeHash: _envelopeHash, ...partial } = envelope;
            if (
          ''',
              "envelope-partial",
          )
          source = replace_in_section(
              source,
              "function assertArtifactEnvelope(\n",
              "export function assertBookCreditMasterChain(\n",
              "    || envelope.contentHash !== stableHash(envelope.payload)\n",
              '''    || envelope.contentHash !== stableHash(envelope.payload)
            || canonicalEnvelopeHash(partial) !== envelope.envelopeHash
          ''',
              "envelope-hash",
          )
          source = replace_in_section(
              source,
              "export function assertBookCreditMasterChain(\n",
              "export function bookCreditMasterPublicView(\n",
              '''  assertArtifactEnvelope(
            chain.reviewEvidence,
            "audio-analysis",
            "BOOK_CREDIT_MASTER_REVIEW_ENVELOPE_INVALID",
          );
          ''',
              '''  assertArtifactEnvelope(
            chain.approvedSourceAudio,
            "audio-candidate",
            "BOOK_CREDIT_MASTER_SOURCE_ENVELOPE_INVALID",
          );
            if (
              chain.transcriptArtifact.payload.kind !== "transcript"
              && chain.transcriptArtifact.payload.kind !== "audio-analysis"
            ) {
              throw new BookCreditMasterError("BOOK_CREDIT_MASTER_TRANSCRIPT_ENVELOPE_INVALID");
            }
            assertArtifactEnvelope(
              chain.transcriptArtifact,
              chain.transcriptArtifact.payload.kind,
              "BOOK_CREDIT_MASTER_TRANSCRIPT_ENVELOPE_INVALID",
            );
            assertArtifactEnvelope(
              chain.engineeringArtifact,
              "audio-analysis",
              "BOOK_CREDIT_MASTER_ENGINEERING_ENVELOPE_INVALID",
            );
            assertArtifactEnvelope(
              chain.reviewEvidence,
              "audio-analysis",
              "BOOK_CREDIT_MASTER_REVIEW_ENVELOPE_INVALID",
            );
          ''',
              "source-envelope-assertions",
          )
          source = replace_in_section(
              source,
              "export function assertBookCreditMasterChain(\n",
              "export function bookCreditMasterPublicView(\n",
              '''  const review = chain.reviewEvidence.payload;
            const master = chain.creditMaster.payload;
            if (
          ''',
              '''  const approvedSource = chain.approvedSourceAudio.payload;
            const transcript = chain.transcriptArtifact.payload;
            const engineering = chain.engineeringArtifact.payload;
            const review = chain.reviewEvidence.payload;
            const master = chain.creditMaster.payload;
            if (
              chain.selectedAudioArtifactId !== approvedSource.id
              || chain.selectedAudioRevision !== chain.approvedSourceAudio.revision
              || chain.selectedAudioFingerprint !== approvedSource.fingerprint
              || approvedSource.verification.status !== "verified"
              || approvedSource.review.status !== "approved"
              || approvedSource.integrity.contentHash !== chain.contentHash
              || approvedSource.integrity.byteCount !== chain.byteCount
              || transcript.projectId !== approvedSource.projectId
              || transcript.jobId !== approvedSource.jobId
              || transcript.segmentId !== approvedSource.segmentId
              || transcript.takeId !== approvedSource.takeId
              || engineering.projectId !== approvedSource.projectId
              || engineering.jobId !== approvedSource.jobId
              || engineering.segmentId !== approvedSource.segmentId
              || engineering.takeId !== approvedSource.takeId
              || transcript.verification.status !== "verified"
              || engineering.verification.status !== "verified"
              || !transcript.provenance.parentArtifactIds.includes(approvedSource.id)
              || !engineering.provenance.parentArtifactIds.includes(approvedSource.id)
              || review.provenance.parentArtifactIds.length !== 3
              || !review.provenance.parentArtifactIds.includes(approvedSource.id)
              || !review.provenance.parentArtifactIds.includes(transcript.id)
              || !review.provenance.parentArtifactIds.includes(engineering.id)
              || master.provenance.parentArtifactIds.length !== 4
              || !master.provenance.parentArtifactIds.includes(approvedSource.id)
              || !master.provenance.parentArtifactIds.includes(transcript.id)
              || !master.provenance.parentArtifactIds.includes(engineering.id)
              || !master.provenance.parentArtifactIds.includes(review.id)
              || stableHash(approvedSource.rights) !== stableHash(master.rights)
              || stableHash(approvedSource.rights) !== stableHash(review.rights)
              || stableHash(approvedSource.rights) !== stableHash(transcript.rights)
              || stableHash(approvedSource.rights) !== stableHash(engineering.rights)
              || Date.parse(chain.createdAt) !== Date.parse(master.updatedAt)
              ||
          ''',
              "chain-source-semantics",
          )
          source_path.write_text(source, encoding="utf-8", newline="\n")

          test_path = Path("packages/storyteller/src/book-credit-master.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '  allowedUses: Object.freeze(["audiobook"]),\n',
              '  allowedUses: Object.freeze(["audiobook"] as const),\n',
              "rights-fixture",
          )
          tests = replace_once(
              tests,
              '''    const draftSession = {
              ...fixture.session,
              status: "ready-for-approval" as const,
              approval: undefined,
            };
          ''',
              '''    const {
              approval: _approval,
              fingerprint: _fingerprint,
              ...draftBase
            } = fixture.session;
            const draftPartial = {
              ...draftBase,
              status: "ready-for-approval" as const,
            };
            const draftSession = {
              ...draftPartial,
              fingerprint: stableHash(draftPartial),
            };
          ''',
              "draft-session",
          )
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./book-credit-master"] = "./src/book-credit-master.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(json.dumps(engine, indent=2) + "\n", encoding="utf-8", newline="\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:book-credit-master"] = "node scripts/check-book-credit-master.mjs"
          marker = "npm run verify:book-credit-take-review"
          if "npm run verify:book-credit-master" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("BOOK_CREDIT_MASTER_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:book-credit-master",
                  1,
              )
          root_path.write_text(json.dumps(root, indent=2) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-book-credit-master-promotion.yml"),
              Path(".github/book-credit-master-promotion.trigger"),
              Path(".github/workflows/one-time-book-credit-master-promotion-v2.yml"),
              Path(".github/book-credit-master-promotion-v2.trigger"),
              Path(".github/workflows/one-time-book-credit-master-promotion-v3.yml"),
              Path(".github/book-credit-master-promotion-v3.trigger"),
              Path(".github/workflows/one-time-book-credit-master-promotion-v4.yml"),
              Path(".github/book-credit-master-promotion-v4.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CREDIT_MASTER_V4_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-credit-master-v4-verify.log
          npm run build 2>&1 | tee .book-credit-master-v4-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-credit-master-promotion-v4-${{ github.sha }}
          path: |
            .book-credit-master-v4.log
            .book-credit-master-v4-verify.log
            .book-credit-master-v4-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-credit-master-v4.log .book-credit-master-v4-verify.log .book-credit-master-v4-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed audiobook credit master promotion"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-credit-master-v4.log",
              ".book-credit-master-v4-verify.log",
              ".book-credit-master-v4-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_CREDIT_MASTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book credit master v4 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-credit-master-promotion-v4",
              description: state === "success" ? "Credit master, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
