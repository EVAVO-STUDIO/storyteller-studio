name: One-time governed worker transition hooks

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-transition-hooks.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-transition-hooks
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add governed queue transition hooks
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-transition-hooks.log
          from pathlib import Path

          def patch(path_value: str, replacements: list[tuple[str, str, str]]) -> None:
              path = Path(path_value)
              source = path.read_text(encoding="utf-8")
              for old, new, label in replacements:
                  count = source.count(old)
                  print(f"WORKER_TRANSITION_HOOK_ANCHOR:{path_value}:{label}:{count}")
                  if count != 1:
                      raise SystemExit(f"WORKER_TRANSITION_HOOK_MATCH_COUNT_INVALID:{path_value}:{label}:{count}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8", newline="\n")

          patch("packages/storyteller/src/artifact-queue.ts", [
              (
                  '''  totalEstimatedCost?: number;
            currency?: string;
            now?: Date;
          ''',
                  '''  totalEstimatedCost?: number;
            currency?: string;
            beforeQueueComplete?: (input: Readonly<{
              artifactIds: readonly string[];
              candidateTakeIds: readonly string[];
              admissionFingerprint: string;
            }>) => Promise<void>;
            now?: Date;
          ''',
                  "completion-hook-contract",
              ),
              (
                  '''  const admissionFingerprint = artifactAdmissionFingerprint(
            input.claim,
            assessment,
            candidateTakeIds,
          );
            const envelope = await input.queue.complete(
          ''',
                  '''  const admissionFingerprint = artifactAdmissionFingerprint(
            input.claim,
            assessment,
            candidateTakeIds,
          );
            await input.beforeQueueComplete?.({
              artifactIds: assessment.artifactIds,
              candidateTakeIds,
              admissionFingerprint,
            });
            const envelope = await input.queue.complete(
          ''',
                  "completion-hook-call",
              ),
          ])

          worker = Path("packages/storyteller/src/generation-worker.ts")
          source = worker.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              print(f"WORKER_TRANSITION_HOOK_ANCHOR:generation-worker:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_TRANSITION_HOOK_MATCH_COUNT_INVALID:generation-worker:{label}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''export interface ClaimedGenerationWorkerInput {
          ''',
              '''export interface GenerationWorkerCostAccounting {
            attemptedProviderCount: number;
            successfulResultCount: number;
            totalEstimatedCost?: number;
            currency?: string;
            blockedCode?: string;
          }

          export type GenerationWorkerQueueTransition =
            | Readonly<{
                kind: "block" | "retry";
                codes: readonly string[];
                accounting: GenerationWorkerCostAccounting;
                at: string;
              }>
            | Readonly<{
                kind: "complete";
                codes: readonly [];
                accounting: GenerationWorkerCostAccounting;
                artifactIds: readonly string[];
                candidateTakeIds: readonly string[];
                admissionFingerprint: string;
                at: string;
              }>;

          export interface ClaimedGenerationWorkerInput {
          ''',
              "transition-types",
          )
          replace_once(
              '  beforeTerminalTransition?: () => Promise<void>;\n',
              '  beforeTerminalTransition?: (transition: GenerationWorkerQueueTransition) => Promise<void>;\n',
              "transition-callback-contract",
          )

          old_accounting = '''function executionAccounting(
            report: GenerationExecutionReport,
            policy: GenerationWorkerMaterial["costPolicy"],
          ): Readonly<{
            totalEstimatedCost?: number;
            currency?: string;
            blockedCode?: string;
          }> {
            let total = 0;
            let currency: string | undefined;
            let observedCosts = 0;

            for (const result of report.results) {
              const cost = result.usage.estimatedCost;
              const resultCurrency = result.usage.currency;
              if (cost === undefined) continue;
              if (!Number.isFinite(cost) || cost < 0 || !resultCurrency || !CURRENCY_PATTERN.test(resultCurrency)) {
                return { blockedCode: "GENERATION_COST_EVIDENCE_INVALID" };
              }
              if (currency && currency !== resultCurrency) {
                return { blockedCode: "GENERATION_COST_CURRENCY_MISMATCH" };
              }
              currency = resultCurrency;
              total += cost;
              observedCosts += 1;
            }

            if (policy) {
              if (observedCosts !== report.results.length) {
                return { blockedCode: "GENERATION_COST_EVIDENCE_MISSING" };
              }
              if (currency !== policy.currency) {
                return { blockedCode: "GENERATION_COST_POLICY_CURRENCY_MISMATCH" };
              }
              if (total > policy.maximumTotalEstimatedCost) {
                return { blockedCode: "GENERATION_COST_POLICY_EXCEEDED" };
              }
            }

            return observedCosts > 0
              ? { totalEstimatedCost: Number(total.toFixed(6)), currency }
              : {};
          }
          '''
          new_accounting = '''function executionAccounting(
            report: GenerationExecutionReport,
            policy: GenerationWorkerMaterial["costPolicy"],
          ): GenerationWorkerCostAccounting {
            let total = 0;
            let currency: string | undefined;
            let observedCosts = 0;
            const attemptedProviderCount = report.attempts.filter(
              (attempt) => attempt.status !== "skipped",
            ).length;
            const successfulResultCount = report.results.length;
            const resultBase = {
              attemptedProviderCount,
              successfulResultCount,
            };

            for (const result of report.results) {
              const cost = result.usage.estimatedCost;
              const resultCurrency = result.usage.currency;
              if (cost === undefined) continue;
              if (!Number.isFinite(cost) || cost < 0 || !resultCurrency || !CURRENCY_PATTERN.test(resultCurrency)) {
                return { ...resultBase, blockedCode: "GENERATION_COST_EVIDENCE_INVALID" };
              }
              if (currency && currency !== resultCurrency) {
                return {
                  ...resultBase,
                  totalEstimatedCost: Number(total.toFixed(6)),
                  currency,
                  blockedCode: "GENERATION_COST_CURRENCY_MISMATCH",
                };
              }
              currency = resultCurrency;
              total += cost;
              observedCosts += 1;
            }

            const observed = observedCosts > 0
              ? { totalEstimatedCost: Number(total.toFixed(6)), currency }
              : {};
            if (policy) {
              if (observedCosts !== report.results.length) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_EVIDENCE_MISSING" };
              }
              if (currency !== policy.currency) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_POLICY_CURRENCY_MISMATCH" };
              }
              if (total > policy.maximumTotalEstimatedCost) {
                return { ...resultBase, ...observed, blockedCode: "GENERATION_COST_POLICY_EXCEEDED" };
              }
            }

            return { ...resultBase, ...observed };
          }
          '''
          replace_once(old_accounting, new_accounting, "accounting-context")

          replace_once(
              '''  reportHash?: string;
            now: Date;
          }>): Promise<GenerationWorkerResult> {
            await input.worker.beforeTerminalTransition?.();
          ''',
              '''  reportHash?: string;
            accounting: GenerationWorkerCostAccounting;
            now: Date;
          }>): Promise<GenerationWorkerResult> {
            await input.worker.beforeTerminalTransition?.({
              kind: "block",
              codes: input.codes,
              accounting: input.accounting,
              at: input.now.toISOString(),
            });
          ''',
              "block-transition",
          )

          replace_once(
              '''  const report = await executeGenerationJob({
            job: input.claim.item.job,
            registry: input.providers,
            credentials: input.credentials,
            requests,
            ...(input.timeoutMs !== undefined ? { timeoutMs: input.timeoutMs } : {}),
            ...(input.signal ? { signal: input.signal } : {}),
          });
            throwIfWorkerAborted(input.signal);

            const requestsById = new Map(requests.map((request) => [request.requestId, request]));
          ''',
              '''  const report = await executeGenerationJob({
            job: input.claim.item.job,
            registry: input.providers,
            credentials: input.credentials,
            requests,
            ...(input.timeoutMs !== undefined ? { timeoutMs: input.timeoutMs } : {}),
            ...(input.signal ? { signal: input.signal } : {}),
          });
            throwIfWorkerAborted(input.signal);
            const accounting = executionAccounting(report, input.material.costPolicy);

            const requestsById = new Map(requests.map((request) => [request.requestId, request]));
          ''',
              "early-accounting",
          )
          replace_once(
              '  const accounting = executionAccounting(report, input.material.costPolicy);\n  if (accounting.blockedCode) {\n',
              '  if (accounting.blockedCode) {\n',
              "remove-late-accounting",
          )

          block_anchor = '      executionStatus: report.status,\n      codes:'
          block_count = source.count(block_anchor)
          print(f"WORKER_TRANSITION_HOOK_ANCHOR:generation-worker:block-accounting:{block_count}")
          if block_count != 6:
              raise SystemExit(f"WORKER_TRANSITION_HOOK_MATCH_COUNT_INVALID:generation-worker:block-accounting:{block_count}")
          source = source.replace(
              block_anchor,
              '      executionStatus: report.status,\n      accounting,\n      codes:',
          )

          replace_once(
              '''    if (providerExecutionIsRetryable(report)) {
              await input.beforeTerminalTransition?.();
              const queueEnvelope = await input.queue.fail(
          ''',
              '''    if (providerExecutionIsRetryable(report)) {
              const transitionTime = currentTime();
              await input.beforeTerminalTransition?.({
                kind: "retry",
                codes: ["GENERATION_PROVIDER_EXECUTION_INCOMPLETE"],
                accounting,
                at: transitionTime.toISOString(),
              });
              const queueEnvelope = await input.queue.fail(
          ''',
              "retry-transition",
          )
          replace_once(
              '          now: currentTime(),\n        },\n      );\n',
              '          now: transitionTime,\n        },\n      );\n',
              "retry-transition-time",
          )

          replace_once(
              '''  try {
              await input.beforeTerminalTransition?.();
              const completion = await completeGenerationWithArtifacts({
          ''',
              '''  try {
              const completionTime = currentTime();
              const completion = await completeGenerationWithArtifacts({
          ''',
              "completion-time",
          )
          replace_once(
              '''      ...(accounting.totalEstimatedCost !== undefined
                ? {
                    totalEstimatedCost: accounting.totalEstimatedCost,
                    currency: accounting.currency,
                  }
                : {}),
              now: currentTime(),
          ''',
              '''      ...(accounting.totalEstimatedCost !== undefined
                ? {
                    totalEstimatedCost: accounting.totalEstimatedCost,
                    currency: accounting.currency,
                  }
                : {}),
              beforeQueueComplete: async ({
                artifactIds,
                candidateTakeIds,
                admissionFingerprint,
              }) => {
                await input.beforeTerminalTransition?.({
                  kind: "complete",
                  codes: [],
                  accounting,
                  artifactIds,
                  candidateTakeIds,
                  admissionFingerprint,
                  at: completionTime.toISOString(),
                });
              },
              now: completionTime,
          ''',
              "completion-transition",
          )

          worker.write_text(source, encoding="utf-8", newline="\n")

          patch("packages/storyteller/src/heartbeat-worker.ts", [
              (
                  '''  type GenerationWorkerPublicView,
            type GenerationWorkerResult,
          ''',
                  '''  type GenerationWorkerPublicView,
            type GenerationWorkerQueueTransition,
            type GenerationWorkerResult,
          ''',
                  "transition-type-import",
              ),
              (
                  '''  signal?: AbortSignal;
            heartbeat?: GenerationLeaseHeartbeatOptions;
          ''',
                  '''  signal?: AbortSignal;
            heartbeat?: GenerationLeaseHeartbeatOptions;
            beforeQueueTransition?: (transition: GenerationWorkerQueueTransition) => Promise<void>;
          ''',
                  "external-transition-contract",
              ),
              (
                  '''    heartbeat: heartbeatOptions,
              signal: externalSignal,
              ...workerInput
          ''',
                  '''    heartbeat: heartbeatOptions,
              signal: externalSignal,
              beforeQueueTransition,
              ...workerInput
          ''',
                  "external-transition-destructure",
              ),
              (
                  '''      beforeTerminalTransition: async () => {
                await heartbeat.stopForTerminalTransition();
              },
          ''',
                  '''      beforeTerminalTransition: async (transition) => {
                await heartbeat.stopForTerminalTransition();
                await beforeQueueTransition?.(transition);
              },
          ''',
                  "external-transition-compose",
              ),
          ])

          print("WORKER_TRANSITION_HOOKS_PATCHED")
          PY

      - name: Remove integration machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/one-time-worker-transition-hooks.yml \
            .github/worker-transition-hooks.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify governed transition hooks
        run: npm run typecheck && npm run test:engine

      - name: Commit queue transition hooks
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/storyteller/src/artifact-queue.ts \
            packages/storyteller/src/generation-worker.ts \
            packages/storyteller/src/heartbeat-worker.ts
          git diff --cached --check
          git commit -m "Add governed worker queue transition hooks"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          INTEGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.INTEGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-transition-hooks.log")
              ? fs.readFileSync(".worker-transition-hooks.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker transition hook log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_TRANSITION_HOOK_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker transition hook integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-transition-hooks",
              description: state === "success"
                ? "Worker queue transitions expose governed settlement hooks"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
