name: Verify Storyteller Studio

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: storyteller-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify contracts and tests
        run: npm run verify

      - name: Build workspaces
        run: npm run build
