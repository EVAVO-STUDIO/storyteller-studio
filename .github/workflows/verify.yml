name: Verify Storyteller Studio

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: storyteller-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify contracts and tests
        run: npm run verify

      - name: Build workspaces
        run: npm run build

      - name: Publish verification commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          STORYTELLER_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.STORYTELLER_JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/verify",
              description: state === "success"
                ? "Contracts, typecheck, tests and workspace builds passed"
                : "Storyteller Studio verification failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
