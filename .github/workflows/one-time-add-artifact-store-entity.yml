name: One-time artifact store entity migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/storyteller-artifact-store-entity.trigger"

permissions:
  contents: write

concurrency:
  group: storyteller-artifact-store-entity
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add the dedicated artifact entity type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/project-store.ts")
          source = path.read_text(encoding="utf-8")
          old = 'export type StoredEntityType =\n  | "project"\n'
          new = 'export type StoredEntityType =\n  | "artifact"\n  | "project"\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"ARTIFACT_STORE_ENTITY_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check the entity migration
        run: npm run typecheck

      - name: Commit the migration directly to main
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/project-store.ts
          git diff --cached --check
          git commit -m "Add artifact entity to project store"
          git push origin HEAD:main
