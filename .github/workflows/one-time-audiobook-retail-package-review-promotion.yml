name: One-time audiobook retail package-review promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-package-review.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail package-review slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-package-review-20260729
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_PACKAGE_REVIEW.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-review.test.ts \
            packages/storyteller/src/audiobook-retail-package-review.ts \
            scripts/check-audiobook-retail-package-review.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-package-review-patch.log
          from pathlib import Path

          project_store = Path("packages/storyteller/src/project-store.ts")
          source = project_store.read_text(encoding="utf-8")
          old = (
              '  | "audiobook-retail-package-inspection"\n'
              '  | "chapter-assembly"'
          )
          new = (
              '  | "audiobook-retail-package-inspection"\n'
              '  | "audiobook-retail-package-review"\n'
              '  | "chapter-assembly"'
          )
          count = source.count(old)
          print(f"AUDIOBOOK_RETAIL_PACKAGE_REVIEW_ENTITY_FIX:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_RETAIL_PACKAGE_REVIEW_ENTITY_FIX_INVALID:{count}"
              )
          project_store.write_text(
              source.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path(
              "packages/storyteller/src/"
              "audiobook-retail-package-review.test.ts"
          )
          tests = test_path.read_text(encoding="utf-8")
          old_package_id = '    packageId: "retail_package_review_001",'
          new_package_id = '    packageId: "package_subject_opaque_001",'
          package_id_count = tests.count(old_package_id)
          print(
              "AUDIOBOOK_RETAIL_PACKAGE_REVIEW_PACKAGE_ID_FIX:"
              f"{package_id_count}"
          )
          if package_id_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_PACKAGE_REVIEW_PACKAGE_ID_FIX_INVALID:"
                  f"{package_id_count}"
              )
          tests = tests.replace(old_package_id, new_package_id, 1)

          old_audit = (
              '    const audit = await readFile(join(root, "audit", '
              '"2026-07-29.jsonl"), "utf8");'
          )
          new_audit = "\n".join([
              '    const audit = await readFile(join(root, "audit", "2026-07-29.jsonl"), "utf8");',
              '    const auditMetadata = JSON.stringify(',
              '      audit.trim().split(/\\r?\\n/u).filter(Boolean).map((line) =>',
              '        (JSON.parse(line) as { metadata: unknown }).metadata',
              '      ),',
              '    );',
          ])
          audit_count = tests.count(old_audit)
          print(f"AUDIOBOOK_RETAIL_PACKAGE_REVIEW_AUDIT_PARSE_FIX:{audit_count}")
          if audit_count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_RETAIL_PACKAGE_REVIEW_AUDIT_PARSE_FIX_INVALID:{audit_count}"
              )
          tests = tests.replace(old_audit, new_audit, 1)
          old_assertion = '      assert.equal(audit.includes(forbidden), false);'
          new_assertion = '      assert.equal(auditMetadata.includes(forbidden), false);'
          assertion_count = tests.count(old_assertion)
          print(
              "AUDIOBOOK_RETAIL_PACKAGE_REVIEW_AUDIT_ASSERTION_FIX:"
              f"{assertion_count}"
          )
          if assertion_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_PACKAGE_REVIEW_AUDIT_ASSERTION_FIX_INVALID:"
                  f"{assertion_count}"
              )
          test_path.write_text(
              tests.replace(old_assertion, new_assertion, 1),
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-package-review-promotion.yml"
              ),
              Path(".github/audiobook-retail-package-review.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_PACKAGE_REVIEW_PATCH_APPLIED")
          PY

          git add \
            docs/AUDIOBOOK_RETAIL_PACKAGE_REVIEW.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-review.test.ts \
            packages/storyteller/src/audiobook-retail-package-review.ts \
            packages/storyteller/src/project-store.ts \
            scripts/check-audiobook-retail-package-review.mjs

          expected=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_PACKAGE_REVIEW.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/audiobook-retail-package-review.test.ts
          packages/storyteller/src/audiobook-retail-package-review.ts
          packages/storyteller/src/project-store.ts
          scripts/check-audiobook-retail-package-review.mjs
          EOF
          )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //')
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo AUDIOBOOK_RETAIL_PACKAGE_REVIEW_FILE_SCOPE_INVALID
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-package-review 2>&1 | tee .audiobook-retail-package-review-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-package-review-typecheck.log
          node --import tsx --test \
            packages/storyteller/src/audiobook-retail-package-review.test.ts \
            2>&1 | tee .audiobook-retail-package-review-test.log
          npm run verify 2>&1 | tee .audiobook-retail-package-review-verify.log
          npm run build 2>&1 | tee .audiobook-retail-package-review-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-package-review-${{ github.sha }}
          path: |
            .audiobook-retail-package-review-patch.log
            .audiobook-retail-package-review-check.log
            .audiobook-retail-package-review-typecheck.log
            .audiobook-retail-package-review-test.log
            .audiobook-retail-package-review-verify.log
            .audiobook-retail-package-review-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-package-review-patch.log \
            .audiobook-retail-package-review-check.log \
            .audiobook-retail-package-review-typecheck.log \
            .audiobook-retail-package-review-test.log \
            .audiobook-retail-package-review-verify.log \
            .audiobook-retail-package-review-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add final human audiobook retail package review"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-package-review-patch.log",
              ".audiobook-retail-package-review-check.log",
              ".audiobook-retail-package-review-typecheck.log",
              ".audiobook-retail-package-review-test.log",
              ".audiobook-retail-package-review-verify.log",
              ".audiobook-retail-package-review-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_PACKAGE_REVIEW_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail package-review promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-package-review",
              description: state === "success" ? "Package-review tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
