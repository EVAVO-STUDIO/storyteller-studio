name: One-time audiobook retail policy promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-policy.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated retail-policy slice by exact paths
        shell: bash
        run: |
          set -o pipefail
          git fetch origin work/audiobook-retail-policy-20260728
          git checkout origin/work/audiobook-retail-policy-20260728 -- \
            docs/AUDIOBOOK_RETAIL_POLICY.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-policy.test.ts \
            packages/storyteller/src/audiobook-retail-policy.ts \
            scripts/check-audiobook-retail-policy.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-policy-promotion.log
          from pathlib import Path
          import subprocess

          expected = {
              "docs/AUDIOBOOK_RETAIL_POLICY.md",
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/audiobook-retail-policy.test.ts",
              "packages/storyteller/src/audiobook-retail-policy.ts",
              "scripts/check-audiobook-retail-policy.mjs",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print("AUDIOBOOK_RETAIL_POLICY_FILES:" + ",".join(sorted(changed)))
          if changed != expected:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_POLICY_FILE_SCOPE_INVALID:"
                  + ",".join(sorted(changed))
              )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-policy-promotion.yml"
              ),
              Path(".github/audiobook-retail-policy.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_POLICY_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-retail-policy-verify.log
          npm run build 2>&1 | tee .audiobook-retail-policy-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-policy-${{ github.sha }}
          path: |
            .audiobook-retail-policy-promotion.log
            .audiobook-retail-policy-verify.log
            .audiobook-retail-policy-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-retail-policy-promotion.log \
            .audiobook-retail-policy-verify.log \
            .audiobook-retail-policy-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail policy"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-policy-promotion.log",
              ".audiobook-retail-policy-verify.log",
              ".audiobook-retail-policy-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_RETAIL_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook retail policy promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-policy",
              description: state === "success" ? "Retail policy tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
