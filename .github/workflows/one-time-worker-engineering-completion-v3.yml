name: One-time worker engineering completion v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-engineering-completion-v3.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-engineering-completion-v3
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Complete mandatory engineering integration
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-engineering-completion-v3.log
          from pathlib import Path

          def load(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def save(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          def index_of(lines: list[str], text: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == text:
                      return index
              raise SystemExit(f"WORKER_ENGINEERING_V3_LINE_MISSING:{text}")

          def insert_after(lines: list[str], anchor: str, additions: list[str], sentinel: str, start: int = 0) -> None:
              if any(sentinel in line for line in lines):
                  return
              index = index_of(lines, anchor, start)
              lines[index + 1:index + 1] = additions

          def replace_line(lines: list[str], old: str, new: str) -> None:
              if new in lines:
                  return
              index = index_of(lines, old)
              lines[index] = new

          def section(lines: list[str], start_text: str, end_text: str) -> tuple[int, int]:
              start = index_of(lines, start_text)
              end = index_of(lines, end_text, start + 1)
              return start, end

          fixture_path = "apps/worker/src/elevenlabs-generation.test.ts"
          fixture = load(fixture_path)
          insert_after(
              fixture,
              'import test from "node:test";',
              [
                  'import type {',
                  '  AudioEngineeringCommand,',
                  '  AudioEngineeringCommandResult,',
                  '  AudioEngineeringRunner,',
                  '} from "@evavo/storyteller-engine/audio-engineering";',
              ],
              "AudioEngineeringCommandResult",
          )
          insert_after(
              fixture,
              'import { FileProjectStore } from "@evavo/storyteller-engine/project-store";',
              ['import { resolveWorkerAudioEngineeringPolicy } from "./audio-engineering.js";'],
              "resolveWorkerAudioEngineeringPolicy",
          )
          if not any("STORYTELLER_AUDIO_ENGINEERING_PROFILE:" in line for line in fixture):
              index = index_of(fixture, '    ELEVENLABS_API_KEY: "fixture-elevenlabs-generation-secret",')
              fixture[index:index] = [
                  '    STORYTELLER_AUDIO_ENGINEERING_PROFILE: "acx-audiobook",',
                  '    STORYTELLER_AUDIO_ENGINEERING_PROFILE_VERSION: "acx-2026-07",',
                  '    STORYTELLER_AUDIO_ENGINEERING_PROFILE_REVIEWED_AT: "2026-07-01T00:00:00.000Z",',
                  '    STORYTELLER_AUDIO_ENGINEERING_PROFILE_SOURCE_REFERENCE:',
                  '      "acx-audio-submission-requirements-reviewed-2026-07",',
                  '    STORYTELLER_AUDIO_ENGINEERING_TIMEOUT_MS: "5000",',
                  '    STORYTELLER_AUDIO_ENGINEERING_MAX_OUTPUT_BYTES: String(1024 * 1024),',
              ]

          if not any("class ElevenLabsEngineeringRunner" in line for line in fixture):
              index = index_of(fixture, "function fetchFrom(")
              fixture[index:index] = [
                  "function engineeringCommandResult(",
                  '  stdout = "",',
                  '  stderr = "",',
                  "): AudioEngineeringCommandResult {",
                  "  return Object.freeze({",
                  "    exitCode: 0,",
                  "    stdout,",
                  "    stderr,",
                  "    durationMs: 4,",
                  "  });",
                  "}",
                  "",
                  "class ElevenLabsEngineeringRunner implements AudioEngineeringRunner {",
                  "  readonly commands: AudioEngineeringCommand[] = [];",
                  "",
                  "  async run(command: AudioEngineeringCommand): Promise<AudioEngineeringCommandResult> {",
                  "    this.commands.push(command);",
                  "    switch (command.stage) {",
                  '      case "ffprobe-version":',
                  '        return engineeringCommandResult("ffprobe version 7.1 fixture\\n");',
                  '      case "ffmpeg-version":',
                  '        return engineeringCommandResult("ffmpeg version 7.1 fixture\\n");',
                  '      case "probe":',
                  "        return engineeringCommandResult(JSON.stringify({",
                  "          streams: [{",
                  '            codec_type: "audio",',
                  '            codec_name: "pcm_s16le",',
                  '            sample_rate: "44100",',
                  "            channels: 1,",
                  '            bit_rate: "192000",',
                  '            duration: "0.750000",',
                  "          }],",
                  "          format: {",
                  '            format_name: "wav",',
                  '            duration: "0.750000",',
                  '            bit_rate: "192000",',
                  "            size: String(wavBytes().byteLength),",
                  "          },",
                  "        }));",
                  '      case "astats":',
                  "        return engineeringCommandResult([",
                  '          "lavfi.astats.Overall.RMS_level=-20.0000",',
                  '          "lavfi.astats.Overall.Peak_level=-4.0000",',
                  '          "lavfi.astats.Overall.Noise_floor=-65.0000",',
                  '          "lavfi.astats.Overall.Peak_count=0",',
                  '        ].join("\\n"));',
                  '      case "loudnorm":',
                  '        return engineeringCommandResult("", JSON.stringify({',
                  '          input_i: "-20.10",',
                  '          input_tp: "-4.20",',
                  '          input_lra: "4.10",',
                  '          input_thresh: "-30.00",',
                  '          target_offset: "0.10",',
                  "        }));",
                  '      case "silence":',
                  "        return engineeringCommandResult();",
                  "    }",
                  "  }",
                  "}",
                  "",
              ]

          if not any("const engineeringRunner = new ElevenLabsEngineeringRunner" in line for line in fixture):
              index = index_of(fixture, "    const calls: string[] = [];")
              fixture[index:index] = [
                  "    const engineeringRunner = new ElevenLabsEngineeringRunner();",
                  "    const audioEngineering = resolveWorkerAudioEngineeringPolicy({",
                  "      workerEnabled: true,",
                  "      environment: env,",
                  "      temporaryRoot: resolve(",
                  "        dirname(configuration.objectRootDirectory),",
                  '        "audio-engineering-temp",',
                  "      ),",
                  "      runner: engineeringRunner,",
                  "      now: t0,",
                  "    });",
                  '    if (!audioEngineering) throw new Error("worker engineering policy required");',
                  "",
              ]
          runtime_call = index_of(fixture, "    const result = await runConfiguredWorkerRuntime(configuration, {")
          runtime_end = index_of(fixture, "    });", runtime_call + 1)
          if not any("audioEngineering," in fixture[index] for index in range(runtime_call, runtime_end + 1)):
              credentials_index = index_of(fixture, "      credentials,", runtime_call)
              fixture.insert(credentials_index + 1, "      audioEngineering,")
          insert_after(
              fixture,
              "    assert.equal(calls.length, 3);",
              ["    assert.equal(engineeringRunner.commands.length, 6);"],
              "engineeringRunner.commands.length",
          )
          replace_line(
              fixture,
              "    assert.equal(queueEnvelope?.payload.completion?.outputArtifactRefs.length, 4);",
              "    assert.equal(queueEnvelope?.payload.completion?.outputArtifactRefs.length, 5);",
          )
          replace_line(
              fixture,
              "    assert.equal(artifactRows.length, 4);",
              "    assert.equal(artifactRows.length, 5);",
          )
          if not any("const analysisArtifacts = artifactRows.filter" in line for line in fixture):
              start = index_of(fixture, "    assert.deepEqual(artifactKinds.sort(), [")
              end = index_of(fixture, "    ]);", start + 1)
              fixture[start:end + 1] = [
                  "    assert.deepEqual(artifactKinds.sort(), [",
                  '      "audio-analysis",',
                  '      "audio-analysis",',
                  '      "audio-candidate",',
                  '      "transcript",',
                  '      "word-alignment",',
                  "    ]);",
                  "    const analysisArtifacts = artifactRows.filter(",
                  '      (row) => row.payload.kind === "audio-analysis",',
                  "    );",
                  "    assert.equal(analysisArtifacts.length, 2);",
                  "    assert.equal(",
                  "      analysisArtifacts.some((row) => row.payload.takeId !== undefined),",
                  "      true,",
                  "    );",
              ]
          if not any('"acx-audio-submission-requirements-reviewed-2026-07"' in line for line in fixture[index_of(fixture, "    const serialised = JSON.stringify(result);"):]):
              index = index_of(fixture, "      configuration.objectRootDirectory,")
              fixture[index + 1:index + 1] = [
                  '      "audio-engineering-temp",',
                  '      "acx-audio-submission-requirements-reviewed-2026-07",',
              ]
          save(fixture_path, fixture)

          checker_path = "scripts/check-elevenlabs-generation.mjs"
          checker = load(checker_path)
          replace_line(checker, '  "outputArtifactRefs.length, 4",', '  "outputArtifactRefs.length, 5",')
          fixture_section_start, fixture_section_end = section(
              checker,
              'requireTokens("apps/worker/src/elevenlabs-generation.test.ts", [',
              "]);",
          )
          for token in [
              '  "resolveWorkerAudioEngineeringPolicy",',
              '  "ElevenLabsEngineeringRunner",',
              '  "engineeringRunner.commands.length, 6",',
          ]:
              if token not in checker[fixture_section_start:fixture_section_end]:
                  insert_at = index_of(checker, '  "runConfiguredWorkerRuntime",', fixture_section_start)
                  checker.insert(insert_at + 1, token)
                  fixture_section_end += 1
          runtime_section_start, runtime_section_end = section(
              checker,
              'requireTokens("apps/worker/src/runtime.ts", [',
              "]);",
          )
          for token in [
              '  "WORKER_AUDIO_ENGINEERING_POLICY_REQUIRED",',
              '  "requireAudioEngineering: true",',
          ]:
              if token not in checker[runtime_section_start:runtime_section_end]:
                  insert_at = index_of(checker, '  "requireBudget: true",', runtime_section_start)
                  checker.insert(insert_at + 1, token)
                  runtime_section_end += 1
          replace_line(
              checker,
              'console.log("- verified audio, transcript, alignment and execution evidence back queue completion");',
              'console.log("- verified audio, transcript, alignment, independent engineering and execution evidence back queue completion");',
          )
          save(checker_path, checker)

          runtime_checker_path = "scripts/check-worker-runtime.mjs"
          runtime_checker = load(runtime_checker_path)
          runtime_source_start, runtime_source_end = section(
              runtime_checker,
              'requireTokens("apps/worker/src/runtime.ts", [',
              "]);",
          )
          for token in [
              '  "WORKER_AUDIO_ENGINEERING_POLICY_REQUIRED",',
              '  "requireAudioEngineering: true",',
          ]:
              if token not in runtime_checker[runtime_source_start:runtime_source_end]:
                  insert_at = index_of(runtime_checker, '  "requireBudget: true",', runtime_source_start)
                  runtime_checker.insert(insert_at + 1, token)
                  runtime_source_end += 1
          runtime_test_start, runtime_test_end = section(
              runtime_checker,
              'requireTokens("apps/worker/src/runtime.test.ts", [',
              "]);",
          )
          token = '  "enabled runtime rejects missing engineering policy before provider preflight",'
          if token not in runtime_checker[runtime_test_start:runtime_test_end]:
              insert_at = index_of(
                  runtime_checker,
                  '  "disabled runtime returns without providers, credentials or persistence",',
                  runtime_test_start,
              )
              runtime_checker.insert(insert_at + 1, token)
          main_start, main_end = section(
              runtime_checker,
              'requireTokens("apps/worker/src/main.ts", [',
              "]);",
          )
          for token in [
              '  "resolveWorkerAudioEngineeringPolicy",',
              '  "workerAudioEngineeringPolicySummary",',
          ]:
              if token not in runtime_checker[main_start:main_end]:
                  insert_at = index_of(runtime_checker, '  "EnvironmentCredentialResolver",', main_start)
                  runtime_checker.insert(insert_at + 1, token)
                  main_end += 1
          env_start, env_end = section(
              runtime_checker,
              'requireTokens(".env.example", [',
              "]);",
          )
          env_tokens = [
              '  "STORYTELLER_AUDIO_ENGINEERING_PROFILE=",',
              '  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_VERSION=",',
              '  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_REVIEWED_AT=",',
              '  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_SOURCE_REFERENCE=",',
              '  "STORYTELLER_AUDIO_ENGINEERING_TIMEOUT_MS=120000",',
              '  "STORYTELLER_AUDIO_ENGINEERING_MAX_OUTPUT_BYTES=8388608",',
          ]
          for token in env_tokens:
              if token not in runtime_checker[env_start:env_end]:
                  insert_at = index_of(runtime_checker, '  "STORYTELLER_WORKER_CREDENTIAL_BINDINGS={}",', env_start)
                  runtime_checker.insert(insert_at + 1, token)
                  env_end += 1
          replace_line(
              runtime_checker,
              'console.log("- the private runtime requires calibration and transactional budget control before provider work");',
              'console.log("- the private runtime requires calibration, independent engineering and transactional budget control before provider work");',
          )
          save(runtime_checker_path, runtime_checker)

          env_path = ".env.example"
          env = load(env_path)
          if not any(line.startswith("STORYTELLER_AUDIO_ENGINEERING_PROFILE=") for line in env):
              index = index_of(env, "STORYTELLER_WORKER_CREDENTIAL_BINDINGS={}")
              env[index + 1:index + 1] = [
                  "",
                  "# Independent engineering is mandatory whenever the private worker is enabled.",
                  "# Leave reviewed profile evidence blank while disabled; enabled startup fails closed without it.",
                  "STORYTELLER_AUDIO_ENGINEERING_PROFILE=",
                  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_VERSION=",
                  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_REVIEWED_AT=",
                  "STORYTELLER_AUDIO_ENGINEERING_PROFILE_SOURCE_REFERENCE=",
                  "STORYTELLER_AUDIO_ENGINEERING_TIMEOUT_MS=120000",
                  "STORYTELLER_AUDIO_ENGINEERING_MAX_OUTPUT_BYTES=8388608",
              ]
          save(env_path, env)

          runtime_doc_path = "docs/WORKER_RUNTIME.md"
          runtime_doc = load(runtime_doc_path)
          if "## Required engineering control" not in runtime_doc:
              index = index_of(runtime_doc, "## Required budget control")
              runtime_doc[index:index] = [
                  "## Required engineering control",
                  "",
                  "Enabled worker startup requires one reviewed independent audio-engineering policy before provider preflight. The process resolves a versioned `acx-audiobook` or `lossless-production` profile, review timestamp, source reference, bounded `ffprobe` and `ffmpeg` controls, and a private temporary directory.",
                  "",
                  "A missing or malformed policy fails with `WORKER_AUDIO_ENGINEERING_POLICY_REQUIRED` or a more specific configuration code before provider credentials or remote model metadata are used. Every successful provider candidate is analysed independently before queue completion. Failed engineering evidence is retained as a verified `audio-analysis` artifact while the queue is blocked with its technical finding codes.",
                  "",
                  "Runtime and process summaries expose only the safe profile identifier, version, review date and fingerprint. Tool paths, temporary directories and source references remain private.",
                  "",
              ]
          save(runtime_doc_path, runtime_doc)

          provider_doc_path = "docs/ELEVENLABS_PRODUCTION_PATH.md"
          provider_doc = load(provider_doc_path)
          provider_doc = [
              "The private artifact registry receives five verified artifacts:"
              if line == "The private artifact registry receives four verified artifacts:"
              else "- five governed output artifact references;"
              if line == "- four governed output artifact references;"
              else line
              for line in provider_doc
          ]
          if "- `audio-analysis` containing independent audio-engineering evidence;" not in provider_doc:
              index = index_of(provider_doc, "- `audio-analysis` containing safe execution evidence.")
              provider_doc[index:index + 1] = [
                  "- `audio-analysis` containing independent audio-engineering evidence;",
                  "- a separate `audio-analysis` containing safe execution evidence.",
              ]
          if "## Independent engineering gate" not in provider_doc:
              provider_doc.extend([
                  "",
                  "## Independent engineering gate",
                  "",
                  "The worker resolves a reviewed audio-engineering profile before provider preflight. Each generated candidate is measured independently with `ffprobe`, `astats`, `loudnorm` and `silencedetect` before queue completion. The resulting verified `audio-analysis` artifact is distinct from the generation execution report and is bound to the exact candidate take.",
                  "",
                  "Failed engineering evidence remains retained for review, but the candidate cannot complete production or enter calibration selection. Provider metadata cannot self-certify loudness, clipping, noise floor, sample rate, channel count or silence compliance.",
              ])
          save(provider_doc_path, provider_doc)

          audio_doc_path = "docs/AUDIO_ENGINEERING.md"
          audio_doc = load(audio_doc_path)
          if "This slice creates and verifies independent engineering evidence." in audio_doc:
              start = index_of(audio_doc, "## Current boundary")
              audio_doc[start:] = [
                  "## Current boundary",
                  "",
                  "Independent engineering evidence is now attached automatically to policy-governed provider candidates and stored as a verified `audio-analysis` artifact. Private worker startup requires a reviewed profile, and failed engineering blocks queue completion while retaining the evidence.",
                  "",
                  "The next engineering layer is chapter assembly and mastering: retain pre-master evidence, create the mastered chapter, reanalyse it under the release profile, compare before-and-after measurements, and require a current profile snapshot plus explicit human release approval.",
              ]
          save(audio_doc_path, audio_doc)

          for path in [
              ".github/workflows/one-time-worker-engineering-completion.yml",
              ".github/worker-engineering-completion.trigger",
              ".github/workflows/one-time-worker-engineering-completion-v2.yml",
              ".github/worker-engineering-completion-v2.trigger",
              ".github/workflows/one-time-worker-engineering-v2-selector-fix.yml",
              ".github/worker-engineering-v2-selector-fix.trigger",
              ".github/worker-engineering-anchor-diagnostic.txt",
              ".github/workflows/one-time-worker-engineering-completion-v3.yml",
              ".github/worker-engineering-completion-v3.trigger",
          ]:
              Path(path).unlink(missing_ok=True)

          print("WORKER_ENGINEERING_COMPLETION_V3_WRITTEN")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit completed engineering integration
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Complete mandatory worker engineering integration"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish completion status
        if: always()
        uses: actions/github-script@v7
        env:
          COMPLETION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.COMPLETION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-engineering-completion-v3.log")
              ? fs.readFileSync(".worker-engineering-completion-v3.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker engineering completion v3 log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_ENGINEERING_V3_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker engineering completion v3 failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-engineering-completion-v3",
              description: state === "success"
                ? "Mandatory engineering startup and five-artifact provider path passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
