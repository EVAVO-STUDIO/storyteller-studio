name: One-time calibration engineering test correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/calibration-engineering-test-fix.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-calibration-engineering-test-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct calibration redaction fixture typo
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .calibration-engineering-test-fix.log
          from pathlib import Path

          path = Path("packages/storyteller/src/calibration-engineering.test.ts")
          source = path.read_text(encoding="utf-8")
          old = "      session().text,\n"
          new = "      segment().text,\n"
          count = source.count(old)
          print(f"CALIBRATION_ENGINEERING_TEST_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"CALIBRATION_ENGINEERING_TEST_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          print("CALIBRATION_ENGINEERING_TEST_FIXED")
          PY

      - name: Remove one-time correction machinery
        shell: bash
        run: |
          rm -f .github/workflows/one-time-calibration-engineering-test-fix.yml
          rm -f .github/calibration-engineering-test-fix.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify complete repository
        run: |
          npm run verify
          npm run build

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/calibration-engineering.test.ts .github/workflows/one-time-calibration-engineering-test-fix.yml .github/calibration-engineering-test-fix.trigger
          git diff --cached --check
          git commit -m "Correct calibration engineering redaction fixture"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish correction status
        if: always()
        uses: actions/github-script@v7
        env:
          CORRECTION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.CORRECTION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".calibration-engineering-test-fix.log")
              ? fs.readFileSync(".calibration-engineering-test-fix.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "calibration engineering correction log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /CALIBRATION_ENGINEERING_TEST_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "calibration engineering correction failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/calibration-engineering-test-fix",
              description: state === "success"
                ? "Calibration engineering admission and repository verification passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
