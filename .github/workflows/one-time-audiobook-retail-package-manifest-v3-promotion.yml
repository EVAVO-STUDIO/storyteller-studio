name: One-time audiobook retail package-manifest promotion v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-package-manifest-v3.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply line-stable retail package-manifest slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-package-manifest-20260728
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_PACKAGE_MANIFEST.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-manifest.test.ts \
            packages/storyteller/src/audiobook-retail-package-manifest.ts \
            scripts/check-audiobook-retail-package-manifest.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-package-manifest-patch.log
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_REPLACE:{path}:{count}:{expected}")
              if count != expected:
                  raise SystemExit(
                      f"AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_REPLACE_INVALID:{path}:{count}:{expected}"
                  )
              path.write_text(
                  source.replace(old, new),
                  encoding="utf-8",
                  newline="\n",
              )

          project_store = Path("packages/storyteller/src/project-store.ts")
          replace_exact(
              project_store,
              '  | "audiobook-retail-sample-review"\n  | "chapter-assembly"',
              '  | "audiobook-retail-sample-review"\n  | "audiobook-retail-package-manifest"\n  | "chapter-assembly"',
          )

          source_path = Path(
              "packages/storyteller/src/audiobook-retail-package-manifest.ts"
          )
          replace_exact(
              source_path,
              "\n".join([
                  '  approved: AudiobookRetailTrackReviewSession["approval"] extends infer _T',
                  '    ? ArtifactRecord',
                  '    : never,',
              ]) + "\n",
              '  approved: ArtifactRecord,\n',
          )
          replace_exact(
              source_path,
              "\n".join([
                  '  assertAudiobookRetailPackageManifest(manifest);',
                  '  assertAudiobookRetailPackageManifestMatchesSources(manifest, input);',
                  '  return manifest;',
              ]) + "\n",
              "\n".join([
                  '  assertAudiobookRetailPackageManifest(manifest);',
                  '  if (!constructingUnchecked) {',
                  '    assertAudiobookRetailPackageManifestMatchesSources(manifest, input);',
                  '  }',
                  '  return manifest;',
              ]) + "\n",
          )
          for old, new in [
              (
                  "approval.id !== reviewed.artifact.id",
                  "approval.id !== reviewed.artifact.payload.id",
              ),
              (
                  "originalRevision: reviewed.artifact.revision",
                  "originalRevision: reviewed.artifact.payload.revision",
              ),
              (
                  "originalFingerprint: reviewed.artifact.fingerprint",
                  "originalFingerprint: reviewed.artifact.payload.fingerprint",
              ),
              (
                  "contentHash: reviewed.artifact.contentHash",
                  "contentHash: reviewed.artifact.payload.integrity.contentHash",
              ),
              (
                  "byteCount: reviewed.artifact.byteCount",
                  "byteCount: reviewed.artifact.payload.integrity.byteCount",
              ),
          ]:
              replace_exact(source_path, old, new)

          test_path = Path(
              "packages/storyteller/src/audiobook-retail-package-manifest.test.ts"
          )
          replace_exact(
              test_path,
              'import { FileProjectStore } from "./project-store.js";',
              "\n".join([
                  'import {',
                  '  FileProjectStore,',
                  '  type StoredEnvelope,',
                  '} from "./project-store.js";',
              ]),
          )
          planned_marker = 'function plannedTrack(input: Readonly<{\n'
          helper = "\n".join([
              'function artifactEnvelope(',
              '  record: ArtifactRecord,',
              '): StoredEnvelope<ArtifactRecord> {',
              '  return Object.freeze({',
              '    schemaVersion: "storyteller-store-v1",',
              '    entityType: "artifact",',
              '    entityId: record.id,',
              '    revision: record.revision,',
              '    createdAt: record.createdAt,',
              '    savedAt: record.updatedAt,',
              '    contentHash: stableHash(record),',
              '    envelopeHash: stableHash({',
              '      entityId: record.id,',
              '      revision: record.revision,',
              '      artifactFingerprint: record.fingerprint,',
              '    }),',
              '    payload: record,',
              '  });',
              '}',
              '',
          ])
          replace_exact(
              test_path,
              planned_marker,
              helper + planned_marker,
          )
          replace_exact(
              test_path,
              "\n".join([
                  '      artifact: Object.freeze({',
                  '        id: original.id,',
                  '        revision: original.revision,',
                  '        fingerprint: original.fingerprint,',
                  '        contentHash: original.integrity.contentHash,',
                  '        byteCount: original.integrity.byteCount,',
                  '      }),',
              ]) + "\n",
              '      artifact: artifactEnvelope(original),\n',
          )
          replace_exact(
              test_path,
              "  const original = review.tracks[1]!.artifact;",
              "  const original = review.tracks[1]!.artifact.payload;",
          )
          replace_exact(
              test_path,
              "\n".join([
                  '  const changedSamplePlanBase: Omit<AudiobookRetailSamplePlan, "fingerprint"> = {',
                  '    ...value.samplePlan,',
                  '    policy: Object.freeze({',
              ]) + "\n",
              "\n".join([
                  '  const {',
                  '    fingerprint: _samplePlanFingerprint,',
                  '    ...samplePlanBase',
                  '  } = value.samplePlan;',
                  '  const changedSamplePlanBase: Omit<AudiobookRetailSamplePlan, "fingerprint"> = {',
                  '    ...samplePlanBase,',
                  '    policy: Object.freeze({',
              ]) + "\n",
          )

          print("AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_V3_PATCH_APPLIED")
          PY

          git add \
            docs/AUDIOBOOK_RETAIL_PACKAGE_MANIFEST.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-retail-package-manifest.test.ts \
            packages/storyteller/src/audiobook-retail-package-manifest.ts \
            packages/storyteller/src/project-store.ts \
            scripts/check-audiobook-retail-package-manifest.mjs

          expected=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_PACKAGE_MANIFEST.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/audiobook-retail-package-manifest.test.ts
          packages/storyteller/src/audiobook-retail-package-manifest.ts
          packages/storyteller/src/project-store.ts
          scripts/check-audiobook-retail-package-manifest.mjs
          EOF
          )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //')
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_FILE_SCOPE_INVALID
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          rm -f \
            .github/workflows/one-time-audiobook-retail-package-manifest-promotion.yml \
            .github/workflows/one-time-audiobook-retail-package-manifest-v2-promotion.yml \
            .github/workflows/one-time-audiobook-retail-package-manifest-v3-promotion.yml \
            .github/audiobook-retail-package-manifest.trigger \
            .github/audiobook-retail-package-manifest-v2.trigger \
            .github/audiobook-retail-package-manifest-v3.trigger
          echo AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_PROMOTION_APPLIED

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-package-manifest 2>&1 | tee .audiobook-retail-package-manifest-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-package-manifest-typecheck.log
          node --import tsx --test \
            packages/storyteller/src/audiobook-retail-package-manifest.test.ts \
            2>&1 | tee .audiobook-retail-package-manifest-test.log
          npm run verify 2>&1 | tee .audiobook-retail-package-manifest-verify.log
          npm run build 2>&1 | tee .audiobook-retail-package-manifest-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-package-manifest-v3-${{ github.sha }}
          path: |
            .audiobook-retail-package-manifest-patch.log
            .audiobook-retail-package-manifest-check.log
            .audiobook-retail-package-manifest-typecheck.log
            .audiobook-retail-package-manifest-test.log
            .audiobook-retail-package-manifest-verify.log
            .audiobook-retail-package-manifest-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-package-manifest-patch.log \
            .audiobook-retail-package-manifest-check.log \
            .audiobook-retail-package-manifest-typecheck.log \
            .audiobook-retail-package-manifest-test.log \
            .audiobook-retail-package-manifest-verify.log \
            .audiobook-retail-package-manifest-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail package manifest"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-package-manifest-patch.log",
              ".audiobook-retail-package-manifest-check.log",
              ".audiobook-retail-package-manifest-typecheck.log",
              ".audiobook-retail-package-manifest-test.log",
              ".audiobook-retail-package-manifest-verify.log",
              ".audiobook-retail-package-manifest-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_PACKAGE_MANIFEST_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail package-manifest promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-package-manifest-v3",
              description: state === "success" ? "Package-manifest tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
