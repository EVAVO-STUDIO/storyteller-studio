name: One-time mastered chapter artifact kind

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastered-chapter-kind.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add governed mastered chapter kind
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastered-chapter-kind.log
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"MASTERED_CHAPTER_KIND_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERED_CHAPTER_KIND_ANCHOR_INVALID:{label}:{count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          registry = Path("packages/storyteller/src/artifact-registry.ts")
          replace_once(
              registry,
              '  | "chapter-master"\n  | "release-package";\n',
              '  | "chapter-master"\n  | "mastered-chapter"\n  | "release-package";\n',
              "kind-union",
          )
          replace_once(
              registry,
              '  "chapter-master",\n  "release-package",\n',
              '  "chapter-master",\n  "mastered-chapter",\n  "release-package",\n',
              "kind-set",
          )
          replace_once(
              registry,
              '  "visual-render",\n  "chapter-master",\n  "release-package",\n',
              '  "visual-render",\n  "chapter-master",\n  "mastered-chapter",\n  "release-package",\n',
              "review-set",
          )
          replace_once(
              registry,
              '  if ((kind === "audio-candidate" || kind === "chapter-master") && !mime.startsWith("audio/")) {\n',
              '  if ((kind === "audio-candidate" || kind === "chapter-master" || kind === "mastered-chapter") && !mime.startsWith("audio/")) {\n',
              "audio-integrity",
          )
          replace_once(
              registry,
              '  if ((record.kind === "chapter-master" || record.kind === "release-package") && parents.length === 0) {\n',
              '  if ((record.kind === "chapter-master" || record.kind === "mastered-chapter" || record.kind === "release-package") && parents.length === 0) {\n',
              "parent-required",
          )

          tests = Path("packages/storyteller/src/artifact-registry.test.ts")
          new_test = '''test("mastered chapters require audio integrity, parent provenance and human review", () => {
            const source = approve(verify(createArtifactRecord({
              id: "artifact_mastered_source_001",
              kind: "chapter-master",
              projectId: job.projectId,
              storage: {
                driver: "private-object-store",
                provider: "s3-compatible-private",
                container: "storyteller-production",
                objectKey: `projects/${job.projectId}/chapters/chapter_001/pre-master.wav`,
                region: "australia-southeast",
              },
              integrity: {
                algorithm: "sha256",
                contentHash: "1".repeat(64),
                byteCount: 960_000,
                mimeType: "audio/wav",
                format: "wav",
              },
              provenance: {
                createdByActorId: "assembler_artifact_001",
                sourceContentHash: "d".repeat(64),
                parentArtifactIds: ["artifact_take_001"],
              },
              rights: rights(),
            }, t0)));
            const mastered = createArtifactRecord({
              id: "artifact_mastered_chapter_001",
              kind: "mastered-chapter",
              projectId: job.projectId,
              segmentId: "chapter_001",
              takeId: "mastered_take_001",
              storage: {
                driver: "private-object-store",
                provider: "s3-compatible-private",
                container: "storyteller-production",
                objectKey: `projects/${job.projectId}/chapters/chapter_001/mastered.wav`,
                region: "australia-southeast",
              },
              integrity: {
                algorithm: "sha256",
                contentHash: "2".repeat(64),
                byteCount: 960_000,
                mimeType: "audio/wav",
                format: "wav",
              },
              provenance: {
                createdByActorId: "mastering_artifact_001",
                sourceContentHash: source.integrity.contentHash,
                generationRequestHash: "3".repeat(64),
                parentArtifactIds: [source.id],
              },
              rights: rights(),
            }, t1);
            assert.equal(mastered.review.required, true);
            assert.equal(mastered.review.status, "pending");
            assert.doesNotThrow(() => assertArtifactRecord(mastered));

            assert.throws(
              () => createArtifactRecord({
                ...candidateInput("artifact_mastered_invalid_001", "take_mastered_invalid_001", "4"),
                kind: "mastered-chapter",
                provenance: {
                  createdByActorId: "mastering_artifact_001",
                  parentArtifactIds: [],
                },
              }, t1),
              /ARTIFACT_PARENT_REQUIRED/u,
            );
          });

          '''
          replace_once(
              tests,
              'test("release remains blocked until every dependency is verified, reviewed and rights-valid", () => {\n',
              new_test + 'test("release remains blocked until every dependency is verified, reviewed and rights-valid", () => {\n',
              "kind-test",
          )

          checker = Path("scripts/check-artifact-registry.mjs")
          replace_once(
              checker,
              '  "ArtifactRightsSnapshot",\n',
              '  "ArtifactRightsSnapshot",\n  \'"mastered-chapter"\',\n',
              "checker-kind",
          )
          replace_once(
              checker,
              '  "fingerprint tampering is detected",\n',
              '  "fingerprint tampering is detected",\n  "mastered chapters require audio integrity, parent provenance and human review",\n',
              "checker-test",
          )

          docs = Path("docs/ARTIFACT_REGISTRY.md")
          source = docs.read_text(encoding="utf-8")
          if "`mastered-chapter`" not in source:
              marker = "## Production artifact\n"
              count = source.count(marker)
              print(f"MASTERED_CHAPTER_KIND_ANCHOR:docs:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERED_CHAPTER_KIND_DOCS_ANCHOR_INVALID:{count}")
              note = '''## Mastered chapter artifact

          A `mastered-chapter` is a new immutable audio artifact produced from an approved `chapter-master` through a governed mastering plan and render. It requires parent provenance, independent verification and a new human review. The approved pre-master chapter is never overwritten.

          '''
              docs.write_text(source.replace(marker, note + marker, 1), encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-mastered-chapter-kind.yml"),
              Path(".github/mastered-chapter-kind.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERED_CHAPTER_KIND_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastered-chapter-kind-verify.log
          npm run build 2>&1 | tee .mastered-chapter-kind-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastered-chapter-kind-${{ github.sha }}
          path: |
            .mastered-chapter-kind.log
            .mastered-chapter-kind-verify.log
            .mastered-chapter-kind-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit artifact kind
        shell: bash
        run: |
          rm -f .mastered-chapter-kind.log .mastered-chapter-kind-verify.log .mastered-chapter-kind-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed mastered chapter artifacts"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".mastered-chapter-kind.log",
              ".mastered-chapter-kind-verify.log",
              ".mastered-chapter-kind-build.log",
            ].filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /MASTERED_CHAPTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "mastered chapter artifact kind failed verification";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastered-chapter-kind",
              description: state === "success"
                ? "Mastered chapter artifact kind, tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
