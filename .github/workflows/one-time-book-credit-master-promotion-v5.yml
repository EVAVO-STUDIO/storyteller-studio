name: One-time book credit master promotion v5

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-credit-master-promotion-v5.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected direct credit master promotion
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-credit-master-v5.log
          from pathlib import Path

          workflow = Path(
              ".github/workflows/one-time-book-credit-master-promotion-v4.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY' 2>&1 | tee .book-credit-master-v4.log\n"
          end_marker = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"

          boundary_old = '"export function assertBookCreditMasterChain(\\n"'
          boundary_new = '"export function assertBookCreditMasterChain("'
          boundary_count = code.count(boundary_old)
          print(f"BOOK_CREDIT_MASTER_V5_ASSERT_BOUNDARY:{boundary_count}")
          if boundary_count != 4:
              raise SystemExit(
                  f"BOOK_CREDIT_MASTER_V5_ASSERT_BOUNDARY_INVALID:{boundary_count}"
              )
          code = code.replace(boundary_old, boundary_new)

          assertion_old = (
              "'''  assertArtifactEnvelope(\n"
              "  chain.reviewEvidence,\n"
              '  "audio-analysis",\n'
              '  "BOOK_CREDIT_MASTER_REVIEW_ENVELOPE_INVALID",\n'
              ");\n"
              "'''"
          )
          assertion_new = (
              "'''  assertArtifactEnvelope(\n"
              "    chain.reviewEvidence,\n"
              '    "audio-analysis",\n'
              '    "BOOK_CREDIT_MASTER_REVIEW_ENVELOPE_INVALID",\n'
              "  );\n"
              "'''"
          )
          assertion_count = code.count(assertion_old)
          print(f"BOOK_CREDIT_MASTER_V5_ASSERT_LITERAL:{assertion_count}")
          if assertion_count != 1:
              raise SystemExit(
                  f"BOOK_CREDIT_MASTER_V5_ASSERT_LITERAL_INVALID:{assertion_count}"
              )
          code = code.replace(assertion_old, assertion_new, 1)

          exec(compile(code, "book-credit-master-promotion-v5.py", "exec"), {})
          for temporary in [
              Path(".github/workflows/one-time-book-credit-master-promotion-v5.yml"),
              Path(".github/book-credit-master-promotion-v5.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CREDIT_MASTER_V5_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-credit-master-v5-verify.log
          npm run build 2>&1 | tee .book-credit-master-v5-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-credit-master-promotion-v5-${{ github.sha }}
          path: |
            .book-credit-master-v5.log
            .book-credit-master-v5-verify.log
            .book-credit-master-v5-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-credit-master-v5.log .book-credit-master-v5-verify.log .book-credit-master-v5-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed audiobook credit master promotion"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-credit-master-v5.log",
              ".book-credit-master-v5-verify.log",
              ".book-credit-master-v5-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_CREDIT_MASTER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book credit master v5 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-credit-master-promotion-v5",
              description: state === "success" ? "Credit master, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
