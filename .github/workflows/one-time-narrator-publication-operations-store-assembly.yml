name: Assemble narrator publication operations store

on:
  push:
    branches:
      - agent/narrator-publication-store-20260813
    paths:
      - .github/workflows/one-time-narrator-publication-operations-store-assembly.yml

permissions:
  contents: write

concurrency:
  group: narrator-publication-operations-store-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: ${{ github.event.head_commit.message != 'build: assemble narrator publication operations store' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          ref: agent/narrator-publication-store-20260813
          fetch-depth: 0

      - name: Assemble and verify exact production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/storyteller/src docs

          cat .github/agent-payload/store-ts.part*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            > packages/storyteller/src/narrator-retail-publication-operations-store.ts

          cat .github/agent-payload/store-test-ts.part*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            > packages/storyteller/src/narrator-retail-publication-operations-store.test.ts

          cat .github/agent-payload/docs-md.part*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            > docs/NARRATOR_RETAIL_PUBLICATION_OPERATIONS_PERSISTENCE.md

          cat .github/agent-payload/package-json.part*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            > packages/storyteller/package.json

          sha256sum -c <<'EOF'
          ee33d89ed4a4f05067f637e15ce2b360cdc758c0745ebf90f71edd8b9f07269a  packages/storyteller/src/narrator-retail-publication-operations-store.ts
          506de15ec6a57fb462968761f32d789c18ac523d6e212f2bd7db20fd09bce0df  packages/storyteller/src/narrator-retail-publication-operations-store.test.ts
          2460ac36ce8a4a404a125ba15726377c6fd5f52c977066da770a8f885e9d372e  docs/NARRATOR_RETAIL_PUBLICATION_OPERATIONS_PERSISTENCE.md
          80b2593ec6fbe1cefdc17ba5297b5d2602a67168b1e62ba86be0f7e713fb1522  packages/storyteller/package.json
          EOF

          node -e 'const fs=require("node:fs"); JSON.parse(fs.readFileSync("packages/storyteller/package.json","utf8"));'
          grep -F '"./narrator-retail-publication-operations-store": "./src/narrator-retail-publication-operations-store.ts"' packages/storyteller/package.json

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check complete repository
        run: npm run typecheck

      - name: Run focused persistence regressions
        run: node --import tsx --test packages/storyteller/src/narrator-retail-publication-operations-store.test.ts

      - name: Verify existing private and publication boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:private-boundary
          node scripts/check-audiobook-retail-publication-monitor.mjs

      - name: Produce clean candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-payload
          rm -f .github/workflows/one-time-narrator-publication-operations-store-assembly.yml

          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add --all

          git diff --cached --name-status
          git commit -m "build: assemble narrator publication operations store"

          if git ls-tree -r --name-only HEAD | grep -E '^\.github/(agent-payload/|workflows/one-time-narrator-publication-operations-store-assembly\.yml$)'; then
            echo "ASSEMBLY_TRANSPORT_RESIDUE_DETECTED"
            exit 1
          fi

          git push origin HEAD:agent/narrator-publication-store-20260813
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
