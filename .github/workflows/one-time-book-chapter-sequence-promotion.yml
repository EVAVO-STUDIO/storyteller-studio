name: One-time book chapter sequence promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/book-chapter-sequence-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote book chapter sequence contracts
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .book-sequence-promotion.log
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"BOOK_SEQUENCE_PROMOTION_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"BOOK_SEQUENCE_PROMOTION_ANCHOR_INVALID:{label}:{count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          test_path = Path("packages/storyteller/src/book-chapter-sequence.test.ts")
          replace_once(
              test_path,
              '    seed: input.seed + 10_000,\n    kind: "audio-analysis",\n',
              '    seed: input.seed,\n    kind: "audio-analysis",\n',
              "engineering-scope",
          )
          replace_once(
              test_path,
              '''    assert.throws(
                () => createBookChapterSequence(sequenceInput([
                  chapters[0]!,
                  chapters[1]!,
                  { ...chapters[2]!, role: "chapter" },
                ])),
                /BOOK_SEQUENCE_EPILOGUE_POSITION_INVALID|BOOK_SEQUENCE_/u,
              );
          ''',
              '''    assert.throws(
                () => createBookChapterSequence(sequenceInput([
                  chapters[0]!,
                  { ...chapters[1]!, role: "epilogue" },
                  { ...chapters[2]!, role: "chapter" },
                ])),
                /BOOK_SEQUENCE_EPILOGUE_POSITION_INVALID/u,
              );
          ''',
              "epilogue-fixture",
          )
          replace_once(
              test_path,
              '      rightsOverrides: { expiresAt: "2026-07-26T00:00:00.000Z" },\n',
              '      rightsOverrides: { expiresAt: "2026-07-27T00:00:08.500Z" },\n',
              "rights-expiry-fixture",
          )

          store_path = Path("packages/storyteller/src/project-store.ts")
          replace_once(
              store_path,
              '  | "mastered-chapter-review"\n  | "chapter-assembly"\n',
              '  | "mastered-chapter-review"\n  | "book-chapter-sequence"\n  | "chapter-assembly"\n',
              "store-entity",
          )

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./book-chapter-sequence"] = "./src/book-chapter-sequence.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(json.dumps(engine, indent=2) + "\n", encoding="utf-8", newline="\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:book-sequence"] = "node scripts/check-book-chapter-sequence.mjs"
          marker = "npm run verify:mastered-review"
          if "npm run verify:book-sequence" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("BOOK_SEQUENCE_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:book-sequence",
                  1,
              )
          root_path.write_text(json.dumps(root, indent=2) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-book-chapter-sequence-promotion.yml"),
              Path(".github/book-chapter-sequence-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("BOOK_CHAPTER_SEQUENCE_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .book-sequence-promotion-verify.log
          npm run build 2>&1 | tee .book-sequence-promotion-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-chapter-sequence-promotion-${{ github.sha }}
          path: |
            .book-sequence-promotion.log
            .book-sequence-promotion-verify.log
            .book-sequence-promotion-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .book-sequence-promotion.log .book-sequence-promotion-verify.log .book-sequence-promotion-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed audiobook chapter sequence"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".book-sequence-promotion.log",
              ".book-sequence-promotion-verify.log",
              ".book-sequence-promotion-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /BOOK_SEQUENCE_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "book sequence promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/book-chapter-sequence-promotion",
              description: state === "success" ? "Book sequence, complete tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
