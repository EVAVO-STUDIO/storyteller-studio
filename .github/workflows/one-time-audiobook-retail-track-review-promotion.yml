name: One-time audiobook retail track review promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-track-review.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated retail track review slice
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-track-review-20260728
          git fetch origin "$branch"
          git checkout "origin/$branch" -- \
            docs/AUDIOBOOK_RETAIL_TRACK_REVIEW.md \
            packages/storyteller/src/audiobook-retail-track-review.test.ts \
            packages/storyteller/src/audiobook-retail-track-review.ts \
            scripts/check-audiobook-retail-track-review.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-retail-track-review-promotion.log
          from pathlib import Path
          import subprocess

          initial_expected = {
              "docs/AUDIOBOOK_RETAIL_TRACK_REVIEW.md",
              "packages/storyteller/src/audiobook-retail-track-review.test.ts",
              "packages/storyteller/src/audiobook-retail-track-review.ts",
              "scripts/check-audiobook-retail-track-review.mjs",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print(
              "AUDIOBOOK_RETAIL_TRACK_REVIEW_INITIAL_FILES:"
              + ",".join(sorted(changed))
          )
          if changed != initial_expected:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_REVIEW_INITIAL_SCOPE_INVALID:"
                  + ",".join(sorted(changed))
              )

          def replace_exact(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(
                  "AUDIOBOOK_RETAIL_TRACK_REVIEW_REPLACE:"
                  f"{path}:{count}"
              )
              if count != 1:
                  raise SystemExit(
                      "AUDIOBOOK_RETAIL_TRACK_REVIEW_REPLACE_INVALID:"
                      f"{path}:{count}"
                  )
              path.write_text(
                  source.replace(old, new, 1),
                  encoding="utf-8",
                  newline="\n",
              )

          project_store = Path("packages/storyteller/src/project-store.ts")
          replace_exact(
              project_store,
              '  | "audiobook-reference-master-review"\n'
              '  | "chapter-assembly"',
              '  | "audiobook-reference-master-review"\n'
              '  | "audiobook-retail-track-review"\n'
              '  | "chapter-assembly"',
          )

          engine_package = Path("packages/storyteller/package.json")
          replace_exact(
              engine_package,
              '    "./audiobook-retail-track-encode": '
              '"./src/audiobook-retail-track-encode.ts",\n'
              '    "./audiobook-sequence": '
              '"./src/audiobook-sequence.ts",',
              '    "./audiobook-retail-track-encode": '
              '"./src/audiobook-retail-track-encode.ts",\n'
              '    "./audiobook-retail-track-review": '
              '"./src/audiobook-retail-track-review.ts",\n'
              '    "./audiobook-sequence": '
              '"./src/audiobook-sequence.ts",',
          )

          root_package = Path("package.json")
          replace_exact(
              root_package,
              ' && npm run verify:audiobook-retail-track-encode'
              ' && npm run verify:mastering-render',
              ' && npm run verify:audiobook-retail-track-encode'
              ' && npm run verify:audiobook-retail-track-review'
              ' && npm run verify:mastering-render',
          )
          replace_exact(
              root_package,
              '    "verify:audiobook-retail-track-encode": '
              '"node scripts/check-audiobook-retail-track-encode.mjs"\n',
              '    "verify:audiobook-retail-track-encode": '
              '"node scripts/check-audiobook-retail-track-encode.mjs",\n'
              '    "verify:audiobook-retail-track-review": '
              '"node scripts/check-audiobook-retail-track-review.mjs"\n',
          )

          test_path = Path(
              "packages/storyteller/src/audiobook-retail-track-review.test.ts"
          )
          replace_exact(
              test_path,
              '      "retail_release_manager_001",\n'
              '      chain.tracks[0]!.artifact.payload.id,\n'
              '      chain.tracks[0]!.fileName,\n',
              '      chain.tracks[0]!.artifact.payload.id,\n'
              '      chain.tracks[0]!.fileName,\n',
          )

          final_expected = {
              *initial_expected,
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/project-store.ts",
          }
          final_changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          } | changed
          print(
              "AUDIOBOOK_RETAIL_TRACK_REVIEW_FINAL_FILES:"
              + ",".join(sorted(final_changed))
          )
          if final_changed != final_expected:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_REVIEW_FINAL_SCOPE_INVALID:"
                  + ",".join(sorted(final_changed))
              )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-track-review-promotion.yml"
              ),
              Path(".github/audiobook-retail-track-review.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_TRACK_REVIEW_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-track-review 2>&1 | tee .audiobook-retail-track-review-check.log
          npm run typecheck 2>&1 | tee .audiobook-retail-track-review-typecheck.log
          node --import tsx --test packages/storyteller/src/audiobook-retail-track-review.test.ts 2>&1 | tee .audiobook-retail-track-review-test.log
          npm run verify 2>&1 | tee .audiobook-retail-track-review-verify.log
          npm run build 2>&1 | tee .audiobook-retail-track-review-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-track-review-${{ github.sha }}
          path: |
            .audiobook-retail-track-review-promotion.log
            .audiobook-retail-track-review-check.log
            .audiobook-retail-track-review-typecheck.log
            .audiobook-retail-track-review-test.log
            .audiobook-retail-track-review-verify.log
            .audiobook-retail-track-review-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-track-review-promotion.log \
            .audiobook-retail-track-review-check.log \
            .audiobook-retail-track-review-typecheck.log \
            .audiobook-retail-track-review-test.log \
            .audiobook-retail-track-review-verify.log \
            .audiobook-retail-track-review-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail track review"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-track-review-promotion.log",
              ".audiobook-retail-track-review-check.log",
              ".audiobook-retail-track-review-typecheck.log",
              ".audiobook-retail-track-review-test.log",
              ".audiobook-retail-track-review-verify.log",
              ".audiobook-retail-track-review-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_TRACK_REVIEW_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "retail track review promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-track-review",
              description: state === "success" ? "Retail track review tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
