name: One-time budget account entity migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/budget-account-entity.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-budget-account-entity
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add dedicated budget account entity
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .budget-account-entity.log
          from pathlib import Path

          path = Path("packages/storyteller/src/project-store.ts")
          source = path.read_text(encoding="utf-8")
          old = 'export type StoredEntityType =\n  | "artifact"\n  | "generation-material"\n'
          new = 'export type StoredEntityType =\n  | "artifact"\n  | "budget-account"\n  | "generation-material"\n'
          count = source.count(old)
          print(f"BUDGET_ACCOUNT_ENTITY_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"BUDGET_ACCOUNT_ENTITY_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Remove migration machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/one-time-budget-account-entity.yml \
            .github/budget-account-entity.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check migration
        run: npm run typecheck

      - name: Commit budget account entity
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/project-store.ts
          git diff --cached --check
          git commit -m "Add budget account entity to project store"
          git push origin HEAD:main

      - name: Publish migration status
        if: always()
        uses: actions/github-script@v7
        env:
          MIGRATION_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.MIGRATION_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".budget-account-entity.log")
              ? fs.readFileSync(".budget-account-entity.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "budget account migration log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /BUDGET_ACCOUNT_ENTITY_MATCH_COUNT_INVALID|error TS\d+|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "budget account entity migration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/budget-account-entity",
              description: state === "success"
                ? "Budget account entity migration passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
