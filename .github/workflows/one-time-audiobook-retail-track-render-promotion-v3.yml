name: One-time audiobook retail track-render promotion v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-track-render-v3.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply line-stable slice and harden executable validation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audiobook-retail-track-render-v3-promotion.log
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/"
              "one-time-audiobook-retail-track-render-promotion-v2.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          step_marker = (
              "      - name: Apply the isolated retail track-render slice "
              "with line-stable corrections\n"
          )
          step_start = workflow.index(step_marker)
          run_marker = "        run: |\n"
          script_start = workflow.index(run_marker, step_start) + len(run_marker)
          script_end = workflow.index(
              "\n      - name: Install dependencies",
              script_start,
          )
          lines = workflow[script_start:script_end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          Path(".audiobook-retail-track-render-v3-apply.sh").write_text(
              script,
              encoding="utf-8",
              newline="\n",
          )
          print("AUDIOBOOK_RETAIL_TRACK_RENDER_V3_SCRIPT_PREPARED")
          PY

          bash .audiobook-retail-track-render-v3-apply.sh
          rm -f .audiobook-retail-track-render-v3-apply.sh

          python3 - <<'PY' 2>&1 | tee -a .audiobook-retail-track-render-v3-promotion.log
          from pathlib import Path

          source_path = Path(
              "packages/storyteller/src/audiobook-retail-track-render.ts"
          )
          source = source_path.read_text(encoding="utf-8")
          old = (
              "  if (!name || name.length > 200 || "
              "CONTROL_CHARACTERS.test(name)) {"
          )
          new = "\n".join([
              "  if (",
              "    !name",
              "    || name.length > 200",
              "    || CONTROL_CHARACTERS.test(name)",
              "    || /[\\r\\n]/u.test(name)",
              "  ) {",
          ])
          count = source.count(old)
          print(
              "AUDIOBOOK_RETAIL_TRACK_RENDER_V3_EXECUTABLE_FIX:"
              f"{count}"
          )
          if count != 1:
              raise SystemExit(
                  "AUDIOBOOK_RETAIL_TRACK_RENDER_V3_EXECUTABLE_FIX_INVALID:"
                  f"{count}"
              )
          source_path.write_text(
              source.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-retail-track-render-promotion-v3.yml"
              ),
              Path(".github/audiobook-retail-track-render-v3.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_RETAIL_TRACK_RENDER_V3_PROMOTION_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-retail-track-render-v3-verify.log
          npm run build 2>&1 | tee .audiobook-retail-track-render-v3-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-track-render-v3-${{ github.sha }}
          path: |
            .audiobook-retail-track-render-v3-promotion.log
            .audiobook-retail-track-render-v3-verify.log
            .audiobook-retail-track-render-v3-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-retail-track-render-v3-promotion.log \
            .audiobook-retail-track-render-v3-verify.log \
            .audiobook-retail-track-render-v3-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail track rendering"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-track-render-v3-promotion.log",
              ".audiobook-retail-track-render-v3-verify.log",
              ".audiobook-retail-track-render-v3-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_RETAIL_TRACK_RENDER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook retail track-render v3 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-track-render-v3",
              description: state === "success" ? "Retail track rendering tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
