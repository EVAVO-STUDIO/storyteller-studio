name: One-time complete audiobook render promotion v3

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-render-promotion-v3.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply renderer promotion and type-safe fixture correction
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audiobook-render-v3.log
          from pathlib import Path

          workflow = Path(
              ".github/workflows/one-time-audiobook-render-promotion-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY' 2>&1 | tee .audiobook-render-v2.log\n"
          end_marker = "          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          exec(compile(code, "audiobook-render-promotion-v3.py", "exec"), {})

          test_path = Path("packages/storyteller/src/audiobook-render.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          old = '''  assert.deepEqual(
            runner.request?.sourcePaths,
            plan.components.map((entry) => `/private/storyteller/${entry.artifact.id}.wav`),
          );
          assert.equal(runner.request?.filterScript, buildAudiobookFilterScript(plan));
          assert.equal(runner.request?.sampleRateHz, 44_100);
          assert.equal(runner.request?.channels, 1);
          assert.equal(runner.request?.bitDepth, 24);
          assert.equal(runner.request?.expectedDurationMs, 71_000);
          '''
          new = '''  const request = runner.request as ChapterRenderRequest | undefined;
          assert.ok(request);
          assert.deepEqual(
            request.sourcePaths,
            plan.components.map((entry) => `/private/storyteller/${entry.artifact.id}.wav`),
          );
          assert.equal(request.filterScript, buildAudiobookFilterScript(plan));
          assert.equal(request.sampleRateHz, 44_100);
          assert.equal(request.channels, 1);
          assert.equal(request.bitDepth, 24);
          assert.equal(request.expectedDurationMs, 71_000);
          '''
          count = tests.count(old)
          print(f"AUDIOBOOK_RENDER_V3_REQUEST_FIXTURE:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_RENDER_V3_REQUEST_FIXTURE_INVALID:{count}"
              )
          test_path.write_text(
              tests.replace(old, new, 1),
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(".github/workflows/one-time-audiobook-render-promotion-v3.yml"),
              Path(".github/audiobook-render-promotion-v3.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("AUDIOBOOK_RENDER_V3_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-render-v3-verify.log
          npm run build 2>&1 | tee .audiobook-render-v3-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-render-promotion-v3-${{ github.sha }}
          path: |
            .audiobook-render-v3.log
            .audiobook-render-v3-verify.log
            .audiobook-render-v3-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .audiobook-render-v3.log .audiobook-render-v3-verify.log .audiobook-render-v3-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify shell-free complete audiobook rendering"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-render-v3.log",
              ".audiobook-render-v3-verify.log",
              ".audiobook-render-v3-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_RENDER_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook render v3 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-render-promotion-v3",
              description: state === "success" ? "Complete render, tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
