name: Export Storyteller Source Snapshot

on:
  push:
    branches:
      - temp/source-export-20260808-1139

permissions:
  contents: read

concurrency:
  group: storyteller-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-export
          archive=".source-export/storyteller-source-${GITHUB_SHA}.zip"
          git archive --format=zip --output="$archive" HEAD
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: storyteller-source-${{ github.sha }}
          path: .source-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
