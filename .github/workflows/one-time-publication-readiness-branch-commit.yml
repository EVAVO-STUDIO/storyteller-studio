name: One-time publication readiness branch commit

on:
  push:
    branches:
      - main
    paths:
      - ".github/publication-readiness-branch-commit.trigger"
      - ".github/publication-readiness-branch-commit-2.trigger"

permissions:
  contents: write

jobs:
  commit-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-operations-readiness-20260730
          fetch-depth: 0

      - name: Apply readiness wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          source_path = Path("packages/cli/src/publication-operations-readiness.ts")
          source = source_path.read_text(encoding="utf-8")
          if "type AudiobookRetailPublicationHealth," in source:
              source = source.replace("  type AudiobookRetailPublicationHealth,\n", "", 1)
          type_anchor = '''export type PublicationOperationsOperationalStatus =
  | "empty"
  | "healthy"
  | "attention";
'''
          if "type AudiobookRetailPublicationHealth =" not in source:
              if source.count(type_anchor) != 1:
                  raise SystemExit("READINESS_HEALTH_TYPE_ANCHOR_INVALID")
              source = source.replace(
                  type_anchor,
                  type_anchor + '''

type AudiobookRetailPublicationHealth =
  | "healthy-live"
  | "degraded"
  | "unavailable"
  | "mismatch"
  | "stale";
''',
                  1,
              )
          source_path.write_text(source, encoding="utf-8", newline="\n")

          test_path = Path("packages/cli/src/publication-operations-readiness.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          old = '{ stdout: new CaptureOutput(), stderr: failed }'
          if old in tests:
              tests = tests.replace(
                  old,
                  '{ environment: {}, stdout: new CaptureOutput(), stderr: failed }',
                  1,
              )
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["publication-operations-readiness"] = (
              "tsx packages/cli/src/publication-operations-readiness-main.ts"
          )
          scripts["verify:publication-operations-readiness"] = (
              "node scripts/check-publication-operations-readiness.mjs"
          )
          verify_runtime = scripts.get("verify:runtime", "")
          token = "npm run verify:publication-operations-readiness"
          if not verify_runtime:
              raise SystemExit("READINESS_VERIFY_RUNTIME_MISSING")
          if token not in verify_runtime:
              scripts["verify:runtime"] = verify_runtime + " && " + token
          package_path.write_text(
              json.dumps(package, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          compose_path = Path("compose.publication-operations.yml")
          compose = compose_path.read_text(encoding="utf-8")
          if "npm run publication-operations-readiness" not in compose:
              marker = "node -e \"const net=require('node:net');"
              if compose.count(marker) != 1:
                  raise SystemExit("READINESS_COMPOSE_HEALTH_SCOPE_INVALID")
              compose = compose.replace(
                  marker,
                  "npm run publication-operations-readiness -- --data-dir /var/lib/storyteller --readiness-only >/dev/null && node -e \"const net=require('node:net');",
                  1,
              )
              compose_path.write_text(compose, encoding="utf-8", newline="\n")

          docker_doc = Path("docs/PUBLICATION_OPERATIONS_DOCKER.md")
          document = docker_doc.read_text(encoding="utf-8")
          if "## Application-level readiness" not in document:
              document += '''

## Application-level readiness

The evidence-gateway container health check requires both the private loopback listener and the read-only publication-operations readiness diagnostic.

The readiness diagnostic reopens and domain-validates every persisted monitor, evidence-inbox item and alert, checks audit JSONL partitions, rejects unsafe filesystem entries and stale atomic temporary files, and reports only aggregate state. A publication incident produces operational `attention`; it does not create a container restart loop.

Run the same diagnostic after restore rehearsal and before selecting a restored volume for production:

```bash
npm run publication-operations-readiness -- \\
  --data-dir ./storage
```

A successful result proves structural readability for the current application revision. It does not prove external email or retailer connectivity and does not replace startup preflight.
'''
              docker_doc.write_text(document, encoding="utf-8", newline="\n")
          PY

      - name: Commit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/cli/src/publication-operations-readiness.ts \
            packages/cli/src/publication-operations-readiness-main.ts \
            packages/cli/src/publication-operations-readiness.test.ts \
            docs/PUBLICATION_OPERATIONS_READINESS.md \
            docs/PUBLICATION_OPERATIONS_DOCKER.md \
            scripts/check-publication-operations-readiness.mjs \
            package.json \
            compose.publication-operations.yml
          git diff --cached --check
          git commit -m "Add publication operations readiness diagnostic"
          git pull --rebase origin work/publication-operations-readiness-20260730
          git push origin HEAD:work/publication-operations-readiness-20260730

      - name: Clean temporary workflows from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f \
            .github/workflows/one-time-publication-operations-readiness-integration.yml \
            .github/publication-operations-readiness-integration.trigger \
            .github/workflows/one-time-publication-readiness-branch-commit.yml \
            .github/publication-readiness-branch-commit.trigger \
            .github/publication-readiness-branch-commit-2.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove publication readiness branch workflows"
          git pull --rebase origin main
          git push origin HEAD:main
