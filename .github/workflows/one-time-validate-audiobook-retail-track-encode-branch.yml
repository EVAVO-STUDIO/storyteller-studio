name: One-time validate audiobook retail track admission branch

on:
  push:
    branches:
      - work/audiobook-retail-track-encode-20260728
    paths:
      - ".github/audiobook-retail-track-encode-branch.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/audiobook-retail-track-encode-20260728
          fetch-depth: 0

      - name: Apply known fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/audiobook-retail-track-encode.test.ts")
          source = path.read_text(encoding="utf-8")
          old = '''    assert.throws(
                () => approvedReference({ suffix: "other" }),
                /ARTIFACT_[A-Z_]+|AUDIOBOOK_[A-Z_]+/u,
                "the helper uses safe identifiers and should only throw if a future invariant changes",
              );
          '''
          count = source.count(old)
          print(f"AUDIOBOOK_RETAIL_TRACK_ENCODE_FIXTURE_CORRECTION:{count}")
          if count != 1:
              raise SystemExit(
                  f"AUDIOBOOK_RETAIL_TRACK_ENCODE_FIXTURE_CORRECTION_INVALID:{count}"
              )
          path.write_text(source.replace(old, "", 1), encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify branch slice
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:audiobook-retail-track-encode 2>&1 | tee .retail-track-encode-check.log
          npm run typecheck 2>&1 | tee .retail-track-encode-typecheck.log
          node --import tsx --test packages/storyteller/src/audiobook-retail-track-encode.test.ts 2>&1 | tee .retail-track-encode-test.log
          npm run verify 2>&1 | tee .retail-track-encode-verify.log
          npm run build 2>&1 | tee .retail-track-encode-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-track-encode-branch-${{ github.sha }}
          path: |
            .retail-track-encode-check.log
            .retail-track-encode-typecheck.log
            .retail-track-encode-test.log
            .retail-track-encode-verify.log
            .retail-track-encode-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated correction and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .retail-track-encode-check.log \
            .retail-track-encode-typecheck.log \
            .retail-track-encode-test.log \
            .retail-track-encode-verify.log \
            .retail-track-encode-build.log \
            .github/workflows/one-time-validate-audiobook-retail-track-encode-branch.yml \
            .github/audiobook-retail-track-encode-branch.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Validate governed audiobook retail track admission"
          git pull --rebase origin work/audiobook-retail-track-encode-20260728
          git push origin HEAD:work/audiobook-retail-track-encode-20260728

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".retail-track-encode-check.log",
              ".retail-track-encode-typecheck.log",
              ".retail-track-encode-test.log",
              ".retail-track-encode-verify.log",
              ".retail-track-encode-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.at(-1) || "retail track admission branch validation failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-track-encode-branch",
              description: state === "success" ? "Retail track admission branch passed all gates" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
