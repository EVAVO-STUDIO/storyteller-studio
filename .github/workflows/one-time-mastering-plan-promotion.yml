name: One-time mastering plan promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-plan-promotion.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-mastering-plan-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote mastering plan contracts
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastering-plan-promotion.log
          import json
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              print(f"MASTERING_PLAN_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"MASTERING_PLAN_ANCHOR_INVALID:{label}:{count}")
              return source.replace(old, new, 1)

          path = Path("packages/storyteller/src/mastering-plan.ts")
          source = path.read_text(encoding="utf-8")

          source = replace_once(
              source,
              "    artifact: MasteringArtifactSnapshot;\n    evidenceFingerprint: string;\n",
              "    artifact: MasteringArtifactSnapshot;\n    metrics: AudioMetrics;\n    evidenceFingerprint: string;\n",
              "source-metrics-contract",
          )

          source = replace_once(
              source,
              "    const current = order[operation.kind];\n",
              "    const current = operation.kind === \"high-pass\"\n      ? 0\n      : operation.kind === \"gain\"\n        ? 1\n        : 2;\n",
              "operation-order-type",
          )

          metrics_helper = '''function assertMetrics(metrics: AudioMetrics): void {
            requireFinite(metrics.rmsDb, -200, 24, "MASTERING_PLAN_METRICS_RMS_INVALID");
            requireFinite(metrics.peakDb, -200, 24, "MASTERING_PLAN_METRICS_PEAK_INVALID");
            if (metrics.truePeakDb !== undefined) {
              requireFinite(metrics.truePeakDb, -200, 24, "MASTERING_PLAN_METRICS_TRUE_PEAK_INVALID");
            }
            requireFinite(metrics.noiseFloorDb, -200, 24, "MASTERING_PLAN_METRICS_NOISE_INVALID");
            if (!Number.isSafeInteger(metrics.sampleRateHz) || metrics.sampleRateHz < 8_000 || metrics.sampleRateHz > 384_000) {
              throw new MasteringPlanError("MASTERING_PLAN_METRICS_SAMPLE_RATE_INVALID");
            }
            if (
              metrics.bitRateKbps !== undefined
              && (!Number.isFinite(metrics.bitRateKbps) || metrics.bitRateKbps <= 0 || metrics.bitRateKbps > 100_000)
            ) {
              throw new MasteringPlanError("MASTERING_PLAN_METRICS_BIT_RATE_INVALID");
            }
            if (!Number.isSafeInteger(metrics.channels) || metrics.channels < 1 || metrics.channels > 32) {
              throw new MasteringPlanError("MASTERING_PLAN_METRICS_CHANNELS_INVALID");
            }
            for (const [value, code] of [
              [metrics.clippedSampleCount, "MASTERING_PLAN_METRICS_CLIPPING_INVALID"],
              [metrics.leadingSilenceMs, "MASTERING_PLAN_METRICS_LEADING_SILENCE_INVALID"],
              [metrics.trailingSilenceMs, "MASTERING_PLAN_METRICS_TRAILING_SILENCE_INVALID"],
            ] as const) {
              if (!Number.isSafeInteger(value) || value < 0 || value > 86_400_000) {
                throw new MasteringPlanError(code);
              }
            }
          }

          '''
          source = replace_once(
              source,
              "function assertVerified(record: ArtifactRecord, code: string): void {\n",
              metrics_helper + "function assertVerified(record: ArtifactRecord, code: string): void {\n",
              "metrics-helper",
          )

          source = replace_once(
              source,
              "      artifact: snapshot(input.engineeringArtifact),\n      evidenceFingerprint: input.engineeringEvidence.fingerprint,\n",
              "      artifact: snapshot(input.engineeringArtifact),\n      metrics: Object.freeze({ ...input.engineeringEvidence.metrics }),\n      evidenceFingerprint: input.engineeringEvidence.fingerprint,\n",
              "source-metrics-snapshot",
          )

          source = replace_once(
              source,
              "  assertSnapshot(plan.sourceEngineering.artifact);\n  requireHash(plan.sourceEngineering.evidenceFingerprint, \"MASTERING_PLAN_EVIDENCE_HASH_INVALID\");\n",
              "  assertSnapshot(plan.sourceEngineering.artifact);\n  assertMetrics(plan.sourceEngineering.metrics);\n  requireHash(plan.sourceEngineering.evidenceFingerprint, \"MASTERING_PLAN_EVIDENCE_HASH_INVALID\");\n",
              "source-metrics-validation",
          )

          source = replace_once(
              source,
              "  const predicted = applyPrediction(plan.prediction.metrics, []);\n  if (predicted.metrics.rmsDb !== plan.prediction.metrics.rmsDb) {\n    throw new MasteringPlanError(\"MASTERING_PLAN_PREDICTION_INVALID\");\n  }\n",
              "  const predicted = applyPrediction(plan.sourceEngineering.metrics, plan.operations);\n  if (stableHash(predicted.metrics) !== stableHash(plan.prediction.metrics)) {\n    throw new MasteringPlanError(\"MASTERING_PLAN_PREDICTION_MISMATCH\");\n  }\n",
              "prediction-recomputation",
          )

          source = replace_once(
              source,
              "  if (Number.isNaN(Date.parse(plan.createdAt))) throw new MasteringPlanError(\"MASTERING_PLAN_DATE_INVALID\");\n",
              "  if (Number.isNaN(Date.parse(plan.createdAt))) throw new MasteringPlanError(\"MASTERING_PLAN_DATE_INVALID\");\n  if (Date.parse(plan.targetProfile.reviewedAt) > Date.parse(plan.createdAt)) {\n    throw new MasteringPlanError(\"MASTERING_PLAN_PROFILE_REVIEW_IN_FUTURE\");\n  }\n",
              "persisted-profile-time",
          )

          path.write_text(source, encoding="utf-8", newline="\n")

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./mastering-plan"] = "./src/mastering-plan.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(json.dumps(engine, indent=2) + "\n", encoding="utf-8", newline="\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:mastering"] = "node scripts/check-mastering-plan.mjs"
          artifacts = scripts["verify:artifacts"]
          if "npm run verify:mastering" not in artifacts:
              marker = "npm run verify:master"
              if marker not in artifacts:
                  raise SystemExit("MASTERING_PLAN_MASTER_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = artifacts.replace(
                  marker,
                  f"{marker} && npm run verify:mastering",
                  1,
              )
          root_path.write_text(json.dumps(root, indent=2) + "\n", encoding="utf-8", newline="\n")

          for temporary in [
              Path(".github/workflows/one-time-mastering-plan-promotion.yml"),
              Path(".github/mastering-plan-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("MASTERING_PLAN_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .mastering-plan-verify.log
          npm run build 2>&1 | tee .mastering-plan-build.log

      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify preservation-first mastering plans"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastering-plan-promotion-${{ github.sha }}
          path: |
            .mastering-plan-promotion.log
            .mastering-plan-verify.log
            .mastering-plan-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const paths = [
              ".mastering-plan-promotion.log",
              ".mastering-plan-verify.log",
              ".mastering-plan-build.log",
            ];
            const source = paths
              .filter((path) => fs.existsSync(path))
              .map((path) => fs.readFileSync(path, "utf8"))
              .join("\n")
              .replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /MASTERING_PLAN_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "mastering plan promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-plan-promotion",
              description: state === "success"
                ? "Mastering plans, complete tests and builds passed"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
