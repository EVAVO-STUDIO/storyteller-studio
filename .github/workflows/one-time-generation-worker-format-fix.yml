name: One-time generation worker format fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/generation-worker-format-fix.trigger"

permissions:
  contents: write

concurrency:
  group: storyteller-generation-worker-format-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make unsupported provider formats runtime-validatable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/storyteller/src/generation-worker.ts")
          source = path.read_text(encoding="utf-8")
          old = '  format?: Exclude<ProviderAudioFormat, "pcm">;\n'
          new = '  format?: ProviderAudioFormat;\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"GENERATION_WORKER_FORMAT_FIX_MATCH_COUNT_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit the contract correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/generation-worker.ts
          git diff --cached --check
          git commit -m "Validate unsupported worker formats at runtime"
          git push origin HEAD:main
