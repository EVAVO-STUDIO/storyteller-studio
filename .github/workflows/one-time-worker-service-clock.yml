name: One-time worker service clock wiring

on:
  push:
    branches:
      - main
    paths:
      - ".github/worker-service-clock.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: storyteller-worker-service-clock
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire the live clock and deterministic heartbeat scheduler
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .worker-service-clock.log
          from pathlib import Path

          path = Path("packages/storyteller/src/worker-service.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              print(f"WORKER_SERVICE_CLOCK_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(f"WORKER_SERVICE_CLOCK_MATCH_COUNT_INVALID:{label}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              'import { GenerationLeaseOwnershipLostError } from "./lease-heartbeat.js";\n',
              'import {\n'
              '  GenerationLeaseOwnershipLostError,\n'
              '  type LeaseHeartbeatScheduler,\n'
              '} from "./lease-heartbeat.js";\n',
              "heartbeat-import",
          )
          replace_once(
              '  heartbeatIntervalMs?: number;\n  providerTimeoutMs?: number;\n',
              '  heartbeatIntervalMs?: number;\n'
              '  heartbeatScheduler?: LeaseHeartbeatScheduler;\n'
              '  providerTimeoutMs?: number;\n',
              "service-option",
          )
          replace_once(
              '  readonly #heartbeatIntervalMs: number;\n  readonly #providerTimeoutMs: number;\n',
              '  readonly #heartbeatIntervalMs: number;\n'
              '  readonly #heartbeatScheduler: LeaseHeartbeatScheduler | undefined;\n'
              '  readonly #providerTimeoutMs: number;\n',
              "service-field",
          )
          replace_once(
              '    this.#providerTimeoutMs = requireInteger(\n',
              '    this.#heartbeatScheduler = options.heartbeatScheduler;\n'
              '    this.#providerTimeoutMs = requireInteger(\n',
              "service-assignment",
          )
          replace_once(
              '        signal: this.#abortController.signal,\n        now: startedAt,\n        heartbeat: {\n',
              '        signal: this.#abortController.signal,\n'
              '        clock: this.#now,\n'
              '        now: startedAt,\n'
              '        heartbeat: {\n',
              "worker-clock",
          )
          replace_once(
              '          heartbeatIntervalMs: this.#heartbeatIntervalMs,\n          now: this.#now,\n        },\n',
              '          heartbeatIntervalMs: this.#heartbeatIntervalMs,\n'
              '          now: this.#now,\n'
              '          ...(this.#heartbeatScheduler\n'
              '            ? { scheduler: this.#heartbeatScheduler }\n'
              '            : {}),\n'
              '        },\n',
              "heartbeat-scheduler",
          )

          path.write_text(source, encoding="utf-8", newline="\n")
          print("WORKER_SERVICE_CLOCK_PATCHED")
          PY

      - name: Remove completed one-time migration machinery
        shell: bash
        run: |
          git rm -f \
            .github/workflows/one-time-worker-live-clock.yml \
            .github/worker-live-clock.trigger \
            .github/workflows/one-time-worker-service-clock.yml \
            .github/worker-service-clock.trigger

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify repository
        run: npm run verify && npm run build

      - name: Commit live service clock wiring
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add packages/storyteller/src/worker-service.ts
          git diff --cached --check
          git commit -m "Wire live clock through worker service"
          git push origin HEAD:main

      - name: Publish integration status
        if: always()
        uses: actions/github-script@v7
        env:
          WORKER_SERVICE_CLOCK_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.WORKER_SERVICE_CLOCK_STATUS === "success" ? "success" : "failure";
            const source = fs.existsSync(".worker-service-clock.log")
              ? fs.readFileSync(".worker-service-clock.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "")
              : "worker service clock log unavailable";
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) =>
              /WORKER_SERVICE_CLOCK_MATCH_COUNT_INVALID|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line),
            ) || lines.at(-1) || "worker service clock integration failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/worker-service-clock",
              description: state === "success"
                ? "Worker service uses the live heartbeat clock"
                : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
