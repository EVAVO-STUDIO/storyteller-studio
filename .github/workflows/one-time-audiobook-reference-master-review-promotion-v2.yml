name: One-time audiobook reference-master review promotion v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-reference-master-review-v2.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated whole-book review slice by exact paths
        shell: bash
        run: |
          set -o pipefail
          git fetch origin work/audiobook-reference-master-review-20260728
          git checkout origin/work/audiobook-reference-master-review-20260728 -- \
            docs/AUDIOBOOK_REFERENCE_MASTER_REVIEW.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/audiobook-reference-master-review.test.ts \
            packages/storyteller/src/audiobook-reference-master-review.ts \
            scripts/check-audiobook-reference-master-review.mjs

          python3 - <<'PY' 2>&1 | tee .audiobook-reference-master-review-v2.log
          from pathlib import Path
          import subprocess

          expected = {
              "docs/AUDIOBOOK_REFERENCE_MASTER_REVIEW.md",
              "package.json",
              "packages/storyteller/package.json",
              "packages/storyteller/src/audiobook-reference-master-review.test.ts",
              "packages/storyteller/src/audiobook-reference-master-review.ts",
              "scripts/check-audiobook-reference-master-review.mjs",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          print("AUDIOBOOK_REFERENCE_REVIEW_V2_FILES:" + ",".join(sorted(changed)))
          if changed != expected:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_V2_FILE_SCOPE_INVALID:"
                  + ",".join(sorted(changed))
              )

          project_store_path = Path("packages/storyteller/src/project-store.ts")
          project_store = project_store_path.read_text(encoding="utf-8")
          entity_old = '  | "audiobook-sequence"\n  | "chapter-assembly"'
          entity_new = (
              '  | "audiobook-sequence"\n'
              '  | "audiobook-reference-master-review"\n'
              '  | "chapter-assembly"'
          )
          entity_count = project_store.count(entity_old)
          print(
              "AUDIOBOOK_REFERENCE_REVIEW_V2_ENTITY_ANCHOR:"
              f"{entity_count}"
          )
          if entity_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_V2_ENTITY_ANCHOR_INVALID:"
                  f"{entity_count}"
              )
          project_store_path.write_text(
              project_store.replace(entity_old, entity_new, 1),
              encoding="utf-8",
              newline="\n",
          )

          review_path = Path(
              "packages/storyteller/src/"
              "audiobook-reference-master-review.ts"
          )
          review = review_path.read_text(encoding="utf-8")
          review_old = (
              "    artifactReviewFingerprint: "
              "approvedArtifact.review.events.at(-1)!.fingerprint,"
          )
          review_new = (
              "    artifactReviewFingerprint: "
              "stableHash(approvedArtifact.review),"
          )
          review_count = review.count(review_old)
          print(
              "AUDIOBOOK_REFERENCE_REVIEW_V2_ARTIFACT_BINDING_ANCHOR:"
              f"{review_count}"
          )
          if review_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_V2_ARTIFACT_BINDING_INVALID:"
                  f"{review_count}"
              )
          review_path.write_text(
              review.replace(review_old, review_new, 1),
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path(
              "packages/storyteller/src/"
              "audiobook-reference-master-review.test.ts"
          )
          tests = test_path.read_text(encoding="utf-8")
          test_old = (
              "    assert.equal(\n"
              "      approved.session.approval?.approvedArtifactFingerprint,\n"
              "      approved.artifact.fingerprint,\n"
              "    );\n"
          )
          test_new = test_old + (
              "    assert.equal(\n"
              "      approved.session.approval?.artifactReviewFingerprint,\n"
              "      stableHash(approved.artifact.review),\n"
              "    );\n"
          )
          test_count = tests.count(test_old)
          print(
              "AUDIOBOOK_REFERENCE_REVIEW_V2_ARTIFACT_TEST_ANCHOR:"
              f"{test_count}"
          )
          if test_count != 1:
              raise SystemExit(
                  "AUDIOBOOK_REFERENCE_REVIEW_V2_ARTIFACT_TEST_INVALID:"
                  f"{test_count}"
              )
          test_path.write_text(
              tests.replace(test_old, test_new, 1),
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-reference-master-review-promotion.yml"
              ),
              Path(
                  ".github/workflows/"
                  "one-time-audiobook-reference-master-review-promotion-v2.yml"
              ),
              Path(".github/audiobook-reference-master-review.trigger"),
              Path(".github/audiobook-reference-master-review-v2.trigger"),
          ]:
              temporary.unlink(missing_ok=True)

          print("AUDIOBOOK_REFERENCE_MASTER_REVIEW_V2_APPLIED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-reference-master-review-v2-verify.log
          npm run build 2>&1 | tee .audiobook-reference-master-review-v2-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-reference-master-review-v2-${{ github.sha }}
          path: |
            .audiobook-reference-master-review-v2.log
            .audiobook-reference-master-review-v2-verify.log
            .audiobook-reference-master-review-v2-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f \
            .audiobook-reference-master-review-v2.log \
            .audiobook-reference-master-review-v2-verify.log \
            .audiobook-reference-master-review-v2-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed whole-book reference review"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-reference-master-review-v2.log",
              ".audiobook-reference-master-review-v2-verify.log",
              ".audiobook-reference-master-review-v2-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_REFERENCE_REVIEW_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "whole-book reference review v2 promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-reference-master-review-v2",
              description: state === "success" ? "Whole-book review tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
