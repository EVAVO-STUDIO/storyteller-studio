name: One-time mastering output selector correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/mastering-output-selector-fix.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct create-input selector
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .mastering-output-selector-fix.log
          from pathlib import Path
          path = Path(".github/workflows/one-time-mastering-output-contract.yml")
          source = path.read_text(encoding="utf-8")
          old = '''              "  targetProfile: AudioEngineeringProfileSnapshot;\\n  operations: readonly MasteringOperation[];\\n",
              "  targetProfile: AudioEngineeringProfileSnapshot;\\n  output: MasteringOutputProfile;\\n  operations: readonly MasteringOperation[];\\n",
              "input-output",
          )
          '''
          new = '''              "  engineeringEvidence: AudioEngineeringEvidence;\\n  targetProfile: AudioEngineeringProfileSnapshot;\\n  operations: readonly MasteringOperation[];\\n",
              "  engineeringEvidence: AudioEngineeringEvidence;\\n  targetProfile: AudioEngineeringProfileSnapshot;\\n  output: MasteringOutputProfile;\\n  operations: readonly MasteringOperation[];\\n",
              "input-output",
          )
          '''
          count = source.count(old)
          print(f"MASTERING_OUTPUT_SELECTOR_ANCHOR:{count}")
          if count != 1:
              raise SystemExit(f"MASTERING_OUTPUT_SELECTOR_ANCHOR_INVALID:{count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/one-time-mastering-output-selector-fix.yml").unlink(missing_ok=True)
          Path(".github/mastering-output-selector-fix.trigger").unlink(missing_ok=True)
          print("MASTERING_OUTPUT_SELECTOR_CORRECTED")
          PY
      - name: Commit selector correction
        shell: bash
        run: |
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct mastering output contract selector"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/mastering-output-selector-fix",
              description: state === "success"
                ? "Mastering output selector corrected"
                : "Mastering output selector correction failed",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
