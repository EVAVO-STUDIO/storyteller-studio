name: One-time verified retention interruption inspection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-retention-inspection.yml"

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending inspection-build status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "storyteller/retention-inspection-build",
              description: "Generating and verifying the read-only retention inspector",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Check out the exact work branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: work/publication-retention-inspection-20260801
          fetch-depth: 0

      - name: Verify guarded branch and main scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cb5c45e54152c776f39f23ff14495ee4ff4ef213"
          git merge-base --is-ancestor b52a5c1d6a426ccf3b7b1508d786e12504599a4f HEAD
          test "$(git diff --name-only b52a5c1d6a426ccf3b7b1508d786e12504599a4f..HEAD | sort)" = "$(printf '%s\n' \
            packages/cli/src/publication-operations-backup-retention-evidence.ts \
            scripts/one-time-retention-inspection-patch.py \
            scripts/one-time-retention-inspection-payload.00 \
            scripts/one-time-retention-inspection-payload.01 \
            scripts/one-time-retention-inspection-payload.02 \
            scripts/one-time-retention-inspection-payload.03 \
            scripts/one-time-retention-inspection-payload.04 \
            scripts/one-time-retention-inspection-payload.05 \
            scripts/one-time-retention-inspection-payload.06 \
            scripts/one-time-retention-inspection-payload.07 | sort)"
          git merge-base --is-ancestor b52a5c1d6a426ccf3b7b1508d786e12504599a4f origin/main
          test "$(git diff --name-only b52a5c1d6a426ccf3b7b1508d786e12504599a4f..origin/main | sort)" = ".github/workflows/one-time-retention-inspection.yml"
          echo "STORYTELLER_RETENTION_INSPECTION_BRANCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up the repository runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply the fail-closed inspection slice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one-time-retention-inspection-patch.py
          test ! -e scripts/one-time-retention-inspection-patch.py
          test ! -e scripts/one-time-retention-assertions.ts
          test -z "$(find scripts -maxdepth 1 -type f -name 'one-time-retention-inspection-payload.*' -print -quit)"
          git diff --check

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the complete repository
        run: npm run verify

      - name: Build every workspace
        run: npm run build

      - name: Commit and push the validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/publication-retention-inspection-20260801
          test "$(git rev-parse origin/work/publication-retention-inspection-20260801)" = "$STORYTELLER_RETENTION_INSPECTION_BRANCH_HEAD"
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git diff --cached --quiet && { echo "RETENTION_INSPECTION_PRODUCT_DIFF_MISSING"; exit 1; }
          git commit -m "Add verified retention interruption inspection" -m "Add fingerprint-bound v2 apply evidence and a read-only two-pass inspector that validates plan, apply and snapshot state, detects partial deletion or pruning residue, preserves legacy evidence as untrusted, and blocks restart until a safe disposition is proven."
          git push origin HEAD:work/publication-retention-inspection-20260801

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -f .github/workflows/one-time-retention-inspection.yml
          rm .github/workflows/one-time-retention-inspection.yml
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Remove completed retention inspection workflow"
          git push origin main

      - name: Publish final inspection-build status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          STORYTELLER_RETENTION_INSPECTION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.STORYTELLER_RETENTION_INSPECTION_JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "failure",
              context: "storyteller/retention-inspection-build",
              description: succeeded
                ? "Read-only retention inspection slice verified and pushed"
                : "Retention inspection build failed; inspect the guarded run",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
