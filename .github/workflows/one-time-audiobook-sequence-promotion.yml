name: One-time complete audiobook sequence promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-sequence-promotion.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote governed complete audiobook sequence
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .audiobook-sequence-promotion.log
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              print(f"AUDIOBOOK_SEQUENCE_PROMOTION_ANCHOR:{label}:{count}")
              if count != 1:
                  raise SystemExit(
                      f"AUDIOBOOK_SEQUENCE_PROMOTION_ANCHOR_INVALID:{label}:{count}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          store_path = Path("packages/storyteller/src/project-store.ts")
          replace_once(
              store_path,
              '  | "book-credit-take-review"\n  | "chapter-assembly"\n',
              '  | "book-credit-take-review"\n  | "audiobook-sequence"\n  | "chapter-assembly"\n',
              "store-entity",
          )

          engine_path = Path("packages/storyteller/package.json")
          engine = json.loads(engine_path.read_text(encoding="utf-8"))
          engine["exports"]["./audiobook-sequence"] = "./src/audiobook-sequence.ts"
          engine["exports"] = dict(sorted(engine["exports"].items()))
          engine_path.write_text(
              json.dumps(engine, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          root_path = Path("package.json")
          root = json.loads(root_path.read_text(encoding="utf-8"))
          scripts = root["scripts"]
          scripts["verify:audiobook-sequence"] = "node scripts/check-audiobook-sequence.mjs"
          marker = "npm run verify:book-credit-delivery"
          if "npm run verify:audiobook-sequence" not in scripts["verify:artifacts"]:
              if marker not in scripts["verify:artifacts"]:
                  raise SystemExit("AUDIOBOOK_SEQUENCE_VERIFY_MARKER_MISSING")
              scripts["verify:artifacts"] = scripts["verify:artifacts"].replace(
                  marker,
                  f"{marker} && npm run verify:audiobook-sequence",
                  1,
              )
          root_path.write_text(
              json.dumps(root, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          for temporary in [
              Path(".github/workflows/one-time-audiobook-sequence-promotion.yml"),
              Path(".github/audiobook-sequence-promotion.trigger"),
          ]:
              temporary.unlink(missing_ok=True)
          print("AUDIOBOOK_SEQUENCE_PROMOTED")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee .audiobook-sequence-verify.log
          npm run build 2>&1 | tee .audiobook-sequence-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-sequence-promotion-${{ github.sha }}
          path: |
            .audiobook-sequence-promotion.log
            .audiobook-sequence-verify.log
            .audiobook-sequence-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          rm -f .audiobook-sequence-promotion.log .audiobook-sequence-verify.log .audiobook-sequence-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Verify governed complete audiobook sequence"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-sequence-promotion.log",
              ".audiobook-sequence-verify.log",
              ".audiobook-sequence-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /AUDIOBOOK_SEQUENCE_|error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+/i.test(line)) || lines.at(-1) || "audiobook sequence promotion failed";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-sequence-promotion",
              description: state === "success" ? "Complete sequence, tests and builds passed" : diagnostic.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
