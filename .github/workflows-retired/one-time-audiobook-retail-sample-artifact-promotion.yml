name: One-time audiobook retail sample-artifact promotion

on:
  push:
    branches:
      - main
    paths:
      - ".github/audiobook-retail-sample-artifact.trigger"

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated retail sample-artifact slice by validated paths
        shell: bash
        run: |
          set -euo pipefail
          branch=work/audiobook-retail-sample-artifact-20260728
          git fetch origin "$branch"

          expected=$(git diff --name-only "HEAD...origin/$branch" | sort)
          allowed=$(cat <<'EOF'
          docs/AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT.md
          package.json
          packages/storyteller/package.json
          packages/storyteller/src/artifact-registry.test.ts
          packages/storyteller/src/artifact-registry.ts
          packages/storyteller/src/audiobook-retail-sample-artifact.test.ts
          packages/storyteller/src/audiobook-retail-sample-artifact.ts
          scripts/check-artifact-registry.mjs
          scripts/check-audiobook-retail-sample-artifact.mjs
          EOF
          )
          for required in \
            docs/AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT.md \
            package.json \
            packages/storyteller/package.json \
            packages/storyteller/src/artifact-registry.ts \
            packages/storyteller/src/audiobook-retail-sample-artifact.test.ts \
            packages/storyteller/src/audiobook-retail-sample-artifact.ts \
            scripts/check-artifact-registry.mjs \
            scripts/check-audiobook-retail-sample-artifact.mjs
          do
            printf '%s\n' "$expected" | grep -Fx "$required" >/dev/null
          done
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            printf '%s\n' "$allowed" | sed 's/^          //' | grep -Fx "$path" >/dev/null || {
              echo "AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT_UNEXPECTED_PATH:$path"
              exit 1
            }
          done <<< "$expected"

          mapfile -t product_paths <<< "$expected"
          git checkout "origin/$branch" -- "${product_paths[@]}"
          changed=$(git diff --cached --name-only | sort)
          if [ "$changed" != "$expected" ]; then
            echo "AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT_FILE_SCOPE_INVALID"
            printf 'expected:\n%s\nchanged:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          rm -f \
            .github/workflows/one-time-audiobook-retail-sample-artifact-promotion.yml \
            .github/audiobook-retail-sample-artifact.trigger

          printf 'AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT_FILES:%s\n' "$(printf '%s' "$expected" | paste -sd, -)"
          echo AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT_PROMOTION_APPLIED

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee .audiobook-retail-sample-artifact-verify.log
          npm run build 2>&1 | tee .audiobook-retail-sample-artifact-build.log

      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-retail-sample-artifact-${{ github.sha }}
          path: |
            .audiobook-retail-sample-artifact-verify.log
            .audiobook-retail-sample-artifact-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .audiobook-retail-sample-artifact-verify.log \
            .audiobook-retail-sample-artifact-build.log
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Add governed audiobook retail sample artifact"
          git pull --rebase origin main
          npm run verify
          npm run build
          git push origin HEAD:main

      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("node:fs");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const source = [
              ".audiobook-retail-sample-artifact-verify.log",
              ".audiobook-retail-sample-artifact-build.log",
            ].filter((path) => fs.existsSync(path)).map((path) => fs.readFileSync(path, "utf8")).join("\n").replace(/\u001b\[[0-9;]*m/g, "");
            const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
            const diagnostic = lines.find((line) => /error TS\d+|TEST_FAILURE_DIAGNOSTIC|not ok|AssertionError|ERR_[A-Z_]+|check failed/i.test(line)) || lines.find((line) => /AUDIOBOOK_RETAIL_SAMPLE_ARTIFACT_[A-Z0-9_]+/i.test(line)) || lines.at(-1) || "audiobook retail sample-artifact promotion failed";
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "storyteller/audiobook-retail-sample-artifact",
              description: state === "success" ? "Retail sample-artifact tests, contracts and builds passed" : diagnostic.slice(0, 140),
              target_url: targetUrl,
            });
            if (state === "failure") {
              const slug = diagnostic.replace(/[^A-Za-z0-9._/-]+/g, "-").replace(/-+/g, "-").replace(/^[-./]+|[-./]+$/g, "").slice(0, 62) || "unknown";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: "failure",
                context: `storyteller/failure/${slug}`,
                description: diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }
